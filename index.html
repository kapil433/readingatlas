orld of Vikram Lall\", \"author\": \"M. G. Vassanji\", \"year\": \"2003\", \"note\": \"A Kenyan-Indian family across Kenya's independence and corruption -- the Indian diaspora's most underexplored     literary   territory.   Vassanji's   Giller   Prize   winner   is   the   third   side   of   the India-Britain-Africa colonial triangle.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Lives of Others\", \"author\": \"Neel Mukherjee\", \"year\": \"2014\", \"note\": \"A Calcutta joint family's disintegration in the 1960s-70s, with a Naxalite rebellion subplot. Mukherjee's Booker-shortlisted novel captures the moral and political crises of Bengal with uncompromising intensity.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Posthumous Memoirs of Bras Cubas\", \"author\": \"Machado de Assis\", \"year\": \"1881\", \"note\": \"A dead man narrates his own pointless life. Machado's novel, written by a Black Brazilian in Rio, invented a sardonic postmodern voice 100 years early and is now recognised as a world masterpiece.\", \"tag\": \"Brazil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Devil to Pay in the Backlands\", \"author\": \"Joao Guimaraes Rosa\", \"year\": \"1956\", \"note\": \"A bandit chief's confessional monologue across the Sertao meditates on good, evil, and God in invented language of such richness that Guimaraes Rosa is Brazil's greatest prose stylist.\", \"tag\": \"Brazil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Gabriela, Clove and Cinnamon\", \"author\": \"Jorge Amado\", \"year\": \"1958\", \"note\": \"Set in 1920s Bahia, Amado's sensuous novel captures Brazil's racial mixing, its African heritage, and the slow dissolution of patriarchal power in a cacao-boom town.\", \"tag\": \"Brazil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Alchemist\", \"author\": \"Paulo Coelho\", \"year\": \"1988\", \"note\": \"The most-translated book by a living author. Coelho's fable of an Andalusian shepherd's journey encapsulates Brazil's spiritual syncretism and the universal longing for Personal Legend.\", \"tag\": \"Brazil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"City of God\", \"author\": \"Paulo Lins\", \"year\": \"1997\", \"note\": \"Lins grew up in the Rio favela he wrote about. This documentary-novel of drug gang warfare and police violence is the essential account of Brazil's urban underclass and the real cost of inequality.\", \"tag\": \"Brazil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"One Hundred Years of Solitude\", \"author\": \"Gabriel Garcia Marquez\", \"year\": \"1967\", \"note\": \"The Buendia family's seven-generation saga in the mythical Macondo is Latin America's Bible -- Colombian civil wars, banana company massacres, and history dissolved into magical, irresistible prose.\", \"tag\": \"Colombia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Love in the Time of Cholera\", \"author\": \"Gabriel Garcia Marquez\", \"year\": \"1985\", \"note\": \"Florentino Ariza waits 51 years for Fermina Daza. Garcia Marquez sets this love story in Cartagena as it modernises -- river boats, telegraphs, and the end of the old Caribbean world.\", \"tag\": \"Colombia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Armies\", \"author\": \"Evelio Rosero\", \"year\": \"2007\", \"note\": \"A retired teacher in a Colombian village watches guerrillas, paramilitaries, and the army tear his community apart. Rosero's spare, terrifying novel is the essential account of Colombia's 60-year internal conflict.\", \"tag\": \"Colombia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"No One Writes to the Colonel\", \"author\": \"Gabriel Garcia Marquez\", \"year\": \"1961\", \"note\": \"A retired colonel waits fifteen years for a pension that never comes. This perfectly compressed novella captures the slow violence of bureaucracy, poverty, and dignity under siege.\", \"tag\": \"Colombia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Our Lady of the Assassins\", \"author\": \"Fernando Vallejo\", \"year\": \"1994\", \"note\": \"A writer returns to Medellin at the height of the drug wars. Vallejo's furious novella is Medellin's violence made literary -- uncomfortable and essential.\", \"tag\": \"Colombia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Disgrace\", \"author\": \"J. M. Coetzee\", \"year\": \"1999\", \"note\": \"A Cape Town professor's retreat to his daughter's Eastern Cape farm, where history settles its accounts violently. Coetzee's Booker Prize winner is post-apartheid South Africa's most searching self-examination.\", \"tag\": \"South Africa\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cry, the Beloved Country\", \"author\": \"Alan Paton\", \"year\": \"1948\", \"note\": \"Written the year the National Party came to power, Paton's novel of a Zulu pastor searching for his son in Johannesburg became the world's introduction to apartheid -- a lament for a beautiful land being destroyed.\", \"tag\": \"South Africa\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"July's People\", \"author\": \"Nadine Gordimer\", \"year\": \"1981\", \"note\": \"In an imagined near-future revolution, a white liberal family takes refuge with their Black servant July. Gordimer's disquieting novel dismantles the comfortable myths white South Africans told themselves.\", \"tag\": \"South Africa\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Triomf\", \"author\": \"Marlene van Niekerk\", \"year\": \"1994\", \"note\": \"Set in the white Afrikaner working-class suburb built on the bulldozed ruins of Sophiatown, van Niekerk's dark, grotesque novel is Afrikanerdom's self-portrait at the moment of apartheid's collapse.\", \"tag\": \"South Africa\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Born a Crime\", \"author\": \"Trevor Noah\", \"year\": \"2016\", \"note\": \"Noah's memoir about growing up mixed-race under apartheid -- where his very existence was illegal -- is the most accessible, joyful, and devastating introduction to what South Africa's racial system actually meant.\", \"tag\": \"South Africa\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Things Fall Apart\", \"author\": \"Chinua Achebe\", \"year\": \"1958\", \"note\": \"Okonkwo's story -- Igbo warrior, tradition, the arrival of Christian missionaries -- is Africa's most-read novel and the founding text of African literature in English. Achebe gave Nigeria its own voice on the global stage.\", \"tag\": \"Nigeria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Half of a Yellow Sun\", \"author\": \"Chimamanda Ngozi Adichie\", \"year\": \"2006\", \"note\": \"The Nigeria-Biafra War (1967-70) through three characters -- a houseboy, a twin sister, and a British journalist. Adichie's Booker Prize winner rescued the Biafran genocide from historical amnesia.\", \"tag\": \"Nigeria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Purple Hibiscus\", \"author\": \"Chimamanda Ngozi Adichie\", \"year\": \"2003\", \"note\": \"Kambili's father is a model Catholic citizen and a domestic tyrant. Adichie's debut maps the trauma of religious extremism and political repression in 1990s Nigeria.\", \"tag\": \"Nigeria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Palm-Wine Drinkard\", \"author\": \"Amos Tutuola\", \"year\": \"1952\", \"note\": \"A man descends into Yoruba spirit-world to retrieve his dead palm-wine tapster. Written in Tutuola's distinctive Yoruba-inflected English, it was the first African novel published internationally.\", \"tag\": \"Nigeria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Americanah\", \"author\": \"Chimamanda Ngozi Adichie\", \"year\": \"2013\", \"note\": \"Ifemelu navigates race, identity, and love across Nigeria, America, and Britain. Adichie's novel is both Nigeria's sharpest portrait of the diaspora experience and America's most incisive outside observer.\", \"tag\": \"Nigeria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Blind Owl\", \"author\": \"Sadegh Hedayat\", \"year\": \"1937\", \"note\": \"Iran's most celebrated novel -- a painter's hallucinatory descent into obsession and murder -- is the Iranian psyche's dark mirror, written by a man who would eventually take his own life in Paris.\", \"tag\": \"Iran\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"My Uncle Napoleon\", \"author\": \"Iraj Pezeshkzad\", \"year\": \"1973\", \"note\": \"Iran's most beloved comic novel -- a pompous uncle who sees himself as Napoleon. Beneath its brilliant farce lies a portrait of Iranian paranoia, honour obsession, and anti-British conspiracy thinking.\", \"tag\": \"Iran\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Savushun\", \"author\": \"Simin Daneshvar\", \"year\": \"1969\", \"note\": \"The first novel published by an Iranian woman -- a Shiraz family during WWII-era occupation. Daneshvar's masterpiece gave Iranian women a literary voice and Iran an identity beyond oil and empire.\", \"tag\": \"Iran\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Reading Lolita in Tehran\", \"author\": \"Azar Nafisi\", \"year\": \"2003\", \"note\": \"A professor gathers female students to read banned Western literature in her Tehran living room. Part memoir, part literary criticism -- the essential experience of women living under the Islamic Republic.\", \"tag\": \"Iran\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Colonel\", \"author\": \"Mahmoud Dowlatabadi\", \"year\": \"2009\", \"note\": \"A retired colonel buries one of his children killed by the Islamic Republic during a rainy night. Long banned, Dowlatabadi's novel is Iran's most searing portrait of revolution devouring its own children.\", \"tag\": \"Iran\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Snow\", \"author\": \"Orhan Pamuk\", \"year\": \"2002\", \"note\": \"A poet visits a snow-locked border town and finds himself in a collision of Islamism, secularism, and Kurdish nationalism. Pamuk's Nobel Prize-winning novel is modern Turkey's most honest self-portrait.\", \"tag\": \"Turkey\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"My Name Is Red\", \"author\": \"Orhan Pamuk\", \"year\": \"1998\", \"note\": \"Ottoman Istanbul's miniaturist painters debate Western perspective versus Islamic artistic tradition. A murder mystery and a meditation on cultural identity and the East-West tension.\", \"tag\": \"Turkey\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Time Regulation Institute\", \"author\": \"Ahmet Hamdi Tanpinar\", \"year\": \"1962\", \"note\": \"A satire of Turkish modernisation -- a bureaucracy created to regulate all the nation's clocks. Tanpinar's absurdist masterpiece captures the comedy and tragedy of a society caught between East and West.\", \"tag\": \"Turkey\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Memed, My Hawk\", \"author\": \"Yasar Kemal\", \"year\": \"1955\", \"note\": \"A young Anatolian villager becomes a bandit hero fighting feudal landlords. Kemal's epic folk-novel is rural Turkey in literature -- its landscapes, poverty, and stubborn dignity.\", \"tag\": \"Turkey\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Istanbul: Memories and the City\", \"author\": \"Orhan Pamuk\", \"year\": \"2003\", \"note\": \"Pamuk's love letter to Istanbul weaves personal history with the city's huzun (collective melancholy). No book captures the sadness of a once-imperial city more beautifully.\", \"tag\": \"Turkey\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Ficciones\", \"author\": \"Jorge Luis Borges\", \"year\": \"1944\", \"note\": \"Borges' story collection -- libraries of infinite books, circular ruins, a man who remembers everything -- invented postmodernism before the word existed. No Argentine writer is thinkable without him.\", \"tag\": \"Argentina\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Hopscotch (Rayuela)\", \"author\": \"Julio Cortazar\", \"year\": \"1963\", \"note\": \"A novel you can read in multiple orders: a Buenos Aires-Paris love story that simultaneously deconstructs itself. Cortazar's masterpiece is Latin America's most radical experiment in novelistic form.\", \"tag\": \"Argentina\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Invention of Morel\", \"author\": \"Adolfo Bioy Casares\", \"year\": \"1940\", \"note\": \"A fugitive on a deserted island discovers he shares it with projections of a past social gathering. This philosophical thriller -- praised by Borges -- is the most elegant science fiction novella in Spanish.\", \"tag\": \"Argentina\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kiss of the Spider Woman\", \"author\": \"Manuel Puig\", \"year\": \"1976\", \"note\": \"Two prisoners in a Buenos Aires jail -- a gay window dresser and a Marxist guerrilla -- share a cell under Peron's regime. Puig's novel, told entirely in dialogue, is the most compassionate account of Argentina's dirty war.\", \"tag\": \"Argentina\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Santa Evita\", \"author\": \"Tomas Eloy Martinez\", \"year\": \"1995\", \"note\": \"The fate of Eva Peron's embalmed corpse across three decades of Argentine history. Martinez's phantasmagoric novel is the most brilliant account of Peronism, the cult of the dead, and Argentina's addiction to myth.\", \"tag\": \"Argentina\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Pedro Paramo\", \"author\": \"Juan Rulfo\", \"year\": \"1955\", \"note\": \"Juan Preciado travels to Comala to find his father Pedro Paramo and finds only ghosts. Rulfo's 100-page masterpiece -- a ghost story, a meditation on power and death -- is the seed from which all Latin American Magical Realism grew.\", \"tag\": \"Mexico\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Like Water for Chocolate\", \"author\": \"Laura Esquivel\", \"year\": \"1989\", \"note\": \"Tita de la Garza's forbidden love and magical cooking in revolutionary-era Mexico. Esquivel's novel is the most popular account of Mexican feminine domestic life -- and the country's pre-Columbian and colonial culinary heritage.\", \"tag\": \"Mexico\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Death of Artemio Cruz\", \"author\": \"Carlos Fuentes\", \"year\": \"1962\", \"note\": \"A dying Mexican tycoon revisits his corrupt life across the Mexican Revolution and its betrayal. Fuentes'   modernist    tour   de    force   is   the   definitive   novel   of   Mexico's   post-revolutionary disillusionment.\", \"tag\": \"Mexico\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Aura\", \"author\": \"Carlos Fuentes\", \"year\": \"1962\", \"note\": \"A young historian hired to complete an old general's memoirs finds himself trapped in a house of mirrors between a young woman and her aged mistress. Fuentes' Gothic novella is Mexico's most perfect uncanny tale.\", \"tag\": \"Mexico\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Underdogs\", \"author\": \"Mariano Azuela\", \"year\": \"1915\", \"note\": \"Written during the Revolution it depicts, Azuela's novel of peasant soldiers who fight without knowing why is the founding text of Mexican revolutionary literature -- raw, disillusioned, and still alive.\", \"tag\": \"Mexico\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Leopard\", \"author\": \"Giuseppe Tomasi di Lampedusa\", \"year\": \"1958\", \"note\": \"The Sicilian Prince of Salina watches his aristocratic world collapse as Garibaldi's revolution sweeps Italy in 1860. Lampedusa's novel -- published posthumously -- is the greatest meditation on historical change and the necessity of adaptation.\", \"tag\": \"Italy\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"If on a winter's night a traveler\", \"author\": \"Italo Calvino\", \"year\": \"1979\", \"note\": \"A novel about reading a novel -- the second person 'You' trying to read a book that keeps being interrupted. Calvino's metafictional masterpiece is Italian literature's most playful and serious meditation on storytelling.\", \"tag\": \"Italy\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Name of the Rose\", \"author\": \"Umberto Eco\", \"year\": \"1980\", \"note\": \"A Franciscan monk investigates murders in a medieval Italian monastery. Eco's philosophical thriller -- a postmodern detective novel, a meditation on censorship and knowledge -- is the most intellectually dense bestseller ever written.\", \"tag\": \"Italy\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Christ Stopped at Eboli\", \"author\": \"Carlo Levi\", \"year\": \"1945\", \"note\": \"A Jewish anti-fascist doctor exiled to a remote Lucanian village describes a Italy entirely outside history and modernity. Levi's memoir-novel revealed the South to the North and is the essential book about Italian internal colonialism.\", \"tag\": \"Italy\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"My Brilliant Friend\", \"author\": \"Elena Ferrante\", \"year\": \"2011\", \"note\": \"Elena and Lila growing up in a violent Naples neighbourhood across 60 years. Ferrante's Neapolitan tetralogy is the most powerful fictional account of female friendship, class escape, and Italian post-war society ever written.\", \"tag\": \"Italy\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Don Quixote\", \"author\": \"Miguel de Cervantes\", \"year\": \"1605\", \"note\": \"The first modern novel. Cervantes' mad knight tilting at windmills is the prototype for every novel written since -- the gap between imagination and reality, between the ideal and the actual, that fiction has been exploring ever since.\", \"tag\": \"Spain\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Time of the Doves\", \"author\": \"Merce Rodoreda\", \"year\": \"1962\", \"note\": \"Natalia's life in Barcelona across the Spanish Civil War and its aftermath -- the most human account of what Franco's war did to ordinary women, written in Catalan under Franco's censorship and smuggled out to be published in exile.\", \"tag\": \"Spain\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Nada\", \"author\": \"Carmen Laforet\", \"year\": \"1944\", \"note\": \"An 18-year-old arrives in post-Civil War Barcelona to study and finds her relatives destroyed by poverty, violence, and repression. Laforet's debut -- written at 23 -- is the definitive portrait of Franco's Spain from inside.\", \"tag\": \"Spain\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Shadow of the Wind\", \"author\": \"Carlos Ruiz Zafon\", \"year\": \"2001\", \"note\": \"A boy discovers a mysterious novel by Julian Carax in a Cemetery of Forgotten Books. Zafon's Gothic love letter to Barcelona -- the city under Franco, its layers of secrets -- became Spain's bestselling post-war novel.\", \"tag\": \"Spain\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Soldiers of Salamis\", \"author\": \"Javier Cercas\", \"year\": \"2001\", \"note\": \"A journalist investigates whether a Republican soldier spared a Francoist writer's life at the end of the Civil War. Cercas' novel -- part investigation, part meditation -- is the most honest reckoning with the Civil War's moral complexity.\", \"tag\": \"Spain\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Cairo Trilogy\", \"author\": \"Naguib Mahfouz\", \"year\": \"1956-1957\", \"note\": \"Three generations of the Abd al-Jawad family in Cairo's old quarter from WWI to the 1952 Revolution. Mahfouz's Nobel Prize-winning trilogy is the Arab world's equivalent of Tolstoy -- society, politics, and individual conscience in one vast portrait.\", \"tag\": \"Egypt\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Midaq Alley\", \"author\": \"Naguib Mahfouz\", \"year\": \"1947\", \"note\": \"A single alley in old Cairo and all its inhabitants -- the dreamer, the barber, the marriage broker, the girl seduced by modernity. Mahfouz's most compact social portrait is Cairo as a microcosm of Egyptian contradiction.\", \"tag\": \"Egypt\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Yacoubian Building\", \"author\": \"Alaa Al Aswany\", \"year\": \"2002\", \"note\": \"Cairo's most famous art deco building and all its tenants -- secular elites, Islamists, homosexuals, the corrupt. Al Aswany's novel was Egypt's bestselling book in decades and a precursor to the 2011 revolution.\", \"tag\": \"Egypt\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Zaat\", \"author\": \"Sonallah Ibrahim\", \"year\": \"1992\", \"note\": \"An Egyptian woman accumulates appliances and newspaper clippings across three decades of Sadat and Mubarak's Egypt. Ibrahim's formally radical novel -- consumer goods as the measure of a life -- is the best portrait of Egypt's infitah betrayal.\", \"tag\": \"Egypt\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Map of Love\", \"author\": \"Ahdaf Soueif\", \"year\": \"1999\", \"note\": \"Two love stories across a century -- an English woman in Egypt in 1900 and her great-niece in 1997. Soueif's Booker-shortlisted novel is the most nuanced account of the Anglo-Egyptian encounter and its colonial legacies.\", \"tag\": \"Egypt\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Case of Exploding Mangoes\", \"author\": \"Mohammed Hanif\", \"year\": \"2008\", \"note\": \"A junior air force officer plots to assassinate General Zia ul-Haq. Hanif's satirical novel is the most irreverent and entertaining portrait of Pakistan's military-political absurdity ever written.\", \"tag\": \"Pakistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Moth Smoke\", \"author\": \"Mohsin Hamid\", \"year\": \"2000\", \"note\": \"A sacked banker in Lahore slides into heroin addiction and crime against the backdrop of Pakistan's 1998 nuclear tests. Hamid's debut captures the class system and moral dissolution of elite Pakistani society with corrosive elegance.\", \"tag\": \"Pakistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Reluctant Fundamentalist\", \"author\": \"Mohsin Hamid\", \"year\": \"2007\", \"note\": \"A Pakistani Princeton graduate tells an American stranger in Lahore why he left his Wall Street career after 9/11. Hamid's monologue novel is the most concise account of the post-9/11 Muslim identity crisis ever written.\", \"tag\": \"Pakistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Home Fire\", \"author\": \"Kamila Shamsie\", \"year\": \"2017\", \"note\": \"A British-Pakistani family is torn apart when one sibling joins ISIS. Shamsie's retelling of Sophocles' Antigone is the essential novel about radicalisation, belonging, and the impossible positions Muslim families occupy in the West.\", \"tag\": \"Pakistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In Other Rooms, Other Wonders\", \"author\": \"Daniyal Mueenuddin\", \"year\": \"2009\", \"note\": \"Stories of a feudal Pakistani landowner and all who depend on him -- from his New York-educated son to the most junior servants. Mueenuddin's debut maps Pakistan's feudal social structure with Chekhovian precision.\", \"tag\": \"Pakistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"This Earth of Mankind\", \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1980\", \"note\": \"Minke, a young Javanese student in colonial Dutch East Indies, falls in love across racial lines and awakens politically. The first of Pramoedya's Buru Quartet -- dictated to fellow prisoners and smuggled out -- is one of the great anti-colonial novels.\", \"tag\": \"Indonesia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Child of All Nations\", \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1980\", \"note\": \"Minke's political consciousness develops as he witnesses Dutch colonial exploitation. The Buru Quartet's second volume is the Indonesian national awakening in fiction form.\", \"tag\": \"Indonesia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Footsteps\", \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1985\", \"note\": \"Minke founds Indonesia's first native newspaper and the first national organisation. Pramoedya's third volume is one of the great novels of journalism and political organising as acts of resistance.\", \"tag\": \"Indonesia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"House of Glass\", \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1988\", \"note\": \"Told from the perspective of the Dutch colonial investigator pursuing Minke, the Buru Quartet's final volume is a meditation on surveillance, collaboration, and the psychology of the coloniser.\", \"tag\": \"Indonesia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Rainbow Troops\", \"author\": \"Andrea Hirata\", \"year\": \"2005\", \"note\": \"Ten children on the tin-mining island of Belitung fight for the right to education against a corporation that wants their school closed. Indonesia's bestselling novel is a celebration of the human hunger for learning.\", \"tag\": \"Indonesia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Grain of Wheat\", \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1967\", \"note\": \"Four Kenyans prepare for Uhuru (independence) while carrying the weight of their actions during the Mau Mau uprising. Ngugi's masterpiece is the most morally complex portrait of anti-colonial struggle and its cost in any African literature.\", \"tag\": \"Kenya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Weep Not, Child\", \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1964\", \"note\": \"The first novel in English by an East African -- Njoroge's education during the Mau Mau Emergency. Ngugi's debut is the essential account of how colonialism destroyed the thing it claimed to bring: hope through education.\", \"tag\": \"Kenya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Petals of Blood\", \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1977\", \"note\": \"Four characters in post-independence Kenya find that nothing has changed except who does the exploiting. This is the novel that led to Ngugi's imprisonment by the Kenyatta government -- Kenya's most important political novel.\", \"tag\": \"Kenya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Devil on the Cross\", \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1982\", \"note\": \"Written on toilet paper in prison in Ngugi's native Gikuyu language, this allegorical novel of a feast where thieves and robbers compete is the most radical act in African literary history.\", \"tag\": \"Kenya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Wizard of the Crow\", \"author\": \"Ngugi wa Thiong'o\", \"year\": \"2006\", \"note\": \"A comic epic satire of an African dictatorship -- the ruler wants to build a tower to Heaven, his people are suffering. Ngugi's longest and funniest novel is the definitive satirical portrait of post-colonial African governance.\", \"tag\": \"Kenya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Zorba the Greek\", \"author\": \"Nikos Kazantzakis\", \"year\": \"1946\", \"note\": \"A bookish narrator and his exuberant companion Alexis Zorba work a Cretan lignite mine. Kazantzakis's novel is the fullest expression of the Greek character -- its vitality, its fatalism, its dance in the face of disaster.\", \"tag\": \"Greece\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Last Temptation of Christ\", \"author\": \"Nikos Kazantzakis\", \"year\": \"1955\", \"note\": \"Kazantzakis's Jesus -- torn between human desire and divine duty -- scandalised the Greek Orthodox Church and was banned. It is the most psychologically honest fictional exploration of the Christ story ever attempted.\", \"tag\": \"Greece\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Captain's Daughter\", \"author\": \"Stratis Myrivilis\", \"year\": \"1933\", \"note\": \"Set on Lesbos across WWI and the Asia Minor Catastrophe of 1922 -- when Turkey expelled its Greek population -- Myrivilis's novel is the essential account of the event that shaped modern Greek identity above all others.\", \"tag\": \"Greece\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Beloved and Rejected\", \"author\": \"Alexandros Papadiamantis\", \"year\": \"1879\", \"note\": \"Papadiamantis -- the father of modern Greek prose -- captures life on the Aegean island of Skiathos with a tenderness and spiritual depth that gave Greek literature its modern vernacular voice.\", \"tag\": \"Greece\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Z\", \"author\": \"Vassilis Vassilikos\", \"year\": \"1966\", \"note\": \"The assassination of the left-wing politician Grigoris Lambrakis in 1963 and the cover-up that followed. Vassilikos's political thriller -- banned under the Greek junta -- is the model for the political assassination novel.\", \"tag\": \"Greece\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Street of Crocodiles\", \"author\": \"Bruno Schulz\", \"year\": \"1934\", \"note\": \"Stories of a boy and his eccentric father in the Jewish quarter of Drohobych -- matter dissolving into dream, commerce into myth. Schulz, murdered by the Gestapo in 1942, is the most original prose writer in Polish literature.\", \"tag\": \"Poland\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Solaris\", \"author\": \"Stanislaw Lem\", \"year\": \"1961\", \"note\": \"Scientists orbit a planet whose ocean may be conscious but is wholly incomprehensible. Lem's science fiction is genuinely philosophical -- the most serious exploration of the limits of human knowledge in the genre.\", \"tag\": \"Poland\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Painted Bird\", \"author\": \"Jerzy Kosinski\", \"year\": \"1965\", \"note\": \"A dark-haired child wanders through WWII Eastern Europe. Kosinski's harrowing novel captures the savagery of Central European peasant culture and Nazi occupation from a child's bewildered perspective.\", \"tag\": \"Poland\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Flights\", \"author\": \"Olga Tokarczuk\", \"year\": \"2007\", \"note\": \"Meditations on travel, the human body, and impermanence -- Tokarczuk's Nobel Prize-winning novel (technically a 'constellation novel') is the most formally original Polish fiction since Schulz and the most European in sensibility.\", \"tag\": \"Poland\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Doll\", \"author\": \"Boleslaw Prus\", \"year\": \"1890\", \"note\": \"Stanislaw Wokulski's hopeless love for an aristocratic woman in Warsaw -- but really the story of a society between old Poland and the new industrial age. Prus's social novel is the Polish Middlemarch.\", \"tag\": \"Poland\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Handmaid's Tale\", \"author\": \"Margaret Atwood\", \"year\": \"1985\", \"note\": \"In the theocratic republic of Gilead (former New England), women are classified by function. Atwood's dystopia -- rooted in real historical precedents -- is the most influential feminist novel of the 20th century.\", \"tag\": \"Canada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The English Patient\", \"author\": \"Michael Ondaatje\", \"year\": \"1992\", \"note\": \"Four wounded people in an Italian villa at the end of WWII -- a burned pilot whose identity is unknown, a Sikh sapper, a Canadian nurse, and a thief. Ondaatje's Booker Prize winner is the most lyrical war novel in English.\", \"tag\": \"Canada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Life of Pi\", \"author\": \"Yann Martel\", \"year\": \"2001\", \"note\": \"A 16-year-old Indian boy survives a shipwreck with a Bengal tiger on a lifeboat. Martel's philosophical adventure story is the most read Canadian novel internationally and a meditation on storytelling and the existence of God.\", \"tag\": \"Canada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Alias Grace\", \"author\": \"Margaret Atwood\", \"year\": \"1996\", \"note\": \"Based on the real 1843 murder trial of Grace Marks, a Canadian servant girl. Atwood's novel is the most sophisticated exploration of female criminality, memory, and the unreliable narrator in Canadian fiction.\", \"tag\": \"Canada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Stone Angel\", \"author\": \"Margaret Laurence\", \"year\": \"1964\", \"note\": \"Ninety-year-old Hagar Shipley -- proud, rigid, unforgiving -- reviews her prairie life. Laurence's novel is the founding text of Canadian prairie literature and one of the most powerful portrayals of an unsympathetic consciousness in fiction.\", \"tag\": \"Canada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cloudstreet\", \"author\": \"Tim Winton\", \"year\": \"1991\", \"note\": \"Two working-class families share a large house in Perth across 20 years. Winton's sprawling, comic, tender novel is the great Australian family epic -- the country's relationship with its own land, luck, and larrikin spirit.\", \"tag\": \"Australia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"True History of the Kelly Gang\", \"author\": \"Peter Carey\", \"year\": \"2000\", \"note\": \"Ned Kelly -- Australia's most famous outlaw -- writes his own story. Carey's Booker Prize winner, written in Kelly's invented voice, is the most vivid account of colonial class violence and the birth of an Australian anti-authoritarian identity.\", \"tag\": \"Australia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Voss\", \"author\": \"Patrick White\", \"year\": \"1957\", \"note\": \"A German explorer attempts to cross the Australian continent in the 1840s and is destroyed by it. White's Nobel Prize-winning novel is the most philosophically ambitious Australian fiction -- the continent itself as spiritual ordeal.\", \"tag\": \"Australia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Carpentaria\", \"author\": \"Alexis Wright\", \"year\": \"2006\", \"note\": \"An epic of the Gulf Country in northern Australia -- Aboriginal myth, political struggle, cyclones, and the poisoned land around a mining town. Wright's Miles Franklin Award winner is the great novel of Indigenous Australia.\", \"tag\": \"Australia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Secret River\", \"author\": \"Kate Grenville\", \"year\": \"2005\", \"note\": \"An English convict transported to New South Wales in 1806 and his violent encounter with the Dharug people. Grenville's novel forces white Australia to look directly at the founding violence it has preferred to forget.\", \"tag\": \"Australia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Hunger\", \"author\": \"Knut Hamsun\", \"year\": \"1890\", \"note\": \"An unnamed writer starves through Christiania (Oslo), refusing to compromise his artistic integrity. Hamsun's first-person stream-of-consciousness novel invented modernist interiority in European fiction before Joyce or Woolf.\", \"tag\": \"Scandinavia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kristin Lavransdatter\", \"author\": \"Sigrid Undset\", \"year\": \"1920-1922\", \"note\": \"A woman's life across 14th-century Norway -- the most complete historical novel of medieval Christian Europe ever written. Undset's Nobel Prize-winning trilogy is the Norse world made flesh.\", \"tag\": \"Scandinavia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Girl with the Dragon Tattoo\", \"author\": \"Stieg Larsson\", \"year\": \"2005\", \"note\": \"Lisbeth Salander and journalist Mikael Blomkvist investigate a 40-year-old disappearance. Larsson's Millennium trilogy exposed Sweden's carefully hidden establishment misogyny and corruption to the entire world.\", \"tag\": \"Scandinavia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Miss Smilla's Feeling for Snow\", \"author\": \"Peter Hoeg\", \"year\": \"1992\", \"note\": \"A Greenlandic-Danish woman investigates a child's death in Copenhagen and follows the trail to the Arctic. Hoeg's novel is both a superb thriller and a profound meditation on Greenlandic identity and Denmark's colonial relationship with it.\", \"tag\": \"Scandinavia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Emigrants\", \"author\": \"Vilhelm Moberg\", \"year\": \"1949-1959\", \"note\": \"A Swedish farming family emigrates to Minnesota in the 1850s. Moberg's four-volume epic is the foundational text of the Scandinavian-American experience and Sweden's most cherished national saga.\", \"tag\": \"Scandinavia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Trial\", \"author\": \"Franz Kafka\", \"year\": \"1925\", \"note\": \"Josef K. is arrested without ever knowing his crime. Kafka's novel -- written in German in Prague by a Czech Jew -- invented the language we use to describe bureaucratic oppression and has given its author's name to a whole category of human experience.\", \"tag\": \"Czech Republic\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Unbearable Lightness of Being\", \"author\": \"Milan Kundera\", \"year\": \"1984\", \"note\": \"Two couples across the Prague Spring of 1968 and its Soviet suppression. Kundera's meditation on lightness versus weight, love versus politics, is the essential novel of Eastern European life under communist occupation.\", \"tag\": \"Czech Republic\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"I Served the King of England\", \"author\": \"Bohumil Hrabal\", \"year\": \"1971\", \"note\": \"A waiter rises through the ranks of Czech hotels while history -- occupation, communism, nationalisation -- keeps overturning everything. Hrabal's picaresque is the most joyful serious Czech novel: life's absurdity as comedy rather than tragedy.\", \"tag\": \"Czech Republic\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Book of Laughter and Forgetting\", \"author\": \"Milan Kundera\", \"year\": \"1979\", \"note\": \"Seven stories on a single theme: the erasure of memory as a political weapon. Kundera's meditation on forgetting -- both personal and collective -- was banned in Czechoslovakia and is the most political of his novels.\", \"tag\": \"Czech Republic\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Too Loud a Solitude\", \"author\": \"Bohumil Hrabal\", \"year\": \"1976\", \"note\": \"A paper compactor has spent 35 years secretly saving books from destruction under communism. Hrabal's lyrical monologue is the most beautiful defence of literature against power ever written.\", \"tag\": \"Czech Republic\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Book of Disquiet\", \"author\": \"Fernando Pessoa\", \"year\": \"1982\", \"note\": \"Written over decades by Lisbon's greatest modernist under a semi-heteronym, Pessoa's fragmentary masterpiece is the most intimate document of urban melancholy ever written -- a city and a consciousness become one.\", \"tag\": \"Portugal\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Blindness\", \"author\": \"Jose Saramago\", \"year\": \"1995\", \"note\": \"A city goes suddenly blind; society collapses in an interment camp. Saramago's Nobel Prize-winning allegory is one of the most disturbing and morally unsparing accounts of what human beings do to each other when order disappears.\", \"tag\": \"Portugal\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Baltasar and Blimunda\", \"author\": \"Jose Saramago\", \"year\": \"1982\", \"note\": \"In 18th-century Portugal, a one-handed soldier and a woman who can see inside bodies try to build a flying machine. Saramago's most humane novel meditates on the Inquisition, Baroque excess, and the human need to transcend.\", \"tag\": \"Portugal\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Land at the End of the World\", \"author\": \"Antonio Lobo Antunes\", \"year\": \"1979\", \"note\": \"A Portuguese army doctor returns from the Angola colonial war and talks through the night. Antunes's novel -- the most traumatic account of Portugal's colonial wars -- helped bury the myths of Salazarist empire.\", \"tag\": \"Portugal\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Gospel According to Jesus Christ\", \"author\": \"Jose Saramago\", \"year\": \"1991\", \"note\": \"Jesus as a confused young man, God as a cynical strategist. Saramago's controversial novel was banned in Portugal by the conservative government -- and is the most provocative fictional rethinking of the Christian story.\", \"tag\": \"Portugal\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Fatelessness\", \"author\": \"Imre Kertesz\", \"year\": \"1975\", \"note\": \"A 15-year-old Hungarian Jewish boy describes his time in Auschwitz and Buchenwald without rage or sentimentality -- as if it were simply what happened to him. Kertesz's Nobel Prize winner is the most morally precise Holocaust novel ever written.\", \"tag\": \"Hungary\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Door\", \"author\": \"Magda Szabo\", \"year\": \"1987\", \"note\": \"A writer's decades-long relationship with her fierce, secretive peasant housekeeper Emerence -- and the catastrophic ending. Szabo's novel is the greatest portrait of female friendship and class difference in Central European fiction.\", \"tag\": \"Hungary\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Embers\", \"author\": \"Sandor Marai\", \"year\": \"1942\", \"note\": \"Two old men meet after 41 years of estrangement and the General talks through the night about friendship, betrayal, and passion. Marai's Austro-Hungarian masterpiece is the most perfectly constructed novel of its decade.\", \"tag\": \"Hungary\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Journey by Moonlight\", \"author\": \"Antal Szerb\", \"year\": \"1937\", \"note\": \"A Hungarian honeymooner in Italy becomes lost in his own past and the Italian landscape of death and beauty. Szerb's novel -- its author killed in a labour camp in 1945 -- is pre-war Central European literature's most beautiful elegy.\", \"tag\": \"Hungary\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Satantango\", \"author\": \"Laszlo Krasznahorkai\", \"year\": \"1985\", \"note\": \"The inhabitants of a collective farm wait for their charismatic leader Irimias to return, who may or may not be dead. Krasznahorkai's spiralling, rain-soaked novel is the most apocalyptic portrait of late communism ever written.\", \"tag\": \"Hungary\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Three Trapped Tigers\", \"author\": \"Guillermo Cabrera Infante\", \"year\": \"1967\", \"note\": \"Havana's nightlife on the eve of the Revolution -- music, women, jokes, and linguistic pyrotechnics. Cabrera Infante's novel is the fullest portrait of pre-Castro Cuban culture and the most technically dazzling novel in Spanish.\", \"tag\": \"Cuba\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Kingdom of This World\", \"author\": \"Alejo Carpentier\", \"year\": \"1949\", \"note\": \"The Haitian Revolution and the life of Ti Noel across the island's transformation from French colony to Black republic. Carpentier's novel invented 'lo real maravilloso' -- the American marvellous real -- before Garcia Marquez used it.\", \"tag\": \"Cuba\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Paradiso\", \"author\": \"Jose Lezama Lima\", \"year\": \"1966\", \"note\": \"A Cuban boy's coming of age and sexual formation in baroque, encyclopaedic prose. Lezama Lima's novel is the most difficult and rewarding in Caribbean literature -- Havana and the Spanish Baroque as a single overwhelming experience.\", \"tag\": \"Cuba\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Before Night Falls\", \"author\": \"Reinaldo Arenas\", \"year\": \"1992\", \"note\": \"A gay Cuban poet's memoir-novel of survival under Castro -- prison, persecution, exile, AIDS. Arenas's autobiography is the most defiant act in Cuban literature and one of the 20th century's most important testimonies of oppression.\", \"tag\": \"Cuba\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Explosion in a Cathedral\", \"author\": \"Alejo Carpentier\", \"year\": \"1962\", \"note\": \"A young man caught up in the French Revolution's Caribbean overflow witnesses the Terror arriving in the islands. Carpentier's philosophical novel is the greatest meditation on revolution, utopia, and their inevitable corruption.\", \"tag\": \"Cuba\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The House of the Spirits\", \"author\": \"Isabel Allende\", \"year\": \"1982\", \"note\": \"Four generations of the Trueba family across Chile's political upheavals -- from hacienda patriarchy to Salvador Allende's government to Pinochet's coup. Allende's magical realist epic is the most read novel about Latin American political violence.\", \"tag\": \"Chile\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"2666\", \"author\": \"Roberto Bolano\", \"year\": \"2004\", \"note\": \"Four academics searching for a reclusive German novelist, a series of femicides in a Mexican border city, and a Nazi soldier on the Eastern Front. Bolano's 900-page posthumous masterpiece is the most ambitious Latin American novel of the last 50 years.\", \"tag\": \"Chile\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Savage Detectives\", \"author\": \"Roberto Bolano\", \"year\": \"1998\", \"note\": \"Two poets searching for a vanished poetess, through 50 testimonies spanning 20 years. Bolano's novel is the most comprehensive portrait of the generation of Latin American intellectuals formed by the coup generation.\", \"tag\": \"Chile\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"I Dreamed the Snow Was Burning\", \"author\": \"Antonio Skarmeta\", \"year\": \"1975\", \"note\": \"A young footballer arrives in Santiago on September 10, 1973 -- the day before Pinochet's coup. Skarmeta's novel captures the exact moment Chilean democracy ended, from the eyes of someone who didn't know what he was witnessing.\", \"tag\": \"Chile\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Distant Star\", \"author\": \"Roberto Bolano\", \"year\": \"1996\", \"note\": \"A Chilean pilot who wrote poems in the sky commits atrocities under Pinochet. Bolano's novella -- the evil of aestheticism in the service of fascism -- is a meditation on how art can be complicit in horror.\", \"tag\": \"Chile\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Beneath the Lion's Gaze\", \"author\": \"Maaza Mengiste\", \"year\": \"2010\", \"note\": \"A Haile Selassie-era doctor's family across the 1974 coup that brought Mengistu to power. Mengiste's debut is the essential fictional account of the Derg dictatorship and the Red Terror that killed an estimated 500,000 Ethiopians.\", \"tag\": \"Ethiopia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cutting for Stone\", \"author\": \"Abraham Verghese\", \"year\": \"2009\", \"note\": \"Twin brothers born in an Addis Ababa missionary hospital across Ethiopia's turbulent 20th century. Verghese's epic -- medicine as metaphor for a country and its wounds -- is the most widely read international novel about Ethiopia.\", \"tag\": \"Ethiopia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Shadow King\", \"author\": \"Maaza Mengiste\", \"year\": \"2019\", \"note\": \"Italian invasion of Ethiopia in 1935 -- and the Ethiopian women fighters who resisted it. Mengiste's Booker Prize-shortlisted novel recovered from history a story that had been almost entirely erased.\", \"tag\": \"Ethiopia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Notes from the Hyena's Belly\", \"author\": \"Nega Mezlekia\", \"year\": \"2000\", \"note\": \"A boyhood in Jijiga, Ethiopian Somali region, through civil war, Marxist revolution, and drought. Mezlekia's memoir-novel is the most intimate account of Ethiopia's long crisis from a region that remains in conflict.\", \"tag\": \"Ethiopia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The God Who Begat a Jackal\", \"author\": \"Nega Mezlekia\", \"year\": \"2002\", \"note\": \"A 16th-century Ethiopian ruler faces the Oromo migrations. Mezlekia's historical novel excavates Ethiopia's deeper past and the political dynamics -- ethnic, religious, imperial -- that echo in today's Tigray conflict.\", \"tag\": \"Ethiopia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Sand Child\", \"author\": \"Tahar Ben Jelloun\", \"year\": \"1985\", \"note\": \"A Moroccan father raises his eighth daughter as a son. Ben Jelloun's Prix Goncourt winner is a meditation on gender, identity, and Islamic patriarchy that reads like a story from the Thousand and One Nights rewritten by Kafka.\", \"tag\": \"Morocco\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"For Bread Alone\", \"author\": \"Mohamed Choukri\", \"year\": \"1973\", \"note\": \"Choukri grew up illiterate in Tangier's slums; he learned to read at 20 and wrote this autobiography of childhood poverty, hunger, and violence. Banned in Morocco for 30 years, it is the most honest account of North African poverty ever written.\", \"tag\": \"Morocco\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"This Blinding Absence of Light\", \"author\": \"Tahar Ben Jelloun\", \"year\": \"2001\", \"note\": \"Based on the real Derb Moulay Cherif detention camp where King Hassan II imprisoned political opponents underground for 18 years. Ben Jelloun's account -- narrated by a survivor -- is the essential novel of North African political imprisonment.\", \"tag\": \"Morocco\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Voices of Marrakesh\", \"author\": \"Elias Canetti\", \"year\": \"1968\", \"note\": \"The Nobel laureate's account of three weeks in Marrakesh -- its sounds, smells, human presences. Canetti's meditation on the city is the finest literary portrait of Morocco written by an outsider and one of the great travel-essay hybrids.\", \"tag\": \"Morocco\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Dreams of Trespass\", \"author\": \"Fatema Mernissi\", \"year\": \"1994\", \"note\": \"A girl growing up in a Fez harem in the 1940s, imagining life beyond its walls. Mernissi's memoir-novel is the most important feminist account of Moroccan women's lives and the meaning of domestic space in Islamic culture.\", \"tag\": \"Morocco\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The White Guard\", \"author\": \"Mikhail Bulgakov\", \"year\": \"1925\", \"note\": \"Set in Kyiv during the Civil War of 1918-19, Bulgakov's first novel follows the Turbin family as the city changes hands between Bolsheviks, Whites, and Ukrainian forces -- the primal scene of modern Ukraine's birth.\", \"tag\": \"Ukraine\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Death and the Penguin\", \"author\": \"Andrey Kurkov\", \"year\": \"1996\", \"note\": \"A Kyiv obituary writer and his pet penguin stumble into the gangster economy of 1990s post-Soviet Ukraine. Kurkov's black comedy is the essential portrait of the chaos and absurdity of Ukraine's independence decade.\", \"tag\": \"Ukraine\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Voroshilovgrad\", \"author\": \"Serhiy Zhadan\", \"year\": \"2010\", \"note\": \"A Kharkiv man returns to the Donbas to save his brother's petrol station. Zhadan -- now a volunteer soldier -- captures eastern Ukraine's identity, landscape, and the forces that would later destroy it.\", \"tag\": \"Ukraine\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Museum of Abandoned Secrets\", \"author\": \"Oksana Zabuzhko\", \"year\": \"2009\", \"note\": \"Alternating between WWII-era UPA partisans and modern Kyiv, Zabuzhko's epic excavates Ukraine's suppressed historical memory and asks who has the right to tell its story -- vital reading after 2022.\", \"tag\": \"Ukraine\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Fieldwork in Ukrainian Sex\", \"author\": \"Oksana Zabuzhko\", \"year\": \"1996\", \"note\": \"A Ukrainian poet on an American academic exchange confronts the colonial damage done to Ukrainian language, identity, and women's lives. The novel that gave Ukrainian literature its feminist voice.\", \"tag\": \"Ukraine\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Kite Runner\", \"author\": \"Khaled Hosseini\", \"year\": \"2003\", \"note\": \"Amir's betrayal of his Hazara servant Hassan haunts him across decades and continents. Hosseini gave the world its first intimate view of Afghan life -- Kabul's winters, Pashtun-Hazara tension, and the Taliban's brutality.\", \"tag\": \"Afghanistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Thousand Splendid Suns\", \"author\": \"Khaled Hosseini\", \"year\": \"2007\", \"note\": \"Two Afghan women from different generations, bound together in a loveless marriage, survive the Soviet war, civil war, and Taliban rule. The essential account of Afghan women's experience.\", \"tag\": \"Afghanistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Swallows of Kabul\", \"author\": \"Yasmina Khadra\", \"year\": \"2002\", \"note\": \"A novel of Taliban-ruled Kabul -- a prison guard and a prisoner -- captures the dehumanisation of fundamentalist rule with devastating restraint.\", \"tag\": \"Afghanistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"And the Mountains Echoed\", \"author\": \"Khaled Hosseini\", \"year\": \"2013\", \"note\": \"A brother and sister separated in 1952 Kabul, and the echoes across generations and continents. Hosseini's most ambitious novel captures how Afghanistan's wars shattered families across the world.\", \"tag\": \"Afghanistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Patience Stone\", \"author\": \"Atiq Rahimi\", \"year\": \"2008\", \"note\": \"An Afghan woman talks to her comatose husband -- and finally says everything. Rahimi's Prix Goncourt-winning novella is the most intimate, devastating portrait of an Afghan woman's inner life.\", \"tag\": \"Afghanistan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"To the End of the Land\", \"author\": \"David Grossman\", \"year\": \"2008\", \"note\": \"An Israeli mother walks the Galilee hills to avoid receiving news of her son's death in combat. Written while Grossman's own son was serving -- and finished after he died -- it is the most harrowing account of the conflict's cost.\", \"tag\": \"Palestine and Israel\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mornings in Jenin\", \"author\": \"Susan Abulhawa\", \"year\": \"2010\", \"note\": \"Four generations of a Palestinian family from the village of Ein Hod -- displacement in 1948, life in Jenin refugee camp, and diaspora. Abulhawa gave the Palestinian narrative its most read novelistic form.\", \"tag\": \"Palestine and Israel\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Tale of Love and Darkness\", \"author\": \"Amos Oz\", \"year\": \"2002\", \"note\": \"Oz's memoir-novel of growing up in pre-independence Jerusalem is the great Zionist narrative -- both its extraordinary idealism and the shadows it contained. Essential for understanding what Israel believed itself to be.\", \"tag\": \"Palestine and Israel\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Gate of the Sun\", \"author\": \"Elias Khoury\", \"year\": \"1998\", \"note\": \"A Palestinian doctor tells stories to a comatose fedayeen fighter -- the Nakba, the camps, the lost villages. Khoury's epic is the Palestinian oral tradition transformed into a monument of world literature.\", \"tag\": \"Palestine and Israel\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"My Michael\", \"author\": \"Amos Oz\", \"year\": \"1968\", \"note\": \"A Jerusalem woman's inner life -- her fantasies about Arab twins she knew as a child -- becomes a portrait of Israeli society's repressed anxieties in the years leading to the Six-Day War.\", \"tag\": \"Palestine and Israel\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"What Strange Paradise\", \"author\": \"Omar El Akkad\", \"year\": \"2021\", \"note\": \"A Syrian boy washes ashore on a Greek island after a refugee boat capsizes. El Akkad's Booker Prize winner tells the Mediterranean migration crisis from both sides of the wire -- among the most urgent novels of our moment.\", \"tag\": \"Syria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Beekeeper of Aleppo\", \"author\": \"Christy Lefteri\", \"year\": \"2019\", \"note\": \"A beekeeper and his artist wife flee the destruction of Aleppo to reach Britain. Written after Lefteri volunteered in Athens refugee camps, this novel brings the Syrian refugee experience into human scale.\", \"tag\": \"Syria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"No Knives in the Kitchens of This City\", \"author\": \"Khaled Khalifa\", \"year\": \"2013\", \"note\": \"A Damascene family over four decades of Baathist rule -- surveillance, torture, and the slow death of hope. Syria's most important living novelist remains in Damascus; this is courage in fiction form.\", \"tag\": \"Syria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In Praise of Hatred\", \"author\": \"Khaled Khalifa\", \"year\": \"2008\", \"note\": \"Set in 1980s Aleppo during Assad Sr.'s crackdown on the Muslim Brotherhood, a young woman is drawn into extremism. It foresaw the Syria that would collapse in 2011.\", \"tag\": \"Syria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Dark Side of Love\", \"author\": \"Rafik Schami\", \"year\": \"2004\", \"note\": \"A Syrian writer in exile traces two Damascene families across three generations -- Christian, Muslim, urban, rural. Schami's epic of forbidden love is the richest fictional portrait of Syrian society before its destruction.\", \"tag\": \"Syria\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Glass Palace\", \"author\": \"Amitav Ghosh\", \"year\": \"2000\", \"note\": \"From the fall of the Burmese monarchy in 1885 to the present day, Ghosh's epic follows an Indian-born orphan's rise across Burma, Malaya, and India. The essential fictional account of Burma under British colonial rule.\", \"tag\": \"Myanmar (Burma)\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"From the Land of Green Ghosts\", \"author\": \"Pascal Khoo Thwe\", \"year\": \"2002\", \"note\": \"A Padaung tribesman escapes Burma's 1988 uprising and walks through the jungle to Thailand. This autobiographical novel is both an adventure story and an elegy for Burma under the generals.\", \"tag\": \"Myanmar (Burma)\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Finding George Orwell in Burma\", \"author\": \"Emma Larkin\", \"year\": \"2004\", \"note\": \"A journalist retraces Orwell's time as a colonial police officer in Burma and discovers that Burmese read 1984 and Animal Farm as documentaries about their own lives. Literature as survival.\", \"tag\": \"Myanmar (Burma)\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Smile as They Bow\", \"author\": \"Nu Nu Yi\", \"year\": \"2007\", \"note\": \"Set during the Taungbyon spirit festival near Mandalay, this novel of a transgender ritual performer navigating gender, spirituality, and love is Burma's most celebrated literary debut in decades.\", \"tag\": \"Myanmar (Burma)\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Lizard Cage\", \"author\": \"Karen Connelly\", \"year\": \"2005\", \"note\": \"A political prisoner in a Rangoon jail and a street orphan. Connelly's Giller Prize-winning novel is the most sustained fictional portrait of life inside Burma's gulag.\", \"tag\": \"Myanmar (Burma)\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Season of Migration to the North\", \"author\": \"Tayeb Salih\", \"year\": \"1966\", \"note\": \"Called 'the most important Arabic novel of the 20th century' -- a Sudanese man returns from studying in London carrying something dark. Salih's inversion of Heart of Darkness is a perfect post-colonial masterpiece.\", \"tag\": \"Sudan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Wedding of Zein\", \"author\": \"Tayeb Salih\", \"year\": \"1966\", \"note\": \"Salih's companion novella -- the village fool's miraculous marriage -- is a celebration of Sudanese communal life, Islamic spirituality, and the humanity of a Nile village before modernity devoured it.\", \"tag\": \"Sudan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Cairo Trilogy\", \"author\": \"Naguib Mahfouz\", \"year\": \"1956-1957\", \"note\": \"Though Egyptian, Mahfouz's Nobel Prize-winning trilogy shapes the entire tradition within which Sudanese literature operates -- included here as the defining Arab social novel.\", \"tag\": \"Sudan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Grain of Wheat\", \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1967\", \"note\": \"The East African anti-colonial tradition that Sudanese literature shares -- resistance, betrayal, and the cost of independence -- captured in the most morally complex novel of Kenyan resistance.\", \"tag\": \"Sudan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Johnny Mad Dog\", \"author\": \"Emmanuel Dongala\", \"year\": \"2002\", \"note\": \"A teenage soldier in a sub-Saharan African civil war -- the world as seen through a child soldier's eyes. Congolese author Dongala's novel captures the logic of Africa's child-soldier wars that extends across Sudan's own conflicts.\", \"tag\": \"Sudan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Frankenstein in Baghdad\", \"author\": \"Ahmed Saadawi\", \"year\": \"2013\", \"note\": \"A junk dealer in post-invasion Baghdad sews together body parts of bomb victims to create a creature that goes on its own killing spree for justice. Saadawi's International Prize for Arabic Fiction winner is the most brilliant literary response to the Iraq War.\", \"tag\": \"Iraq\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Corpse Washer\", \"author\": \"Sinan Antoon\", \"year\": \"2010\", \"note\": \"A Baghdad sculptor who reluctantly inherits his father's corpse-washing business across the Iran-Iraq War, Gulf War, and US invasion. Antoon's novel -- one per decade of catastrophe -- is the most intimate portrait of what war does to one Iraqi family.\", \"tag\": \"Iraq\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Absent\", \"author\": \"Jawad Al-Asadi\", \"year\": \"2010\", \"note\": \"Iraqi theatre and poetry's confrontation with displacement and the cultural destruction of Baghdad -- the libraries burned, the museums looted. Al-Asadi represents Iraq's cultural mourning for its own civilisational heritage.\", \"tag\": \"Iraq\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Long Way Back\", \"author\": \"Jabra Ibrahim Jabra\", \"year\": \"1986\", \"note\": \"Palestinian-Iraqi author Jabra's novel of Baghdad intellectuals -- exiles within their exile -- is the essential portrait of Iraq's mid-century literary culture: cosmopolitan, modernist, doomed.\", \"tag\": \"Iraq\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In the City of Love and Ashes\", \"author\": \"Haifa Zangana\", \"year\": \"2009\", \"note\": \"A Baghdadi woman under Saddam's surveillance state in the 1980s. Zangana, a former political prisoner herself, writes with documentary precision about the daily terror of life in a totalitarian Arab state.\", \"tag\": \"Iraq\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Hostage (Boats of Al-Ghad)\", \"author\": \"Zayd Mutee' Dammaj\", \"year\": \"1985\", \"note\": \"A boy becomes a hostage in an Imam's court -- Yemen's most celebrated novel, describing the feudal Imamate system that the 1962 revolution overthrew. A world vanished into history, and now being fought over again.\", \"tag\": \"Yemen\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Arch and the Butterfly\", \"author\": \"Mohammed Achaari\", \"year\": \"2010\", \"note\": \"A Moroccan father discovers his son has died in the Afghan jihad. Achaari's Prix Goncourt Arabic-language winner captures the radicalisation pipeline that has devastated Yemen -- and the grief of the families left behind.\", \"tag\": \"Yemen\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Arabian Nights and Days\", \"author\": \"Naguib Mahfouz\", \"year\": \"1979\", \"note\": \"Mahfouz's revisitation of the One Thousand and One Nights transposes the frame story to modern times. Included here for the Arabian Peninsula literary tradition within which Yemen's endangered oral culture sits.\", \"tag\": \"Yemen\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cities of Salt\", \"author\": \"Abdul Rahman Munif\", \"year\": \"1984\", \"note\": \"Saudi-Jordanian author Munif's five-volume novel of an Arabian desert community transformed by oil -- banned in Saudi Arabia and every Gulf state. The most devastating account of what the discovery of oil did to the Gulf's people and societies.\", \"tag\": \"Yemen\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Slaves\", \"author\": \"Ibrahim al-Koni\", \"year\": \"2010\", \"note\": \"Libyan-Tuareg author al-Koni's novel of the Saharan desert world -- nomads, slavery, and the elemental confrontation between human beings and the merciless landscape -- captures the pre-modern Arabian world Yemen's war is destroying.\", \"tag\": \"Yemen\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In the Country of Men\", \"author\": \"Hisham Matar\", \"year\": \"2006\", \"note\": \"A nine-year-old in Tripoli in 1979 watches his father disappear into Gaddafi's secret police. Matar's Booker Prize-shortlisted debut is the most intimate portrait of life under Gaddafi's Libya and of a childhood destroyed by a dictatorship.\", \"tag\": \"Libya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Return\", \"author\": \"Hisham Matar\", \"year\": \"2016\", \"note\": \"Matar returns to Libya after Gaddafi's fall to search for news of his father, imprisoned 20 years earlier. This Pulitzer Prize-winning memoir is inseparable from its fiction -- the most honest account of what Libya's revolution cost.\", \"tag\": \"Libya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Bleeding of the Stone\", \"author\": \"Ibrahim al-Koni\", \"year\": \"1990\", \"note\": \"A Tuareg shepherd in the Libyan Sahara is the last man who knows the whereabouts of the aoudad mountain sheep -- and the last connection to a world the modern state is destroying. Al-Koni's lyrical novel is Libya's greatest work of fiction.\", \"tag\": \"Libya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Gold Dust\", \"author\": \"Ibrahim al-Koni\", \"year\": \"1990\", \"note\": \"A man and his camel cross the desert together in a novel that transforms a Tuareg journey into a meditation on loyalty, mortality, and the relationship between humans and the earth. Desert literature at its purest.\", \"tag\": \"Libya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Anubis\", \"author\": \"Ibrahim al-Koni\", \"year\": \"2002\", \"note\": \"Al-Koni's mythological novel weaving Tuareg and ancient Egyptian spiritual worlds. Libya's literary tradition is inseparable from the Sahara -- this is its deepest, most spiritual expression.\", \"tag\": \"Libya\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Maps\", \"author\": \"Nuruddin Farah\", \"year\": \"1986\", \"note\": \"An orphan's uncertain identity -- his nationality, his gender, who his mother is -- mirrors Somalia's uncertain borders. Farah's Maps Trilogy opener is the most psychologically profound Somali novel and a masterpiece of postcolonial identity fiction.\", \"tag\": \"Somalia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Links\", \"author\": \"Nuruddin Farah\", \"year\": \"2003\", \"note\": \"A Somali exile returns to Mogadishu in the early 1990s to find a city of warring clans and ruins. Farah's most directly political novel is the essential fictional account of Somalia's collapse into statelessness.\", \"tag\": \"Somalia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Crossbones\", \"author\": \"Nuruddin Farah\", \"year\": \"2011\", \"note\": \"A Somali-Canadian journalist returns to Mogadishu as Al-Shabaab controls the city. The final volume of Farah's Variations on the Theme of an African Dictatorship is the most recent portrait of a country trying to exist.\", \"tag\": \"Somalia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"From a Crooked Rib\", \"author\": \"Nuruddin Farah\", \"year\": \"1970\", \"note\": \"A Somali girl runs away from an arranged marriage -- the first novel published by a Somali author and the first in the tradition to give voice to Somali women's experience of patriarchal nomadic society.\", \"tag\": \"Somalia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Gifts\", \"author\": \"Nuruddin Farah\", \"year\": \"1993\", \"note\": \"A doctor in Mogadishu contemplates the ethics of international aid -- gift or dependency, relief or humiliation. Farah's meditation on what foreign charity does to Somali dignity is the most politically uncomfortable novel about Africa and the West.\", \"tag\": \"Somalia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Dona Barbara\", \"author\": \"Romulo Gallegos\", \"year\": \"1929\", \"note\": \"The cacica (chieftain) Dona Barbara dominates the Venezuelan llanos (plains) in a novel of civilization versus barbarism. Gallegos's novel is Venezuela's national epic -- its landscape, its caudillo culture, and its eternal political conflict in one story.\", \"tag\": \"Venezuela\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Ifigenia\", \"author\": \"Teresa de la Parra\", \"year\": \"1924\", \"note\": \"A Venezuelan upper-class woman returns from Paris to find herself trapped in Caracas's patriarchal society. De la Parra's feminist novel is the earliest and most elegant critique of Venezuelan bourgeois culture.\", \"tag\": \"Venezuela\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Lanzas Coloradas\", \"author\": \"Arturo Uslar Pietri\", \"year\": \"1931\", \"note\": \"The wars of Venezuelan independence (1810-23) through the llanos. Uslar Pietri's historical novel is the most vivid account of the violence that created Venezuela -- the same violence, transformed, that defines it today.\", \"tag\": \"Venezuela\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Lost Steps\", \"author\": \"Alejo Carpentier\", \"year\": \"1953\", \"note\": \"A Cuban composer travels into the Venezuelan jungle to find primitive musical instruments and finds himself going back in time through human history. Set on the Orinoco, Carpentier's masterpiece captures the elemental power of Venezuela's interior.\", \"tag\": \"Venezuela\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Night\", \"author\": \"Tomas Eloy Martinez\", \"year\": \"1996\", \"note\": \"A journalist covering Peron's return to Argentina in 1973 -- included here as the model for Venezuelan political fiction: the caudillo as phenomenon, the crowd as his instrument, and the journalist as helpless witness.\", \"tag\": \"Venezuela\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Heart of Darkness\", \"author\": \"Joseph Conrad\", \"year\": \"1899\", \"note\": \"Marlow travels up the Congo River to find Kurtz -- the famous horror of European colonialism. Conrad's novella is ethically contested (Achebe called it racist) but remains the foundational text on what Europe did to the Congo and what the Congo did to Europe.\", \"tag\": \"DR Congo\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Poisonwood Bible\", \"author\": \"Barbara Kingsolver\", \"year\": \"1998\", \"note\": \"An American Baptist missionary imposes his rigid faith on a Congolese village during the 1960s. Kingsolver's novel is the most read fictional account of the Congo's decolonisation, Patrice Lumumba's murder, and Mobutu's rise.\", \"tag\": \"DR Congo\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Johnny Mad Dog\", \"author\": \"Emmanuel Dongala\", \"year\": \"2002\", \"note\": \"A teenage soldier and a girl trying to survive the same civil war from opposite sides. Congolese author Dongala's novel is the most honest account of child soldiers -- their logic, their violence, their terrifying ordinariness.\", \"tag\": \"DR Congo\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Congo Inc.\", \"author\": \"In Koli Jean Bofane\", \"year\": \"2014\", \"note\": \"A young Mongo tribesman in Kinshasa navigates coltan mining, international NGOs, and the absurdity of Congo's globalised extraction economy. Bofane's satirical novel is the most original Congolese fiction written from inside.\", \"tag\": \"DR Congo\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Sunday at the Pool in Kigali\", \"author\": \"Gil Courtemanche\", \"year\": \"2000\", \"note\": \"Though set in Rwanda, Courtemanche's novel of genocide-era Central Africa captures the specific atmosphere of the Great Lakes region -- aid workers, corrupt elites, and the catastrophe none of them could stop.\", \"tag\": \"DR Congo\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Breath, Eyes, Memory\", \"author\": \"Edwidge Danticat\", \"year\": \"1994\", \"note\": \"Sophie Caco travels from Haiti to New York to live with her mother, carrying the trauma of her island. Danticat's debut introduced Haiti to the world literary stage and gave the Haitian diaspora its founding narrative.\", \"tag\": \"Haiti\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Krik? Krak!\", \"author\": \"Edwidge Danticat\", \"year\": \"1995\", \"note\": \"Nine stories of Haitian women across the Duvalier dictatorship, the boat people, and the diaspora. Danticat's story collection is the fullest portrait of Haitian feminine experience -- suffering, resistance, and radical survival.\", \"tag\": \"Haiti\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Farming of Bones\", \"author\": \"Edwidge Danticat\", \"year\": \"1998\", \"note\": \"The 1937 massacre of Haitian sugar cane workers by Dominican dictator Trujillo -- an event deliberately forgotten by both countries. Danticat's novel is the essential act of historical recovery in Caribbean literature.\", \"tag\": \"Haiti\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Kingdom of This World\", \"author\": \"Alejo Carpentier\", \"year\": \"1949\", \"note\": \"The Haitian Revolution and Henri Christophe's Black Kingdom -- Carpentier's first Magical Realist novel is the most beautiful account of Haiti's founding revolution and the African spiritual world that powered it.\", \"tag\": \"Haiti\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Masters of the Dew\", \"author\": \"Jacques Roumain\", \"year\": \"1944\", \"note\": \"A young Haitian returns from Cuba to find his village destroyed by drought and family feud. Roumain's masterpiece -- written in Haitian Creole and French -- is both a political manifesto and Haiti's most beloved novel.\", \"tag\": \"Haiti\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Bridge on the Drina\", \"author\": \"Ivo Andric\", \"year\": \"1945\", \"note\": \"A 16th-century Ottoman bridge in Visegrad as the fixed point around which four centuries of Bosnian history revolves -- Turks, Austro-Hungarians, Serbs, Muslims, Jews. Andric's Nobel Prize winner is the essential account of the Balkans as Europe's civilisational crossroads.\", \"tag\": \"Bosnia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Death and the Dervish\", \"author\": \"Mesa Selimovic\", \"year\": \"1966\", \"note\": \"An 18th-century Bosnian Muslim monk searches for his arrested brother within an Ottoman legal system that treats individuals as expendable. Selimovic's masterpiece is the most philosophically profound Bosnian novel -- justice, power, and the individual soul.\", \"tag\": \"Bosnia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Cellist of Sarajevo\", \"author\": \"Steven Galloway\", \"year\": \"2008\", \"note\": \"During the Sarajevo siege (1992-96), a cellist plays Albinoni's Adagio for 22 days in memory of 22 people killed by a shell. Three civilians try to reach him. Galloway's novel is the most widely read international account of the siege.\", \"tag\": \"Bosnia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Lazarus Project\", \"author\": \"Aleksandar Hemon\", \"year\": \"2008\", \"note\": \"A Bosnian immigrant in Chicago traces the 1908 murder of a Jewish immigrant by a Chicago police chief. Hemon's bilingual, bicultural novel is the essential account of what it means to carry Eastern Europe inside you in America.\", \"tag\": \"Bosnia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Nowhere Man\", \"author\": \"Aleksandar Hemon\", \"year\": \"2002\", \"note\": \"Jozef Pronek -- Bosnian musician in Chicago -- loses his country while visiting America. Hemon's fragmented, funny, heartbreaking debut is the Bosnian war's best account of what it means to be displaced from a country that has ceased to exist.\", \"tag\": \"Bosnia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Our Lady of the Nile\", \"author\": \"Scholastique Mukasonga\", \"year\": \"2012\", \"note\": \"Girls at an elite Rwandan boarding school in the 1970s navigate the growing ethnic tensions between Hutu and Tutsi students. Mukasonga -- who lost 37 family members in the genocide -- shows the ideology being assembled, year by year.\", \"tag\": \"Rwanda\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cockroaches\", \"author\": \"Scholastique Mukasonga\", \"year\": \"2006\", \"note\": \"The term 'inyenzi' (cockroach) used for Tutsi in pre-genocide Rwanda. Mukasonga's novella is the most personal account of the ethnic hatred that built for decades before the killing began in 1994.\", \"tag\": \"Rwanda\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Sunday at the Pool in Kigali\", \"author\": \"Gil Courtemanche\", \"year\": \"2000\", \"note\": \"A Canadian journalist at a Kigali hotel pool watches the genocide approach. Courtemanche's documentary novel -- written before the International Criminal Tribunal's verdicts -- is the essential fictional account of the genocide's mechanics.\", \"tag\": \"Rwanda\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Barefoot Woman\", \"author\": \"Scholastique Mukasonga\", \"year\": \"2018\", \"note\": \"Mukasonga's tribute to her mother Stefania, who died in the 1994 genocide. This memoir-novel of Rwandan Tutsi women's daily lives is the most intimate account of the world that was destroyed.\", \"tag\": \"Rwanda\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Shake Hands with the Devil\", \"author\": \"Romeo Dallaire\", \"year\": \"2003\", \"note\": \"The UN force commander's account of the genocide he was powerless to stop. Though memoir rather than fiction, Dallaire's book -- written in the desperation of a man who saw everything -- is indispensable to understanding Rwanda's catastrophe.\", \"tag\": \"Rwanda\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Accusation\", \"author\": \"Bandi\", \"year\": \"2014\", \"note\": \"Seven stories written inside North Korea by an author who cannot be identified, smuggled out by a defector. This is the only fiction written inside North Korea by a North Korean that the world has been able to read -- an act of extraordinary courage.\", \"tag\": \"North Korea\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In Order to Live\", \"author\": \"Yeonmi Park\", \"year\": \"2015\", \"note\": \"Park escaped North Korea at 13 and crossed the Gobi Desert to reach freedom. Her memoir-narrative of life in Hyesan, the defection, and the sex trafficking she survived is the most widely read North Korean defector account.\", \"tag\": \"North Korea\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Without You, There Is No Us\", \"author\": \"Suki Kim\", \"year\": \"2014\", \"note\": \"A Korean-American journalist spends six months teaching English to the sons of the North Korean elite. Kim's account is the most detailed portrait of daily life at the top of North Korean society -- the most isolated people on earth.\", \"tag\": \"North Korea\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Nothing to Envy\", \"author\": \"Barbara Demick\", \"year\": \"2009\", \"note\": \"Six North Korean defectors tell their stories. Demick's reconstruction -- part fiction, part reportage -- is the fullest portrait of ordinary North Korean life across the Kim dynasty, the famine, and the decision to flee.\", \"tag\": \"North Korea\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Dear Leader\", \"author\": \"Jang Jin-Sung\", \"year\": \"2014\", \"note\": \"A poet who was a member of Kim Jong-il's inner propaganda circle defects after obtaining a banned South Korean magazine. Jang's memoir of life inside the Korean Workers' Party is the most intimate portrait of how the regime maintains its ideological control. A Final Note on Selection Every list like this is an argument. These novels were chosen on two grounds: literary greatness and documentary power -- the ability to make a country's history, landscape, class structure, and moral life legible to an outsider. Four countries received extended treatment because their literary traditions are deep enough to demand it: Russia, India, the USA, and the UK have each produced literary traditions that rival any civilisation's. The conflict zone selections carry particular weight: in Ukraine, Afghanistan, Syria, Myanmar, Iraq, Somalia, Haiti, Bosnia, Rwanda, and North Korea, literature is an act of survival. The books listed for those countries are as close as reading can bring you to understanding what war destroys -- not just buildings and bodies, but the particular, irreplaceable way a people told stories about themselves. Read them before those stories become inaccessible. 50 Countries | 300 Novels | One World\", \"tag\": \"North Korea\", \"detail\": \"\", \"bridge\": \"\"}]}, \"new-data.json\": {\"science\": [{\"title\": \"Frankenstein\", \"author\": \"Mary Shelley\", \"year\": 1818, \"note\": \"A created being demands responsibility from the scientist who abandoned him.\", \"tag\": \"Crea
