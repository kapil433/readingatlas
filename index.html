\", \"detail\": \"\", \"bridge\": \"Good training in separating formal theory from intuitive ontology.\"}, {\"title\": \"The Fabric of the Cosmos\", \"author\": \"Brian Greene\", \"year\": \"\", \"note\": \"Space, time, quantum physics and cosmology woven into one accessible narrative.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Broadens the physical worldview without replacing technical study.\"}, {\"title\": \"The Information\", \"author\": \"James Gleick\", \"year\": \"\", \"note\": \"A history of information from communication systems to Shannon, computation and biology.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"A major bridge linking physics, computation, networks and life.\"}, {\"title\": \"Campbell Biology\", \"author\": \"Urry et al.\", \"year\": \"\", \"note\": \"A panoramic undergraduate introduction from cells and genetics through evolution, physiology and ecology.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Provides the multilevel biological architecture complexity science often generalizes from.\"}, {\"title\": \"The Selfish Gene\", \"author\": \"Richard Dawkins\", \"year\": \"\", \"note\": \"The gene-centered view of evolution and how cooperation can emerge under selection.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Builds intuition for replicators, selection, strategy and evolutionary games.\"}, {\"title\": \"The Extended Phenotype\", \"author\": \"Richard Dawkins\", \"year\": \"\", \"note\": \"Extends phenotypic effects beyond bodies into environments and other organisms.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Challenges where system boundaries should be drawn.\"}, {\"title\": \"The Vital Question\", \"author\": \"Nick Lane\", \"year\": \"\", \"note\": \"Explains complex life through energetic constraints and cellular evolution.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"A powerful cross-scale story from chemistry to cells to evolution.\"}, {\"title\": \"I Contain Multitudes\", \"author\": \"Ed Yong\", \"year\": \"\", \"note\": \"Organisms as ecosystems shaped by microbes and symbiosis.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Makes nested systems and interdependence biologically concrete.\"}, {\"title\": \"Other Minds\", \"author\": \"Peter Godfrey-Smith\", \"year\": \"\", \"note\": \"Octopus intelligence as a route into the independent evolution of complex minds.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Useful for embodiment, distributed control and evolutionary contingency.\"}, {\"title\": \"The Song of the Dodo\", \"author\": \"David Quammen\", \"year\": \"\", \"note\": \"Island biogeography, extinction and habitat fragmentation told through travel and history.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Direct bridge to connectivity, fragmentation and ecological networks.\"}, {\"title\": \"The Tangled Tree\", \"author\": \"David Quammen\", \"year\": \"\", \"note\": \"Horizontal gene transfer and the changing shape of the tree of life.\", \"tag\": \"Biology, Evolution & Life\", \"detail\": \"\", \"bridge\": \"Shows how network-like exchange complicates simple branching histories.\"}, {\"title\": \"The Economy 2.0\", \"author\": \"CORE Econ\", \"year\": \"\", \"note\": \"A modern evidence-led introduction emphasizing institutions, power, innovation, inequality and real economies.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"A better social-science base for complexity than a purely equilibrium-first introduction.\"}, {\"title\": \"Poor Economics\", \"author\": \"Abhijit V. Banerjee & Esther Duflo\", \"year\": \"\", \"note\": \"Field evidence dismantles simplistic stories about poverty and development.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"Keeps large-scale theories accountable to mechanisms and heterogeneity.\"}, {\"title\": \"Misbehaving\", \"author\": \"Richard H. Thaler\", \"year\": \"\", \"note\": \"The intellectual history of behavioural economics through experiments and disputes.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"Replaces idealized agents with psychologically realistic ones.\"}, {\"title\": \"Why Nations Fail\", \"author\": \"Daron Acemoglu & James A. Robinson\", \"year\": \"\", \"note\": \"A broad argument about inclusive and extractive institutions and long-run prosperity.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"Useful for feedback between power, incentives and institutional persistence.\"}, {\"title\": \"The Narrow Corridor\", \"author\": \"Daron Acemoglu & James A. Robinson\", \"year\": \"\", \"note\": \"Liberty as a moving balance between state capacity and social power.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"A coevolutionary view of state and society.\"}, {\"title\": \"Capital in the Twenty-First Century\", \"author\": \"Thomas Piketty\", \"year\": \"\", \"note\": \"A data-rich history of wealth, income and inequality.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"Useful for cumulative advantage, inheritance and distributional dynamics.\"}, {\"title\": \"The Box\", \"author\": \"Marc Levinson\", \"year\": \"\", \"note\": \"How containerization rewired logistics and global trade.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"A superb case study in standards, modularity, network topology and transaction costs.\"}, {\"title\": \"Microeconomics: Behavior, Institutions, and Evolution\", \"author\": \"Samuel Bowles\", \"year\": \"\", \"note\": \"Microeconomics reworked around institutions, social preferences and evolutionary games.\", \"tag\": \"Economics & Institutions\", \"detail\": \"\", \"bridge\": \"A direct formal bridge from economics to complexity and cultural evolution.\"}, {\"title\": \"Politics\", \"author\": \"Andrew Heywood\", \"year\": \"\", \"note\": \"A clear map of power, state, ideology, democracy, governance and institutions.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"Provides the political vocabulary needed before specialist arguments.\"}, {\"title\": \"Sociology\", \"author\": \"Anthony Giddens & Philip Sutton\", \"year\": \"\", \"note\": \"A broad introduction to institutions, class, family, religion, modernity and globalization.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"Adds macro-social structure to agent-level explanations.\"}, {\"title\": \"Seeing Like a State\", \"author\": \"James C. Scott\", \"year\": \"\", \"note\": \"Why centralized schemes fail when they simplify local realities into legible categories.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"How administrative simplification erases local realities.\", \"bridge\": \"Essential for information loss, local adaptation and unintended consequences.\"}, {\"title\": \"The Logic of Collective Action\", \"author\": \"Mancur Olson\", \"year\": \"\", \"note\": \"Why shared interests do not automatically produce coordinated group action.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"Foundational for cooperation, free-riding and institutional design.\"}, {\"title\": \"The Dictator's Handbook\", \"author\": \"Bruce Bueno de Mesquita & Alastair Smith\", \"year\": \"\", \"note\": \"Political survival explained through coalitions, incentives and resource distribution.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"Reframes regimes as strategic systems rather than moral labels.\"}, {\"title\": \"Political Order and Political Decay\", \"author\": \"Francis Fukuyama\", \"year\": \"\", \"note\": \"State capacity, rule of law, accountability and institutional decay across history.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"Rich material for path dependence and institutional evolution.\"}, {\"title\": \"Bowling Alone\", \"author\": \"Robert D. Putnam\", \"year\": \"\", \"note\": \"The rise and decline of social capital and civic association in the United States.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"Useful for networks, trust, participation and community structure.\"}, {\"title\": \"Exit, Voice, and Loyalty\", \"author\": \"Albert O. Hirschman\", \"year\": \"\", \"note\": \"Three basic responses to decline in firms, organizations and states.\", \"tag\": \"Politics, Sociology & Collective Action\", \"detail\": \"\", \"bridge\": \"A compact framework for feedback, adaptation and institutional survival.\"}, {\"title\": \"The Pursuit of History\", \"author\": \"John Tosh\", \"year\": \"\", \"note\": \"Introduces historical evidence, causation, source criticism and explanation.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"Teaches how to reason about path dependence without turning history into anecdote.\"}, {\"title\": \"Prisoners of Geography\", \"author\": \"Tim Marshall\", \"year\": \"\", \"note\": \"A highly accessible introduction to how terrain, borders, rivers and access shape strategic choices.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"A first spatial constraint model of geopolitics\u2014useful but not deterministic.\"}, {\"title\": \"The Power of Geography\", \"author\": \"Tim Marshall\", \"year\": \"\", \"note\": \"Extends the geographic lens to additional strategic regions and emerging power centres.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"Useful for comparing how spatial constraints operate differently across systems.\"}, {\"title\": \"The Future of Geography\", \"author\": \"Tim Marshall\", \"year\": \"\", \"note\": \"Extends geopolitics beyond Earth into satellites, orbital infrastructure and space competition.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"Shows how new technological layers create new strategic geographies.\"}, {\"title\": \"The Silk Roads\", \"author\": \"Peter Frankopan\", \"year\": \"\", \"note\": \"Retells global history through Eurasian trade, exchange, disease, religion and power.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"A network-centered alternative to Europe-first world history.\"}, {\"title\": \"The Great Divergence\", \"author\": \"Kenneth Pomeranz\", \"year\": \"\", \"note\": \"Reconsiders why industrialization accelerated in Europe rather than comparably developed regions of Asia.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"A model of multicausal historical explanation: energy, ecology, colonies and contingency.\"}, {\"title\": \"Energy and Civilization\", \"author\": \"Vaclav Smil\", \"year\": \"\", \"note\": \"Tracks how energy capture shaped agriculture, cities, transport, war and industry.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"Makes material throughput and energetic constraints visible beneath social change.\"}, {\"title\": \"The Lessons of History\", \"author\": \"Will & Ariel Durant\", \"year\": \"\", \"note\": \"A very short meditation on recurring patterns in civilization, economics, religion and war.\", \"tag\": \"History, Geography & Geopolitics\", \"detail\": \"\", \"bridge\": \"Best used to generate hypotheses about patterns rather than accept timeless laws.\"}, {\"title\": \"Understanding Media\", \"author\": \"Marshall McLuhan\", \"year\": \"\", \"note\": \"The classic argument that the form of a medium reshapes perception and society independent of specific content.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"\", \"bridge\": \"A systems lens on communication technologies as environments that reorganize behaviour.\"}, {\"title\": \"The Medium Is the Massage\", \"author\": \"Marshall McLuhan & Quentin Fiore\", \"year\": \"\", \"note\": \"A short visual distillation of McLuhan's ideas about media, perception and technological environments.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"\", \"bridge\": \"Shows argument through form as well as prose.\"}, {\"title\": \"Ways of Seeing\", \"author\": \"John Berger\", \"year\": \"\", \"note\": \"A compact re-education in how class, gender, reproduction and convention shape what we see in art.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"\", \"bridge\": \"Teaches that perception is socially organized, not merely optical.\"}, {\"title\": \"The Story of Art\", \"author\": \"E. H. Gombrich\", \"year\": \"\", \"note\": \"A narrative introduction to major artistic traditions and visual problems.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"\", \"bridge\": \"Provides historical scaffolding before more theoretical visual-culture books.\"}, {\"title\": \"On Photography\", \"author\": \"Susan Sontag\", \"year\": \"\", \"note\": \"How photography changes memory, evidence, beauty, violence and spectatorship.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"Representation, violence, evidence and spectatorship.\", \"bridge\": \"A study of how representational technologies alter social meaning.\"}, {\"title\": \"The Poetics of Space\", \"author\": \"Gaston Bachelard\", \"year\": \"\", \"note\": \"A phenomenology of rooms, houses, corners, drawers and intimate space.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"Rooms, corners and intimate space as psychological material.\", \"bridge\": \"Adds lived experience to otherwise functional models of built environments.\"}, {\"title\": \"The Image\", \"author\": \"Daniel J. Boorstin\", \"year\": \"\", \"note\": \"An early critique of pseudo-events, celebrity and manufactured public images.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"\", \"bridge\": \"Useful for understanding feedback between media systems and public attention.\"}, {\"title\": \"Change by Design\", \"author\": \"Tim Brown\", \"year\": \"\", \"note\": \"An accessible introduction to human-centred design, prototyping and iterative problem solving.\", \"tag\": \"Media, Art, Design & Perception\", \"detail\": \"\", \"bridge\": \"Treats design as a learning loop between users, prototypes and constraints.\"}, {\"title\": \"Psychology\", \"author\": \"Peter Gray & David Bjorklund\", \"year\": \"\", \"note\": \"A broad introduction to learning, perception, cognition, development, emotion and social behaviour.\", \"tag\": \"Psychology, Cognition & Behaviour\", \"detail\": \"\", \"bridge\": \"Provides the agent-level mechanisms social models often assume.\"}, {\"title\": \"Thinking, Fast and Slow\", \"author\": \"Daniel Kahneman\", \"year\": \"\", \"note\": \"A landmark synthesis of judgment, heuristics and decision-making.\", \"tag\": \"Psychology, Cognition & Behaviour\", \"detail\": \"\", \"bridge\": \"Adds bounded rationality to models of choice and institutions.\"}, {\"title\": \"Behave\", \"author\": \"Robert Sapolsky\", \"year\": \"\", \"note\": \"Explains behaviour across milliseconds, hormones, development, culture, evolution and history.\", \"tag\": \"Psychology, Cognition & Behaviour\", \"detail\": \"\", \"bridge\": \"A masterclass in multiscale causation.\"}, {\"title\": \"The Righteous Mind\", \"author\": \"Jonathan Haidt\", \"year\": \"\", \"note\": \"Moral intuition, group identity and why disagreements are not simply failures of information.\", \"tag\": \"Psychology, Cognition & Behaviour\", \"detail\": \"Moral intuition and group identity without assuming opponents are irrational.\", \"bridge\": \"Useful for polarization, group dynamics and norm formation.\"}, {\"title\": \"Surfing Uncertainty\", \"author\": \"Andy Clark\", \"year\": \"\", \"note\": \"A rigorous account of predictive processing, perception and action.\", \"tag\": \"Psychology, Cognition & Behaviour\", \"detail\": \"\", \"bridge\": \"Frames minds as hierarchical prediction systems embedded in environments.\"}, {\"title\": \"Mistakes Were Made (But Not by Me)\", \"author\": \"Carol Tavris & Elliot Aronson\", \"year\": \"\", \"note\": \"Cognitive dissonance and self-justification explain why people defend poor decisions.\", \"tag\": \"Psychology, Cognition & Behaviour\", \"detail\": \"\", \"bridge\": \"Useful for organizational denial, polarization and reinforcing belief loops.\"}, {\"title\": \"Earth System Science: A Very Short Introduction\", \"author\": \"Tim Lenton\", \"year\": \"\", \"note\": \"A concise entry into Earth as interacting atmosphere, ocean, biosphere and geosphere.\", \"tag\": \"Environment, Climate & Earth Systems\", \"detail\": \"\", \"bridge\": \"Establishes the coupled-system viewpoint before climate-specialist reading.\"}, {\"title\": \"The Climate Book\", \"author\": \"Greta Thunberg (ed.)\", \"year\": \"\", \"note\": \"A broad collection on climate science, impacts, politics, justice and solutions.\", \"tag\": \"Environment, Climate & Earth Systems\", \"detail\": \"\", \"bridge\": \"Shows why climate is simultaneously physical, ecological, economic and institutional.\"}, {\"title\": \"The Uninhabitable Earth\", \"author\": \"David Wallace-Wells\", \"year\": \"\", \"note\": \"A forceful account of climate risks across heat, food, conflict, disease and economic systems.\", \"tag\": \"Environment, Climate & Earth Systems\", \"detail\": \"\", \"bridge\": \"Makes cascades and compounding risks emotionally legible.\"}, {\"title\": \"The Sixth Extinction\", \"author\": \"Elizabeth Kolbert\", \"year\": \"\", \"note\": \"Reports on human-driven extinction through field science and natural history.\", \"tag\": \"Environment, Climate & Earth Systems\", \"detail\": \"\", \"bridge\": \"A study in ecological networks, thresholds and irreversible change.\"}, {\"title\": \"Resilience Thinking\", \"author\": \"Brian Walker & David Salt\", \"year\": \"\", \"note\": \"An accessible guide to resilience, thresholds, adaptive cycles and social\u2013ecological systems.\", \"tag\": \"Environment, Climate & Earth Systems\", \"detail\": \"\", \"bridge\": \"Direct bridge from ecology to practical complex-systems thinking.\"}, {\"title\": \"The Wizard and the Prophet\", \"author\": \"Charles C. Mann\", \"year\": \"\", \"note\": \"Contrasts technological intensification with ecological limits through two intellectual traditions.\", \"tag\": \"Environment, Climate & Earth Systems\", \"detail\": \"\", \"bridge\": \"Useful for understanding competing intervention strategies under uncertainty.\"}, {\"title\": \"Shadow Armies\", \"author\": \"Dhirendra K. Jha\", \"year\": \"\", \"note\": \"Documents Hindu nationalist organisations and their foot soldiers at ground level.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Ramesh's organisational and ideological world.\", \"bridge\": \"Useful for building politically committed characters as people with motives, networks and incentives rather than caricatures.\"}, {\"title\": \"Why I Am Not a Hindu\", \"author\": \"Kancha Ilaiah Shepherd\", \"year\": \"\", \"note\": \"A Dalit-Bahujan critique of caste, Hindu social order and claims of cultural representation.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Caste and religious mobilisation.\", \"bridge\": \"Provides a structural counterpoint to fictional scenes where marginalised people are mobilised by institutions that still exclude them.\"}, {\"title\": \"The Free Voice\", \"author\": \"Ravish Kumar\", \"year\": \"\", \"note\": \"Essays on public speech, media, fear and the experience of politics in everyday India.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Intimate-to-political prose register.\", \"bridge\": \"A model for moving between one household and the national atmosphere without losing human scale.\"}, {\"title\": \"Caste Matters\", \"author\": \"Suraj Yengde\", \"year\": \"\", \"note\": \"A contemporary Dalit account of caste, aspiration, humiliation and political belonging.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Dalit aspiration and political belonging.\", \"bridge\": \"Useful for writing aspiration and identification without reducing a lower-caste character to false consciousness.\"}, {\"title\": \"Kabir: The Weaver's Songs\", \"author\": \"Vinay Dharwadker (ed.)\", \"year\": \"\", \"note\": \"A major English selection of Kabir's anti-caste, anti-clerical and radically interior devotional poetry.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"The theological background of 'Only Temple'.\", \"bridge\": \"Gives a lived vocabulary for faith that is distinct from institutional religion.\"}, {\"title\": \"The Bijak of Kabir\", \"author\": \"Linda Hess & Shukdev Singh\", \"year\": \"\", \"note\": \"A major translation and study of Kabir's Bijak tradition.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Faith versus organised religious power.\", \"bridge\": \"Useful for the novella's distinction between ethical devotion and politicised religious identity.\"}, {\"title\": \"The Life of a Text\", \"author\": \"Philip Lutgendorf\", \"year\": \"\", \"note\": \"Shows how the Ramcharitmanas lives through recitation, performance and everyday devotional practice.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Ramcharitmanas as lived practice.\", \"bridge\": \"Helps make Ayodhya's faith practices concrete rather than abstract or purely ideological.\"}, {\"title\": \"We Need New Stories\", \"author\": \"Nesrine Malik\", \"year\": \"\", \"note\": \"Challenges political myths about identity, free speech, immigration and public debate.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"Intellectual architecture for the Sudan project.\", \"bridge\": \"A Sudanese-British political voice useful for understanding how narratives distribute attention and legitimacy.\"}, {\"title\": \"Sudan's Unfinished Democracy\", \"author\": \"Raga Makawi & Khalid Mustafa Medani (eds.)\", \"year\": \"\", \"note\": \"Essays on Sudan's revolution, transition, institutions and unfinished democratic struggle.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"Historical-political foundation.\", \"bridge\": \"Provides political structure beneath the novella's courtroom without turning the fiction into exposition.\"}, {\"title\": \"The Great Theft\", \"author\": \"Khaled Abou El Fadl\", \"year\": \"\", \"note\": \"An argument about authoritarian distortions of Islamic ethics and religious authority.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"Islamic ethics and theodicy.\", \"bridge\": \"Useful for distinguishing patience and divine decree from moral permission for bystanders.\"}, {\"title\": \"The Question of Palestine\", \"author\": \"Edward W. Said\", \"year\": \"\", \"note\": \"A foundational Palestinian intellectual account of representation, dispossession and political narrative.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"Narrative, representation and dispossession.\", \"bridge\": \"Useful for understanding how political language can erase lived experience.\"}, {\"title\": \"The Hundred Years' War on Palestine\", \"author\": \"Rashid Khalidi\", \"year\": \"\", \"note\": \"A modern history of the Palestinian national experience told through successive political ruptures.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"Historical spine for Palestine.\", \"bridge\": \"Provides chronology and institutional context while keeping family history visible.\"}, {\"title\": \"Palestinian Walks\", \"author\": \"Raja Shehadeh\", \"year\": \"\", \"note\": \"Walking memoirs in which landscape, law, memory and occupation overlap.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"Landscape as political evidence.\", \"bridge\": \"Excellent training in turning political geography into paths, stones, views and bodily movement.\"}, {\"title\": \"Steering the Craft\", \"author\": \"Ursula K. Le Guin\", \"year\": \"\", \"note\": \"Exercises in sound, sentence rhythm, point of view, repetition and narrative movement.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Primary craft manual from the Novelist's Handbook.\", \"bridge\": \"Especially useful for de-abstracting political fiction and making prose physically specific.\"}, {\"title\": \"Reading Like a Writer\", \"author\": \"Francine Prose\", \"year\": \"\", \"note\": \"Teaches how to read sentences, paragraphs, dialogue and detail as working machinery.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Use with a hero book while drafting.\", \"bridge\": \"Turns every novel in the two fiction libraries into a craft lesson.\"}, {\"title\": \"The Naive and the Sentimental Novelist\", \"author\": \"Orhan Pamuk\", \"year\": \"\", \"note\": \"A novelist's account of what readers imagine, how scenes create a world and how novels hide a 'secret center'.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Secret-center framework.\", \"bridge\": \"Useful for locating a novella's deepest question in one image, relationship or recurring motif.\"}, {\"title\": \"On Writing\", \"author\": \"Stephen King\", \"year\": \"\", \"note\": \"A highly readable account of habit, revision, description and the working life of a writer.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Drafting and revision discipline.\", \"bridge\": \"Strong on routine, cutting excess and finishing drafts.\"}, {\"title\": \"Bird by Bird\", \"author\": \"Anne Lamott\", \"year\": \"\", \"note\": \"Practical, funny advice about bad first drafts, small frames and continuing when a project feels too large.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Small-scene drafting ethic.\", \"bridge\": \"Ideal for turning geopolitical subjects into one manageable scene at a time.\"}, {\"title\": \"Writing Down the Bones\", \"author\": \"Natalie Goldberg\", \"year\": \"\", \"note\": \"Freewriting as a disciplined practice of attention, risk and uncensored first contact with material.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Notebook practice.\", \"bridge\": \"Useful for getting politically or emotionally difficult material onto the page before self-censorship.\"}, {\"title\": \"The Art of Fiction\", \"author\": \"John Gardner\", \"year\": \"\", \"note\": \"A demanding but lucid discussion of fictional dream, detail, psychic distance and narrative technique.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Immersion and psychic distance.\", \"bridge\": \"Helps distinguish explanation from immersive scene-making.\"}, {\"title\": \"Meander, Spiral, Explode\", \"author\": \"Jane Alison\", \"year\": \"\", \"note\": \"Shows alternatives to conventional arc: spirals, cells, networks, waves and fractal structures.\", \"tag\": \"Writing Craft & Literary Practice\", \"detail\": \"Alternative structural forms.\", \"bridge\": \"Particularly valuable for novellas that need formal shapes other than linear escalation.\"}, {\"title\": \"How Language Works\", \"author\": \"David Crystal\", \"year\": \"\", \"note\": \"A broad, readable map of speech, grammar, meaning, writing, acquisition and language change.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Best first book for understanding the whole field before specialist debates.\"}, {\"title\": \"The Language Instinct\", \"author\": \"Steven Pinker\", \"year\": \"\", \"note\": \"An influential argument for language as a species-typical human capacity.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Useful as a strong thesis to compare with cultural and usage-based accounts.\"}, {\"title\": \"The Unfolding of Language\", \"author\": \"Guy Deutscher\", \"year\": \"\", \"note\": \"Explains how grammar and complexity emerge through ordinary historical change.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Makes linguistic evolution intuitive and story-like.\"}, {\"title\": \"Through the Language Glass\", \"author\": \"Guy Deutscher\", \"year\": \"\", \"note\": \"Explores how language can influence attention, categories and perception without simplistic determinism.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Useful for writing multilingual characters and culturally shaped description.\"}, {\"title\": \"Because Internet\", \"author\": \"Gretchen McCulloch\", \"year\": \"\", \"note\": \"A lively account of how online communication creates new conventions, tones and social signals.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Shows language changing in real time through networks and communities.\"}, {\"title\": \"The Power of Babel\", \"author\": \"John McWhorter\", \"year\": \"\", \"note\": \"A global story of languages splitting, mixing, simplifying and becoming new languages.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"A useful antidote to treating languages as fixed national objects.\"}, {\"title\": \"Metaphors We Live By\", \"author\": \"George Lakoff & Mark Johnson\", \"year\": \"\", \"note\": \"Argues that metaphor structures everyday thought rather than merely decorating prose.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Directly useful for both conceptual thinking and literary language.\"}, {\"title\": \"Don't Sleep, There Are Snakes\", \"author\": \"Daniel L. Everett\", \"year\": \"\", \"note\": \"A linguist's account of living with the Pirah\u00e3 and having his assumptions about language and culture challenged.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"A vivid lesson in fieldwork, translation and the danger of importing categories.\"}, {\"title\": \"Empires of the Word\", \"author\": \"Nicholas Ostler\", \"year\": \"\", \"note\": \"How languages spread through empire, trade, religion and administration.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"Connects linguistic change to power and political history.\"}, {\"title\": \"Babel\", \"author\": \"Gaston Dorren\", \"year\": \"\", \"note\": \"A tour of major world languages and the different histories carried by their structures and writing systems.\", \"tag\": \"Language & Linguistics\", \"detail\": \"\", \"bridge\": \"An entertaining global entry point into linguistic diversity.\"}, {\"title\": \"This Is Your Brain on Music\", \"author\": \"Daniel J. Levitin\", \"year\": \"\", \"note\": \"A musician-neuroscientist explains pitch, rhythm, expectation, memory and why music moves us.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"Best first bridge between subjective listening and cognitive mechanism.\"}, {\"title\": \"Musicophilia\", \"author\": \"Oliver Sacks\", \"year\": \"\", \"note\": \"Case histories show how music can survive, disappear or transform through neurological change.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"Makes the biology of music human and memorable.\"}, {\"title\": \"How Music Works\", \"author\": \"David Byrne\", \"year\": \"\", \"note\": \"Explores how rooms, technology, economics and social context shape the music that gets made.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"A systems view of music rather than a theory textbook.\"}, {\"title\": \"The Rest Is Noise\", \"author\": \"Alex Ross\", \"year\": \"\", \"note\": \"A narrative history of twentieth-century classical music through politics, war, modernism and culture.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"Shows sound as part of historical atmosphere.\"}, {\"title\": \"Ways of Hearing\", \"author\": \"Damon Krukowski\", \"year\": \"\", \"note\": \"A short, accessible argument about how digital platforms change listening, space and attention.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"Useful for noticing what compression and platforms remove from lived sound.\"}, {\"title\": \"The Music Lesson\", \"author\": \"Victor L. Wooten\", \"year\": \"\", \"note\": \"A playful parable about groove, listening, notes, space and musical communication.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"Invites musicianship through attention rather than technical intimidation.\"}, {\"title\": \"The Jazz of Physics\", \"author\": \"Stephon Alexander\", \"year\": \"\", \"note\": \"Connects improvisation, cosmology, vibration and scientific imagination.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"A perspective-changing bridge between sound, pattern and physical reality.\"}, {\"title\": \"Perfecting Sound Forever\", \"author\": \"Greg Milner\", \"year\": \"\", \"note\": \"A history of recorded sound from cylinders to digital audio and loudness wars.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"Shows how technologies alter what listeners consider 'real' sound.\"}, {\"title\": \"The World in Six Songs\", \"author\": \"Daniel J. Levitin\", \"year\": \"\", \"note\": \"Uses six recurring song functions to connect music with bonding, knowledge, religion and emotion.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"A broad humanistic entry into why music exists socially.\"}, {\"title\": \"The Audible Past\", \"author\": \"Jonathan Sterne\", \"year\": \"\", \"note\": \"A history of listening technologies and the cultural assumptions built into modern sound reproduction.\", \"tag\": \"Sound, Music & Listening\", \"detail\": \"\", \"bridge\": \"The deeper conceptual step after the more accessible sound books.\"}, {\"title\": \"The Globalization of World Politics\", \"author\": \"John Baylis, Steve Smith & Patricia Owens (eds.)\", \"year\": \"\", \"note\": \"A broad standard introduction to states, war, institutions, globalization, security and major IR theories.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"The map of the field before choosing a theoretical camp.\"}, {\"title\": \"Theories of International Politics and Zombies\", \"author\": \"Daniel W. Drezner\", \"year\": \"\", \"note\": \"Explains realism, liberalism, constructivism and other theories by asking how each would respond to zombies.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"A genuinely fun first pass through otherwise abstract schools of international relations.\"}, {\"title\": \"Man, the State, and War\", \"author\": \"Kenneth N. Waltz\", \"year\": \"\", \"note\": \"Three levels of explanation for war: individuals, domestic politics and the international system.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"Excellent training in keeping causal scales separate.\"}, {\"title\": \"The Tragedy of Great Power Politics\", \"author\": \"John J. Mearsheimer\", \"year\": \"\", \"note\": \"A major realist argument that great powers are pushed toward rivalry by the structure of the international system.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"Read as a strong model, not as the only model.\"}, {\"title\": \"The Anarchical Society\", \"author\": \"Hedley Bull\", \"year\": \"\", \"note\": \"Explains how order can exist among sovereign states without a world government.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"Useful for institutions, norms and the strange partial order of international society.\"}, {\"title\": \"World Order\", \"author\": \"Henry Kissinger\", \"year\": \"\", \"note\": \"A sweeping interpretation of competing regional ideas of international order.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"Valuable as one influential establishment perspective to compare against critical histories.\"}, {\"title\": \"The Rise and Fall of the Great Powers\", \"author\": \"Paul Kennedy\", \"year\": \"\", \"note\": \"Links military power, economic capacity and imperial overextension across centuries.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"A long-run view of material constraints on power.\"}, {\"title\": \"The Revenge of Geography\", \"author\": \"Robert D. Kaplan\", \"year\": \"\", \"note\": \"Argues that terrain and strategic location continue to constrain political choices.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"Read alongside anti-determinist accounts; useful for spatial intuition.\"}, {\"title\": \"Soft Power\", \"author\": \"Joseph S. Nye Jr.\", \"year\": \"\", \"note\": \"Explains influence through attraction, legitimacy and culture rather than coercion alone.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"Useful for media, reputation and symbolic power in world politics.\"}, {\"title\": \"The Strategy of Conflict\", \"author\": \"Thomas C. Schelling\", \"year\": \"\", \"note\": \"Bargaining, threats, commitment and focal points in conflict.\", \"tag\": \"Global Politics & International Relations\", \"detail\": \"\", \"bridge\": \"A foundational bridge from game theory to diplomacy and coercion.\"}, {\"title\": \"Architecture: Form, Space, and Order\", \"author\": \"Francis D. K. Ching\", \"year\": \"\", \"note\": \"A visual grammar of form, space, circulation, proportion and ordering principles.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"Probably the best first book for learning to see architecture.\"}, {\"title\": \"A Pattern Language\", \"author\": \"Christopher Alexander, Sara Ishikawa & Murray Silverstein\", \"year\": \"\", \"note\": \"Hundreds of recurring patterns for rooms, streets, neighborhoods and human-scale environments.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"Turns built space into a vocabulary of relationships and recurring solutions.\"}, {\"title\": \"The Architecture of Happiness\", \"author\": \"Alain de Botton\", \"year\": \"\", \"note\": \"A very accessible reflection on why buildings affect mood, identity and aspiration.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"An easy bridge from everyday feeling to architectural attention.\"}, {\"title\": \"How Buildings Learn\", \"author\": \"Stewart Brand\", \"year\": \"\", \"note\": \"Shows how buildings change after construction and why adaptable structures often outlive perfect designs.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"A systems view of buildings as evolving objects.\"}, {\"title\": \"The Death and Life of Great American Cities\", \"author\": \"Jane Jacobs\", \"year\": \"\", \"note\": \"Street life, mixed use, eyes on the street and the failures of top-down urban renewal.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"One of the clearest books on emergent urban order.\"}, {\"title\": \"The Image of the City\", \"author\": \"Kevin Lynch\", \"year\": \"\", \"note\": \"Introduces paths, edges, districts, nodes and landmarks as the mental structure of cities.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"Extremely useful for writing places readers can navigate in their heads.\"}, {\"title\": \"The Eyes of the Skin\", \"author\": \"Juhani Pallasmaa\", \"year\": \"\", \"note\": \"Argues that architecture is experienced through the whole body, not just the eye.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"A compact guide to sensory world-building through space.\"}, {\"title\": \"Happy City\", \"author\": \"Charles Montgomery\", \"year\": \"\", \"note\": \"Research and stories about how urban design changes health, trust, movement and happiness.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"A readable bridge between city form and lived experience.\"}, {\"title\": \"Walkable City\", \"author\": \"Jeff Speck\", \"year\": \"\", \"note\": \"A practical explanation of why walkability depends on safety, usefulness, comfort and interest.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"Makes street-level design legible without specialist training.\"}, {\"title\": \"Building and Dwelling\", \"author\": \"Richard Sennett\", \"year\": \"\", \"note\": \"Distinguishes the planned city from the lived city and asks how urban form can remain open to difference.\", \"tag\": \"Architecture, Cities & Built Environment\", \"detail\": \"\", \"bridge\": \"A humane bridge between architecture, sociology and politics.\"}, {\"title\": \"The Upanishads\", \"author\": \"Patrick Olivelle (trans.)\", \"year\": \"\", \"note\": \"Primary texts behind later Vedanta: self, ultimate reality, consciousness and liberation in multiple voices.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Start here to see the diversity that later Advaita systematizes.\"}, {\"title\": \"The Bhagavad Gita\", \"author\": \"Eknath Easwaran (trans.)\", \"year\": \"\", \"note\": \"A readable translation of the dialogue on action, self, devotion, knowledge and liberation.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Useful for seeing how non-dual insight coexists with action and ethical duty.\"}, {\"title\": \"The Ashtavakra Gita\", \"author\": \"Thomas Byrom (trans.)\", \"year\": \"\", \"note\": \"Radically direct verses identifying awareness as already free and untouched by experience.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"One of the cleanest literary expressions of uncompromising non-duality.\"}, {\"title\": \"Mandukya Upanishad with Gaudapada's Karika\", \"author\": \"Swami Nikhilananda (trans.)\", \"year\": \"\", \"note\": \"Waking, dreaming, deep sleep and turiya become the basis for a rigorous early Advaita analysis of consciousness.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"The conceptual bridge from Upanishadic insight to systematic non-dual philosophy.\"}, {\"title\": \"Vivekachudamani\", \"author\": \"Adi Shankaracharya\", \"year\": \"\", \"note\": \"A traditional path of discrimination between the changing field of experience and the self.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Useful for understanding classical Advaita's method, vocabulary and assumptions.\"}, {\"title\": \"Drg-Drsya-Viveka\", \"author\": \"Traditional Advaita text\", \"year\": \"\", \"note\": \"A compact inquiry into the seer and the seen, moving from objects to mind to awareness.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Exceptionally useful as a precise philosophical exercise rather than a belief system.\"}, {\"title\": \"I Am That\", \"author\": \"Nisargadatta Maharaj\", \"year\": \"\", \"note\": \"Conversations repeatedly return attention from identity, biography and thought to bare awareness.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"One of the most influential twentieth-century direct-path texts.\"}, {\"title\": \"Be As You Are\", \"author\": \"Ramana Maharshi; ed. David Godman\", \"year\": \"\", \"note\": \"A clear thematic selection of Ramana Maharshi's teaching on self-inquiry and the sense of 'I'.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"The most accessible entry into Ramana without reading thousands of pages of talks.\"}, {\"title\": \"Talks with Sri Ramana Maharshi\", \"author\": \"Ramana Maharshi\", \"year\": \"\", \"note\": \"Extended conversations showing self-inquiry applied to grief, action, devotion, doubt and metaphysics.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Useful after Be As You Are for nuance and contradictions that summaries smooth over.\"}, {\"title\": \"The Direct Path\", \"author\": \"Greg Goode\", \"year\": \"\", \"note\": \"Experiments that investigate perception, awareness and the assumed subject-object split.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"A modern, analytic presentation of direct-path inquiry.\"}, {\"title\": \"The Transparency of Things\", \"author\": \"Rupert Spira\", \"year\": \"\", \"note\": \"Short contemplative essays on experience, awareness and the apparent division between self and world.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Accessible modern prose; best read alongside classical sources rather than as a substitute.\"}, {\"title\": \"The Recognition Sutras\", \"author\": \"Christopher D. Wallis\", \"year\": \"\", \"note\": \"A translation and commentary on a non-dual Tantric philosophy in which consciousness manifests the world rather than merely witnessing it.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"An important alternative to Advaita's characteristic language of discrimination and appearance.\"}, {\"title\": \"Kashmir Shaivism: The Secret Supreme\", \"author\": \"Swami Lakshman Joo\", \"year\": \"\", \"note\": \"A traditional introduction to major schools and concepts of non-dual Kashmir Shaivism.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Adds a world-affirming non-dual tradition to the shelf.\"}, {\"title\": \"The Fundamental Wisdom of the Middle Way\", \"author\": \"Nagarjuna; Jay L. Garfield (trans./commentary)\", \"year\": \"\", \"note\": \"A rigorous dismantling of intrinsic existence through dependent arising and emptiness.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"A major comparative counterpoint: non-duality without an eternal metaphysical self.\"}, {\"title\": \"Seeing That Frees\", \"author\": \"Rob Burbea\", \"year\": \"\", \"note\": \"A systematic exploration of emptiness, dependent perception and ways of looking.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"Unusually precise about how experience changes when assumptions about self and world relax.\"}, {\"title\": \"Waking Up\", \"author\": \"Sam Harris\", \"year\": \"\", \"note\": \"A secular route into meditation, selflessness and non-dual awareness, with philosophical discussion of consciousness.\", \"tag\": \"Non-Dual Philosophy & Contemplative Traditions\", \"detail\": \"\", \"bridge\": \"A contemporary gateway; strongest when compared with the older traditions it draws from.\"}], \"world\": [{\"title\": \"To Kill a Mockingbird\", \"author\": \"Harper Lee\", \"year\": \"1960\", \"note\": \"Through Scout Finch's eyes in Depression-era Alabama, Lee anatomises racial injustice and moral courage. No novel better captures the nation's long struggle with race, law, and conscience.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Great Gatsby\", \"author\": \"F. Scott Fitzgerald\", \"year\": \"1925\", \"note\": \"The definitive novel of the American Dream's seductive illusion -- wealth, reinvention, the green light across the bay. Fitzgerald's Jazz Age portrait remains an unsurpassed diagnosis of American aspiration and its hollow core.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Beloved\", \"author\": \"Toni Morrison\", \"year\": \"1987\", \"note\": \"A Nobel Prize-winning meditation on slavery's psychic aftermath. Morrison builds an almost unbearable portrait of trauma, memory, and survival that defines the African-American experience for the world.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Grapes of Wrath\", \"author\": \"John Steinbeck\", \"year\": \"1939\", \"note\": \"Steinbeck's Dust Bowl epic follows the Joad family's migration to California, laying bare class exploitation, the myth of the frontier, and the dignity of ordinary Americans crushed by economic forces.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Moby-Dick\", \"author\": \"Herman Melville\", \"year\": \"1851\", \"note\": \"Ahab's mad pursuit of the White Whale is America's foundational obsession -- the individual will against an indifferent universe. The most encyclopaedic, ambiguous, and magnificent novel the country has produced.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Invisible Man\", \"author\": \"Ralph Ellison\", \"year\": \"1952\", \"note\": \"An unnamed Black man moves through American society unseen. Ellison's novel -- a masterpiece of jazz-influenced prose -- is the defining account of race, identity, and the American promise of visibility denied.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Their Eyes Were Watching God\", \"author\": \"Zora Neale Hurston\", \"year\": \"1937\", \"note\": \"Janie Crawford's journey toward selfhood in all-Black Florida towns is the great novel of Black women's inner life and the Harlem Renaissance's most lyrical achievement.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Catch-22\", \"author\": \"Joseph Heller\", \"year\": \"1961\", \"note\": \"The American military-bureaucratic machine as absurdist comedy. Heller's WWII novel invented a new way of writing about war and institutional madness that has never been surpassed.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Blood Meridian\", \"author\": \"Cormac McCarthy\", \"year\": \"1985\", \"note\": \"McCarthy's savage historical novel on the 1850s Texas-Mexico border is perhaps the most unflinching examination of American violence ever written -- a meditation on manifest destiny and human darkness.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Adventures of Huckleberry Finn\", \"author\": \"Mark Twain\", \"year\": \"1884\", \"note\": \"Hemingway said all American literature comes from this one book. Huck and Jim floating the Mississippi is the nation's conscience in its purest form -- freedom, friendship, and the original sin of slavery.\", \"tag\": \"United States of America\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"1984\", \"author\": \"George Orwell\", \"year\": \"1949\", \"note\": \"Orwell's totalitarian nightmare -- surveillance, doublethink, the Ministry of Truth -- was forged from Britain's wartime experience. The world's most-read political novel and a permanent warning about state power.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Middlemarch\", \"author\": \"George Eliot\", \"year\": \"1871\", \"note\": \"Widely considered the greatest English-language novel, Eliot's panoramic portrait of provincial life in reform-era England captures the aspirations and constraints of Victorian society with extraordinary precision.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Bleak House\", \"author\": \"Charles Dickens\", \"year\": \"1852\", \"note\": \"Dickens used the interminable case of Jarndyce v Jarndyce to savage England's legal system, class structure, and hollow philanthropy -- a fog-shrouded masterpiece of social critique.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Jane Eyre\", \"author\": \"Charlotte Bronte\", \"year\": \"1847\", \"note\": \"The first great novel of female interiority in English -- a governess asserting her moral and psychological equality against class and patriarchy. Victorian England's social hierarchy made viscerally personal.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Wuthering Heights\", \"author\": \"Emily Bronte\", \"year\": \"1847\", \"note\": \"A Gothic love story set on the Yorkshire moors, Heathcliff and Catherine's destructive passion is the dark underside of Romanticism -- and one of the most original novels in any language.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mrs Dalloway\", \"author\": \"Virginia Woolf\", \"year\": \"1925\", \"note\": \"A single June day in post-WWI London. Woolf's stream-of-consciousness masterpiece invented interiority in the novel and captured the haunted quality of a civilisation that had survived the trenches.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Never Let Me Go\", \"author\": \"Kazuo Ishiguro\", \"year\": \"2005\", \"note\": \"Set in an alternate England, Ishiguro's haunting novel uses clones bred for organ donation to explore memory, mortality, and the human capacity for passive acceptance of injustice.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Brave New World\", \"author\": \"Aldous Huxley\", \"year\": \"1932\", \"note\": \"Where Orwell feared the boot on the face, Huxley feared a world of pleasure and distraction so total that freedom becomes unimaginable. Written in 1931, it describes the 21st century with eerie precision.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Atonement\", \"author\": \"Ian McEwan\", \"year\": \"2001\", \"note\": \"A teenage girl's false accusation destroys three lives across WWII and its aftermath. McEwan's meditation on fiction, guilt, and the stories we tell about the past is the finest British novel of this century so far.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Things Fall Apart\", \"author\": \"Chinua Achebe\", \"year\": \"1958\", \"note\": \"Written from Nigeria under British colonial rule, Achebe's novel is the essential counter-narrative to the colonial canon. Included here for its explicit, defining conversation with the British literary tradition.\", \"tag\": \"United Kingdom\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"War and Peace\", \"author\": \"Leo Tolstoy\", \"year\": \"1869\", \"note\": \"Tolstoy's chronicle of Napoleonic Russia is not merely a novel but a philosophy of history -- five aristocratic families measured against the tidal forces of war and fate. The Russian soul in one book.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Brothers Karamazov\", \"author\": \"Fyodor Dostoevsky\", \"year\": \"1880\", \"note\": \"Russia's spiritual and moral wrestling match in novelistic form. Through three brothers, Dostoevsky debates God, murder, free will, and the Russian character -- Freud called it the greatest novel ever written.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Anna Karenina\", \"author\": \"Leo Tolstoy\", \"year\": \"1878\", \"note\": \"The novel that Nabokov taught as the greatest ever written. Anna's tragedy is not a morality tale but a study of a society that destroys those who feel too much -- Tolstoy's most complete, compassionate work.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Crime and Punishment\", \"author\": \"Fyodor Dostoevsky\", \"year\": \"1866\", \"note\": \"Raskolnikov murders a pawnbroker to prove his Napoleonic exceptionalism and is destroyed by his own conscience. Dostoevsky's psychological thriller invented the modern thriller and probed guilt more deeply than any other novel.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Master and Margarita\", \"author\": \"Mikhail Bulgakov\", \"year\": \"1967\", \"note\": \"The Devil visits Stalin-era Moscow. Bulgakov's satirical fantasy is the definitive literary indictment of Soviet bureaucracy and censorship, written in secret and published 27 years after his death.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Doctor Zhivago\", \"author\": \"Boris Pasternak\", \"year\": \"1957\", \"note\": \"Banned in the USSR, awarded the Nobel Prize, smuggled out on microfilm -- Pasternak's epic of love across the Russian Revolution and Civil War is inseparable from Russia's 20th-century tragedy.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"One Day in the Life of Ivan Denisovich\", \"author\": \"Alexander Solzhenitsyn\", \"year\": \"1962\", \"note\": \"The single day of a Gulag prisoner becomes an entire civilisation's indictment. This slim novel cracked the Soviet Union's self-mythology and told Russians what their system really was.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Dead Souls\", \"author\": \"Nikolai Gogol\", \"year\": \"1842\", \"note\": \"Chichikov travels provincial Russia buying the names of dead serfs to use as collateral. Gogol's satirical picaresque is the first great Russian novel and an indictment of bureaucracy, greed, and the absurdity of serfdom.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Idiot\", \"author\": \"Fyodor Dostoevsky\", \"year\": \"1869\", \"note\": \"Prince Myshkin -- Christ-like, epileptic, guileless -- enters St Petersburg society and is destroyed by it. Dostoevsky's meditation on goodness in a corrupt world is among his most personal and painful achievements.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Fathers and Sons\", \"author\": \"Ivan Turgenev\", \"year\": \"1862\", \"note\": \"Bazarov, the first nihilist in literature, returns home and collides with the old generation. Turgenev's novel captured the generational clash that was about to convulse Russia -- and coined the word 'nihilism' for the world.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Hero of Our Time\", \"author\": \"Mikhail Lermontov\", \"year\": \"1840\", \"note\": \"Pechorin -- cold, brilliant, destructive -- is Russia's first Byronic anti-hero and the prototype for superfluous men in Turgenev, Dostoevsky, and Chekhov. The first Russian psychological novel.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Petersburg\", \"author\": \"Andrei Bely\", \"year\": \"1913\", \"note\": \"A senator's son is given a bomb to assassinate his father. Bely's hallucinatory novel of pre-revolutionary St Petersburg is the most formally radical work in Russian literature -- its city as fog and terror.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Life and Fate\", \"author\": \"Vasily Grossman\", \"year\": \"1980\", \"note\": \"Called the Soviet War and Peace. Grossman's massive novel -- set at Stalingrad and in the death camps -- directly compares Nazism and Stalinism, which is why the KGB arrested the manuscript itself.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"We\", \"author\": \"Yevgeny Zamyatin\", \"year\": \"1924\", \"note\": \"The first great dystopian novel, written in 1920 and banned in the USSR. Zamyatin's glass-city surveillance state directly inspired both Huxley's Brave New World and Orwell's 1984.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Foundation Pit\", \"author\": \"Andrei Platonov\", \"year\": \"1987\", \"note\": \"Workers dig a pit for a communal building that will never be built. Platonov's novella -- written 1930, published 57 years later -- is the most devastating portrait of Soviet collectivisation's human cost.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Oblomov\", \"author\": \"Ivan Goncharov\", \"year\": \"1859\", \"note\": \"Oblomov cannot get out of bed. Goncharov's portrait of total inertia is both a comic masterpiece and a devastating critique of the Russian gentry -- 'Oblomovism' became a national diagnosis.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The First Circle\", \"author\": \"Alexander Solzhenitsyn\", \"year\": \"1968\", \"note\": \"Prisoners in a sharashka (privileged Gulag research lab) face a choice: collaborate or return to the camps. Solzhenitsyn's most intellectually rich novel is the Soviet system's soul on the operating table.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Quiet Flows the Don\", \"author\": \"Mikhail Sholokhov\", \"year\": \"1928-1940\", \"note\": \"The Cossack Grigory Melekhov across WWI, Revolution, and Civil War. Sholokhov's epic is the last great realist novel of the Russian tradition and the only Soviet-era Nobel winner that genuinely earned the prize.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Lolita\", \"author\": \"Vladimir Nabokov\", \"year\": \"1955\", \"note\": \"Humbert Humbert's predatory obsession with a twelve-year-old girl is rendered in the most gorgeous prose in the English language. Written by a Russian in English, Lolita is both Nabokov's double exile and his conquest.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Gift\", \"author\": \"Vladimir Nabokov\", \"year\": \"1937\", \"note\": \"Nabokov's last Russian-language novel -- a young emigre poet in Berlin writing a life of Chernyshevsky. The most personal distillation of the Russian literary tradition by the man who both loved and escaped it.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Chevengur\", \"author\": \"Andrei Platonov\", \"year\": \"1988\", \"note\": \"Revolutionaries build a utopian commune and wait for communism to arrive on its own. Platonov's surreal novel -- suppressed for six decades -- is the most original and heartbreaking vision of the Bolshevik dream.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Road to Calvary\", \"author\": \"Alexei Tolstoy\", \"year\": \"1920-1941\", \"note\": \"A trilogy following two St Petersburg families through WWI, Revolution, and Civil War. Alexei Tolstoy's epic is the Soviet regime's most ambitious attempt to write its own War and Peace -- and largely succeeds.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Enchanted Wanderer\", \"author\": \"Nikolai Leskov\", \"year\": \"1873\", \"note\": \"Ivan Flyagin's picaresque adventures across the Russian steppe -- a soldier, a horse trader, a monk. Leskov's kaleidoscopic novel captures the rootless Russian soul and the vastness of the empire with unique vitality.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Red Cavalry\", \"author\": \"Isaac Babel\", \"year\": \"1926\", \"note\": \"Babel's cycle of stories from the 1920 Soviet-Polish War -- a Jewish intellectual among Cossack cavalry -- is the most honest account of revolutionary violence ever written by a true believer in the revolution.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Adolescent\", \"author\": \"Fyodor Dostoevsky\", \"year\": \"1875\", \"note\": \"Arkady Dolgoruky, the illegitimate son of a dissolute noble, seeks his identity and a fortune. The least-read of Dostoevsky's five major novels is among his most intimate -- the story of a Russia between certainties.\", \"tag\": \"Russia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Les Miserables\", \"author\": \"Victor Hugo\", \"year\": \"1862\", \"note\": \"Hugo's titanic novel -- Jean Valjean pursued across decades of revolutionary France -- is at once a social manifesto, a love story, and a theological argument. No book captures the French soul's belief in justice more powerfully.\", \"tag\": \"France\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Madame Bovary\", \"author\": \"Gustave Flaubert\", \"year\": \"1857\", \"note\": \"The birth of literary Realism. Flaubert's provincial doctor's wife -- destroyed by romantic illusions and a suffocating bourgeois world -- put France's middle class on the page with surgical, merciless clarity.\", \"tag\": \"France\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Stranger\", \"author\": \"Albert Camus\", \"year\": \"1942\", \"note\": \"Meursault kills a man under the Algerian sun and feels nothing. Camus's Absurdist parable defines Existentialism for the world and poses the defining question: does life have meaning?\", \"tag\": \"France\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In Search of Lost Time\", \"author\": \"Marcel Proust\", \"year\": \"1913-1927\", \"note\": \"The longest novel ever written is also among the most intimate -- a seven-volume excavation of memory, time, and Belle Epoque French society that gave Europe's aristocracy its final, glittering flourish before WWI.\", \"tag\": \"France\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Germinal\", \"author\": \"Emile Zola\", \"year\": \"1885\", \"note\": \"The greatest novel of labour and class war. Zola descended into the mines of northern France for research; the result is a ferocious portrait of industrial exploitation that shaped socialist movements across Europe.\", \"tag\": \"France\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Tin Drum\", \"author\": \"Gunter Grass\", \"year\": \"1959\", \"note\": \"Oskar Matzerath decides at age three to stop growing and beats his tin drum through the rise of Nazism and WWII. Grass's grotesque masterpiece forced Germany to confront what it had done -- and become.\", \"tag\": \"Germany\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"All Quiet on the Western Front\", \"author\": \"Erich Maria Remarque\", \"year\": \"1929\", \"note\": \"The most devastating anti-war novel ever written -- Paul Baumer's WWI trench experience stripped of all glory. Burned by the Nazis in 1933, it remains the definitive account of the generation the war annihilated.\", \"tag\": \"Germany\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Reader\", \"author\": \"Bernhard Schlink\", \"year\": \"1995\", \"note\": \"A teenage boy's affair with an older woman becomes a moral earthquake when he discovers she was a Nazi guard. Schlink captures Germany's post-war generation's impossible reckoning with their parents' complicity.\", \"tag\": \"Germany\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Steppenwolf\", \"author\": \"Hermann Hesse\", \"year\": \"1927\", \"note\": \"Harry Haller -- half-man, half-wolf -- wanders Weimar Republic Germany in existential crisis. Hesse's hallucinatory novel of alienation became the counterculture's bible across generations.\", \"tag\": \"Germany\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Emigrants\", \"author\": \"W. G. Sebald\", \"year\": \"1992\", \"note\": \"Four   Jewish   emigrants     displaced   by   the   20th   century's   upheavals.   Sebald's   hypnotic prose-photograph hybrid invented a new genre and enshrined memory and loss as Germany's inescapable literary preoccupations.\", \"tag\": \"Germany\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Dream of the Red Chamber\", \"author\": \"Cao Xueqin\", \"year\": \"1791\", \"note\": \"China's greatest novel follows the decline of an aristocratic clan. An encyclopaedia of Qing Dynasty society -- its food, fashion, poetry, and politics -- in one vast tapestry.\", \"tag\": \"China\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"To Live\", \"author\": \"Yu Hua\", \"year\": \"1993\", \"note\": \"Fugui survives the Civil War, the Great Leap Forward, and the Cultural Revolution, losing everyone he loves. Yu Hua's spare, devastating novel contains the entire arc of modern Chinese history in a single peasant's life.\", \"tag\": \"China\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Three-Body Problem\", \"author\": \"Liu Cixin\", \"year\": \"2008\", \"note\": \"Beginning during the Cultural Revolution and expanding to humanity's first contact with an alien civilisation, Liu's trilogy is both a portrait of China's traumatic 20th century and the most ambitious science fiction in any language.\", \"tag\": \"China\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Red Sorghum\", \"author\": \"Mo Yan\", \"year\": \"1987\", \"note\": \"The Nobel laureate's multigenerational saga of a Shandong family across the Japanese occupation blends myth, violence, and sensory intensity into a style that defines Chinese Magical Realism.\", \"tag\": \"China\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Fortress Besieged\", \"author\": \"Qian Zhongshu\", \"year\": \"1947\", \"note\": \"China's wittiest novel -- its marriage-as-fortress metaphor captures the educated Chinese caught between tradition and modernity in the turbulent 1930s with savage comic precision.\", \"tag\": \"China\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Snow Country\", \"author\": \"Yasunari Kawabata\", \"year\": \"1956\", \"note\": \"Kawabata's Nobel Prize-winning haiku-like novel -- a Tokyo dilettante and a mountain hot-spring geisha -- renders the Japanese aesthetic of impermanence and beauty as something felt rather than read.\", \"tag\": \"Japan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Wind-Up Bird Chronicle\", \"author\": \"Haruki Murakami\", \"year\": \"1994\", \"note\": \"A missing cat spirals into Japan's suppressed wartime history in Manchuria. Murakami's dreamlike novel is both Tokyo suburban life at its most surreal and Japan's most honest reckoning with its 20th-century violence.\", \"tag\": \"Japan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"No Longer Human\", \"author\": \"Osamu Dazai\", \"year\": \"1948\", \"note\": \"Dazai's semi-autobiographical novel -- a man who cannot connect with humanity -- was written just before his suicide and reads as Japan's confession: the mask worn in society, the abyss beneath.\", \"tag\": \"Japan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Black Rain\", \"author\": \"Masuji Ibuse\", \"year\": \"1966\", \"note\": \"The most compassionate novel about Hiroshima -- told through survivor testimonies assembled by a man trying to find his niece a husband despite radiation stigma. No book honours the bomb survivors more fully.\", \"tag\": \"Japan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kokoro\", \"author\": \"Soseki Natsume\", \"year\": \"1914\", \"note\": \"A young man's relationship with a solitary, guilt-haunted older man (Sensei) who carries a secret. Soseki's masterwork is the novel of Meiji Japan's moral transition -- the old world ending and the new not yet born.\", \"tag\": \"Japan\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Fine Balance\", \"author\": \"Rohinton Mistry\", \"year\": \"1995\", \"note\": \"Set during Indira Gandhi's Emergency (1975-77), four characters across India's social spectrum share a Bombay apartment. Mistry's Dickensian masterpiece is the most complete portrait of modern India's cruelties and kindnesses.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Midnight's Children\", \"author\": \"Salman Rushdie\", \"year\": \"1981\", \"note\": \"Saleem Sinai, born at the exact moment of Indian independence, is telepathically linked to all children born that midnight. Rushdie's Booker Prize winner is post-colonial India's founding myth retold as magical, irreverent history.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The God of Small Things\", \"author\": \"Arundhati Roy\", \"year\": \"1997\", \"note\": \"Roy's debut -- a Syrian Christian family in Kerala, a forbidden love across caste lines -- captures India's caste system, communism, and postcolonial psychology with prose of shattering beauty.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Suitable Boy\", \"author\": \"Vikram Seth\", \"year\": \"1993\", \"note\": \"At 1,500 pages, Seth's novel of a mother seeking her daughter's husband across newly independent India is the great panoramic novel of the subcontinent -- Hindu-Muslim tensions, land reform, and the birth of a democracy.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The White Tiger\", \"author\": \"Aravind Adiga\", \"year\": \"2008\", \"note\": \"Balram Halwai's rise from rural Bihar to Bangalore entrepreneur through murder is India's darkest, funniest self-portrait -- the 21st century's answer to caste, class, and the economic miracle's underside.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Train to Pakistan\", \"author\": \"Khushwant Singh\", \"year\": \"1956\", \"note\": \"The Partition of 1947 arrives in the village of Mano Majra on the Indo-Pakistan border. Singh's slim novel is the most visceral fictional account of the subcontinent's bloodiest wound -- still essential 70 years on.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Shadow Lines\", \"author\": \"Amitav Ghosh\", \"year\": \"1988\", \"note\": \"A Calcutta family's connections to London and Dhaka across WWII and the communal riots of 1964. Ghosh's novel interrogates memory, nationalism, and the arbitrary violence of borders with unique intellectual tenderness.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Inheritance of Loss\", \"author\": \"Kiran Desai\", \"year\": \"2006\", \"note\": \"A retired judge in the Himalayas, his granddaughter, and her undocumented immigrant cook in New York. Desai's Booker Prize winner is the most unflinching portrait of globalisation's human cost from an Indian perspective.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Interpreter of Maladies\", \"author\": \"Jhumpa Lahiri\", \"year\": \"1999\", \"note\": \"Lahiri's Pulitzer Prize-winning story collection captures the Indian diaspora's dislocation -- caught between a homeland becoming memory and an America that will never fully receive them. The definitive immigrant literature.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Untouchable\", \"author\": \"Mulk Raj Anand\", \"year\": \"1935\", \"note\": \"A single day in the life of Bakha, a sweeper (latrine cleaner) in colonial India. Anand's novel -- introduced by E.M. Forster -- is the first great literary indictment of untouchability, written when Gandhiji was still alive.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Guide\", \"author\": \"R. K. Narayan\", \"year\": \"1960\", \"note\": \"Raju the tour guide becomes a criminal, then a reluctant saint. Narayan's Sahitya Akademi Award winner set in the fictional Malgudi is both a meditation on modern India's spiritual confusion and its funniest serious novel.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Such a Long Journey\", \"author\": \"Rohinton Mistry\", \"year\": \"1991\", \"note\": \"Gustad Noble -- Parsi bank clerk in Bombay -- is caught in the conspiracy and chaos of Indira Gandhi's Bangladesh War period. Mistry's debut is the essential portrait of Parsi Mumbai at its beleaguered, dignified best.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Sea of Poppies\", \"author\": \"Amitav Ghosh\", \"year\": \"2008\", \"note\": \"The first volume of Ghosh's Ibis Trilogy set the opium trade of the 1830s -- from Bihar's poppy fields to the convict ships to Mauritius. The most ambitious historical fiction about the British Empire in Indian literature.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Moor's Last Sigh\", \"author\": \"Salman Rushdie\", \"year\": \"1995\", \"note\": \"The Zogoiby family across generations of Bombay -- Jewish-Catholic-Hindu spice merchants whose decline mirrors India's -- is Rushdie's most exuberant, grief-stricken portrait of the city that shaped him.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"English, August\", \"author\": \"Upamanyu Chatterjee\", \"year\": \"1988\", \"note\": \"Agastya Sen, an Indian Administrative Service officer posted to a small UP town, spends a year in bemused, stoned incomprehension. The definitive novel of the educated Indian's absurd relationship with the state.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Samskara\", \"author\": \"U. R. Ananthamurthy\", \"year\": \"1965\", \"note\": \"A Brahmin scholar in a Karnataka agrahara must decide whether to perform death rites for an outcast. Ananthamurthy's Kannada novella is the most philosophically searching interrogation of the caste system in any Indian language.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Chemmeen\", \"author\": \"Thakazhi Sivasankara Pillai\", \"year\": \"1956\", \"note\": \"A fisherman's daughter from Kerala falls in love across community lines. Thakazhi's Malayalam novel -- the single most widely read Indian regional language work -- is the fisher community's Iliad, heartbreaking and tidal.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Raag Darbari\", \"author\": \"Shrilal Shukla\", \"year\": \"1968\", \"note\": \"A government officer returns to his village in UP and finds bureaucracy, corruption, and political cynicism in their most absurd forms. Shukla's satirical Hindi novel is the definitive portrait of post-independence rural India.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Vendor of Sweets\", \"author\": \"R. K. Narayan\", \"year\": \"1967\", \"note\": \"Jagan the sweet-seller and his Americanised son: tradition versus modernity, India versus the West. Narayan distils the entire tension of post-colonial Indian society into a small, perfect tragicomedy.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Passage to India\", \"author\": \"E. M. Forster\", \"year\": \"1924\", \"note\": \"An Englishman in colonial India, a Marabar Cave incident, a criminal trial. Forster's novel -- written by an outsider -- is paradoxically the most honest English-language account of India under empire and what it did to both sides.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Tamas\", \"author\": \"Bhisham Sahni\", \"year\": \"1974\", \"note\": \"Darkness -- the meaning of the Hindi title -- falls over a North Indian town during Partition. Sahni's Hindi novel, based partly on family memory, is the subcontinent's most unflinching Partition novel after Singh's.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Space Between Us\", \"author\": \"Thrity Umrigar\", \"year\": \"2006\", \"note\": \"A wealthy Parsi woman and her Hindu servant navigate the gulf of class, caste, and domestic intimacy in modern Bombay. Umrigar's novel is the most searching examination of what India's class divide does to women on both sides.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Nectar in a Sieve\", \"author\": \"Kamala Markandaya\", \"year\": \"1954\", \"note\": \"Rukmani's life as a tenant farmer -- drought, industrial encroachment, the loss of children -- is an elegy for rural India's way of life written at the very moment modernisation was destroying it.\", \"tag\": \"India\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The In-Between W
