psyche while remaining compelling literature in its own right.\u003c/p>\u003c/div>\u003caside class=\"hero-card\">\u003cdiv class=\"eyebrow\">Library at a glance\u003c/div>\u003cdiv class=\"hero-stats\">\u003cdiv class=\"hero-stat\">\u003cb>50\u003c/b>\u003cspan>countries / country groups\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>300\u003c/b>\u003cspan>book entries parsed\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>4\u003c/b>\u003cspan>extended country lists\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>16\u003c/b>\u003cspan>conflict / war-zone sections\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"source-note\">Source note: the PDF cover says \u201c285+ Novels,\u201d while its introduction and contents state 300 books. This interactive edition preserves all 300 book entries actually present in the PDF.\u003c/div>\u003c/aside>\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection id=\"overview\">\u003cdiv class=\"section-head\">\u003ch2>One world, many literary routes\u003c/h2>\u003cp>Browse the catalogue as a geography, a timeline, a conflict-reading project or a personal reading tracker. Search includes titles, authors, country introductions and the PDF's full descriptive notes.\u003c/p>\u003c/div>\u003cdiv class=\"stats-grid\">\u003cdiv class=\"statbox\">\u003cb>300\u003c/b>\u003cspan>Total book entries\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>50\u003c/b>\u003cspan>Country sections\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>25\u003c/b>\u003cspan>Russia entries\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>25\u003c/b>\u003cspan>India entries\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>20\u003c/b>\u003cspan>USA + UK entries\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"group-grid\" style=\"margin-top:14px\">\u003carticle class=\"group-card major\">\u003cdiv class=\"eyebrow\" style=\"color:var(--navy2)\">Source section I\u003c/div>\u003ch3>Major World Powers & Significant Nations\u003c/h3>\u003cp style=\"color:var(--muted);font-size:13px\">The PDF's main survey: major literary traditions and nationally revealing works.\u003c/p>\u003cdiv class=\"country-pills\" id=\"majorPills\">\u003c/div>\u003c/article>\u003carticle class=\"group-card conflict\">\u003cdiv class=\"eyebrow\" style=\"color:var(--red)\">Source section II\u003c/div>\u003ch3>Active Conflict & War Zones\u003c/h3>\u003cp style=\"color:var(--muted);font-size:13px\">Selections asking what the world should read to understand places shaped by war, rupture and displacement.\u003c/p>\u003cdiv class=\"country-pills\" id=\"conflictPills\">\u003c/div>\u003c/article>\u003c/div>\u003c/section>\n\n\u003csection id=\"countries\">\u003cdiv class=\"section-head\">\u003ch2>Explore all 50 country sections\u003c/h2>\u003cp>Use the controls to narrow the catalogue. Publication-period filters are derived from the publication year printed in the PDF; all descriptions remain source text.\u003c/p>\u003c/div>\n\u003cdiv class=\"controls-wrap\">\u003cdiv class=\"controls\">\u003cinput id=\"q\" placeholder=\"Search title, author, country, description\u2026\">\u003cselect id=\"group\">\u003coption value=\"\">All source sections\u003c/option>\u003coption>Major world powers & significant nations\u003c/option>\u003coption>Active conflict & war zones\u003c/option>\u003c/select>\u003cselect id=\"country\">\u003coption value=\"\">All countries\u003c/option>\u003c/select>\u003cselect id=\"period\">\u003coption value=\"\">All publication periods\u003c/option>\u003coption value=\"pre1900\">Before 1900\u003c/option>\u003coption value=\"1900-1945\">1900\u20131945\u003c/option>\u003coption value=\"1946-1989\">1946\u20131989\u003c/option>\u003coption value=\"1990-2009\">1990\u20132009\u003c/option>\u003coption value=\"2010plus\">2010+\u003c/option>\u003c/select>\u003cselect id=\"sort\">\u003coption value=\"source\">PDF order\u003c/option>\u003coption value=\"country\">Country A\u2013Z\u003c/option>\u003coption value=\"old\">Oldest book first\u003c/option>\u003coption value=\"new\">Newest book first\u003c/option>\u003coption value=\"title\">Title A\u2013Z\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"toolrow\">\u003cbutton class=\"btn primary\" onclick=\"openVisible()\">Open visible countries\u003c/button>\u003cbutton class=\"btn\" id=\"savedBtn\" onclick=\"toggleSavedFilter()\">\u2605 Saved only\u003c/button>\u003cbutton class=\"btn\" id=\"unreadBtn\" onclick=\"toggleUnreadFilter()\">Unread only\u003c/button>\u003cbutton class=\"btn\" onclick=\"randomUnread()\">Surprise me\u003c/button>\u003cbutton class=\"btn\" onclick=\"resetFilters()\">Reset\u003c/button>\u003c/div>\u003cdiv class=\"resultline\" id=\"resultline\">\u003c/div>\u003c/div>\n\u003cdiv class=\"country-list\" id=\"countryList\">\u003c/div>\u003c/section>\n\n\u003csection id=\"progress\">\u003cdiv class=\"section-head\">\u003ch2>Your reading layer\u003c/h2>\u003cp>Reading status and saved books are stored only in this browser using local storage; the HTML remains fully self-contained and works offline.\u003c/p>\u003c/div>\u003cdiv class=\"progress-wrap\">\u003carticle class=\"progress-card\">\u003ch3>Reading progress\u003c/h3>\u003cdiv class=\"bar\">\u003ci id=\"progressBar\">\u003c/i>\u003c/div>\u003cp id=\"progressText\">\u003c/p>\u003cbutton class=\"btn\" onclick=\"clearProgress()\">Clear my reading data\u003c/button>\u003c/article>\u003carticle class=\"progress-card\">\u003ch3>Saved queue\u003c/h3>\u003cdiv class=\"queue\" id=\"queue\">\u003c/div>\u003c/article>\u003c/div>\u003cdiv class=\"note\">This is a conversion of the earlier PDF, not a newly researched replacement. I have not silently added page counts, genres, ratings or other metadata that the PDF itself does not contain.\u003c/div>\u003c/section>\n\u003cdiv class=\"footer\">The World in Fiction \u2014 Interactive Edition \u00b7 source structure and book annotations preserved from the earlier PDF \u00b7 self-contained HTML, no internet connection required.\u003c/div>\n\u003c/main>\n\u003cscript>\nconst DATA=[{\"code\": \"USA\", \"country\": \"United States of America\", \"expected_count\": 10, \"intro\": \"American fiction is the literary heartbeat of a nation built on ambition, contradiction, and reinvention -- capturing the tension between the Dream and its dark underside. These ten novels span race, class, war, and the peculiar American genius for self-mythology.\", \"source_page\": 4, \"group\": \"Major world powers & significant nations\", \"extended\": true, \"books\": [{\"num\": 1, \"title\": \"To Kill a Mockingbird\", \"source_page\": 4, \"author\": \"Harper Lee\", \"year\": \"1960\", \"description\": \"Through Scout Finch's eyes in Depression-era Alabama, Lee anatomises racial injustice and moral courage. No novel better captures the nation's long struggle with race, law, and conscience.\", \"year_num\": 1960}, {\"num\": 2, \"title\": \"The Great Gatsby\", \"source_page\": 4, \"author\": \"F. Scott Fitzgerald\", \"year\": \"1925\", \"description\": \"The definitive novel of the American Dream's seductive illusion -- wealth, reinvention, the green light across the bay. Fitzgerald's Jazz Age portrait remains an unsurpassed diagnosis of American aspiration and its hollow core.\", \"year_num\": 1925}, {\"num\": 3, \"title\": \"Beloved\", \"source_page\": 4, \"author\": \"Toni Morrison\", \"year\": \"1987\", \"description\": \"A Nobel Prize-winning meditation on slavery's psychic aftermath. Morrison builds an almost unbearable portrait of trauma, memory, and survival that defines the African-American experience for the world.\", \"year_num\": 1987}, {\"num\": 4, \"title\": \"The Grapes of Wrath\", \"source_page\": 4, \"author\": \"John Steinbeck\", \"year\": \"1939\", \"description\": \"Steinbeck's Dust Bowl epic follows the Joad family's migration to California, laying bare class exploitation, the myth of the frontier, and the dignity of ordinary Americans crushed by economic forces.\", \"year_num\": 1939}, {\"num\": 5, \"title\": \"Moby-Dick\", \"source_page\": 4, \"author\": \"Herman Melville\", \"year\": \"1851\", \"description\": \"Ahab's mad pursuit of the White Whale is America's foundational obsession -- the individual will against an indifferent universe. The most encyclopaedic, ambiguous, and magnificent novel the country has produced.\", \"year_num\": 1851}, {\"num\": 6, \"title\": \"Invisible Man\", \"source_page\": 4, \"author\": \"Ralph Ellison\", \"year\": \"1952\", \"description\": \"An unnamed Black man moves through American society unseen. Ellison's novel -- a masterpiece of jazz-influenced prose -- is the defining account of race, identity, and the American promise of visibility denied.\", \"year_num\": 1952}, {\"num\": 7, \"title\": \"Their Eyes Were Watching God\", \"source_page\": 4, \"author\": \"Zora Neale Hurston\", \"year\": \"1937\", \"description\": \"Janie Crawford's journey toward selfhood in all-Black Florida towns is the great novel of Black women's inner life and the Harlem Renaissance's most lyrical achievement.\", \"year_num\": 1937}, {\"num\": 8, \"title\": \"Catch-22\", \"source_page\": 4, \"author\": \"Joseph Heller\", \"year\": \"1961\", \"description\": \"The American military-bureaucratic machine as absurdist comedy. Heller's WWII novel invented a new way of writing about war and institutional madness that has never been surpassed.\", \"year_num\": 1961}, {\"num\": 9, \"title\": \"Blood Meridian\", \"source_page\": 5, \"author\": \"Cormac McCarthy\", \"year\": \"1985\", \"description\": \"McCarthy's savage historical novel on the 1850s Texas-Mexico border is perhaps the most unflinching examination of American violence ever written -- a meditation on manifest destiny and human darkness.\", \"year_num\": 1985}, {\"num\": 10, \"title\": \"Adventures of Huckleberry Finn\", \"source_page\": 5, \"author\": \"Mark Twain\", \"year\": \"1884\", \"description\": \"Hemingway said all American literature comes from this one book. Huck and Jim floating the Mississippi is the nation's conscience in its purest form -- freedom, friendship, and the original sin of slavery.\", \"year_num\": 1884}]}, {\"code\": \"UK\", \"country\": \"United Kingdom\", \"expected_count\": 10, \"intro\": \"British fiction spans empire, class, war, and quiet domesticity -- a literature that invented the novel form and never stopped interrogating power and identity. These ten novels represent the sweep of that tradition.\", \"source_page\": 5, \"group\": \"Major world powers & significant nations\", \"extended\": true, \"books\": [{\"num\": 1, \"title\": \"1984\", \"source_page\": 5, \"author\": \"George Orwell\", \"year\": \"1949\", \"description\": \"Orwell's totalitarian nightmare -- surveillance, doublethink, the Ministry of Truth -- was forged from Britain's wartime experience. The world's most-read political novel and a permanent warning about state power.\", \"year_num\": 1949}, {\"num\": 2, \"title\": \"Middlemarch\", \"source_page\": 5, \"author\": \"George Eliot\", \"year\": \"1871\", \"description\": \"Widely considered the greatest English-language novel, Eliot's panoramic portrait of provincial life in reform-era England captures the aspirations and constraints of Victorian society with extraordinary precision.\", \"year_num\": 1871}, {\"num\": 3, \"title\": \"Bleak House\", \"source_page\": 5, \"author\": \"Charles Dickens\", \"year\": \"1852\", \"description\": \"Dickens used the interminable case of Jarndyce v Jarndyce to savage England's legal system, class structure, and hollow philanthropy -- a fog-shrouded masterpiece of social critique.\", \"year_num\": 1852}, {\"num\": 4, \"title\": \"Jane Eyre\", \"source_page\": 5, \"author\": \"Charlotte Bronte\", \"year\": \"1847\", \"description\": \"The first great novel of female interiority in English -- a governess asserting her moral and psychological equality against class and patriarchy. Victorian England's social hierarchy made viscerally personal.\", \"year_num\": 1847}, {\"num\": 5, \"title\": \"Wuthering Heights\", \"source_page\": 5, \"author\": \"Emily Bronte\", \"year\": \"1847\", \"description\": \"A Gothic love story set on the Yorkshire moors, Heathcliff and Catherine's destructive passion is the dark underside of Romanticism -- and one of the most original novels in any language.\", \"year_num\": 1847}, {\"num\": 6, \"title\": \"Mrs Dalloway\", \"source_page\": 5, \"author\": \"Virginia Woolf\", \"year\": \"1925\", \"description\": \"A single June day in post-WWI London. Woolf's stream-of-consciousness masterpiece invented interiority in the novel and captured the haunted quality of a civilisation that had survived the trenches.\", \"year_num\": 1925}, {\"num\": 7, \"title\": \"Never Let Me Go\", \"source_page\": 6, \"author\": \"Kazuo Ishiguro\", \"year\": \"2005\", \"description\": \"Set in an alternate England, Ishiguro's haunting novel uses clones bred for organ donation to explore memory, mortality, and the human capacity for passive acceptance of injustice.\", \"year_num\": 2005}, {\"num\": 8, \"title\": \"Brave New World\", \"source_page\": 6, \"author\": \"Aldous Huxley\", \"year\": \"1932\", \"description\": \"Where Orwell feared the boot on the face, Huxley feared a world of pleasure and distraction so total that freedom becomes unimaginable. Written in 1931, it describes the 21st century with eerie precision.\", \"year_num\": 1932}, {\"num\": 9, \"title\": \"Atonement\", \"source_page\": 6, \"author\": \"Ian McEwan\", \"year\": \"2001\", \"description\": \"A teenage girl's false accusation destroys three lives across WWII and its aftermath. McEwan's meditation on fiction, guilt, and the stories we tell about the past is the finest British novel of this century so far.\", \"year_num\": 2001}, {\"num\": 10, \"title\": \"Things Fall Apart\", \"source_page\": 6, \"author\": \"Chinua Achebe\", \"year\": \"1958\", \"description\": \"Written from Nigeria under British colonial rule, Achebe's novel is the essential counter-narrative to the colonial canon. Included here for its explicit, defining conversation with the British literary tradition.\", \"year_num\": 1958}]}, {\"code\": \"RUS\", \"country\": \"Russia\", \"expected_count\": 25, \"intro\": \"Russian literature occupies its own continent -- vast, soul-searching, and obsessed with suffering, redemption, and the collision of the individual with historical cataclysm. These 25 novels and novellas represent the full range of the tradition: from the 19th-century giants who defined the novel, through the Soviet era's literature of resistance and survival, to the 20th-century emigres who carried the flame abroad.\", \"source_page\": 6, \"group\": \"Major world powers & significant nations\", \"extended\": true, \"books\": [{\"num\": 1, \"title\": \"War and Peace\", \"source_page\": 6, \"author\": \"Leo Tolstoy\", \"year\": \"1869\", \"description\": \"Tolstoy's chronicle of Napoleonic Russia is not merely a novel but a philosophy of history -- five aristocratic families measured against the tidal forces of war and fate. The Russian soul in one book.\", \"year_num\": 1869}, {\"num\": 2, \"title\": \"The Brothers Karamazov\", \"source_page\": 6, \"author\": \"Fyodor Dostoevsky\", \"year\": \"1880\", \"description\": \"Russia's spiritual and moral wrestling match in novelistic form. Through three brothers, Dostoevsky debates God, murder, free will, and the Russian character -- Freud called it the greatest novel ever written.\", \"year_num\": 1880}, {\"num\": 3, \"title\": \"Anna Karenina\", \"source_page\": 6, \"author\": \"Leo Tolstoy\", \"year\": \"1878\", \"description\": \"The novel that Nabokov taught as the greatest ever written. Anna's tragedy is not a morality tale but a study of a society that destroys those who feel too much -- Tolstoy's most complete, compassionate work.\", \"year_num\": 1878}, {\"num\": 4, \"title\": \"Crime and Punishment\", \"source_page\": 7, \"author\": \"Fyodor Dostoevsky\", \"year\": \"1866\", \"description\": \"Raskolnikov murders a pawnbroker to prove his Napoleonic exceptionalism and is destroyed by his own conscience. Dostoevsky's psychological thriller invented the modern thriller and probed guilt more deeply than any other novel.\", \"year_num\": 1866}, {\"num\": 5, \"title\": \"The Master and Margarita\", \"source_page\": 7, \"author\": \"Mikhail Bulgakov\", \"year\": \"1967\", \"description\": \"The Devil visits Stalin-era Moscow. Bulgakov's satirical fantasy is the definitive literary indictment of Soviet bureaucracy and censorship, written in secret and published 27 years after his death.\", \"year_num\": 1967}, {\"num\": 6, \"title\": \"Doctor Zhivago\", \"source_page\": 7, \"author\": \"Boris Pasternak\", \"year\": \"1957\", \"description\": \"Banned in the USSR, awarded the Nobel Prize, smuggled out on microfilm -- Pasternak's epic of love across the Russian Revolution and Civil War is inseparable from Russia's 20th-century tragedy.\", \"year_num\": 1957}, {\"num\": 7, \"title\": \"One Day in the Life of Ivan Denisovich\", \"source_page\": 7, \"author\": \"Alexander Solzhenitsyn\", \"year\": \"1962\", \"description\": \"The single day of a Gulag prisoner becomes an entire civilisation's indictment. This slim novel cracked the Soviet Union's self-mythology and told Russians what their system really was.\", \"year_num\": 1962}, {\"num\": 8, \"title\": \"Dead Souls\", \"source_page\": 7, \"author\": \"Nikolai Gogol\", \"year\": \"1842\", \"description\": \"Chichikov travels provincial Russia buying the names of dead serfs to use as collateral. Gogol's satirical picaresque is the first great Russian novel and an indictment of bureaucracy, greed, and the absurdity of serfdom.\", \"year_num\": 1842}, {\"num\": 9, \"title\": \"The Idiot\", \"source_page\": 7, \"author\": \"Fyodor Dostoevsky\", \"year\": \"1869\", \"description\": \"Prince Myshkin -- Christ-like, epileptic, guileless -- enters St Petersburg society and is destroyed by it. Dostoevsky's meditation on goodness in a corrupt world is among his most personal and painful achievements.\", \"year_num\": 1869}, {\"num\": 10, \"title\": \"Fathers and Sons\", \"source_page\": 7, \"author\": \"Ivan Turgenev\", \"year\": \"1862\", \"description\": \"Bazarov, the first nihilist in literature, returns home and collides with the old generation. Turgenev's novel captured the generational clash that was about to convulse Russia -- and coined the word 'nihilism' for the world.\", \"year_num\": 1862}, {\"num\": 11, \"title\": \"A Hero of Our Time\", \"source_page\": 7, \"author\": \"Mikhail Lermontov\", \"year\": \"1840\", \"description\": \"Pechorin -- cold, brilliant, destructive -- is Russia's first Byronic anti-hero and the prototype for superfluous men in Turgenev, Dostoevsky, and Chekhov. The first Russian psychological novel.\", \"year_num\": 1840}, {\"num\": 12, \"title\": \"Petersburg\", \"source_page\": 7, \"author\": \"Andrei Bely\", \"year\": \"1913\", \"description\": \"A senator's son is given a bomb to assassinate his father. Bely's hallucinatory novel of pre-revolutionary St Petersburg is the most formally radical work in Russian literature -- its city as fog and terror.\", \"year_num\": 1913}, {\"num\": 13, \"title\": \"Life and Fate\", \"source_page\": 8, \"author\": \"Vasily Grossman\", \"year\": \"1980\", \"description\": \"Called the Soviet War and Peace. Grossman's massive novel -- set at Stalingrad and in the death camps -- directly compares Nazism and Stalinism, which is why the KGB arrested the manuscript itself.\", \"year_num\": 1980}, {\"num\": 14, \"title\": \"We\", \"source_page\": 8, \"author\": \"Yevgeny Zamyatin\", \"year\": \"1924\", \"description\": \"The first great dystopian novel, written in 1920 and banned in the USSR. Zamyatin's glass-city surveillance state directly inspired both Huxley's Brave New World and Orwell's 1984.\", \"year_num\": 1924}, {\"num\": 15, \"title\": \"The Foundation Pit\", \"source_page\": 8, \"author\": \"Andrei Platonov\", \"year\": \"1987\", \"description\": \"Workers dig a pit for a communal building that will never be built. Platonov's novella -- written 1930, published 57 years later -- is the most devastating portrait of Soviet collectivisation's human cost.\", \"year_num\": 1987}, {\"num\": 16, \"title\": \"Oblomov\", \"source_page\": 8, \"author\": \"Ivan Goncharov\", \"year\": \"1859\", \"description\": \"Oblomov cannot get out of bed. Goncharov's portrait of total inertia is both a comic masterpiece and a devastating critique of the Russian gentry -- 'Oblomovism' became a national diagnosis.\", \"year_num\": 1859}, {\"num\": 17, \"title\": \"The First Circle\", \"source_page\": 8, \"author\": \"Alexander Solzhenitsyn\", \"year\": \"1968\", \"description\": \"Prisoners in a sharashka (privileged Gulag research lab) face a choice: collaborate or return to the camps. Solzhenitsyn's most intellectually rich novel is the Soviet system's soul on the operating table.\", \"year_num\": 1968}, {\"num\": 18, \"title\": \"Quiet Flows the Don\", \"source_page\": 8, \"author\": \"Mikhail Sholokhov\", \"year\": \"1928-1940\", \"description\": \"The Cossack Grigory Melekhov across WWI, Revolution, and Civil War. Sholokhov's epic is the last great realist novel of the Russian tradition and the only Soviet-era Nobel winner that genuinely earned the prize.\", \"year_num\": 1928}, {\"num\": 19, \"title\": \"Lolita\", \"source_page\": 8, \"author\": \"Vladimir Nabokov\", \"year\": \"1955\", \"description\": \"Humbert Humbert's predatory obsession with a twelve-year-old girl is rendered in the most gorgeous prose in the English language. Written by a Russian in English, Lolita is both Nabokov's double exile and his conquest.\", \"year_num\": 1955}, {\"num\": 20, \"title\": \"The Gift\", \"source_page\": 8, \"author\": \"Vladimir Nabokov\", \"year\": \"1937\", \"description\": \"Nabokov's last Russian-language novel -- a young emigre poet in Berlin writing a life of Chernyshevsky. The most personal distillation of the Russian literary tradition by the man who both loved and escaped it.\", \"year_num\": 1937}, {\"num\": 21, \"title\": \"Chevengur\", \"source_page\": 8, \"author\": \"Andrei Platonov\", \"year\": \"1988\", \"description\": \"Revolutionaries build a utopian commune and wait for communism to arrive on its own. Platonov's surreal novel -- suppressed for six decades -- is the most original and heartbreaking vision of the Bolshevik dream.\", \"year_num\": 1988}, {\"num\": 22, \"title\": \"The Road to Calvary\", \"source_page\": 9, \"author\": \"Alexei Tolstoy\", \"year\": \"1920-1941\", \"description\": \"A trilogy following two St Petersburg families through WWI, Revolution, and Civil War. Alexei Tolstoy's epic is the Soviet regime's most ambitious attempt to write its own War and Peace -- and largely succeeds.\", \"year_num\": 1920}, {\"num\": 23, \"title\": \"The Enchanted Wanderer\", \"source_page\": 9, \"author\": \"Nikolai Leskov\", \"year\": \"1873\", \"description\": \"Ivan Flyagin's picaresque adventures across the Russian steppe -- a soldier, a horse trader, a monk. Leskov's kaleidoscopic novel captures the rootless Russian soul and the vastness of the empire with unique vitality.\", \"year_num\": 1873}, {\"num\": 24, \"title\": \"Red Cavalry\", \"source_page\": 9, \"author\": \"Isaac Babel\", \"year\": \"1926\", \"description\": \"Babel's cycle of stories from the 1920 Soviet-Polish War -- a Jewish intellectual among Cossack cavalry -- is the most honest account of revolutionary violence ever written by a true believer in the revolution.\", \"year_num\": 1926}, {\"num\": 25, \"title\": \"The Adolescent\", \"source_page\": 9, \"author\": \"Fyodor Dostoevsky\", \"year\": \"1875\", \"description\": \"Arkady Dolgoruky, the illegitimate son of a dissolute noble, seeks his identity and a fortune. The least-read of Dostoevsky's five major novels is among his most intimate -- the story of a Russia between certainties.\", \"year_num\": 1875}]}, {\"code\": \"FRA\", \"country\": \"France\", \"expected_count\": 5, \"intro\": \"French literature invented Realism, gave birth to Existentialism, and has never stopped interrogating liberty, reason, and what it means to be modern.\", \"source_page\": 10, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Les Miserables\", \"source_page\": 10, \"author\": \"Victor Hugo\", \"year\": \"1862\", \"description\": \"Hugo's titanic novel -- Jean Valjean pursued across decades of revolutionary France -- is at once a social manifesto, a love story, and a theological argument. No book captures the French soul's belief in justice more powerfully.\", \"year_num\": 1862}, {\"num\": 2, \"title\": \"Madame Bovary\", \"source_page\": 10, \"author\": \"Gustave Flaubert\", \"year\": \"1857\", \"description\": \"The birth of literary Realism. Flaubert's provincial doctor's wife -- destroyed by romantic illusions and a suffocating bourgeois world -- put France's middle class on the page with surgical, merciless clarity.\", \"year_num\": 1857}, {\"num\": 3, \"title\": \"The Stranger\", \"source_page\": 10, \"author\": \"Albert Camus\", \"year\": \"1942\", \"description\": \"Meursault kills a man under the Algerian sun and feels nothing. Camus's Absurdist parable defines Existentialism for the world and poses the defining question: does life have meaning?\", \"year_num\": 1942}, {\"num\": 4, \"title\": \"In Search of Lost Time\", \"source_page\": 10, \"author\": \"Marcel Proust\", \"year\": \"1913-1927\", \"description\": \"The longest novel ever written is also among the most intimate -- a seven-volume excavation of memory, time, and Belle Epoque French society that gave Europe's aristocracy its final, glittering flourish before WWI.\", \"year_num\": 1913}, {\"num\": 5, \"title\": \"Germinal\", \"source_page\": 10, \"author\": \"Emile Zola\", \"year\": \"1885\", \"description\": \"The greatest novel of labour and class war. Zola descended into the mines of northern France for research; the result is a ferocious portrait of industrial exploitation that shaped socialist movements across Europe.\", \"year_num\": 1885}]}, {\"code\": \"GER\", \"country\": \"Germany\", \"expected_count\": 5, \"intro\": \"German literature is shaped by catastrophe and conscience -- two world wars, the Holocaust, and reunification have produced fiction that confronts collective guilt with extraordinary moral seriousness.\", \"source_page\": 11, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Tin Drum\", \"source_page\": 11, \"author\": \"Gunter Grass\", \"year\": \"1959\", \"description\": \"Oskar Matzerath decides at age three to stop growing and beats his tin drum through the rise of Nazism and WWII. Grass's grotesque masterpiece forced Germany to confront what it had done -- and become.\", \"year_num\": 1959}, {\"num\": 2, \"title\": \"All Quiet on the Western Front\", \"source_page\": 11, \"author\": \"Erich Maria Remarque\", \"year\": \"1929\", \"description\": \"The most devastating anti-war novel ever written -- Paul Baumer's WWI trench experience stripped of all glory. Burned by the Nazis in 1933, it remains the definitive account of the generation the war annihilated.\", \"year_num\": 1929}, {\"num\": 3, \"title\": \"The Reader\", \"source_page\": 11, \"author\": \"Bernhard Schlink\", \"year\": \"1995\", \"description\": \"A teenage boy's affair with an older woman becomes a moral earthquake when he discovers she was a Nazi guard. Schlink captures Germany's post-war generation's impossible reckoning with their parents' complicity.\", \"year_num\": 1995}, {\"num\": 4, \"title\": \"Steppenwolf\", \"source_page\": 11, \"author\": \"Hermann Hesse\", \"year\": \"1927\", \"description\": \"Harry Haller -- half-man, half-wolf -- wanders Weimar Republic Germany in existential crisis. Hesse's hallucinatory novel of alienation became the counterculture's bible across generations.\", \"year_num\": 1927}, {\"num\": 5, \"title\": \"The Emigrants\", \"source_page\": 11, \"author\": \"W. G. Sebald\", \"year\": \"1992\", \"description\": \"Four   Jewish   emigrants     displaced   by   the   20th   century's   upheavals.   Sebald's   hypnotic prose-photograph hybrid invented a new genre and enshrined memory and loss as Germany's inescapable literary preoccupations.\", \"year_num\": 1992}]}, {\"code\": \"CHN\", \"country\": \"China\", \"expected_count\": 5, \"intro\": \"Chinese fiction spans three thousand years -- from dynastic epics to Cultural Revolution trauma to science fiction that imagines humanity's cosmic future.\", \"source_page\": 12, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Dream of the Red Chamber\", \"source_page\": 12, \"author\": \"Cao Xueqin\", \"year\": \"1791\", \"description\": \"China's greatest novel follows the decline of an aristocratic clan. An encyclopaedia of Qing Dynasty society -- its food, fashion, poetry, and politics -- in one vast tapestry.\", \"year_num\": 1791}, {\"num\": 2, \"title\": \"To Live\", \"source_page\": 12, \"author\": \"Yu Hua\", \"year\": \"1993\", \"description\": \"Fugui survives the Civil War, the Great Leap Forward, and the Cultural Revolution, losing everyone he loves. Yu Hua's spare, devastating novel contains the entire arc of modern Chinese history in a single peasant's life.\", \"year_num\": 1993}, {\"num\": 3, \"title\": \"The Three-Body Problem\", \"source_page\": 12, \"author\": \"Liu Cixin\", \"year\": \"2008\", \"description\": \"Beginning during the Cultural Revolution and expanding to humanity's first contact with an alien civilisation, Liu's trilogy is both a portrait of China's traumatic 20th century and the most ambitious science fiction in any language.\", \"year_num\": 2008}, {\"num\": 4, \"title\": \"Red Sorghum\", \"source_page\": 12, \"author\": \"Mo Yan\", \"year\": \"1987\", \"description\": \"The Nobel laureate's multigenerational saga of a Shandong family across the Japanese occupation blends myth, violence, and sensory intensity into a style that defines Chinese Magical Realism.\", \"year_num\": 1987}, {\"num\": 5, \"title\": \"Fortress Besieged\", \"source_page\": 12, \"author\": \"Qian Zhongshu\", \"year\": \"1947\", \"description\": \"China's wittiest novel -- its marriage-as-fortress metaphor captures the educated Chinese caught between tradition and modernity in the turbulent 1930s with savage comic precision.\", \"year_num\": 1947}]}, {\"code\": \"JPN\", \"country\": \"Japan\", \"expected_count\": 5, \"intro\": \"Japanese literature moves between the aesthetic -- ma (negative space), mono no aware (pathos of things) -- and the traumatic, with Hiroshima, modernisation, and isolation recurring as its deepest wounds.\", \"source_page\": 13, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Snow Country\", \"source_page\": 13, \"author\": \"Yasunari Kawabata\", \"year\": \"1956\", \"description\": \"Kawabata's Nobel Prize-winning haiku-like novel -- a Tokyo dilettante and a mountain hot-spring geisha -- renders the Japanese aesthetic of impermanence and beauty as something felt rather than read.\", \"year_num\": 1956}, {\"num\": 2, \"title\": \"The Wind-Up Bird Chronicle\", \"source_page\": 13, \"author\": \"Haruki Murakami\", \"year\": \"1994\", \"description\": \"A missing cat spirals into Japan's suppressed wartime history in Manchuria. Murakami's dreamlike novel is both Tokyo suburban life at its most surreal and Japan's most honest reckoning with its 20th-century violence.\", \"year_num\": 1994}, {\"num\": 3, \"title\": \"No Longer Human\", \"source_page\": 13, \"author\": \"Osamu Dazai\", \"year\": \"1948\", \"description\": \"Dazai's semi-autobiographical novel -- a man who cannot connect with humanity -- was written just before his suicide and reads as Japan's confession: the mask worn in society, the abyss beneath.\", \"year_num\": 1948}, {\"num\": 4, \"title\": \"Black Rain\", \"source_page\": 13, \"author\": \"Masuji Ibuse\", \"year\": \"1966\", \"description\": \"The most compassionate novel about Hiroshima -- told through survivor testimonies assembled by a man trying to find his niece a husband despite radiation stigma. No book honours the bomb survivors more fully.\", \"year_num\": 1966}, {\"num\": 5, \"title\": \"Kokoro\", \"source_page\": 13, \"author\": \"Soseki Natsume\", \"year\": \"1914\", \"description\": \"A young man's relationship with a solitary, guilt-haunted older man (Sensei) who carries a secret. Soseki's masterwork is the novel of Meiji Japan's moral transition -- the old world ending and the new not yet born.\", \"year_num\": 1914}]}, {\"code\": \"IND\", \"country\": \"India\", \"expected_count\": 25, \"intro\": \"Indian fiction, shaped by Partition, caste, colonial inheritance, and extraordinary linguistic diversity, has produced some of the 20th and 21st century's most urgent voices. These 25 novels represent literature in English and major regional languages, spanning a century of the subcontinent's turbulent becoming.\", \"source_page\": 13, \"group\": \"Major world powers & significant nations\", \"extended\": true, \"books\": [{\"num\": 1, \"title\": \"A Fine Balance\", \"source_page\": 13, \"author\": \"Rohinton Mistry\", \"year\": \"1995\", \"description\": \"Set during Indira Gandhi's Emergency (1975-77), four characters across India's social spectrum share a Bombay apartment. Mistry's Dickensian masterpiece is the most complete portrait of modern India's cruelties and kindnesses.\", \"year_num\": 1995}, {\"num\": 2, \"title\": \"Midnight's Children\", \"source_page\": 13, \"author\": \"Salman Rushdie\", \"year\": \"1981\", \"description\": \"Saleem Sinai, born at the exact moment of Indian independence, is telepathically linked to all children born that midnight. Rushdie's Booker Prize winner is post-colonial India's founding myth retold as magical, irreverent history.\", \"year_num\": 1981}, {\"num\": 3, \"title\": \"The God of Small Things\", \"source_page\": 14, \"author\": \"Arundhati Roy\", \"year\": \"1997\", \"description\": \"Roy's debut -- a Syrian Christian family in Kerala, a forbidden love across caste lines -- captures India's caste system, communism, and postcolonial psychology with prose of shattering beauty.\", \"year_num\": 1997}, {\"num\": 4, \"title\": \"A Suitable Boy\", \"source_page\": 14, \"author\": \"Vikram Seth\", \"year\": \"1993\", \"description\": \"At 1,500 pages, Seth's novel of a mother seeking her daughter's husband across newly independent India is the great panoramic novel of the subcontinent -- Hindu-Muslim tensions, land reform, and the birth of a democracy.\", \"year_num\": 1993}, {\"num\": 5, \"title\": \"The White Tiger\", \"source_page\": 14, \"author\": \"Aravind Adiga\", \"year\": \"2008\", \"description\": \"Balram Halwai's rise from rural Bihar to Bangalore entrepreneur through murder is India's darkest, funniest self-portrait -- the 21st century's answer to caste, class, and the economic miracle's underside.\", \"year_num\": 2008}, {\"num\": 6, \"title\": \"Train to Pakistan\", \"source_page\": 14, \"author\": \"Khushwant Singh\", \"year\": \"1956\", \"description\": \"The Partition of 1947 arrives in the village of Mano Majra on the Indo-Pakistan border. Singh's slim novel is the most visceral fictional account of the subcontinent's bloodiest wound -- still essential 70 years on.\", \"year_num\": 1956}, {\"num\": 7, \"title\": \"The Shadow Lines\", \"source_page\": 14, \"author\": \"Amitav Ghosh\", \"year\": \"1988\", \"description\": \"A Calcutta family's connections to London and Dhaka across WWII and the communal riots of 1964. Ghosh's novel interrogates memory, nationalism, and the arbitrary violence of borders with unique intellectual tenderness.\", \"year_num\": 1988}, {\"num\": 8, \"title\": \"The Inheritance of Loss\", \"source_page\": 14, \"author\": \"Kiran Desai\", \"year\": \"2006\", \"description\": \"A retired judge in the Himalayas, his granddaughter, and her undocumented immigrant cook in New York. Desai's Booker Prize winner is the most unflinching portrait of globalisation's human cost from an Indian perspective.\", \"year_num\": 2006}, {\"num\": 9, \"title\": \"Interpreter of Maladies\", \"source_page\": 14, \"author\": \"Jhumpa Lahiri\", \"year\": \"1999\", \"description\": \"Lahiri's Pulitzer Prize-winning story collection captures the Indian diaspora's dislocation -- caught between a homeland becoming memory and an America that will never fully receive them. The definitive immigrant literature.\", \"year_num\": 1999}, {\"num\": 10, \"title\": \"Untouchable\", \"source_page\": 14, \"author\": \"Mulk Raj Anand\", \"year\": \"1935\", \"description\": \"A single day in the life of Bakha, a sweeper (latrine cleaner) in colonial India. Anand's novel -- introduced by E.M. Forster -- is the first great literary indictment of untouchability, written when Gandhiji was still alive.\", \"year_num\": 1935}, {\"num\": 11, \"title\": \"The Guide\", \"source_page\": 14, \"author\": \"R. K. Narayan\", \"year\": \"1960\", \"description\": \"Raju the tour guide becomes a criminal, then a reluctant saint. Narayan's Sahitya Akademi Award winner set in the fictional Malgudi is both a meditation on modern India's spiritual confusion and its funniest serious novel.\", \"year_num\": 1960}, {\"num\": 12, \"title\": \"Such a Long Journey\", \"source_page\": 15, \"author\": \"Rohinton Mistry\", \"year\": \"1991\", \"description\": \"Gustad Noble -- Parsi bank clerk in Bombay -- is caught in the conspiracy and chaos of Indira Gandhi's Bangladesh War period. Mistry's debut is the essential portrait of Parsi Mumbai at its beleaguered, dignified best.\", \"year_num\": 1991}, {\"num\": 13, \"title\": \"Sea of Poppies\", \"source_page\": 15, \"author\": \"Amitav Ghosh\", \"year\": \"2008\", \"description\": \"The first volume of Ghosh's Ibis Trilogy set the opium trade of the 1830s -- from Bihar's poppy fields to the convict ships to Mauritius. The most ambitious historical fiction about the British Empire in Indian literature.\", \"year_num\": 2008}, {\"num\": 14, \"title\": \"The Moor's Last Sigh\", \"source_page\": 15, \"author\": \"Salman Rushdie\", \"year\": \"1995\", \"description\": \"The Zogoiby family across generations of Bombay -- Jewish-Catholic-Hindu spice merchants whose decline mirrors India's -- is Rushdie's most exuberant, grief-stricken portrait of the city that shaped him.\", \"year_num\": 1995}, {\"num\": 15, \"title\": \"English, August\", \"source_page\": 15, \"author\": \"Upamanyu Chatterjee\", \"year\": \"1988\", \"description\": \"Agastya Sen, an Indian Administrative Service officer posted to a small UP town, spends a year in bemused, stoned incomprehension. The definitive novel of the educated Indian's absurd relationship with the state.\", \"year_num\": 1988}, {\"num\": 16, \"title\": \"Samskara\", \"source_page\": 15, \"author\": \"U. R. Ananthamurthy\", \"year\": \"1965\", \"description\": \"A Brahmin scholar in a Karnataka agrahara must decide whether to perform death rites for an outcast. Ananthamurthy's Kannada novella is the most philosophically searching interrogation of the caste system in any Indian language.\", \"year_num\": 1965}, {\"num\": 17, \"title\": \"Chemmeen\", \"source_page\": 15, \"author\": \"Thakazhi Sivasankara Pillai\", \"year\": \"1956\", \"description\": \"A fisherman's daughter from Kerala falls in love across community lines. Thakazhi's Malayalam novel -- the single most widely read Indian regional language work -- is the fisher community's Iliad, heartbreaking and tidal.\", \"year_num\": 1956}, {\"num\": 18, \"title\": \"Raag Darbari\", \"source_page\": 15, \"author\": \"Shrilal Shukla\", \"year\": \"1968\", \"description\": \"A government officer returns to his village in UP and finds bureaucracy, corruption, and political cynicism in their most absurd forms. Shukla's satirical Hindi novel is the definitive portrait of post-independence rural India.\", \"year_num\": 1968}, {\"num\": 19, \"title\": \"The Vendor of Sweets\", \"source_page\": 15, \"author\": \"R. K. Narayan\", \"year\": \"1967\", \"description\": \"Jagan the sweet-seller and his Americanised son: tradition versus modernity, India versus the West. Narayan distils the entire tension of post-colonial Indian society into a small, perfect tragicomedy.\", \"year_num\": 1967}, {\"num\": 20, \"title\": \"A Passage to India\", \"source_page\": 15, \"author\": \"E. M. Forster\", \"year\": \"1924\", \"description\": \"An Englishman in colonial India, a Marabar Cave incident, a criminal trial. Forster's novel -- written by an outsider -- is paradoxically the most honest English-language account of India under empire and what it did to both sides.\", \"year_num\": 1924}, {\"num\": 21, \"title\": \"Tamas\", \"source_page\": 16, \"author\": \"Bhisham Sahni\", \"year\": \"1974\", \"description\": \"Darkness -- the meaning of the Hindi title -- falls over a North Indian town during Partition. Sahni's Hindi novel, based partly on family memory, is the subcontinent's most unflinching Partition novel after Singh's.\", \"year_num\": 1974}, {\"num\": 22, \"title\": \"The Space Between Us\", \"source_page\": 16, \"author\": \"Thrity Umrigar\", \"year\": \"2006\", \"description\": \"A wealthy Parsi woman and her Hindu servant navigate the gulf of class, caste, and domestic intimacy in modern Bombay. Umrigar's novel is the most searching examination of what India's class divide does to women on both sides.\", \"year_num\": 2006}, {\"num\": 23, \"title\": \"Nectar in a Sieve\", \"source_page\": 16, \"author\": \"Kamala Markandaya\", \"year\": \"1954\", \"description\": \"Rukmani's life as a tenant farmer -- drought, industrial encroachment, the loss of children -- is an elegy for rural India's way of life written at the very moment modernisation was destroying it.\", \"year_num\": 1954}, {\"num\": 24, \"title\": \"The In-Between World of Vikram Lall\", \"source_page\": 16, \"author\": \"M. G. Vassanji\", \"year\": \"2003\", \"description\": \"A Kenyan-Indian family across Kenya's independence and corruption -- the Indian diaspora's most underexplored     literary   territory.   Vassanji's   Giller   Prize   winner   is   the   third   side   of   the India-Britain-Africa colonial triangle.\", \"year_num\": 2003}, {\"num\": 25, \"title\": \"The Lives of Others\", \"source_page\": 16, \"author\": \"Neel Mukherjee\", \"year\": \"2014\", \"description\": \"A Calcutta joint family's disintegration in the 1960s-70s, with a Naxalite rebellion subplot. Mukherjee's Booker-shortlisted novel captures the moral and political crises of Bengal with uncompromising intensity.\", \"year_num\": 2014}]}, {\"code\": \"BRA\", \"country\": \"Brazil\", \"expected_count\": 5, \"intro\": \"Brazilian literature mixes African, Indigenous, and European legacies into a distinctly tropical imagination that gave the world a distinctive literary voice.\", \"source_page\": 17, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Posthumous Memoirs of Bras Cubas\", \"source_page\": 17, \"author\": \"Machado de Assis\", \"year\": \"1881\", \"description\": \"A dead man narrates his own pointless life. Machado's novel, written by a Black Brazilian in Rio, invented a sardonic postmodern voice 100 years early and is now recognised as a world masterpiece.\", \"year_num\": 1881}, {\"num\": 2, \"title\": \"The Devil to Pay in the Backlands\", \"source_page\": 17, \"author\": \"Joao Guimaraes Rosa\", \"year\": \"1956\", \"description\": \"A bandit chief's confessional monologue across the Sertao meditates on good, evil, and God in invented language of such richness that Guimaraes Rosa is Brazil's greatest prose stylist.\", \"year_num\": 1956}, {\"num\": 3, \"title\": \"Gabriela, Clove and Cinnamon\", \"source_page\": 17, \"author\": \"Jorge Amado\", \"year\": \"1958\", \"description\": \"Set in 1920s Bahia, Amado's sensuous novel captures Brazil's racial mixing, its African heritage, and the slow dissolution of patriarchal power in a cacao-boom town.\", \"year_num\": 1958}, {\"num\": 4, \"title\": \"The Alchemist\", \"source_page\": 17, \"author\": \"Paulo Coelho\", \"year\": \"1988\", \"description\": \"The most-translated book by a living author. Coelho's fable of an Andalusian shepherd's journey encapsulates Brazil's spiritual syncretism and the universal longing for Personal Legend.\", \"year_num\": 1988}, {\"num\": 5, \"title\": \"City of God\", \"source_page\": 17, \"author\": \"Paulo Lins\", \"year\": \"1997\", \"description\": \"Lins grew up in the Rio favela he wrote about. This documentary-novel of drug gang warfare and police violence is the essential account of Brazil's urban underclass and the real cost of inequality.\", \"year_num\": 1997}]}, {\"code\": \"COL\", \"country\": \"Colombia\", \"expected_count\": 5, \"intro\": \"Colombia's literature is defined by Garcia Marquez's Magical Realism -- a way of seeing that transforms political violence, isolation, and tropical heat into myth.\", \"source_page\": 18, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"One Hundred Years of Solitude\", \"source_page\": 18, \"author\": \"Gabriel Garcia Marquez\", \"year\": \"1967\", \"description\": \"The Buendia family's seven-generation saga in the mythical Macondo is Latin America's Bible -- Colombian civil wars, banana company massacres, and history dissolved into magical, irresistible prose.\", \"year_num\": 1967}, {\"num\": 2, \"title\": \"Love in the Time of Cholera\", \"source_page\": 18, \"author\": \"Gabriel Garcia Marquez\", \"year\": \"1985\", \"description\": \"Florentino Ariza waits 51 years for Fermina Daza. Garcia Marquez sets this love story in Cartagena as it modernises -- river boats, telegraphs, and the end of the old Caribbean world.\", \"year_num\": 1985}, {\"num\": 3, \"title\": \"The Armies\", \"source_page\": 18, \"author\": \"Evelio Rosero\", \"year\": \"2007\", \"description\": \"A retired teacher in a Colombian village watches guerrillas, paramilitaries, and the army tear his community apart. Rosero's spare, terrifying novel is the essential account of Colombia's 60-year internal conflict.\", \"year_num\": 2007}, {\"num\": 4, \"title\": \"No One Writes to the Colonel\", \"source_page\": 18, \"author\": \"Gabriel Garcia Marquez\", \"year\": \"1961\", \"description\": \"A retired colonel waits fifteen years for a pension that never comes. This perfectly compressed novella captures the slow violence of bureaucracy, poverty, and dignity under siege.\", \"year_num\": 1961}, {\"num\": 5, \"title\": \"Our Lady of the Assassins\", \"source_page\": 18, \"author\": \"Fernando Vallejo\", \"year\": \"1994\", \"description\": \"A writer returns to Medellin at the height of the drug wars. Vallejo's furious novella is Medellin's violence made literary -- uncomfortable and essential.\", \"year_num\": 1994}]}, {\"code\": \"ZAF\", \"country\": \"South Africa\", \"expected_count\": 5, \"intro\": \"South African literature is written in the shadow of apartheid and its aftermath -- a literature of moral reckoning, land, and the long, unfinished work of becoming a nation.\", \"source_page\": 19, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Disgrace\", \"source_page\": 19, \"author\": \"J. M. Coetzee\", \"year\": \"1999\", \"description\": \"A Cape Town professor's retreat to his daughter's Eastern Cape farm, where history settles its accounts violently. Coetzee's Booker Prize winner is post-apartheid South Africa's most searching self-examination.\", \"year_num\": 1999}, {\"num\": 2, \"title\": \"Cry, the Beloved Country\", \"source_page\": 19, \"author\": \"Alan Paton\", \"year\": \"1948\", \"description\": \"Written the year the National Party came to power, Paton's novel of a Zulu pastor searching for his son in Johannesburg became the world's introduction to apartheid -- a lament for a beautiful land being destroyed.\", \"year_num\": 1948}, {\"num\": 3, \"title\": \"July's People\", \"source_page\": 19, \"author\": \"Nadine Gordimer\", \"year\": \"1981\", \"description\": \"In an imagined near-future revolution, a white liberal family takes refuge with their Black servant July. Gordimer's disquieting novel dismantles the comfortable myths white South Africans told themselves.\", \"year_num\": 1981}, {\"num\": 4, \"title\": \"Triomf\", \"source_page\": 19, \"author\": \"Marlene van Niekerk\", \"year\": \"1994\", \"description\": \"Set in the white Afrikaner working-class suburb built on the bulldozed ruins of Sophiatown, van Niekerk's dark, grotesque novel is Afrikanerdom's self-portrait at the moment of apartheid's collapse.\", \"year_num\": 1994}, {\"num\": 5, \"title\": \"Born a Crime\", \"source_page\": 19, \"author\": \"Trevor Noah\", \"year\": \"2016\", \"description\": \"Noah's memoir about growing up mixed-race under apartheid -- where his very existence was illegal -- is the most accessible, joyful, and devastating introduction to what South Africa's racial system actually meant.\", \"year_num\": 2016}]}, {\"code\": \"NGA\", \"country\": \"Nigeria\", \"expected_count\": 5, \"intro\": \"Nigerian literature, writing in English from a post-colonial perspective, has produced some of the 20th and 21st century's most powerful voices, negotiating tradition, colonial inheritance, and civil war.\", \"source_page\": 20, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Things Fall Apart\", \"source_page\": 20, \"author\": \"Chinua Achebe\", \"year\": \"1958\", \"description\": \"Okonkwo's story -- Igbo warrior, tradition, the arrival of Christian missionaries -- is Africa's most-read novel and the founding text of African literature in English. Achebe gave Nigeria its own voice on the global stage.\", \"year_num\": 1958}, {\"num\": 2, \"title\": \"Half of a Yellow Sun\", \"source_page\": 20, \"author\": \"Chimamanda Ngozi Adichie\", \"year\": \"2006\", \"description\": \"The Nigeria-Biafra War (1967-70) through three characters -- a houseboy, a twin sister, and a British journalist. Adichie's Booker Prize winner rescued the Biafran genocide from historical amnesia.\", \"year_num\": 2006}, {\"num\": 3, \"title\": \"Purple Hibiscus\", \"source_page\": 20, \"author\": \"Chimamanda Ngozi Adichie\", \"year\": \"2003\", \"description\": \"Kambili's father is a model Catholic citizen and a domestic tyrant. Adichie's debut maps the trauma of religious extremism and political repression in 1990s Nigeria.\", \"year_num\": 2003}, {\"num\": 4, \"title\": \"The Palm-Wine Drinkard\", \"source_page\": 20, \"author\": \"Amos Tutuola\", \"year\": \"1952\", \"description\": \"A man descends into Yoruba spirit-world to retrieve his dead palm-wine tapster. Written in Tutuola's distinctive Yoruba-inflected English, it was the first African novel published internationally.\", \"year_num\": 1952}, {\"num\": 5, \"title\": \"Americanah\", \"source_page\": 20, \"author\": \"Chimamanda Ngozi Adichie\", \"year\": \"2013\", \"description\": \"Ifemelu navigates race, identity, and love across Nigeria, America, and Britain. Adichie's novel is both Nigeria's sharpest portrait of the diaspora experience and America's most incisive outside observer.\", \"year_num\": 2013}]}, {\"code\": \"IRN\", \"country\": \"Iran\", \"expected_count\": 5, \"intro\": \"Persian literature is one of humanity's oldest -- from Rumi and Hafez to the 20th-century novel shaped by revolution, war with Iraq, and literature of resistance written under censorship.\", \"source_page\": 21, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Blind Owl\", \"source_page\": 21, \"author\": \"Sadegh Hedayat\", \"year\": \"1937\", \"description\": \"Iran's most celebrated novel -- a painter's hallucinatory descent into obsession and murder -- is the Iranian psyche's dark mirror, written by a man who would eventually take his own life in Paris.\", \"year_num\": 1937}, {\"num\": 2, \"title\": \"My Uncle Napoleon\", \"source_page\": 21, \"author\": \"Iraj Pezeshkzad\", \"year\": \"1973\", \"description\": \"Iran's most beloved comic novel -- a pompous uncle who sees himself as Napoleon. Beneath its brilliant farce lies a portrait of Iranian paranoia, honour obsession, and anti-British conspiracy thinking.\", \"year_num\": 1973}, {\"num\": 3, \"title\": \"Savushun\", \"source_page\": 21, \"author\": \"Simin Daneshvar\", \"year\": \"1969\", \"description\": \"The first novel published by an Iranian woman -- a Shiraz family during WWII-era occupation. Daneshvar's masterpiece gave Iranian women a literary voice and Iran an identity beyond oil and empire.\", \"year_num\": 1969}, {\"num\": 4, \"title\": \"Reading Lolita in Tehran\", \"source_page\": 21, \"author\": \"Azar Nafisi\", \"year\": \"2003\", \"description\": \"A professor gathers female students to read banned Western literature in her Tehran living room. Part memoir, part literary criticism -- the essential experience of women living under the Islamic Republic.\", \"year_num\": 2003}, {\"num\": 5, \"title\": \"The Colonel\", \"source_page\": 21, \"author\": \"Mahmoud Dowlatabadi\", \"year\": \"2009\", \"description\": \"A retired colonel buries one of his children killed by the Islamic Republic during a rainy night. Long banned, Dowlatabadi's novel is Iran's most searing portrait of revolution devouring its own children.\", \"year_num\": 2009}]}, {\"code\": \"TUR\", \"country\": \"Turkey\", \"expected_count\": 5, \"intro\": \"Turkish literature sits at the crossroads of East and West -- Ottoman past, secular republic, Kurdish conflict, and the tensions of a nation always negotiating its identity.\", \"source_page\": 22, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Snow\", \"source_page\": 22, \"author\": \"Orhan Pamuk\", \"year\": \"2002\", \"description\": \"A poet visits a snow-locked border town and finds himself in a collision of Islamism, secularism, and Kurdish nationalism. Pamuk's Nobel Prize-winning novel is modern Turkey's most honest self-portrait.\", \"year_num\": 2002}, {\"num\": 2, \"title\": \"My Name Is Red\", \"source_page\": 22, \"author\": \"Orhan Pamuk\", \"year\": \"1998\", \"description\": \"Ottoman Istanbul's miniaturist painters debate Western perspective versus Islamic artistic tradition. A murder mystery and a meditation on cultural identity and the East-West tension.\", \"year_num\": 1998}, {\"num\": 3, \"title\": \"The Time Regulation Institute\", \"source_page\": 22, \"author\": \"Ahmet Hamdi Tanpinar\", \"year\": \"1962\", \"description\": \"A satire of Turkish modernisation -- a bureaucracy created to regulate all the nation's clocks. Tanpinar's absurdist masterpiece captures the comedy and tragedy of a society caught between East and West.\", \"year_num\": 1962}, {\"num\": 4, \"title\": \"Memed, My Hawk\", \"source_page\": 22, \"author\": \"Yasar Kemal\", \"year\": \"1955\", \"description\": \"A young Anatolian villager becomes a bandit hero fighting feudal landlords. Kemal's epic folk-novel is rural Turkey in literature -- its landscapes, poverty, and stubborn dignity.\", \"year_num\": 1955}, {\"num\": 5, \"title\": \"Istanbul: Memories and the City\", \"source_page\": 22, \"author\": \"Orhan Pamuk\", \"year\": \"2003\", \"description\": \"Pamuk's love letter to Istanbul weaves personal history with the city's huzun (collective melancholy). No book captures the sadness of a once-imperial city more beautifully.\", \"year_num\": 2003}]}, {\"code\": \"ARG\", \"country\": \"Argentina\", \"expected_count\": 5, \"intro\": \"Argentine literature reinvented the short story, invented meta-fiction, and produced in Borges one of the most influential writers of the 20th century -- a literature of labyrinths, mirrors, and the gaucho plain.\", \"source_page\": 23, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Ficciones\", \"source_page\": 23, \"author\": \"Jorge Luis Borges\", \"year\": \"1944\", \"description\": \"Borges' story collection -- libraries of infinite books, circular ruins, a man who remembers everything -- invented postmodernism before the word existed. No Argentine writer is thinkable without him.\", \"year_num\": 1944}, {\"num\": 2, \"title\": \"Hopscotch (Rayuela)\", \"source_page\": 23, \"author\": \"Julio Cortazar\", \"year\": \"1963\", \"description\": \"A novel you can read in multiple orders: a Buenos Aires-Paris love story that simultaneously deconstructs itself. Cortazar's masterpiece is Latin America's most radical experiment in novelistic form.\", \"year_num\": 1963}, {\"num\": 3, \"title\": \"The Invention of Morel\", \"source_page\": 23, \"author\": \"Adolfo Bioy Casares\", \"year\": \"1940\", \"description\": \"A fugitive on a deserted island discovers he shares it with projections of a past social gathering. This philosophical thriller -- praised by Borges -- is the most elegant science fiction novella in Spanish.\", \"year_num\": 1940}, {\"num\": 4, \"title\": \"Kiss of the Spider Woman\", \"source_page\": 23, \"author\": \"Manuel Puig\", \"year\": \"1976\", \"description\": \"Two prisoners in a Buenos Aires jail -- a gay window dresser and a Marxist guerrilla -- share a cell under Peron's regime. Puig's novel, told entirely in dialogue, is the most compassionate account of Argentina's dirty war.\", \"year_num\": 1976}, {\"num\": 5, \"title\": \"Santa Evita\", \"source_page\": 23, \"author\": \"Tomas Eloy Martinez\", \"year\": \"1995\", \"description\": \"The fate of Eva Peron's embalmed corpse across three decades of Argentine history. Martinez's phantasmagoric novel is the most brilliant account of Peronism, the cult of the dead, and Argentina's addiction to myth.\", \"year_num\": 1995}]}, {\"code\": \"MEX\", \"country\": \"Mexico\", \"expected_count\": 5, \"intro\": \"Mexican literature carries three civilisations -- Aztec, colonial Spanish, and modern mestizo -- and produces fiction of extraordinary mythic density, from Rulfo's ghost-haunted plains to Bolano's savage detectives.\", \"source_page\": 24, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Pedro Paramo\", \"source_page\": 24, \"author\": \"Juan Rulfo\", \"year\": \"1955\", \"description\": \"Juan Preciado travels to Comala to find his father Pedro Paramo and finds only ghosts. Rulfo's 100-page masterpiece -- a ghost story, a meditation on power and death -- is the seed from which all Latin American Magical Realism grew.\", \"year_num\": 1955}, {\"num\": 2, \"title\": \"Like Water for Chocolate\", \"source_page\": 24, \"author\": \"Laura Esquivel\", \"year\": \"1989\", \"description\": \"Tita de la Garza's forbidden love and magical cooking in revolutionary-era Mexico. Esquivel's novel is the most popular account of Mexican feminine domestic life -- and the country's pre-Columbian and colonial culinary heritage.\", \"year_num\": 1989}, {\"num\": 3, \"title\": \"The Death of Artemio Cruz\", \"source_page\": 24, \"author\": \"Carlos Fuentes\", \"year\": \"1962\", \"description\": \"A dying Mexican tycoon revisits his corrupt life across the Mexican Revolution and its betrayal. Fuentes'   modernist    tour   de    force   is   the   definitive   novel   of   Mexico's   post-revolutionary disillusionment.\", \"year_num\": 1962}, {\"num\": 4, \"title\": \"Aura\", \"source_page\  \"Merce Rodoreda\", \"year\": \"1962\", \"description\": \"Natalia's life in Barcelona across the Spanish Civil War and its aftermath -- the most human account of what Franco's war did to ordinary women, written in Catalan under Franco's censorship and smuggled out to be published in exile.\", \"year_num\": 1962}, {\"num\": 3, \"title\": \"Nada\", \"source_page\": 26, \"author\": \"Carmen Laforet\", \"year\": \"1944\", \"description\": \"An 18-year-old arrives in post-Civil War Barcelona to study and finds her relatives destroyed by poverty, violence, and repression. Laforet's debut -- written at 23 -- is the definitive portrait of Franco's Spain from inside.\", \"year_num\": 1944}, {\"num\": 4, \"title\": \"The Shadow of the Wind\", \"source_page\": 26, \"author\": \"Carlos Ruiz Zafon\", \"year\": \"2001\", \"description\": \"A boy discovers a mysterious novel by Julian Carax in a Cemetery of Forgotten Books. Zafon's Gothic love letter to Barcelona -- the city under Franco, its layers of secrets -- became Spain's bestselling post-war novel.\", \"year_num\": 2001}, {\"num\": 5, \"title\": \"Soldiers of Salamis\", \"source_page\": 26, \"author\": \"Javier Cercas\", \"year\": \"2001\", \"description\": \"A journalist investigates whether a Republican soldier spared a Francoist writer's life at the end of the Civil War. Cercas' novel -- part investigation, part meditation -- is the most honest reckoning with the Civil War's moral complexity.\", \"year_num\": 2001}]}, {\"code\": \"EGY\", \"country\": \"Egypt\", \"expected_count\": 5, \"intro\": \"Egyptian literature, the Arab world's richest and most prolific, produced the only Arab Nobel Prize winner and a tradition of social realism that chronicled Cairo's transformation across the 20th century.\", \"source_page\": 27, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Cairo Trilogy\", \"source_page\": 27, \"author\": \"Naguib Mahfouz\", \"year\": \ d on him -- from his New York-educated son to the most junior servants. Mueenuddin's debut maps Pakistan's feudal social structure with Chekhovian precision.\", \"year_num\": 2009}]}, {\"code\": \"IDN\", \"country\": \"Indonesia\", \"expected_count\": 5, \"intro\": \"Indonesian literature is dominated by Pramoedya Ananta Toer, who wrote his masterwork in prison on the Buru Island penal colony and became one of the most nominated writers never to win the Nobel Prize.\", \"source_page\": 29, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"This Earth of Mankind\", \"source_page\": 29, \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1980\", \"description\": \"Minke, a young Javanese student in colonial Dutch East Indies, falls in love across racial lines and awakens politically. The first of Pramoedya's Buru Quartet -- dictated to fellow prisoners and smuggled out -- is one of the great anti-colonial novels.\", \"year_num\": 1980}, {\"num\": 2, \"title\": \"Child of All Nations\", \"source_page\": 29, \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1980\", \"description\": \"Minke's political consciousness develops as he witnesses Dutch colonial exploitation. The Buru Quartet's second volume is the Indonesian national awakening in fiction form.\", \"year_num\": 1980}, {\"num\": 3, \"title\": \"Footsteps\", \"source_page\": 29, \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1985\", \"description\": \"Minke founds Indonesia's first native newspaper and the first national organisation. Pramoedya's third volume is one of the great novels of journalism and political organising as acts of resistance.\", \"year_num\": 1985}, {\"num\": 4, \"title\": \"House of Glass\", \"source_page\": 29, \"author\": \"Pramoedya Ananta Toer\", \"year\": \"1988\", \"description\": \"Told from the perspective of the Dutch colonial investigator pursuing Minke, the Buru Quartet's final volume is a meditation on surveillance, collaboration, and the psychology of the coloniser.\", \"year_num\": 1988}, {\"num\": 5, \"title\": \"The Rainbow Troops\", \"source_page\": 29, \"author\": \"Andrea Hirata\", \"year\": \"2005\", \"description\": \"Ten children on the tin-mining island of Belitung fight for the right to education against a corporation that wants their school closed. Indonesia's bestselling novel is a celebration of the human hunger for learning.\", \"year_num\": 2005}]}, {\"code\": \"KEN\", \"country\": \"Kenya\", \"expected_count\": 5, \"intro\": \"Kenyan literature in English is synonymous with Ngugi wa Thiong'o -- one of the most important writers of the post-colonial world, who eventually rejected English itself for his mother tongue Gikuyu as an act of cultural decolonisation.\", \"source_page\": 30, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"A Grain of Wheat\", \"source_page\": 30, \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1967\", \"description\": \"Four Kenyans prepare for Uhuru (independence) while carrying the weight of their actions during the Mau Mau uprising. Ngugi's masterpiece is the most morally complex portrait of anti-colonial struggle and its cost in any African literature.\", \"year_num\": 1967}, {\"num\": 2, \"title\": \"Weep Not, Child\", \"source_page\": 30, \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1964\", \"description\": \"The first novel in English by an East African -- Njoroge's education during the Mau Mau Emergency. Ngugi's debut is the essential account of how colonialism destroyed the thing it claimed to bring: hope through education.\", \"year_num\": 1964}, {\"num\": 3, \"title\": \"Petals of Blood\", \"source_page\": 30, \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1977\", \"description\": \"Four characters in post-independence Kenya find that nothing has changed except who does the exploiting. This is the novel that led to Ngugi's imprisonment by the Kenyatta g ape, its Indigenous peoples' dispossession, its colonial settler identity, and the dark comedy of a culture that has always needed to invent itself.\", \"source_page\": 34, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Cloudstreet\", \"source_page\": 34, \"author\": \"Tim Winton\", \"year\": \"1991\", \"description\": \"Two working-class families share a large house in Perth across 20 years. Winton's sprawling, comic, tender novel is the great Australian family epic -- the country's relationship with its own land, luck, and larrikin spirit.\", \"year_num\": 1991}, {\"num\": 2, \"title\": \"True History of the Kelly Gang\", \"source_page\": 34, \"author\": \"Peter Carey\", \"year\": \"2000\", \"description\": \"Ned Kelly -- Australia's most famous outlaw -- writes his own story. Carey's Booker Prize winner, written in Kelly's invented voice, is the most vivid account of colonial class violence and the birth of an Australian anti-authoritarian identity.\", \"year_num\": 2000}, {\"num\": 3, \"title\": \"Voss\", \"source_page\": 34, \"author\": \"Patrick White\", \"year\": \"1957\", \"description\": \"A German explorer attempts to cross the Australian continent in the 1840s and is destroyed by it. White's Nobel Prize-winning novel is the most philosophically ambitious Australian fiction -- the continent itself as spiritual ordeal.\", \"year_num\": 1957}, {\"num\": 4, \"title\": \"Carpentaria\", \"source_page\": 34, \"author\": \"Alexis Wright\", \"year\": \"2006\", \"description\": \"An epic of the Gulf Country in northern Australia -- Aboriginal myth, political struggle, cyclones, and the poisoned land around a mining town. Wright's Miles Franklin Award winner is the great novel of Indigenous Australia.\", \"year_num\": 2006}, {\"num\": 5, \"title\": \"The Secret River\", \"source_page\": 34, \"author\": \"Kate Grenville\", \"year\": \"2005\", \"description\": \"An English convict transported to New llows the trail to the Arctic. Hoeg's novel is both a superb thriller and a profound meditation on Greenlandic identity and Denmark's colonial relationship with it.\", \"year_num\": 1992}, {\"num\": 5, \"title\": \"The Emigrants\", \"source_page\": 35, \"author\": \"Vilhelm Moberg\", \"year\": \"1949-1959\", \"description\": \"A Swedish farming family emigrates to Minnesota in the 1850s. Moberg's four-volume epic is the foundational text of the Scandinavian-American experience and Sweden's most cherished national saga.\", \"year_num\": 1949}]}, {\"code\": \"CZE\", \"country\": \"Czech Republic\", \"expected_count\": 5, \"intro\": \"Czech literature -- Kafka, Kundera, Hrabal -- produced in the 20th century a literature of the absurd that made sense of totalitarianism better than any political analysis, and whose authors paid with imprisonment and exile.\", \"source_page\": 36, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Trial\", \"source_page\": 36, \"author\": \"Franz Kafka\", \"year\": \"1925\", \"description\": \"Josef K. is arrested without ever knowing his crime. Kafka's novel -- written in German in Prague by a Czech Jew -- invented the language we use to describe bureaucratic oppression and has given its author's name to a whole category of human experience.\", \"year_num\": 1925}, {\"num\": 2, \"title\": \"The Unbearable Lightness of Being\", \"source_page\": 36, \"author\": \"Milan Kundera\", \"year\": \"1984\", \"description\": \"Two couples across the Prague Spring of 1968 and its Soviet suppression. Kundera's meditation on lightness versus weight, love versus politics, is the essential novel of Eastern European life under communist occupation.\", \"year_num\": 1984}, {\"num\": 3, \"title\": \"I Served the King of England\", \"source_page\": 36, \"author\": \"Bohumil Hrabal\", \"year\": \"1971\", \"description\": \"A waiter rises through the ranks of Czech hotels while history -- occupation, communism, nationalisation -- keeps overturning everything. Hrabal's picaresque is the most joyful serious Czech novel: life's absurdity as comedy rather than tragedy.\", \"year_num\": 1971}, {\"num\": 4, \"title\": \"The Book of Laughter and Forgetting\", \"source_page\": 36, \"author\": \"Milan Kundera\", \"year\": \"1979\", \"description\": \"Seven stories on a single theme: the erasure of memory as a political weapon. Kundera's meditation on forgetting -- both personal and collective -- was banned in Czechoslovakia and is the most political of his novels.\", \"year_num\": 1979}, {\"num\": 5, \"title\": \"Too Loud a Solitude\", \"source_page\": 36, \"author\": \"Bohumil Hrabal\", \"year\": \"1976\", \"description\": \"A paper compactor has spent 35 years secretly saving books from destruction under communism. Hrabal's lyrical monologue is the most beautiful defence of literature against power ever written.\", \"year_num\": 1976}]}, {\"code\": \"POR\", \"country\": \"Portugal\", \"expected_count\": 5, \"intro\": \"Portuguese literature is haunted by saudade -- a yearning for what is lost or absent -- and by the weight of a maritime empire that gave the world half its coastlines and then contracted into melancholy.\", \"source_page\": 37, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Book of Disquiet\", \"source_page\": 37, \"author\": \"Fernando Pessoa\", \"year\": \"1982\", \"description\": \"Written over decades by Lisbon's greatest modernist under a semi-heteronym, Pessoa's fragmentary masterpiece is the most intimate document of urban melancholy ever written -- a city and a consciousness become one.\", \"year_num\": 1982}, {\"num\": 2, \"title\": \"Blindness\", \"source_page\": 37, \"author\": \"Jose Saramago\", \"year\": \"1995\", \"description\": \"A city goes suddenly blind; society collapses in an interment camp. Saramago's Nobel Prize-winning allegory is one of the most disturbing and morally unsparing accounts of what human beings do to each other when order disappears.\", \"year_num\": 1995}, {\"num\": 3, \"title\": \"Baltasar and Blimunda\", \"source_page\": 37, \"author\": \"Jose Saramago\", \"year\": \"1982\", \"description\": \"In 18th-century Portugal, a one-handed soldier and a woman who can see inside bodies try to build a flying machine. Saramago's most humane novel meditates on the Inquisition, Baroque excess, and the human need to transcend.\", \"year_num\": 1982}, {\"num\": 4, \"title\": \"The Land at the End of the World\", \"source_page\": 37, \"author\": \"Antonio Lobo Antunes\", \"year\": \"1979\", \"description\": \"A Portuguese army doctor returns from the Angola colonial war and talks through the night. Antunes's novel -- the most traumatic account of Portugal's colonial wars -- helped bury the myths of Salazarist empire.\", \"year_num\": 1979}, {\"num\": 5, \"title\": \"The Gospel According to Jesus Christ\", \"source_page\": 37, \"author\": \"Jose Saramago\", \"year\": \"1991\", \"description\": \"Jesus as a confused young man, God as a cynical strategist. Saramago's controversial novel was banned in Portugal by the conservative government -- and is the most provocative fictional rethinking of the Christian story.\", \"year_num\": 1991}]}, {\"code\": \"HUN\", \"country\": \"Hungary\", \"expected_count\": 5, \"intro\": \"Hungarian literature, forged between German and Slavic worlds, Ottoman and Habsburg empires, produced in the 20th century a literature of extraordinary moral intensity shaped by WWII, the Holocaust, and communist occupation.\", \"source_page\": 38, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Fatelessness\", \"source_page\": 38, \"author\": \"Imre Kertesz\", \"year\": \"1975\", \"description\": \"A 15-year-old Hungarian Jewish boy describes his time in Auschwitz and Buchenwald without rage or sentimentality -- as if it were simply what happened to him. Kertesz's Nobel Prize winner is the most morally precise Holocaust novel ever written.\", \"year_num\": 1975}, {\"num\": 2, \"title\": \"The Door\", \"source_page\": 38, \"author\": \"Magda Szabo\", \"year\": \"1987\", \"description\": \"A writer's decades-long relationship with her fierce, secretive peasant housekeeper Emerence -- and the catastrophic ending. Szabo's novel is the greatest portrait of female friendship and class difference in Central European fiction.\", \"year_num\": 1987}, {\"num\": 3, \"title\": \"Embers\", \"source_page\": 38, \"author\": \"Sandor Marai\", \"year\": \"1942\", \"description\": \"Two old men meet after 41 years of estrangement and the General talks through the night about friendship, betrayal, and passion. Marai's Austro-Hungarian masterpiece is the most perfectly constructed novel of its decade.\", \"year_num\": 1942}, {\"num\": 4, \"title\": \"Journey by Moonlight\", \"source_page\": 38, \"author\": \"Antal Szerb\", \"year\": \"1937\", \"description\": \"A Hungarian honeymooner in Italy becomes lost in his own past and the Italian landscape of death and beauty. Szerb's novel -- its author killed in a labour camp in 1945 -- is pre-war Central European literature's most beautiful elegy.\", \"year_num\": 1937}, {\"num\": 5, \"title\": \"Satantango\", \"source_page\": 38, \"author\": \"Laszlo Krasznahorkai\", \"year\": \"1985\", \"description\": \"The inhabitants of a collective farm wait for their charismatic leader Irimias to return, who may or may not be dead. Krasznahorkai's spiralling, rain-soaked novel is the most apocalyptic portrait of late communism ever written.\", \"year_num\": 1985}]}, {\"code\": \"CUB\", \"country\": \"Cuba\", \"expected_count\": 5, \"intro\": \"Cuban literature is defined by the violence of history -- Spanish colonialism, American imperialism, the Revolution -- and by an extraordinary capacity for formal experimentation that makes Havana feel like Paris and the Caribbean at ier's philosophical novel is the greatest meditation on revolution, utopia, and their inevitable corruption.\", \"year_num\": 1962}]}, {\"code\": \"CHL\", \"country\": \"Chile\", \"expected_count\": 5, \"intro\": \"Chilean literature lives in the shadow of Pinochet's 1973 coup and its 17-year dictatorship, but also in the shadow of Neruda, producing a literature of political passion, surreal imagination, and devastating exile.\", \"source_page\": 40, \"group\": \"Major world powers & significant nations\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The House of the Spirits\", \"source_page\": 40, \"author\": \"Isabel Allende\", \"year\": \"1982\", \"description\": \"Four generations of the Trueba family across Chile's political upheavals -- from hacienda patriarchy to Salvador Allende's government to Pinochet's coup. Allende's magical realist epic is the most read novel about Latin American political violence.\", \"year_num\": 1982}, {\"num\": 2, \"title\": \"2666\", \"source_page\": 40, \"author\": \"Roberto Bolano\", \"year\": \"2004\", \"description\": \"Four academics searching for a reclusive German novelist, a series of femicides in a Mexican border city, and a Nazi soldier on the Eastern Front. Bolano's 900-page posthumous masterpiece is the most ambitious Latin American novel of the last 50 years.\", \"year_num\": 2004}, {\"num\": 3, \"title\": \"The Savage Detectives\", \"source_page\": 40, \"author\": \"Roberto Bolano\", \"year\": \"1998\", \"description\": \"Two poets searching for a vanished poetess, through 50 testimonies spanning 20 years. Bolano's novel is the most comprehensive portrait of the generation of Latin American intellectuals formed by the coup generation.\", \"year_num\": 1998}, {\"num\": 4, \"title\": \"I Dreamed the Snow Was Burning\", \"source_page\": 40, \"author\": \"Antonio Skarmeta\", \"year\": \"1975\", \"description\": \"A young footballer arrives in Santiago on September 10, 1973 -- the day before Pinochet's coup. ive conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Kite Runner\", \"source_page\": 44, \"author\": \"Khaled Hosseini\", \"year\": \"2003\", \"description\": \"Amir's betrayal of his Hazara servant Hassan haunts him across decades and continents. Hosseini gave the world its first intimate view of Afghan life -- Kabul's winters, Pashtun-Hazara tension, and the Taliban's brutality.\", \"year_num\": 2003}, {\"num\": 2, \"title\": \"A Thousand Splendid Suns\", \"source_page\": 44, \"author\": \"Khaled Hosseini\", \"year\": \"2007\", \"description\": \"Two Afghan women from different generations, bound together in a loveless marriage, survive the Soviet war, civil war, and Taliban rule. The essential account of Afghan women's experience.\", \"year_num\": 2007}, {\"num\": 3, \"title\": \"The Swallows of Kabul\", \"source_page\": 44, \"author\": \"Yasmina Khadra\", \"year\": \"2002\", \"description\": \"A novel of Taliban-ruled Kabul -- a prison guard and a prisoner -- captures the dehumanisation of fundamentalist rule with devastating restraint.\", \"year_num\": 2002}, {\"num\": 4, \"title\": \"And the Mountains Echoed\", \"source_page\": 44, \"author\": \"Khaled Hosseini\", \"year\": \"2013\", \"description\": \"A brother and sister separated in 1952 Kabul, and the echoes across generations and continents. Hosseini's most ambitious novel captures how Afghanistan's wars shattered families across the world.\", \"year_num\": 2013}, {\"num\": 5, \"title\": \"The Patience Stone\", \"source_page\": 44, \"author\": \"Atiq Rahimi\", \"year\": \"2008\", \"description\": \"An Afghan woman talks to her comatose husband -- and finally says everything. Rahimi's Prix Goncourt-winning novella is the most intimate, devastating portrait of an Afghan woman's inner life.\", \"year_num\": 2008}]}, {\"code\": \"PAL/ISR\", \"country\": \"Palestine and Israel\", \"expected_count\": 5, \"intro\": \"Perhaps the world's most contested literary territory -- t
