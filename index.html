rder-radius:18px;padding:20px;box-shadow:var(--shadow)}.novel-layer h3{font-family:Georgia,serif;font-size:25px;margin:0;color:var(--navy)}.novel-layer p{font-size:12.5px;color:#475467;max-width:900px}\n.project-row,.toolrow,.pills{display:flex;gap:7px;flex-wrap:wrap}.project{border:1px solid #AAB7C7;background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.project.active{background:var(--pink);border-color:var(--pink);color:white}\n.controls-wrap{position:sticky;top:41px;z-index:20;background:rgba(242,245,249,.97);backdrop-filter:blur(12px);padding:13px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}.controls{display:grid;grid-template-columns:2.1fr repeat(4,1fr);gap:8px}\ninput,select{width:100%;padding:10px 11px;border:1.5px solid #AAB7C7;border-radius:10px;background:white;color:var(--ink);font-size:12px}.btn{border:1px solid #AAB7C7;background:white;border-radius:999px;padding:8px 11px;font-size:10.5px;font-weight:900;color:#344054}.btn.primary{background:var(--navy);border-color:var(--navy);color:white}.btn.active{background:var(--green);border-color:var(--green);color:white}.resultline{font-size:11px;color:var(--muted);margin-top:8px}\n.list{display:grid;gap:13px}.section-card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 6px 20px rgba(15,23,42,.05)}.section-card.novelmatch{border-top:4px solid var(--pink)}\n.section-title{padding:18px 20px 14px;display:grid;grid-template-columns:1fr auto;gap:14px}.code{font-size:10px;letter-spacing:.12em;font-weight:950;color:#B45309}.section-title h3{font-family:Georgia,serif;color:var(--navy);font-size:26px;margin:3px 0 6px}.intro{font-family:Georgia,serif;color:#475467;font-size:14px;margin:0;max-width:1000px}.meta-count{text-align:right}.meta-count b{display:block;font-size:27px;color:var(--navy)}.meta-count span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}\n.section-actions{padding:0 20px 14px}.toggle{border:1px solid #C4D0DE;background:#E8EFF6;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:900;color:#344054}.books{display:none;background:#EAF0F6;border-top:1px solid var(--line);padding:10px 12px 14px}.section-card.open .books{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}\n.book{background:#fff;border:1px solid #BDC9D7;border-radius:12px;padding:13px;position:relative}.book.read{opacity:.78;background:#F4FBF8}.book.saved{box-shadow:inset 0 0 0 2px rgba(217,119,6,.5)}.book.project-hit{border-left:4px solid var(--pink)}\n.book-top{display:grid;grid-template-columns:auto 1fr auto;gap:9px}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#FFF0D7;border:1px solid #F1C37B;color:#994900;font-size:10px;font-weight:950}.book h4{font-family:Georgia,serif;color:#102A43;font-size:18px;line-height:1.12;margin:1px 0 3px}.byline{font-size:10.5px;color:#475467;font-weight:800}.year{font-size:10px;color:#B45309;font-weight:950}.desc{font-family:Georgia,serif;font-size:13px;color:#344054;margin:10px 0 7px}.bridge{font-size:11px;color:#344054;background:#F2F7FB;border-left:3px solid var(--navy2);padding:7px 8px;margin:8px 0}.novelnote{font-size:10.5px;background:#FFF2F7;border-left:3px solid var(--pink);padding:7px 8px;margin:8px 0;color:#5C2143}\n.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{background:#EEF3F8;border:1px solid #D2DDE8;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:850;color:#475467}.tag.projecttag{background:#FBEAF3;border-color:#E8A7C9;color:#7A284F}.tag.deep{background:#EAF7F4;border-color:#A8D9CF;color:#086454}\n.book-foot{border-top:1px solid #DCE3EA;margin-top:9px;padding-top:8px;display:flex;gap:6px}.mini{border:1px solid #C8D2DD;background:#E7EEF5;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:900;color:#344054}.mini.on{background:var(--green);color:#fff;border-color:var(--green)}.mini.star.on{background:var(--gold);color:#fff;border-color:var(--gold)}\n.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.statbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.statbox b{display:block;font-size:25px;color:var(--navy)}.statbox span{font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase}\n.empty{padding:42px;text-align:center;background:#fff;border:1px dashed #AAB7C7;border-radius:14px;color:var(--muted)}.note{margin-top:13px;padding:14px 16px;background:#FFF4DE;border-left:4px solid var(--gold);border-radius:0 11px 11px 0;font-size:11px;color:#4D3B1F}.footer{padding-top:28px;color:var(--muted);font-size:10.5px}\n@media(max-width:980px){.hero-inner{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr 1fr}.section-card.open .books{grid-template-columns:1fr}}\n@media(max-width:620px){.nav{padding:9px 13px}.hero-inner,main{padding-left:13px;padding-right:13px}h1{font-size:48px}.section-head{display:block}.section-head p{margin-top:8px}.controls{grid-template-columns:1fr}.controls-wrap{position:relative;top:0}.stats-grid{grid-template-columns:1fr 1fr}.section-title{grid-template-columns:1fr}.meta-count{text-align:left;display:flex;gap:7px;align-items:baseline}}\n@media print{.top,.controls-wrap,.section-actions,.book-foot,.novel-layer .project-row{display:none!important}.books{display:grid!important;grid-template-columns:repeat(2,1fr)!important}body{background:white}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"top\">\u003cnav class=\"nav\">\u003cdiv class=\"logo\">INDIA IN FICTION\u003c/div>\u003ca href=\"#novelsI\">For My Novels\u003c/a>\u003ca href=\"#browseI\">Browse\u003c/a>\u003ca href=\"#progressI\">Reading\u003c/a>\u003c/nav>\u003c/div>\n\u003cheader class=\"hero\">\u003cdiv class=\"hero-inner\">\u003cdiv>\u003cdiv class=\"eyebrow\">Multilingual novelist's edition\u003c/div>\u003ch1>India\u003cbr>in Fiction\u003c/h1>\u003cp>A multilingual map of India that doubles as a working craft shelf for politically grounded fiction \u2014 now including the exact short-story and communal-violence models named in the Ayodhya research guide.\u003c/p>\u003c/div>\u003caside class=\"hero-card\">\u003cdiv class=\"hero-stats\">\u003cdiv class=\"hero-stat\">\u003cb>125\u003c/b>\u003cspan>works\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>15\u003c/b>\u003cspan>languages\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>16\u003c/b>\u003cspan>novel-linked\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>85\u003c/b>\u003cspan>core picks\u003c/span>\u003c/div>\u003c/div>\u003c/aside>\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection id=\"novelsI\">\u003cdiv class=\"novel-layer\">\u003cdiv class=\"eyebrow\" style=\"color:var(--pink)\">Interactive layer\u003c/div>\u003ch3>\u270d For My Novels\u003c/h3>\u003cp>The Ayodhya / Only Temple route now surfaces the books explicitly named in that research guide, while the Craft route collects especially useful models of voice, structure, restraint and political pressure.\u003c/p>\u003cdiv class=\"project-row\" id=\"projectRowI\">\u003c/div>\u003cdiv class=\"note\">Newly added: \u003cb>Kafan, Toba Tek Singh, The Dog of Tithwal, Selected Short Stories of Ismat Chughtai\u003c/b> and \u003cb>The Moor's Last Sigh\u003c/b>.\u003c/div>\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"stats-grid\">\u003cdiv class=\"statbox\">\u003cb>125\u003c/b>\u003cspan>Total works\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>15\u003c/b>\u003cspan>Languages\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>40\u003c/b>\u003cspan>Hindi shelf\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>14\u003c/b>\u003cspan>Only Temple route\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>12\u003c/b>\u003cspan>Craft route\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"browseI\">\u003cdiv class=\"section-head\">\u003ch2>Explore Indian fiction\u003c/h2>\u003cp>Search by title, author, region or theme; filter by language, period, difficulty and novel project.\u003c/p>\u003c/div>\n\u003cdiv class=\"controls-wrap\">\u003cdiv class=\"controls\">\u003cinput id=\"qI\" placeholder=\"Search title, author, region, theme\u2026\">\u003cselect id=\"langI\">\u003coption value=\"\">All languages\u003c/option>\u003c/select>\u003cselect id=\"eraI\">\u003coption value=\"\">All periods\u003c/option>\u003c/select>\u003cselect id=\"levelI\">\u003coption value=\"\">All difficulty\u003c/option>\u003coption>Easy\u003c/option>\u003coption>Medium\u003c/option>\u003coption>Hard\u003c/option>\u003c/select>\u003cselect id=\"projectI\">\u003coption value=\"\">All novel projects\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"toolrow\">\u003cbutton class=\"btn primary\" onclick=\"openVisibleI()\">Open visible\u003c/button>\u003cbutton class=\"btn\" id=\"coreI\" onclick=\"toggleCoreI()\">Core only\u003c/button>\u003cbutton class=\"btn\" id=\"savedI\" onclick=\"toggleSavedI()\">\u2605 Saved only\u003c/button>\u003cbutton class=\"btn\" id=\"unreadI\" onclick=\"toggleUnreadI()\">Unread only\u003c/button>\u003cbutton class=\"btn\" onclick=\"resetI()\">Reset\u003c/button>\u003c/div>\u003cdiv class=\"resultline\" id=\"resultI\">\u003c/div>\u003c/div>\n\u003cdiv class=\"list\" id=\"listI\">\u003c/div>\u003c/section>\n\u003csection id=\"progressI\">\u003cdiv class=\"section-head\">\u003ch2>Your reading layer\u003c/h2>\u003c/div>\u003cdiv class=\"note\" id=\"progressIText\">\u003c/div>\u003c/section>\n\u003cdiv class=\"footer\">India in Fiction \u2014 Novelist's Edition \u00b7 self-contained interactive HTML.\u003c/div>\u003c/main>\n\u003cscript>\nconst DATAI=[{\"code\":\"HIN\",\"language\":\"Hindi\",\"intro\":\"The deepest shelf in this guide: from Premchand and Jainendra through Agyeya, Nayi Kahani, Shivani, Nirmal Verma, Manohar Shyam Joshi, Uday Prakash and Geetanjali Shree. It moves from social realism to psychological modernism, satire, popular fiction, postmodern play and contemporary experimentation.\",\"books\":[{\"title\":\"Pariksha Guru\",\"author\":\"Srinivas Das\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1882,\"era\":\"Colonial & early modernity\",\"region\":\"North India / Delhi\",\"genres\":[\"social satire\",\"modernity\",\"middle class\"],\"why\":\"An early Hindi novel about imitation, respectability and the anxieties of a new colonial-era middle class.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-001\",\"year_num\":1882},{\"title\":\"Chandrakanta\",\"author\":\"Devaki Nandan Khatri\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1888,\"era\":\"Colonial & early modernity\",\"region\":\"North India / imaginary kingdoms\",\"genres\":[\"fantasy\",\"romance\",\"popular fiction\"],\"why\":\"A landmark of Hindi popular fiction: tilism, intrigue and serialized storytelling before the modern mass-market novel.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":false,\"id\":\"IND-002\",\"year_num\":1888},{\"title\":\"Nirmala\",\"author\":\"Premchand\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1927,\"era\":\"Colonial & early modernity\",\"region\":\"North India\",\"genres\":[\"social realism\",\"gender\",\"family\"],\"why\":\"A sharp domestic tragedy about dowry, mismatched marriage, patriarchy and moral suspicion.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-003\",\"year_num\":1927},{\"title\":\"Chitralekha\",\"author\":\"Bhagwati Charan Verma\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1934,\"era\":\"Colonial & early modernity\",\"region\":\"Historical North India\",\"genres\":[\"philosophical\",\"historical\",\"desire\"],\"why\":\"Uses a historical setting to ask whether sin lies in acts, desire, circumstance or judgment.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":false,\"id\":\"IND-004\",\"year_num\":1934},{\"title\":\"Godaan\",\"author\":\"Premchand\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1936,\"era\":\"Colonial & early modernity\",\"region\":\"Uttar Pradesh / rural North India\",\"genres\":[\"social realism\",\"rural life\",\"class\",\"caste\"],\"why\":\"One of the clearest fictional windows into agrarian debt, caste hierarchy, aspiration and the rural-urban divide.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-005\",\"year_num\":1936,\"novelTags\":[\"Only Temple\"],\"novelNote\":\"Ramesh/Hori: a good man destroyed by accumulated social pressures.\"},{\"title\":\"Kafan (The Shroud)\",\"author\":\"Premchand\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1936,\"era\":\"Colonial & early modernity\",\"region\":\"North India / rural poor\",\"genres\":[\"short story\",\"poverty\",\"black comedy\",\"unsentimental realism\"],\"why\":\"Two impoverished men collect money for a woman's shroud and spend it on food and drink. A brutally unsentimental model for showing deprivation without moral commentary.\",\"format\":\"Short story\",\"level\":\"Easy\",\"core\":true,\"year_num\":1936,\"id\":\"IND-006\",\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Read first for tonal restraint and refusal of easy moral judgment.\"},{\"title\":\"Tyagpatra\",\"author\":\"Jainendra Kumar\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1937,\"era\":\"Colonial & early modernity\",\"region\":\"North India\",\"genres\":[\"psychological\",\"gender\",\"marriage\",\"individualism\"],\"why\":\"A landmark psychological Hindi novella centred on Mrinal, whose rejection by family and marriage becomes a critique of social respectability and the cost of uncompromising individuality.\",\"format\":\"Novella\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-007\",\"year_num\":1937},{\"title\":\"Shekhar: Ek Jivani\",\"author\":\"Agyeya\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1941,\"era\":\"Colonial & early modernity\",\"region\":\"North India / revolutionary milieu\",\"genres\":[\"modernism\",\"psychological\",\"revolution\"],\"why\":\"Introspective modernism around rebellion, selfhood and the revolutionary imagination under colonial rule.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-008\",\"year_num\":1941},{\"title\":\"Gunahon Ka Devta\",\"author\":\"Dharamvir Bharati\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1949,\"era\":\"Nation-making & post-Partition\",\"region\":\"Allahabad / Uttar Pradesh\",\"genres\":[\"romance\",\"youth\",\"social norms\"],\"why\":\"A beloved post-independence love story shaped by restraint, hierarchy and the emotional culture of the Hindi middle class.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-009\",\"year_num\":1949},{\"title\":\"Nadi Ke Dweep\",\"author\":\"Agyeya\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1951,\"era\":\"Nation-making & post-Partition\",\"region\":\"North India\",\"genres\":[\"modernism\",\"psychological\",\"relationships\",\"individualism\"],\"why\":\"A major Hindi modernist novel exploring love, solitude, individuality and the tension between emotional intimacy and personal freedom.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-010\",\"year_num\":1951,\"novelTags\":[\"Craft\"],\"novelNote\":\"Psychological interiority and modernist restraint.\"},{\"title\":\"Sara Akash\",\"author\":\"Rajendra Yadav\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1951,\"era\":\"Nation-making & post-Partition\",\"region\":\"Agra / North Indian middle class\",\"genres\":[\"Nayi Kahani\",\"marriage\",\"middle class\",\"youth\"],\"why\":\"First published as Pret Bolte Hain and later retitled Sara Akash, it turns a claustrophobic arranged marriage into a defining study of the new Hindi middle class and the Nayi Kahani sensibility.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-011\",\"year_num\":1951},{\"title\":\"Suraj Ka Satvan Ghoda\",\"author\":\"Dharamvir Bharati\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1952,\"era\":\"Nation-making & post-Partition\",\"region\":\"North India\",\"genres\":[\"metafiction\",\"romance\",\"class\"],\"why\":\"A playful story-within-stories that dismantles romantic clich\u00e9s while exposing class and gender relations.\",\"format\":\"Novella\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-012\",\"year_num\":1952},{\"title\":\"Maila Anchal\",\"author\":\"Phanishwar Nath Renu\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1954,\"era\":\"Nation-making & post-Partition\",\"region\":\"North Bihar\",\"genres\":[\"regional realism\",\"rural life\",\"politics\",\"public health\"],\"why\":\"An extraordinary village-world full of dialect, caste, disease, electoral politics and post-independence hope.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-013\",\"year_num\":1954},{\"title\":\"Jhootha Sach\",\"author\":\"Yashpal\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1958,\"era\":\"Nation-making & post-Partition\",\"region\":\"Lahore & Delhi\",\"genres\":[\"Partition\",\"politics\",\"social realism\"],\"why\":\"A large-scale social chronicle of Partition, refugee life, ideology and the remaking of North Indian society.\",\"format\":\"Two-volume novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-014\",\"year_num\":1958},{\"title\":\"Andhere Band Kamre\",\"author\":\"Mohan Rakesh\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1961,\"era\":\"Nation-making & post-Partition\",\"region\":\"Delhi / urban North India\",\"genres\":[\"Nayi Kahani\",\"marriage\",\"alienation\",\"urban life\"],\"why\":\"One of the central novels of post-independence Hindi modernity: marriage, ambition, emotional estrangement and the loneliness of an educated urban class.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-015\",\"year_num\":1961},{\"title\":\"Pachpan Khambe Laal Deewarein\",\"author\":\"Usha Priyamvada\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1961,\"era\":\"Nation-making & post-Partition\",\"region\":\"Delhi / women's college world\",\"genres\":[\"women\",\"work\",\"family\",\"middle class\"],\"why\":\"A quietly devastating novel about an educated working woman whose financial independence does not free her from family obligation, loneliness or social surveillance.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-016\",\"year_num\":1961},{\"title\":\"Ve Din\",\"author\":\"Nirmal Verma\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1964,\"era\":\"Nation-making & post-Partition\",\"region\":\"Prague / Indian expatriate perspective\",\"genres\":[\"modernism\",\"exile\",\"love\",\"alienation\"],\"why\":\"Nirmal Verma's first novel and an unusual Hindi work set entirely in Europe; intimacy, exile and postwar memory are rendered through spare, atmospheric modernism.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-017\",\"year_num\":1964,\"novelTags\":[\"Craft\"],\"novelNote\":\"Atmosphere, memory and emotional distance.\"},{\"title\":\"Chaudah Phere\",\"author\":\"Shivani (Gaura Pant)\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1965,\"era\":\"Nation-making & post-Partition\",\"region\":\"Kumaon / North Indian family world\",\"genres\":[\"women\",\"family\",\"tradition\",\"popular fiction\"],\"why\":\"A representative Shivani novel: accessible, socially observant fiction in which marriage, family expectations and Kumaoni cultural life meet the changing aspirations of women.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-018\",\"year_num\":1965},{\"title\":\"Aadha Gaon\",\"author\":\"Rahi Masoom Raza\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1966,\"era\":\"Nation-making & post-Partition\",\"region\":\"Eastern Uttar Pradesh\",\"genres\":[\"Partition\",\"Muslim life\",\"rural life\",\"identity\"],\"why\":\"Shows Partition from inside a north Indian Muslim village, where kinship, land and local history exceed national slogans.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-019\",\"year_num\":1966},{\"title\":\"Mitro Marjani\",\"author\":\"Krishna Sobti\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1966,\"era\":\"Nation-making & post-Partition\",\"region\":\"Punjab / North India\",\"genres\":[\"gender\",\"sexuality\",\"family\"],\"why\":\"A bracing, comic and unapologetic challenge to the ideal of the silent, sexually contained daughter-in-law.\",\"format\":\"Novella\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-020\",\"year_num\":1966},{\"title\":\"Raag Darbari\",\"author\":\"Shrilal Shukla\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1968,\"era\":\"Nation-making & post-Partition\",\"region\":\"Uttar Pradesh\",\"genres\":[\"satire\",\"democracy\",\"bureaucracy\",\"rural politics\"],\"why\":\"Perhaps the great satirical novel of postcolonial institutions: panchayat, college, bureaucracy, patronage and cynical power.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-021\",\"year_num\":1968},{\"title\":\"Bhairavi\",\"author\":\"Shivani (Gaura Pant)\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1969,\"era\":\"Nation-making & post-Partition\",\"region\":\"North India\",\"genres\":[\"women\",\"spirituality\",\"margins\",\"psychological\"],\"why\":\"One of Shivani's darker novels, following a woman pushed beyond respectable domestic life into unfamiliar social and spiritual worlds; it shows the range beneath her popular reputation.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":false,\"id\":\"IND-022\",\"year_num\":1969},{\"title\":\"Aapka Bunty\",\"author\":\"Mannu Bhandari\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1971,\"era\":\"Nation-making & post-Partition\",\"region\":\"Urban North India\",\"genres\":[\"family\",\"childhood\",\"gender\",\"urban life\"],\"why\":\"A divorce seen through a child makes changing family structures and middle-class modernity emotionally concrete.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-023\",\"year_num\":1971},{\"title\":\"Tamas\",\"author\":\"Bhisham Sahni\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1974,\"era\":\"Nation-making & post-Partition\",\"region\":\"Punjab / Rawalpindi region\",\"genres\":[\"Partition\",\"communalism\",\"politics\"],\"why\":\"A restrained but devastating account of how rumor, political manipulation and fear turn neighbours into enemies.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-024\",\"year_num\":1974,\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Rumor, manipulation and communal violence at human scale.\"},{\"title\":\"Krishnakali\",\"author\":\"Shivani (Gaura Pant)\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1978,\"era\":\"Emergency to liberalisation\",\"region\":\"North India / Bengali-Kumaoni cultural worlds\",\"genres\":[\"women\",\"identity\",\"family\",\"popular fiction\"],\"why\":\"A widely read Shivani novel combining emotional storytelling, female interiority and culturally layered family worlds\u2014useful for understanding the huge Hindi magazine-reading public of the twentieth century.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-025\",\"year_num\":1978},{\"title\":\"Ek Chithra Sukh\",\"author\":\"Nirmal Verma\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1979,\"era\":\"Emergency to liberalisation\",\"region\":\"Delhi / theatre world\",\"genres\":[\"modernism\",\"art\",\"alienation\",\"relationships\"],\"why\":\"A fragmented, intimate novel of theatre people in Delhi, useful for understanding Nirmal Verma's inward modernism and the fragile emotional worlds of the urban intelligentsia.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-026\",\"year_num\":1979},{\"title\":\"Mahabhoj\",\"author\":\"Mannu Bhandari\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1979,\"era\":\"Emergency to liberalisation\",\"region\":\"North India\",\"genres\":[\"politics\",\"democracy\",\"media\",\"caste\"],\"why\":\"A political novel about how a poor man's death becomes raw material for parties, administrators and newspapers.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-027\",\"year_num\":1979,\"novelTags\":[\"Only Temple\"],\"novelNote\":\"Political institutions convert a poor man's death into raw material.\"},{\"title\":\"Naukar Ki Kameez\",\"author\":\"Vinod Kumar Shukla\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1979,\"era\":\"Emergency to liberalisation\",\"region\":\"Small-town India\",\"genres\":[\"absurdism\",\"middle class\",\"bureaucracy\",\"everyday life\"],\"why\":\"Deadpan, strange and tender: the clerk's life becomes a lens on obedience, dignity and the absurdity of hierarchy.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-028\",\"year_num\":1979,\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Quiet small-town dignity, bureaucracy and slight surrealism.\"},{\"title\":\"Zindaginama\",\"author\":\"Krishna Sobti\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1979,\"era\":\"Emergency to liberalisation\",\"region\":\"Undivided Punjab\",\"genres\":[\"historical\",\"rural life\",\"pluralism\",\"language\"],\"why\":\"A dense polyphonic portrait of pre-Partition Punjab where Sikh, Muslim and Hindu worlds share land, stories and speech.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-029\",\"year_num\":1979},{\"title\":\"Kuru Kuru Swaha\",\"author\":\"Manohar Shyam Joshi\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1980,\"era\":\"Emergency to liberalisation\",\"region\":\"Bombay / metropolitan India\",\"genres\":[\"postmodern\",\"satire\",\"experimental\",\"city\"],\"why\":\"A deliberately unruly, self-mocking metropolitan novel that breaks with solemn realism and brings postmodern play, popular culture and linguistic mischief into Hindi fiction.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-030\",\"year_num\":1980},{\"title\":\"Kasap\",\"author\":\"Manohar Shyam Joshi\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1982,\"era\":\"Emergency to liberalisation\",\"region\":\"Kumaon / North India\",\"genres\":[\"love\",\"regional culture\",\"experimental\",\"language\"],\"why\":\"A playful and moving love story rooted in Kumaoni cultural textures, constantly questioning the conventions of romance, narration and literary seriousness.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-031\",\"year_num\":1982},{\"title\":\"Mujhe Chand Chahiye\",\"author\":\"Surendra Verma\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1993,\"era\":\"Emergency to liberalisation\",\"region\":\"Shahjahanpur, Delhi & Mumbai\",\"genres\":[\"theatre\",\"ambition\",\"women\",\"art\"],\"why\":\"An expansive novel of a woman's artistic ambition, theatre and cinema, tracing the tensions between family expectations, sexuality, fame and creative self-making.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-032\",\"year_num\":1993},{\"title\":\"Deewar Mein Ek Khidki Rehti Thi\",\"author\":\"Vinod Kumar Shukla\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1997,\"era\":\"Emergency to liberalisation\",\"region\":\"Small-town India\",\"genres\":[\"magical realism\",\"marriage\",\"everyday life\"],\"why\":\"Transforms modest salaried life into quiet wonder; a useful antidote to reading India only through crisis and politics.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-033\",\"year_num\":1997},{\"title\":\"Kali-Katha: Via Bypass\",\"author\":\"Alka Saraogi\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":1998,\"era\":\"Emergency to liberalisation\",\"region\":\"Kolkata / Marwari community\",\"genres\":[\"history\",\"business community\",\"city\",\"memory\"],\"why\":\"Tracks Marwari migration, capital, family memory and Kolkata across the twentieth century.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-034\",\"year_num\":1998},{\"title\":\"Kitne Pakistan\",\"author\":\"Kamleshwar\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":2000,\"era\":\"Contemporary India\",\"region\":\"South Asia / transhistorical\",\"genres\":[\"metafiction\",\"Partition\",\"religion\",\"history\"],\"why\":\"A courtroom of history in which civilizations, nations and victims interrogate the repeated logic of partitioning people.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-035\",\"year_num\":2000},{\"title\":\"Peeli Chhatri Wali Ladki\",\"author\":\"Uday Prakash\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":2001,\"era\":\"Contemporary India\",\"region\":\"North Indian university world\",\"genres\":[\"caste\",\"globalisation\",\"campus\",\"satire\"],\"why\":\"A dark campus tale linking caste, bureaucracy, consumer culture and the post-liberalisation moral atmosphere.\",\"format\":\"Novella\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-036\",\"year_num\":2001},{\"title\":\"Tirohit\",\"author\":\"Geetanjali Shree\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":2001,\"era\":\"Contemporary India\",\"region\":\"North India\",\"genres\":[\"women\",\"memory\",\"domestic life\",\"experimental\"],\"why\":\"An elliptical, layered novel about women, memory and domestic spaces that shows the experimental trajectory Geetanjali Shree developed before Rait Samadhi.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-037\",\"year_num\":2001},{\"title\":\"Kashi Ka Assi\",\"author\":\"Kashinath Singh\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":2004,\"era\":\"Contemporary India\",\"region\":\"Varanasi\",\"genres\":[\"city\",\"satire\",\"politics\",\"oral culture\"],\"why\":\"Tea-shop argument, profanity, politics and neighbourhood life make Banaras itself the protagonist.\",\"format\":\"Linked fiction\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-038\",\"year_num\":2004},{\"title\":\"Mohandas\",\"author\":\"Uday Prakash\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":2005,\"era\":\"Contemporary India\",\"region\":\"Central / North India\",\"genres\":[\"caste\",\"corruption\",\"identity\",\"state\"],\"why\":\"A devastating novella about a poor man's identity being stolen by a more powerful namesake, turning bureaucratic corruption, caste privilege and the promise of modern citizenship into Kafkaesque violence.\",\"format\":\"Novella\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-039\",\"year_num\":2005,\"novelTags\":[\"Only Temple\"],\"novelNote\":\"Identity, caste and institutions turning protection into violence.\"},{\"title\":\"Rait Samadhi (Tomb of Sand)\",\"author\":\"Geetanjali Shree\",\"shelf\":\"Hindi original\",\"lang\":\"Hindi\",\"year\":2018,\"era\":\"Contemporary India\",\"region\":\"North India / India-Pakistan border\",\"genres\":[\"experimental\",\"Partition\",\"ageing\",\"gender\"],\"why\":\"An exuberant late-life border crossing that turns Partition, language, family and gender into formal play.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-040\",\"year_num\":2018,\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Permission to be formally ambitious.\"}]},{\"code\":\"ENG\",\"language\":\"English\",\"intro\":\"Indian writing in English ranges from colonial-era social realism to postcolonial nation-making, metropolitan satire, speculative fiction, caste, ecology, migration and conflict. English becomes one of India's own literary languages rather than merely a colonial inheritance.\",\"books\":[{\"title\":\"Untouchable\",\"author\":\"Mulk Raj Anand\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1935,\"era\":\"Colonial & early modernity\",\"region\":\"North India\",\"genres\":[\"caste\",\"social realism\",\"labour\"],\"why\":\"A single day in a sanitation worker's life exposes the everyday mechanics and humiliations of untouchability.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-041\",\"year_num\":1935},{\"title\":\"Kanthapura\",\"author\":\"Raja Rao\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1938,\"era\":\"Colonial & early modernity\",\"region\":\"Karnataka / fictional village\",\"genres\":[\"nationalism\",\"village\",\"oral style\",\"colonialism\"],\"why\":\"Gandhian nationalism arrives in a South Indian village through a narrative voice shaped by oral storytelling.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-042\",\"year_num\":1938},{\"title\":\"All About H. Hatterr\",\"author\":\"G. V. Desani\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1948,\"era\":\"Nation-making & post-Partition\",\"region\":\"Pan-Indian / comic\",\"genres\":[\"experimental\",\"comic\",\"language\",\"identity\"],\"why\":\"A wildly hybrid English that mocks spiritual seeking, colonial language and fixed ideas of 'Indian' style.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-043\",\"year_num\":1948},{\"title\":\"Train to Pakistan\",\"author\":\"Khushwant Singh\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1956,\"era\":\"Nation-making & post-Partition\",\"region\":\"Punjab\",\"genres\":[\"Partition\",\"communalism\",\"village\"],\"why\":\"Compact, vivid and humane: Partition enters a village through trains, rumor and impossible moral choices.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-044\",\"year_num\":1956},{\"title\":\"The Guide\",\"author\":\"R. K. Narayan\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1958,\"era\":\"Nation-making & post-Partition\",\"region\":\"Malgudi / South India\",\"genres\":[\"comic\",\"morality\",\"small town\",\"religion\"],\"why\":\"An ordinary fixer becomes a holy man; a deceptively simple study of performance, faith and provincial modernity.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-045\",\"year_num\":1958},{\"title\":\"The Strange Case of Billy Biswas\",\"author\":\"Arun Joshi\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1971,\"era\":\"Nation-making & post-Partition\",\"region\":\"Delhi & central Indian tribal belt\",\"genres\":[\"alienation\",\"modernity\",\"tribal encounter\",\"psychological\"],\"why\":\"A metropolitan anthropologist rejects elite life, raising uneasy questions about modernity, desire and romanticizing the 'primitive'.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-046\",\"year_num\":1971},{\"title\":\"Clear Light of Day\",\"author\":\"Anita Desai\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1980,\"era\":\"Emergency to liberalisation\",\"region\":\"Old Delhi\",\"genres\":[\"family\",\"memory\",\"Partition\",\"domestic\"],\"why\":\"Partition and national history sit quietly inside sibling resentments, ageing houses and Old Delhi memory.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-047\",\"year_num\":1980},{\"title\":\"Midnight's Children\",\"author\":\"Salman Rushdie\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1981,\"era\":\"Emergency to liberalisation\",\"region\":\"Bombay & India-wide\",\"genres\":[\"historical\",\"magical realism\",\"nation\",\"politics\"],\"why\":\"The foundational maximalist novel of independent India: nation-building, Emergency, memory and unreliable history.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-048\",\"year_num\":1981},{\"title\":\"In Custody\",\"author\":\"Anita Desai\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1984,\"era\":\"Emergency to liberalisation\",\"region\":\"Delhi & North India\",\"genres\":[\"language\",\"Urdu\",\"decline\",\"academia\"],\"why\":\"A Hindi lecturer's obsession with an ageing Urdu poet becomes a meditation on language loss and cultural prestige.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-049\",\"year_num\":1984},{\"title\":\"English, August\",\"author\":\"Upamanyu Chatterjee\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1988,\"era\":\"Emergency to liberalisation\",\"region\":\"Small-town bureaucracy\",\"genres\":[\"bureaucracy\",\"satire\",\"youth\",\"state\"],\"why\":\"The IAS seen from inside by a bored, urban young officer: state power as paperwork, absurdity and cultural dislocation.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-050\",\"year_num\":1988},{\"title\":\"The Shadow Lines\",\"author\":\"Amitav Ghosh\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1988,\"era\":\"Emergency to liberalisation\",\"region\":\"Kolkata, Dhaka & London\",\"genres\":[\"borders\",\"memory\",\"communalism\",\"family\"],\"why\":\"One of the best novels on how borders live in memory and how distant political events enter intimate family histories.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-051\",\"year_num\":1988},{\"title\":\"The Great Indian Novel\",\"author\":\"Shashi Tharoor\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1989,\"era\":\"Emergency to liberalisation\",\"region\":\"India-wide\",\"genres\":[\"political satire\",\"myth retelling\",\"history\"],\"why\":\"Recasts twentieth-century Indian politics through the Mahabharata, useful for seeing how myth and political memory interact.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-052\",\"year_num\":1989},{\"title\":\"A Suitable Boy\",\"author\":\"Vikram Seth\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1993,\"era\":\"Emergency to liberalisation\",\"region\":\"North India / fictional states\",\"genres\":[\"family saga\",\"elections\",\"land reform\",\"religion\"],\"why\":\"A huge social panorama of the 1950s: marriage, university, zamindari abolition, elections, industry and Hindu-Muslim tension.\",\"format\":\"Epic novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-053\",\"year_num\":1993},{\"title\":\"A Fine Balance\",\"author\":\"Rohinton Mistry\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1995,\"era\":\"Emergency to liberalisation\",\"region\":\"Western India / Bombay\",\"genres\":[\"Emergency\",\"caste\",\"poverty\",\"city\"],\"why\":\"An emotionally punishing panorama of caste, migration, informal labour and the coercive underside of the Emergency.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-054\",\"year_num\":1995,\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Policy and state violence entering ordinary bodies and relationships.\"},{\"title\":\"The Calcutta Chromosome\",\"author\":\"Amitav Ghosh\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1995,\"era\":\"Emergency to liberalisation\",\"region\":\"Kolkata & global\",\"genres\":[\"speculative\",\"science\",\"colonialism\",\"mystery\"],\"why\":\"A strange techno-gothic alternative history of malaria research that unsettles who gets to produce scientific knowledge.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-055\",\"year_num\":1995},{\"title\":\"The Moor's Last Sigh\",\"author\":\"Salman Rushdie\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1995,\"era\":\"Emergency to liberalisation\",\"region\":\"Bombay / Mumbai\",\"genres\":[\"family saga\",\"communalism\",\"city\",\"history\"],\"why\":\"A family saga in which Bombay's plural culture, communal politics and national transformation become inseparable from private inheritance and memory.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"year_num\":1995,\"id\":\"IND-056\",\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Family, city and communal politics braided together.\"},{\"title\":\"The God of Small Things\",\"author\":\"Arundhati Roy\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":1997,\"era\":\"Emergency to liberalisation\",\"region\":\"Kerala\",\"genres\":[\"family\",\"caste\",\"gender\",\"politics\"],\"why\":\"Family tragedy, caste and forbidden love in Kerala, written with a language that bends English toward childhood and Malayalam rhythms.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-057\",\"year_num\":1997,\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Personal laws and nonlinear revelation.\"},{\"title\":\"Family Matters\",\"author\":\"Rohinton Mistry\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2002,\"era\":\"Contemporary India\",\"region\":\"Mumbai / Parsi community\",\"genres\":[\"family\",\"minority\",\"city\",\"ageing\"],\"why\":\"A close view of Parsi family life, ageing, housing pressure and communal politics in Mumbai.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-058\",\"year_num\":2002},{\"title\":\"The Hungry Tide\",\"author\":\"Amitav Ghosh\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2004,\"era\":\"Contemporary India\",\"region\":\"Sundarbans\",\"genres\":[\"ecology\",\"migration\",\"state violence\",\"river\"],\"why\":\"Where conservation, refugee history, dolphins, language and precarious island life collide in the Sundarbans.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-059\",\"year_num\":2004},{\"title\":\"Sacred Games\",\"author\":\"Vikram Chandra\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2006,\"era\":\"Contemporary India\",\"region\":\"Mumbai\",\"genres\":[\"crime\",\"city\",\"police\",\"underworld\"],\"why\":\"A sprawling Mumbai crime novel that connects police work, organised crime, religion, corruption and post-1990s urban power.\",\"format\":\"Epic crime novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-060\",\"year_num\":2006},{\"title\":\"The White Tiger\",\"author\":\"Aravind Adiga\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2008,\"era\":\"Contemporary India\",\"region\":\"North India, Delhi & Bengaluru\",\"genres\":[\"class\",\"liberalisation\",\"satire\",\"migration\"],\"why\":\"A deliberately acidic view of upward mobility, servitude, entrepreneurship and the moral grammar of unequal growth.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-061\",\"year_num\":2008},{\"title\":\"Serious Men\",\"author\":\"Manu Joseph\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2010,\"era\":\"Contemporary India\",\"region\":\"Mumbai\",\"genres\":[\"science\",\"caste\",\"class\",\"satire\"],\"why\":\"A comic war over prestige inside a research institute, connecting scientific authority with caste and class ambition.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":false,\"id\":\"IND-062\",\"year_num\":2010},{\"title\":\"Em and the Big Hoom\",\"author\":\"Jerry Pinto\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2012,\"era\":\"Contemporary India\",\"region\":\"Mumbai / Goan-Catholic family\",\"genres\":[\"family\",\"mental illness\",\"care\",\"city\"],\"why\":\"Intimate, funny and painful family fiction about care, illness and minority middle-class life in Mumbai.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-063\",\"year_num\":2012},{\"title\":\"Narcopolis\",\"author\":\"Jeet Thayil\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2012,\"era\":\"Contemporary India\",\"region\":\"Bombay / Mumbai\",\"genres\":[\"city\",\"drugs\",\"margins\",\"experimental\"],\"why\":\"Opium dens, migrants, hijras and vanished Bombay worlds produce a hallucinatory counter-history of the city.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-064\",\"year_num\":2012},{\"title\":\"The Mysterious Ailment of Rupi Baskey\",\"author\":\"Hansda Sowvendra Shekhar\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2014,\"era\":\"Contemporary India\",\"region\":\"Jharkhand / Santhal community\",\"genres\":[\"Adivasi life\",\"family\",\"gender\",\"rural life\"],\"why\":\"A rare English-language novel grounded in Santhal social life, domestic tensions, belief and the texture of rural Jharkhand.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-065\",\"year_num\":2014},{\"title\":\"When the River Sleeps\",\"author\":\"Easterine Kire\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2014,\"era\":\"Contemporary India\",\"region\":\"Nagaland\",\"genres\":[\"folklore\",\"quest\",\"nature\",\"Northeast\"],\"why\":\"Naga cosmology and forest knowledge structure the novel from within rather than appearing as ethnographic decoration.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-066\",\"year_num\":2014},{\"title\":\"The Far Field\",\"author\":\"Madhuri Vijay\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2019,\"era\":\"Contemporary India\",\"region\":\"Karnataka & Kashmir\",\"genres\":[\"Kashmir\",\"conflict\",\"privilege\",\"memory\"],\"why\":\"A useful, uncomfortable novel about an outsider's gaze, privilege and the moral difficulty of entering Kashmir's conflict.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-067\",\"year_num\":2019},{\"title\":\"Djinn Patrol on the Purple Line\",\"author\":\"Deepa Anappara\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2020,\"era\":\"Contemporary India\",\"region\":\"North Indian megacity / basti\",\"genres\":[\"children\",\"crime\",\"urban poverty\",\"inequality\"],\"why\":\"Missing children in an informal settlement are seen through a child's detective game, preserving humour amid structural neglect.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-068\",\"year_num\":2020},{\"title\":\"Quarterlife\",\"author\":\"Devika Rege\",\"shelf\":\"English original\",\"lang\":\"English\",\"year\":2023,\"era\":\"Contemporary India\",\"region\":\"Mumbai & western India\",\"genres\":[\"politics\",\"youth\",\"ideology\",\"class\"],\"why\":\"A multi-perspective novel of young adults navigating ambition, identity and ideological polarisation in contemporary India.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-069\",\"year_num\":2023}]},{\"code\":\"BEN\",\"language\":\"Bengali\",\"intro\":\"Bengali fiction helped shape the modern Indian novel. These works move through nationalism, rural Bengal, Calcutta, women's lives, revolutionary politics, ecology and the moral crises of modernity.\",\"books\":[{\"title\":\"The Home and the World\",\"author\":\"Rabindranath Tagore\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1916,\"era\":\"Colonial & early modernity\",\"region\":\"Bengal\",\"genres\":[\"nationalism\",\"gender\",\"politics\",\"domestic\"],\"why\":\"Swadeshi nationalism enters a marriage, allowing Tagore to question charisma, patriotism and political masculinity.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-070\",\"year_num\":1916},{\"title\":\"Pather Panchali\",\"author\":\"Bibhutibhushan Bandyopadhyay\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1929,\"era\":\"Colonial & early modernity\",\"region\":\"Rural Bengal\",\"genres\":[\"childhood\",\"rural life\",\"poverty\",\"nature\"],\"why\":\"A deeply observant rural childhood in which poverty matters, but so do weather, curiosity, landscape and ordinary wonder.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-071\",\"year_num\":1929},{\"title\":\"The Boatman of the Padma\",\"author\":\"Manik Bandopadhyay\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1936,\"era\":\"Colonial & early modernity\",\"region\":\"Padma river / Bengal delta\",\"genres\":[\"labour\",\"river\",\"poverty\",\"utopia\"],\"why\":\"Fisherfolk, hunger, desire and a seductive utopian scheme make the river economy feel materially alive.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-072\",\"year_num\":1936},{\"title\":\"Aranyak\",\"author\":\"Bibhutibhushan Bandyopadhyay\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1939,\"era\":\"Colonial & early modernity\",\"region\":\"Forests of Bihar\",\"genres\":[\"ecology\",\"Adivasi encounter\",\"land\",\"memory\"],\"why\":\"A land manager's lyrical memory of forest clearance, dispossession and his own complicity in transforming the landscape.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-073\",\"year_num\":1939},{\"title\":\"Chowringhee\",\"author\":\"Sankar\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1962,\"era\":\"Nation-making & post-Partition\",\"region\":\"Kolkata\",\"genres\":[\"city\",\"hotel\",\"class\",\"cosmopolitanism\"],\"why\":\"A grand hotel becomes a social x-ray of postcolonial Calcutta\u2014service labour, wealth, performance and loneliness.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":false,\"id\":\"IND-074\",\"year_num\":1962},{\"title\":\"The First Promise\",\"author\":\"Ashapurna Devi\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1964,\"era\":\"Nation-making & post-Partition\",\"region\":\"Bengal\",\"genres\":[\"women\",\"family\",\"reform\",\"domestic history\"],\"why\":\"The long struggle of a woman against the structures of nineteenth-century domestic patriarchy, written with social breadth.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-075\",\"year_num\":1964},{\"title\":\"Mother of 1084\",\"author\":\"Mahasweta Devi\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Bengali\",\"year\":1974,\"era\":\"Nation-making & post-Partition\",\"region\":\"Kolkata\",\"genres\":[\"Naxalite movement\",\"motherhood\",\"state violence\",\"class\"],\"why\":\"A mother reconstructs the political life of her dead Naxalite son and discovers the class structure she had accepted.\",\"format\":\"Novella\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-076\",\"year_num\":1974,\"novelTags\":[\"Only Temple\"],\"novelNote\":\"Institutions operating normally while a human being is destroyed.\"}]},{\"code\":\"URD\",\"language\":\"Urdu\",\"intro\":\"Urdu fiction is indispensable for North Indian Muslim life, courtesan culture, reform, Progressive writing, Partition, migration and the fate of composite culture.\",\"books\":[{\"title\":\"Umrao Jaan Ada\",\"author\":\"Mirza Hadi Ruswa\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1899,\"era\":\"Colonial & early modernity\",\"region\":\"Lucknow\",\"genres\":[\"courtesan culture\",\"gender\",\"city\",\"memory\"],\"why\":\"A courtesan's life opens the refined, precarious world of nineteenth-century Lucknow and the politics of respectability.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-077\",\"year_num\":1899},{\"title\":\"Angarey\",\"author\":\"Sajjad Zaheer, Rashid Jahan, Ahmed Ali & Mahmud-uz-Zafar\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1932,\"era\":\"Colonial & early modernity\",\"region\":\"North India\",\"genres\":[\"short stories\",\"reform\",\"religion\",\"gender\"],\"why\":\"Provocative modernist stories attacking hypocrisy and social conservatism; crucial to the prehistory of progressive writing.\",\"format\":\"Story collection\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-078\",\"year_num\":1932},{\"title\":\"Selected Short Stories\",\"author\":\"Ismat Chughtai\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1945,\"era\":\"Colonial & early modernity\",\"region\":\"North India\",\"genres\":[\"women\",\"interiority\",\"family\",\"social realism\"],\"why\":\"Chughtai's sharp, unsentimental stories make domestic life politically legible without turning characters into arguments; especially useful for writing women's interior worlds.\",\"format\":\"Story collection\",\"level\":\"Easy\",\"core\":true,\"year_num\":1945,\"id\":\"IND-079\",\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Women's interiority with unsentimental precision.\"},{\"title\":\"The Crooked Line (Terhi Lakir)\",\"author\":\"Ismat Chughtai\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1945,\"era\":\"Colonial & early modernity\",\"region\":\"North India\",\"genres\":[\"women\",\"sexuality\",\"education\",\"modernity\"],\"why\":\"A girl's coming-of-age becomes a fierce account of female desire, education, reform and contradictions in Muslim middle-class life.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-080\",\"year_num\":1945},{\"title\":\"The Dog of Tithwal\",\"author\":\"Saadat Hasan Manto\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1950,\"era\":\"Nation-making & post-Partition\",\"region\":\"Kashmir / India-Pakistan frontline\",\"genres\":[\"Partition\",\"war\",\"absurdism\",\"short story\"],\"why\":\"Soldiers on opposing sides turn a stray dog into an object of nationalist suspicion. A miniature lesson in how political lines manufacture cruelty.\",\"format\":\"Short story\",\"level\":\"Easy\",\"core\":true,\"year_num\":1950,\"id\":\"IND-081\",\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Nationalism made absurd through one small life.\"},{\"title\":\"Toba Tek Singh\",\"author\":\"Saadat Hasan Manto\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1955,\"era\":\"Nation-making & post-Partition\",\"region\":\"Punjab / India-Pakistan border\",\"genres\":[\"Partition\",\"absurdism\",\"politics\",\"short story\"],\"why\":\"A lunatic asylum becomes the most precise possible stage for the absurdity of Partition and political borders imposed on ordinary people.\",\"format\":\"Short story\",\"level\":\"Easy\",\"core\":true,\"year_num\":1955,\"id\":\"IND-082\",\"novelTags\":[\"Craft\",\"Only Temple\"],\"novelNote\":\"Ordinary people under absurd communal pressure.\"},{\"title\":\"River of Fire (Aag Ka Darya)\",\"author\":\"Qurratulain Hyder\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1959,\"era\":\"Nation-making & post-Partition\",\"region\":\"North India / South Asia\",\"genres\":[\"historical epic\",\"Partition\",\"civilisation\",\"identity\"],\"why\":\"Sweeps across centuries to make Partition look less like a clean break and more like violence against layered civilizational memory.\",\"format\":\"Epic novel\",\"level\":\"Hard\",\"core\":true,\"id\":\"IND-083\",\"year_num\":1959},{\"title\":\"The Women's Courtyard (Aangan)\",\"author\":\"Khadija Mastur\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1962,\"era\":\"Nation-making & post-Partition\",\"region\":\"North India\",\"genres\":[\"women\",\"nationalism\",\"family\",\"Partition\"],\"why\":\"The independence movement viewed from a women's domestic courtyard rather than the podium of nationalist history.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-084\",\"year_num\":1962},{\"title\":\"Basti\",\"author\":\"Intizar Husain\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Urdu\",\"year\":1979,\"era\":\"Emergency to liberalisation\",\"region\":\"North India & Pakistan\",\"genres\":[\"Partition\",\"memory\",\"migration\",\"myth\"],\"why\":\"Migration and lost homelands are remembered through myth, ecology and fragmentary memory rather than documentary realism.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-085\",\"year_num\":1979}]},{\"code\":\"PUN\",\"language\":\"Punjabi\",\"intro\":\"Punjabi fiction here is inseparable from Partition: abduction, communal violence, displacement, honour, memory and the destruction of shared rural worlds.\",\"books\":[{\"title\":\"Hymns in Blood (Khoon de Sohile)\",\"author\":\"Nanak Singh\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Punjabi\",\"year\":1948,\"era\":\"Nation-making & post-Partition\",\"region\":\"Punjab\",\"genres\":[\"Partition\",\"communalism\",\"violence\"],\"why\":\"An immediate Punjabi literary response to Partition violence, written close to the historical rupture itself.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-086\",\"year_num\":1948},{\"title\":\"Pinjar\",\"author\":\"Amrita Pritam\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Punjabi\",\"year\":1950,\"era\":\"Nation-making & post-Partition\",\"region\":\"Punjab\",\"genres\":[\"Partition\",\"women\",\"abduction\",\"identity\"],\"why\":\"Partition through a woman's abducted body, where national honor and personal identity become brutally entangled.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-087\",\"year_num\":1950}]},{\"code\":\"MAL\",\"language\":\"Malayalam\",\"intro\":\"One of India's richest modern traditions: caste reform, coast and village life, Gulf migration, gendered power, media, ecology and highly experimental narrative forms.\",\"books\":[{\"title\":\"Indulekha\",\"author\":\"O. Chandu Menon\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Malayalam\",\"year\":1889,\"era\":\"Colonial & early modernity\",\"region\":\"Kerala\",\"genres\":[\"social reform\",\"marriage\",\"modernity\",\"caste\"],\"why\":\"An early Malayalam social novel where English education, marriage reform and caste privilege meet a changing Kerala.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-088\",\"year_num\":1889},{\"title\":\"Chemmeen\",\"author\":\"Thakazhi Sivasankara Pillai\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Malayalam\",\"year\":1956,\"era\":\"Nation-making & post-Partition\",\"region\":\"Kerala coast\",\"genres\":[\"fishing community\",\"love\",\"caste\",\"sea\"],\"why\":\"Myth, love and the material life of a coastal fishing community; a classic for seeing Kerala beyond landowning elites.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-089\",\"year_num\":1956},{\"title\":\"The Legends of Khasak\",\"author\":\"O. V. Vijayan\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Malayalam\",\"year\":1969,\"era\":\"Nation-making & po ctable middle-class ideas of home and morality.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-097\",\"year_num\":1973},{\"title\":\"The Grip of Change\",\"author\":\"P. Sivakami\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Tamil\",\"year\":1989,\"era\":\"Emergency to liberalisation\",\"region\":\"Tamil Nadu\",\"genres\":[\"Dalit\",\"caste\",\"gender\",\"politics\"],\"why\":\"A Dalit feminist novel that refuses simple heroes, examining oppression both across caste and inside subordinated communities.\",\"format\":\"Novel + sequel/critical revisit\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-098\",\"year_num\":1989},{\"title\":\"Seasons of the Palm\",\"author\":\"Perumal Murugan\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Tamil\",\"year\":2000,\"era\":\"Contemporary India\",\"region\":\"Kongunadu / Tamil Nadu\",\"genres\":[\"Dalit\",\"bonded labour\",\"childhood\",\"rural life\"],\"why\":\"A bonded Dalit goatherd's world is rendered with lyrical attention to work, hunger, humiliation, friendship and landscape.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-099\",\"year_num\":2000},{\"title\":\"One Part Woman\",\"author\":\"Perumal Murugan\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Tamil\",\"year\":2010,\"era\":\"Contemporary India\",\"region\":\"Kongunadu / Tamil Nadu\",\"genres\":[\"marriage\",\"fertility\",\"caste\",\"religion\"],\"why\":\"Childlessness, ritual, caste community and marital intimacy expose the pressure that society can place on a private relationship.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-100\",\"year_num\":2010},{\"title\":\"Pyre\",\"author\":\"Perumal Murugan\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Tamil\",\"year\":2013,\"era\":\"Contemporary India\",\"region\":\"Rural Tamil Nadu\",\"genres\":[\"caste\",\"inter-caste marriage\",\"violence\",\"village\"],\"why\":\"A spare, relentless inter-caste love story that sh g\":\"Kannada\",\"year\":1978,\"era\":\"Emergency to liberalisation\",\"region\":\"Western Ghats / Karnataka\",\"genres\":[\"displacement\",\"dam\",\"ecology\",\"rural life\"],\"why\":\"A short but potent novel about a family and village life threatened by submergence after dam construction.\",\"format\":\"Novella\",\"level\":\"Easy\",\"core\":false,\"id\":\"IND-105\",\"year_num\":1978},{\"title\":\"Ghachar Ghochar\",\"author\":\"Vivek Shanbhag\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Kannada\",\"year\":2013,\"era\":\"Contemporary India\",\"region\":\"Bengaluru\",\"genres\":[\"family\",\"money\",\"liberalisation\",\"psychological\"],\"why\":\"A family becomes wealthy almost overnight, and money quietly rewires intimacy, power and dependence.\",\"format\":\"Novella\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-106\",\"year_num\":2013},{\"title\":\"Sakina's Kiss\",\"author\":\"Vivek Shanbhag\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Kannada\",\"year\":2021,\"era\":\"Contemporary India\",\"region\":\"Bengaluru / Karnataka\",\"genres\":[\"family\",\"masculinity\",\"politics\",\"memory\"],\"why\":\"A middle-aged man's private anxieties reveal shifting politics, gender expectations and self-deception in contemporary urban India.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-107\",\"year_num\":2021}]},{\"code\":\"MAR\",\"language\":\"Marathi\",\"intro\":\"Marathi fiction here moves through myth, campus alienation, urban modernism, linguistic experiment and queer desire, especially the tension between provincial origins and metropolitan self-making.\",\"books\":[{\"title\":\"Yayati\",\"author\":\"V. S. Khandekar\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Marathi\",\"year\":1959,\"era\":\"Nation-making & post-Partition\",\"region\":\"Mythic India / Marathi modernity\",\"genres\":[\"myth retelling\",\"desire\",\"philosophy\"],\"why\":\"A Mahabharata figure becomes a modern inquiry into appetite, responsibility and the human wish to postpone consequence.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-108\",\"year_num\":1959},{\"title\":\"Cocoon (Kosala)\",\"author\":\"Bhalchandra Nemade\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Marathi\",\"year\":1963,\"era\":\"Nation-making & post-Partition\",\"region\":\"Maharashtra / Pune\",\"genres\":[\"coming of age\",\"alienation\",\"modernism\",\"education\"],\"why\":\"A sardonic student narrator captures provincial aspiration, education and alienation in post-independence Maharashtra.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-109\",\"year_num\":1963},{\"title\":\"Seven Sixes Are Forty-Three\",\"author\":\"Kiran Nagarkar\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Marathi\",\"year\":1974,\"era\":\"Nation-making & post-Partition\",\"region\":\"Mumbai / Maharashtra\",\"genres\":[\"experimental\",\"urban life\",\"relationships\",\"modernism\"],\"why\":\"Formally inventive and urban, this is a useful bridge between Marathi literary modernism and later cosmopolitan fiction.\",\"format\":\"Novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-110\",\"year_num\":1974},{\"title\":\"Cobalt Blue\",\"author\":\"Sachin Kundalkar\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Marathi\",\"year\":2006,\"era\":\"Contemporary India\",\"region\":\"Pune / urban Maharashtra\",\"genres\":[\"queer\",\"family\",\"desire\",\"middle class\"],\"why\":\"A brother and sister fall for the same male lodger, opening a lyrical space for queer desire and middle-class family secrecy.\",\"format\":\"Novel\",\"level\":\"Easy\",\"core\":true,\"id\":\"IND-111\",\"year_num\":2006}]},{\"code\":\"GUJ\",\"language\":\"Gujarati\",\"intro\":\"A long arc from nineteenth-century historical and reformist fiction to Dalit writing from below, showing transformations in caste, family, duty and rural society.\",\"books\":[{\"title\":\"Karan Ghelo\",\"author\":\"Nandshankar Mehta\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Gujarati\",\"year\":1866,\"era\":\"Colonial & early modernity\",\"region\":\"Gujarat\",\"genres\":[\"historical\",\"kingship\",\"colonial-era novel\"],\"why\":\"Often treated as the first Gujarati novel; historical fiction became a way to think about social decline and colonial modernity.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-112\",\"year_num\":1866},{\"title\":\"Saraswatichandra\",\"author\":\"Govardhanram Tripathi\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Gujarati\",\"year\":1887,\"era\":\"Colonial & early modernity\",\"region\":\"Gujarat\",\"genres\":[\"social epic\",\"reform\",\"family\",\"philosophy\"],\"why\":\"A vast nineteenth-century Gujarati social world\u2014family, reform, duty, statecraft and the making of the modern self.\",\"format\":\"Multi-volume novel\",\"level\":\"Hard\",\"core\":false,\"id\":\"IND-113\",\"year_num\":1887},{\"title\":\"The Stepchild (Angaliyat)\",\"author\":\"Joseph Macwan\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Gujarati\",\"year\":1986,\"era\":\"Emergency to liberalisation\",\"region\":\"Central Gujarat\",\"genres\":[\"Dalit\",\"caste\",\"village\",\"social realism\"],\"why\":\"A powerful history from below centred on Vankar weavers and caste domination in rural Gujarat.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-114\",\"year_num\":1986}]},{\"code\":\"ODI\",\"language\":\"Odia\",\"intro\":\"Odia fiction includes early anti-colonial satire and major Adivasi-centred novels; land, debt, law, reform and exploitation are central.\",\"books\":[{\"title\":\"Six Acres and a Third\",\"author\":\"Fakir Mohan Senapati\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Odia\",\"year\":1897,\"era\":\"Colonial & early modernity\",\"region\":\"Odisha\",\"genres\":[\"satire\",\"land\",\"colonialism\",\"rural society\"],\"why\":\"A wickedly funny early anti-realist novel about land-grabbing, law and the social transformations of colonial rule.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-115\",\"year_num\":1897},{\"title\":\"Basanti\",\"author\":\"Nine-member Sabuja literary collective\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Odia\",\"year\":1931,\"era\":\"Colonial & early modernity\",\"region\":\"Odisha\",\"genres\":[\"women\",\"reform\",\"education\",\"marriage\"],\"why\":\"A rare collaborative early feminist-social novel imagining educated womanhood, companionship and reform in Odia society.\",\"format\":\"Collaborative novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-116\",\"year_num\":1931},{\"title\":\"Paraja\",\"author\":\"Gopinath Mohanty\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Odia\",\"year\":1945,\"era\":\"Colonial & early modernity\",\"region\":\"Koraput / Odisha\",\"genres\":[\"Adivasi life\",\"debt\",\"land\",\"exploitation\"],\"why\":\"A Paraja tribal family's descent into debt-bondage makes land, moneylending and colonial administration painfully concrete.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":true,\"id\":\"IND-117\",\"year_num\":1945}]},{\"code\":\"ASM\",\"language\":\"Assamese\",\"intro\":\"A literary route into Northeast India through widowhood, Vaishnavite institutions, ethnic conflict, Bodo history, political violence and women's survival.\",\"books\":[{\"title\":\"Pages Stained with Blood\",\"author\":\"Indira Goswami\",\"shelf\":\"Translated Indian literature\",\"lang\":\"Assamese\",\"year\":1984,\"era\":\"Emergency to liberalisation\",\"region\":\"Delhi\",\"genres\":[\"1984\",\"communal violence\",\"city\",\"witness\"],\"why\":\"A literary witness to anti-Sikh violence in Delhi, mixing public catastrophe with the narrator's personal urban life.\",\"format\":\"Novel\",\"level\":\"Medium\",\"core\":false,\"id\":\"IND-118\",\"year_num\":1984},{\"title\":\"The Moth-Eaten Howdah of the Tusker\",\"author\":\"Indira Goswami\",\"shelf\":\"Translated Indian literature\",\"lan .nav a{font-size:10px}.atlas-hero-inner{padding:42px 14px 34px;gap:25px}.atlas-hero h1{font-size:48px}.atlas-hero p{font-size:17px}main{padding:20px 14px 50px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.filters label{flex:1;min-width:44%}.filters select{max-width:100%;width:100%}.card{padding:18px}.summary,.results{flex-wrap:wrap}.hero-card{padding:18px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv hidden>\u003cspan id=\"savedCount\">\u003c/span>\u003cbutton id=\"savedTop\">\u003c/button>\u003cdiv id=\"tabs\" class=\"tabs\">\u003c/div>\u003cspan id=\"total\">\u003c/span>\u003c/div>\u003cdiv class=\"top\">\u003cdiv class=\"nav\">\u003cspan class=\"logo\">THE READING ATLAS\u003c/span>\u003ca href=\"#collection\">Explore collection\u003c/a>\u003ca href=\"#reading-notes\">Notes &amp; sources\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"atlas-hero\">\u003cdiv class=\"atlas-hero-inner\">\u003cdiv>\u003cdiv class=\"eyebrow\" id=\"shelfNo\">\u003c/div>\u003ch1 id=\"shelfTitle\">\u003c/h1>\u003cp id=\"shelfNote\">\u003c/p>\u003c/div>\u003caside class=\"hero-card\">\u003cdiv class=\"eyebrow\">A READER\u2019S GUIDE\u003c/div>\u003cdiv class=\"stats\" id=\"shelfStats\">\u003c/div>\u003cdiv class=\"source-note\">Read widely. Follow your curiosity.\u003cbr>Save a work; return when you\u2019re ready.\u003c/div>\u003c/aside>\u003c/div>\u003c/div>\u003cmain id=\"collection\">\u003ca id=\"original\" target=\"_blank\" rel=\"noopener\" hidden>Original collection\u003c/a>\u003cdiv class=\"toolbar\">\u003clabel class=\"search\">\u003cspan>\u2315\u003c/span>\u003cinput id=\"query\" aria-label=\"Search books\" placeholder=\"Search a title, author, country, or idea\u2026\">\u003c/label>\u003cselect id=\"tag\" aria-label=\"Filter by subject\">\u003coption value=\"\">All subjects\u003c/option>\u003c/select>\u003cselect id=\"sort\" aria-label=\"Sort books\">\u003coption value=\"curated\">Collection order\u003c/option>\u003coption value=\"old\">Oldest first\u003c/option>\u003coption value=\"new\">Newest first\u003c/option>\u003coption value=\"az\">Title A\u2013Z\u003c/option>\u003c/select>\u003cbutton id=\"saved\" aria-pressed=\"false\">\u2606 Saved\u003c/button>\u003cbutton id=\"unread\" aria-pressed=\"false\">Unread\u003c/button>\u003c/div>\u003cdiv class=\"results\">\u003cspan id=\"resultCount\" aria-live=\"polite\">\u003c/span>\u003cspan id=\"progress\">\u003c/span>\u003c/div>\u003cdiv id=\"grid\" class=\"grid\">\u003c/div>\u003cdiv class=\"more\">\u003cbutton id=\"more\">Show more books \u2193\u003c/button>\u003c/div>\u003cdetails class=\"editorial\" id=\"reading-notes\">\u003csummary>About the selections & sources\u003c/summary>\u003cp>The first three shelves reproduce the book data in your supplied HTML files. Their original interactive editions are preserved in the first three tabs of this file. The new shelves are editorial selections, not objective rankings. Science fiction is ordered by first publication; dates generally refer to the original work, not its English translation. Serial and book dates can differ.\u003c/p>\u003cp>\u201cShort novels & novellas\u201d includes compact novels alongside novellas; length varies by translation and edition. \u201cRediscovered treasures\u201d means comparatively overlooked or revived older fiction, not books available only as antique copies. Check libraries, secondhand shops, and modern reissue publishers. A book can appear on more than one shelf.\u003c/p>\u003cdiv id=\"sources\">\u003c/div>\u003cp>Saved and read status is kept in this browser. Export a backup to carry your list to another device.\u003c/p>\u003cbutton id=\"export\">Export reading list\u003c/button> \u003clabel class=\"import\">Import backup\u003cinput type=\"file\" id=\"import\" accept=\"application/json\" hidden>\u003c/label>\u003cspan id=\"backupStatus\" role=\"status\">\u003c/span>\u003c/details>\u003c/main>\u003cfooter>\u003cspan class=\"footer-brand\">The Reading Atlas\u003c/span>\u003cspan>Not a race to finish. An invitation to begin.\u003c/span>\u003ca href=\"#\">Back to top \u2191\u003c/a>\u003c/footer>\u003cscript>const EMBEDDED={\"original-data.json\": {\"india\": [{\"title\": \"Pariksha Guru\", \"author\": \"Srinivas Das\", \"year\": 1882, \"note\": \"An early Hindi novel about imitation, respectability and the anxieties of a new colonial-era middle class.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Chandrakanta\", \"author\": \"Devaki Nandan Khatri\", \"year\": 1888, \"note\": \"A landmark of Hindi popular fiction: tilism, intrigue and serialized storytelling before the modern mass-market novel.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Nirmala\", \"author\": \"Premchand\", \"year\": 1927, \"note\": \"A sharp domestic tragedy about dowry, mismatched marriage, patriarchy and moral suspicion.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Chitralekha\", \"author\": \"Bhagwati Charan Verma\", \"year\": 1934, \"note\": \"Uses a historical setting to ask whether sin lies in acts, desire, circumstance or judgment.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Godaan\", \"author\": \"Premchand\", \"year\": 1936, \"note\": \"One of the clearest fictional windows into agrarian debt, caste hierarchy, aspiration and the rural-urban divide.\", \"tag\": \"Hindi\", \"detail\": \"Ramesh/Hori: a good man destroyed by accumulated social pressures.\", \"bridge\": \"\"}, {\"title\": \"Kafan (The Shroud)\", \"author\": \"Premchand\", \"year\": 1936, \"note\": \"Two impoverished men collect money for a woman's shroud and spend it on food and drink. A brutally unsentimental model for showing deprivation without moral commentary.\", \"tag\": \"Hindi\", \"detail\": \"Read first for tonal restraint and refusal of easy moral judgment.\", \"bridge\": \"\"}, {\"title\": \"Tyagpatra\", \"author\": \"Jainendra Kumar\", \"year\": 1937, \"note\": \"A landmark psychological Hindi novella centred on Mrinal, whose rejection by family and marriage becomes a critique of social respectability and the cost of uncompromising individuality.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Shekhar: Ek Jivani\", \"author\": \"Agyeya\", \"year\": 1941, \"note\": \"Introspective modernism around rebellion, selfhood and the revolutionary imagination under colonial rule.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Gunahon Ka Devta\", \"author\": \"Dharamvir Bharati\", \"year\": 1949, \"note\": \"A beloved post-independence love story shaped by restraint, hierarchy and the emotional culture of the Hindi middle class.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Nadi Ke Dweep\", \"author\": \"Agyeya\", \"year\": 1951, \"note\": \"A major Hindi modernist novel exploring love, solitude, individuality and the tension between emotional intimacy and personal freedom.\", \"tag\": \"Hindi\", \"detail\": \"Psychological interiority and modernist restraint.\", \"bridge\": \"\"}, {\"title\": \"Sara Akash\", \"author\": \"Rajendra Yadav\", \"year\": 1951, \"note\": \"First published as Pret Bolte Hain and later retitled Sara Akash, it turns a claustrophobic arranged marriage into a defining study of the new Hindi middle class and the Nayi Kahani sensibility.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Suraj Ka Satvan Ghoda\", \"author\": \"Dharamvir Bharati\", \"year\": 1952, \"note\": \"A playful story-within-stories that dismantles romantic clich\u00e9s while exposing class and gender relations.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Maila Anchal\", \"author\": \"Phanishwar Nath Renu\", \"year\": 1954, \"note\": \"An extraordinary village-world full of dialect, caste, disease, electoral politics and post-independence hope.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Jhootha Sach\", \"author\": \"Yashpal\", \"year\": 1958, \"note\": \"A large-scale social chronicle of Partition, refugee life, ideology and the remaking of North Indian society.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Andhere Band Kamre\", \"author\": \"Mohan Rakesh\", \"year\": 1961, \"note\": \"One of the central novels of post-independence Hindi modernity: marriage, ambition, emotional estrangement and the loneliness of an educated urban class.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Pachpan Khambe Laal Deewarein\", \"author\": \"Usha Priyamvada\", \"year\": 1961, \"note\": \"A quietly devastating novel about an educated working woman whose financial independence does not free her from family obligation, loneliness or social surveillance.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Ve Din\", \"author\": \"Nirmal Verma\", \"year\": 1964, \"note\": \"Nirmal Verma's first novel and an unusual Hindi work set entirely in Europe; intimacy, exile and postwar memory are rendered through spare, atmospheric modernism.\", \"tag\": \"Hindi\", \"detail\": \"Atmosphere, memory and emotional distance.\", \"bridge\": \"\"}, {\"title\": \"Chaudah Phere\", \"author\": \"Shivani (Gaura Pant)\", \"year\": 1965, \"note\": \"A representative Shivani novel: accessible, socially observant fiction in which marriage, family expectations and Kumaoni cultural life meet the changing aspirations of women.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Aadha Gaon\", \"author\": \"Rahi Masoom Raza\", \"year\": 1966, \"note\": \"Shows Partition from inside a north Indian Muslim village, where kinship, land and local history exceed national slogans.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mitro Marjani\", \"author\": \"Krishna Sobti\", \"year\": 1966, \"note\": \"A bracing, comic and unapologetic challenge to the ideal of the silent, sexually contained daughter-in-law.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Raag Darbari\", \"author\": \"Shrilal Shukla\", \"year\": 1968, \"note\": \"Perhaps the great satirical novel of postcolonial institutions: panchayat, college, bureaucracy, patronage and cynical power.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Bhairavi\", \"author\": \"Shivani (Gaura Pant)\", \"year\": 1969, \"note\": \"One of Shivani's darker novels, following a woman pushed beyond respectable domestic life into unfamiliar social and spiritual worlds; it shows the range beneath her popular reputation.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Aapka Bunty\", \"author\": \"Mannu Bhandari\", \"year\": 1971, \"note\": \"A divorce seen through a child makes changing family structures and middle-class modernity emotionally concrete.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Tamas\", \"author\": \"Bhisham Sahni\", \"year\": 1974, \"note\": \"A restrained but devastating account of how rumor, political manipulation and fear turn neighbours into enemies.\", \"tag\": \"Hindi\", \"detail\": \"Rumor, manipulation and communal violence at human scale.\", \"bridge\": \"\"}, {\"title\": \"Krishnakali\", \"author\": \"Shivani (Gaura Pant)\", \"year\": 1978, \"note\": \"A widely read Shivani novel combining emotional storytelling, female interiority and culturally layered family worlds\u2014useful for understanding the huge Hindi magazine-reading public of the twentieth century.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Ek Chithra Sukh\", \"author\": \"Nirmal Verma\", \"year\": 1979, \"note\": \"A fragmented, intimate novel of theatre people in Delhi, useful for understanding Nirmal Verma's inward modernism and the fragile emotional worlds of the urban intelligentsia.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mahabhoj\", \"a
