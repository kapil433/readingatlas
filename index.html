uthor\": \"Mannu Bhandari\", \"year\": 1979, \"note\": \"A political novel about how a poor man's death becomes raw material for parties, administrators and newspapers.\", \"tag\": \"Hindi\", \"detail\": \"Political institutions convert a poor man's death into raw material.\", \"bridge\": \"\"}, {\"title\": \"Naukar Ki Kameez\", \"author\": \"Vinod Kumar Shukla\", \"year\": 1979, \"note\": \"Deadpan, strange and tender: the clerk's life becomes a lens on obedience, dignity and the absurdity of hierarchy.\", \"tag\": \"Hindi\", \"detail\": \"Quiet small-town dignity, bureaucracy and slight surrealism.\", \"bridge\": \"\"}, {\"title\": \"Zindaginama\", \"author\": \"Krishna Sobti\", \"year\": 1979, \"note\": \"A dense polyphonic portrait of pre-Partition Punjab where Sikh, Muslim and Hindu worlds share land, stories and speech.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kuru Kuru Swaha\", \"author\": \"Manohar Shyam Joshi\", \"year\": 1980, \"note\": \"A deliberately unruly, self-mocking metropolitan novel that breaks with solemn realism and brings postmodern play, popular culture and linguistic mischief into Hindi fiction.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kasap\", \"author\": \"Manohar Shyam Joshi\", \"year\": 1982, \"note\": \"A playful and moving love story rooted in Kumaoni cultural textures, constantly questioning the conventions of romance, narration and literary seriousness.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mujhe Chand Chahiye\", \"author\": \"Surendra Verma\", \"year\": 1993, \"note\": \"An expansive novel of a woman's artistic ambition, theatre and cinema, tracing the tensions between family expectations, sexuality, fame and creative self-making.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Deewar Mein Ek Khidki Rehti Thi\", \"author\": \"Vinod Kumar Shukla\", \"year\": 1997, \"note\": \"Transforms modest salaried life into quiet wonder; a useful antidote to reading India only through crisis and politics.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kali-Katha: Via Bypass\", \"author\": \"Alka Saraogi\", \"year\": 1998, \"note\": \"Tracks Marwari migration, capital, family memory and Kolkata across the twentieth century.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kitne Pakistan\", \"author\": \"Kamleshwar\", \"year\": 2000, \"note\": \"A courtroom of history in which civilizations, nations and victims interrogate the repeated logic of partitioning people.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Peeli Chhatri Wali Ladki\", \"author\": \"Uday Prakash\", \"year\": 2001, \"note\": \"A dark campus tale linking caste, bureaucracy, consumer culture and the post-liberalisation moral atmosphere.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Tirohit\", \"author\": \"Geetanjali Shree\", \"year\": 2001, \"note\": \"An elliptical, layered novel about women, memory and domestic spaces that shows the experimental trajectory Geetanjali Shree developed before Rait Samadhi.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kashi Ka Assi\", \"author\": \"Kashinath Singh\", \"year\": 2004, \"note\": \"Tea-shop argument, profanity, politics and neighbourhood life make Banaras itself the protagonist.\", \"tag\": \"Hindi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mohandas\", \"author\": \"Uday Prakash\", \"year\": 2005, \"note\": \"A devastating novella about a poor man's identity being stolen by a more powerful namesake, turning bureaucratic corruption, caste privilege and the promise of modern citizenship into Kafkaesque violence.\", \"tag\": \"Hindi\", \"detail\": \"Identity, caste and institutions turning protection into violence.\", \"bridge\": \"\"}, {\"title\": \"Rait Samadhi (Tomb of Sand)\", \"author\": \"Geetanjali Shree\", \"year\": 2018, \"note\": \"An exuberant late-life border crossing that turns Partition, language, family and gender into formal play.\", \"tag\": \"Hindi\", \"detail\": \"Permission to be formally ambitious.\", \"bridge\": \"\"}, {\"title\": \"Untouchable\", \"author\": \"Mulk Raj Anand\", \"year\": 1935, \"note\": \"A single day in a sanitation worker's life exposes the everyday mechanics and humiliations of untouchability.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Kanthapura\", \"author\": \"Raja Rao\", \"year\": 1938, \"note\": \"Gandhian nationalism arrives in a South Indian village through a narrative voice shaped by oral storytelling.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"All About H. Hatterr\", \"author\": \"G. V. Desani\", \"year\": 1948, \"note\": \"A wildly hybrid English that mocks spiritual seeking, colonial language and fixed ideas of 'Indian' style.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Train to Pakistan\", \"author\": \"Khushwant Singh\", \"year\": 1956, \"note\": \"Compact, vivid and humane: Partition enters a village through trains, rumor and impossible moral choices.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Guide\", \"author\": \"R. K. Narayan\", \"year\": 1958, \"note\": \"An ordinary fixer becomes a holy man; a deceptively simple study of performance, faith and provincial modernity.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Strange Case of Billy Biswas\", \"author\": \"Arun Joshi\", \"year\": 1971, \"note\": \"A metropolitan anthropologist rejects elite life, raising uneasy questions about modernity, desire and romanticizing the 'primitive'.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Clear Light of Day\", \"author\": \"Anita Desai\", \"year\": 1980, \"note\": \"Partition and national history sit quietly inside sibling resentments, ageing houses and Old Delhi memory.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Midnight's Children\", \"author\": \"Salman Rushdie\", \"year\": 1981, \"note\": \"The foundational maximalist novel of independent India: nation-building, Emergency, memory and unreliable history.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"In Custody\", \"author\": \"Anita Desai\", \"year\": 1984, \"note\": \"A Hindi lecturer's obsession with an ageing Urdu poet becomes a meditation on language loss and cultural prestige.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"English, August\", \"author\": \"Upamanyu Chatterjee\", \"year\": 1988, \"note\": \"The IAS seen from inside by a bored, urban young officer: state power as paperwork, absurdity and cultural dislocation.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Shadow Lines\", \"author\": \"Amitav Ghosh\", \"year\": 1988, \"note\": \"One of the best novels on how borders live in memory and how distant political events enter intimate family histories.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Great Indian Novel\", \"author\": \"Shashi Tharoor\", \"year\": 1989, \"note\": \"Recasts twentieth-century Indian politics through the Mahabharata, useful for seeing how myth and political memory interact.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Suitable Boy\", \"author\": \"Vikram Seth\", \"year\": 1993, \"note\": \"A huge social panorama of the 1950s: marriage, university, zamindari abolition, elections, industry and Hindu-Muslim tension.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Fine Balance\", \"author\": \"Rohinton Mistry\", \"year\": 1995, \"note\": \"An emotionally punishing panorama of caste, migration, informal labour and the coercive underside of the Emergency.\", \"tag\": \"English\", \"detail\": \"Policy and state violence entering ordinary bodies and relationships.\", \"bridge\": \"\"}, {\"title\": \"The Calcutta Chromosome\", \"author\": \"Amitav Ghosh\", \"year\": 1995, \"note\": \"A strange techno-gothic alternative history of malaria research that unsettles who gets to produce scientific knowledge.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Moor's Last Sigh\", \"author\": \"Salman Rushdie\", \"year\": 1995, \"note\": \"A family saga in which Bombay's plural culture, communal politics and national transformation become inseparable from private inheritance and memory.\", \"tag\": \"English\", \"detail\": \"Family, city and communal politics braided together.\", \"bridge\": \"\"}, {\"title\": \"The God of Small Things\", \"author\": \"Arundhati Roy\", \"year\": 1997, \"note\": \"Family tragedy, caste and forbidden love in Kerala, written with a language that bends English toward childhood and Malayalam rhythms.\", \"tag\": \"English\", \"detail\": \"Personal laws and nonlinear revelation.\", \"bridge\": \"\"}, {\"title\": \"Family Matters\", \"author\": \"Rohinton Mistry\", \"year\": 2002, \"note\": \"A close view of Parsi family life, ageing, housing pressure and communal politics in Mumbai.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Hungry Tide\", \"author\": \"Amitav Ghosh\", \"year\": 2004, \"note\": \"Where conservation, refugee history, dolphins, language and precarious island life collide in the Sundarbans.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Sacred Games\", \"author\": \"Vikram Chandra\", \"year\": 2006, \"note\": \"A sprawling Mumbai crime novel that connects police work, organised crime, religion, corruption and post-1990s urban power.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The White Tiger\", \"author\": \"Aravind Adiga\", \"year\": 2008, \"note\": \"A deliberately acidic view of upward mobility, servitude, entrepreneurship and the moral grammar of unequal growth.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Serious Men\", \"author\": \"Manu Joseph\", \"year\": 2010, \"note\": \"A comic war over prestige inside a research institute, connecting scientific authority with caste and class ambition.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Em and the Big Hoom\", \"author\": \"Jerry Pinto\", \"year\": 2012, \"note\": \"Intimate, funny and painful family fiction about care, illness and minority middle-class life in Mumbai.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Narcopolis\", \"author\": \"Jeet Thayil\", \"year\": 2012, \"note\": \"Opium dens, migrants, hijras and vanished Bombay worlds produce a hallucinatory counter-history of the city.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Mysterious Ailment of Rupi Baskey\", \"author\": \"Hansda Sowvendra Shekhar\", \"year\": 2014, \"note\": \"A rare English-language novel grounded in Santhal social life, domestic tensions, belief and the texture of rural Jharkhand.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"When the River Sleeps\", \"author\": \"Easterine Kire\", \"year\": 2014, \"note\": \"Naga cosmology and forest knowledge structure the novel from within rather than appearing as ethnographic decoration.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Far Field\", \"author\": \"Madhuri Vijay\", \"year\": 2019, \"note\": \"A useful, uncomfortable novel about an outsider's gaze, privilege and the moral difficulty of entering Kashmir's conflict.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Djinn Patrol on the Purple Line\", \"author\": \"Deepa Anappara\", \"year\": 2020, \"note\": \"Missing children in an informal settlement are seen through a child's detective game, preserving humour amid structural neglect.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Quarterlife\", \"author\": \"Devika Rege\", \"year\": 2023, \"note\": \"A multi-perspective novel of young adults navigating ambition, identity and ideological polarisation in contemporary India.\", \"tag\": \"English\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Home and the World\", \"author\": \"Rabindranath Tagore\", \"year\": 1916, \"note\": \"Swadeshi nationalism enters a marriage, allowing Tagore to question charisma, patriotism and political masculinity.\", \"tag\": \"Bengali\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Pather Panchali\", \"author\": \"Bibhutibhushan Bandyopadhyay\", \"year\": 1929, \"note\": \"A deeply observant rural childhood in which poverty matters, but so do weather, curiosity, landscape and ordinary wonder.\", \"tag\": \"Bengali\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Boatman of the Padma\", \"author\": \"Manik Bandopadhyay\", \"year\": 1936, \"note\": \"Fisherfolk, hunger, desire and a seductive utopian scheme make the river economy feel materially alive.\", \"tag\": \"Bengali\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Aranyak\", \"author\": \"Bibhutibhushan Bandyopadhyay\", \"year\": 1939, \"note\": \"A land manager's lyrical memory of forest clearance, dispossession and his own complicity in transforming the landscape.\", \"tag\": \"Bengali\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Chowringhee\", \"author\": \"Sankar\", \"year\": 1962, \"note\": \"A grand hotel becomes a social x-ray of postcolonial Calcutta\u2014service labour, wealth, performance and loneliness.\", \"tag\": \"Bengali\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The First Promise\", \"author\": \"Ashapurna Devi\", \"year\": 1964, \"note\": \"The long struggle of a woman against the structures of nineteenth-century domestic patriarchy, written with social breadth.\", \"tag\": \"Bengali\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Mother of 1084\", \"author\": \"Mahasweta Devi\", \"year\": 1974, \"note\": \"A mother reconstructs the political life of her dead Naxalite son and discovers the class structure she had accepted.\", \"tag\": \"Bengali\", \"detail\": \"Institutions operating normally while a human being is destroyed.\", \"bridge\": \"\"}, {\"title\": \"Umrao Jaan Ada\", \"author\": \"Mirza Hadi Ruswa\", \"year\": 1899, \"note\": \"A courtesan's life opens the refined, precarious world of nineteenth-century Lucknow and the politics of respectability.\", \"tag\": \"Urdu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Angarey\", \"author\": \"Sajjad Zaheer, Rashid Jahan, Ahmed Ali & Mahmud-uz-Zafar\", \"year\": 1932, \"note\": \"Provocative modernist stories attacking hypocrisy and social conservatism; crucial to the prehistory of progressive writing.\", \"tag\": \"Urdu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Selected Short Stories\", \"author\": \"Ismat Chughtai\", \"year\": 1945, \"note\": \"Chughtai's sharp, unsentimental stories make domestic life politically legible without turning characters into arguments; especially useful for writing women's interior worlds.\", \"tag\": \"Urdu\", \"detail\": \"Women's interiority with unsentimental precision.\", \"bridge\": \"\"}, {\"title\": \"The Crooked Line (Terhi Lakir)\", \"author\": \"Ismat Chughtai\", \"year\": 1945, \"note\": \"A girl's coming-of-age becomes a fierce account of female desire, education, reform and contradictions in Muslim middle-class life.\", \"tag\": \"Urdu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Dog of Tithwal\", \"author\": \"Saadat Hasan Manto\", \"year\": 1950, \"note\": \"Soldiers on opposing sides turn a stray dog into an object of nationalist suspicion. A miniature lesson in how political lines manufacture cruelty.\", \"tag\": \"Urdu\", \"detail\": \"Nationalism made absurd through one small life.\", \"bridge\": \"\"}, {\"title\": \"Toba Tek Singh\", \"author\": \"Saadat Hasan Manto\", \"year\": 1955, \"note\": \"A lunatic asylum becomes the most precise possible stage for the absurdity of Partition and political borders imposed on ordinary people.\", \"tag\": \"Urdu\", \"detail\": \"Ordinary people under absurd communal pressure.\", \"bridge\": \"\"}, {\"title\": \"River of Fire (Aag Ka Darya)\", \"author\": \"Qurratulain Hyder\", \"year\": 1959, \"note\": \"Sweeps across centuries to make Partition look less like a clean break and more like violence against layered civilizational memory.\", \"tag\": \"Urdu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Women's Courtyard (Aangan)\", \"author\": \"Khadija Mastur\", \"year\": 1962, \"note\": \"The independence movement viewed from a women's domestic courtyard rather than the podium of nationalist history.\", \"tag\": \"Urdu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Basti\", \"author\": \"Intizar Husain\", \"year\": 1979, \"note\": \"Migration and lost homelands are remembered through myth, ecology and fragmentary memory rather than documentary realism.\", \"tag\": \"Urdu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Hymns in Blood (Khoon de Sohile)\", \"author\": \"Nanak Singh\", \"year\": 1948, \"note\": \"An immediate Punjabi literary response to Partition violence, written close to the historical rupture itself.\", \"tag\": \"Punjabi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Pinjar\", \"author\": \"Amrita Pritam\", \"year\": 1950, \"note\": \"Partition through a woman's abducted body, where national honor and personal identity become brutally entangled.\", \"tag\": \"Punjabi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Indulekha\", \"author\": \"O. Chandu Menon\", \"year\": 1889, \"note\": \"An early Malayalam social novel where English education, marriage reform and caste privilege meet a changing Kerala.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Chemmeen\", \"author\": \"Thakazhi Sivasankara Pillai\", \"year\": 1956, \"note\": \"Myth, love and the material life of a coastal fishing community; a classic for seeing Kerala beyond landowning elites.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Legends of Khasak\", \"author\": \"O. V. Vijayan\", \"year\": 1969, \"note\": \"A teacher arrives in a remote village and encounters myth, desire and metaphysical uncertainty in one of Malayalam's modernist landmarks.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Goat Days\", \"author\": \"Benyamin\", \"year\": 2008, \"note\": \"A Malayali migrant worker's brutal Gulf experience captures the human cost behind remittance economies and migration dreams.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Delhi: A Soliloquy\", \"author\": \"M. Mukundan\", \"year\": 2011, \"note\": \"Delhi seen through Malayali residents across decades, offering a migrant-insider angle on Emergency, 1984 and urban change.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Hangwoman\", \"author\": \"K. R. Meera\", \"year\": 2012, \"note\": \"A woman from a family of executioners confronts spectacle, patriarchy and state violence with savage intelligence.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Jasmine Days\", \"author\": \"Benyamin\", \"year\": 2014, \"note\": \"A young South Asian migrant's perspective on Gulf society, political unrest and the ambiguous security of expatriate life.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Moustache (Meesha)\", \"author\": \"S. Hareesh\", \"year\": 2018, \"note\": \"A mythic, earthy Kuttanad novel where caste, wetland ecology, folk imagination and masculine power become inseparable.\", \"tag\": \"Malayalam\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Ponniyin Selvan\", \"author\": \"Kalki Krishnamurthy\", \"year\": 1954, \"note\": \"Massively influential historical fiction that turns Chola politics, geography and court intrigue into page-turning popular literature.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"A Man, A Home and A World\", \"author\": \"D. Jayakanthan\", \"year\": 1973, \"note\": \"Jayakanthan's humane attention to unconventional lives complicates respectable middle-class ideas of home and morality.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Grip of Change\", \"author\": \"P. Sivakami\", \"year\": 1989, \"note\": \"A Dalit feminist novel that refuses simple heroes, examining oppression both across caste and inside subordinated communities.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Seasons of the Palm\", \"author\": \"Perumal Murugan\", \"year\": 2000, \"note\": \"A bonded Dalit goatherd's world is rendered with lyrical attention to work, hunger, humiliation, friendship and landscape.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"One Part Woman\", \"author\": \"Perumal Murugan\", \"year\": 2010, \"note\": \"Childlessness, ritual, caste community and marital intimacy expose the pressure that society can place on a private relationship.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Pyre\", \"author\": \"Perumal Murugan\", \"year\": 2013, \"note\": \"A spare, relentless inter-caste love story that shows how village scrutiny turns identity into mortal danger.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Poonachi\", \"author\": \"Perumal Murugan\", \"year\": 2016, \"note\": \"The life of a black goat becomes a deceptively gentle fable about surveillance, scarcity, reproduction and vulnerability.\", \"tag\": \"Tamil\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Samskara\", \"author\": \"U. R. Ananthamurthy\", \"year\": 1965, \"note\": \"A Brahmin community's crisis over funeral rites becomes a profound interrogation of purity, hypocrisy and moral action.\", \"tag\": \"Kannada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Bharathipura\", \"author\": \"U. R. Ananthamurthy\", \"year\": 1973, \"note\": \"An upper-caste reformer tries to force social change, and the novel asks who reform is really for and who controls its terms.\", \"tag\": \"Kannada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Dweepa\", \"author\": \"Na. D'Souza\", \"year\": 1978, \"note\": \"A short but potent novel about a family and village life threatened by submergence after dam construction.\", \"tag\": \"Kannada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Ghachar Ghochar\", \"author\": \"Vivek Shanbhag\", \"year\": 2013, \"note\": \"A family becomes wealthy almost overnight, and money quietly rewires intimacy, power and dependence.\", \"tag\": \"Kannada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Sakina's Kiss\", \"author\": \"Vivek Shanbhag\", \"year\": 2021, \"note\": \"A middle-aged man's private anxieties reveal shifting politics, gender expectations and self-deception in contemporary urban India.\", \"tag\": \"Kannada\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Yayati\", \"author\": \"V. S. Khandekar\", \"year\": 1959, \"note\": \"A Mahabharata figure becomes a modern inquiry into appetite, responsibility and the human wish to postpone consequence.\", \"tag\": \"Marathi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cocoon (Kosala)\", \"author\": \"Bhalchandra Nemade\", \"year\": 1963, \"note\": \"A sardonic student narrator captures provincial aspiration, education and alienation in post-independence Maharashtra.\", \"tag\": \"Marathi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Seven Sixes Are Forty-Three\", \"author\": \"Kiran Nagarkar\", \"year\": 1974, \"note\": \"Formally inventive and urban, this is a useful bridge between Marathi literary modernism and later cosmopolitan fiction.\", \"tag\": \"Marathi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Cobalt Blue\", \"author\": \"Sachin Kundalkar\", \"year\": 2006, \"note\": \"A brother and sister fall for the same male lodger, opening a lyrical space for queer desire and middle-class family secrecy.\", \"tag\": \"Marathi\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Karan Ghelo\", \"author\": \"Nandshankar Mehta\", \"year\": 1866, \"note\": \"Often treated as the first Gujarati novel; historical fiction became a way to think about social decline and colonial modernity.\", \"tag\": \"Gujarati\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Saraswatichandra\", \"author\": \"Govardhanram Tripathi\", \"year\": 1887, \"note\": \"A vast nineteenth-century Gujarati social world\u2014family, reform, duty, statecraft and the making of the modern self.\", \"tag\": \"Gujarati\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Stepchild (Angaliyat)\", \"author\": \"Joseph Macwan\", \"year\": 1986, \"note\": \"A powerful history from below centred on Vankar weavers and caste domination in rural Gujarat.\", \"tag\": \"Gujarati\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Six Acres and a Third\", \"author\": \"Fakir Mohan Senapati\", \"year\": 1897, \"note\": \"A wickedly funny early anti-realist novel about land-grabbing, law and the social transformations of colonial rule.\", \"tag\": \"Odia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Basanti\", \"author\": \"Nine-member Sabuja literary collective\", \"year\": 1931, \"note\": \"A rare collaborative early feminist-social novel imagining educated womanhood, companionship and reform in Odia society.\", \"tag\": \"Odia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Paraja\", \"author\": \"Gopinath Mohanty\", \"year\": 1945, \"note\": \"A Paraja tribal family's descent into debt-bondage makes land, moneylending and colonial administration painfully concrete.\", \"tag\": \"Odia\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Pages Stained with Blood\", \"author\": \"Indira Goswami\", \"year\": 1984, \"note\": \"A literary witness to anti-Sikh violence in Delhi, mixing public catastrophe with the narrator's personal urban life.\", \"tag\": \"Assamese\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Moth-Eaten Howdah of the Tusker\", \"author\": \"Indira Goswami\", \"year\": 1986, \"note\": \"A decaying Vaishnavite household reveals the violence of widowhood, ritual authority and social stagnation in Assam.\", \"tag\": \"Assamese\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Felanee\", \"author\": \"Arupa Patangia Kalita\", \"year\": 2003, \"note\": \"A woman's life becomes a ground-level history of agitation, ethnic conflict, displacement and survival in Assam.\", \"tag\": \"Assamese\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"The Bronze Sword of Thengphakhri Tehsildar\", \"author\": \"Indira Goswami\", \"year\": 2009, \"note\": \"Reimagines the Bodo figure Thengphakhri, a woman tax collector whose loyalties shift toward anti-colonial resistance.\", \"tag\": \"Assamese\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Veyi Padagalu (A Thousand Hoods)\", \"author\": \"Viswanatha Satyanarayana\", \"year\": 1934, \"note\": \"A large village chronicle about the erosion of an old social order under modern institutions, markets and changing belief.\", \"tag\": \"Telugu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Untouchable Spring\", \"author\": \"Kalyana Rao\", \"year\": 2000, \"note\": \"A multigenerational Dalit family saga linking caste oppression, Christianity, labour, oral culture and political awakening.\", \"tag\": \"Telugu\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Karmelin\", \"author\": \"Damodar Mauzo\", \"year\": 1981, \"note\": \"A Goan woman's working life and migration to the Gulf complicate postcard images of Goa with class and gendered labour.\", \"tag\": \"Konkani\", \"detail\": \"\", \"bridge\": \"\"}, {\"title\": \"Paro\", \"author\": \"Nagarjun\", \"year\": 1946, \"note\": \"A short Maithili novel confronting mismatched marriage and the social customs that limit women's choices in Mithila.\", \"tag\": \"Maithili\", \"detail\": \"\", \"bridge\": \"\"}], \"nonfiction\": [{\"title\": \"Basic Mathematics\", \"author\": \"Serge Lang\", \"year\": \"\", \"note\": \"Rebuilds algebra, functions, equations, inequalities, geometry and trigonometry without assuming that school mathematics is already automatic.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Fluent algebra is the entry ticket to dynamical systems, probability, modelling and every later quantitative layer.\"}, {\"title\": \"Book of Proof\", \"author\": \"Richard Hammack\", \"year\": \"\", \"note\": \"A gentle first course in logic, sets, induction, contradiction, functions and proof-writing.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Complexity work becomes stronger when you can distinguish intuition, simulation and proof.\"}, {\"title\": \"How to Solve It\", \"author\": \"George P\u00f3lya\", \"year\": \"\", \"note\": \"A short, durable method for attacking unfamiliar mathematical problems by reformulation, analogy and decomposition.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Problem decomposition is also the mental habit behind modelling and computational experimentation.\"}, {\"title\": \"Calculus: Early Transcendentals\", \"author\": \"James Stewart\", \"year\": \"\", \"note\": \"A broad computational calculus spine with enormous exercise depth.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Calculus supplies rates, accumulation and continuous change\u2014the language of dynamical systems.\"}, {\"title\": \"Infinite Powers\", \"author\": \"Steven Strogatz\", \"year\": \"\", \"note\": \"Tells the story and intuition of calculus through motion, curves, waves and approximation.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Shows why local change can explain global behaviour, a recurring complexity theme.\"}, {\"title\": \"Introduction to Linear Algebra\", \"author\": \"Gilbert Strang\", \"year\": \"\", \"note\": \"Builds geometric and computational intuition for vectors, matrices, eigenvalues and linear transformations.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Networks, machine learning, Markov processes and numerical models all live heavily in linear algebra.\"}, {\"title\": \"Linear Algebra Done Right\", \"author\": \"Sheldon Axler\", \"year\": \"\", \"note\": \"Moves from matrix calculation to vector spaces, operators, eigenstructure and proof-oriented abstraction.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Useful for learning to see structural properties that survive changes of representation.\"}, {\"title\": \"Introduction to Probability\", \"author\": \"Joseph K. Blitzstein & Jessica Hwang\", \"year\": \"\", \"note\": \"An unusually intuitive route into conditional probability, random variables, expectation and common distributions.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Complex systems are noisy; probability separates stochastic structure from narrative guesswork.\"}, {\"title\": \"The Drunkard's Walk\", \"author\": \"Leonard Mlodinow\", \"year\": \"\", \"note\": \"Explains randomness, base rates and probability traps through everyday examples.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"A strong antidote to finding false patterns in noisy systems.\"}, {\"title\": \"Statistics\", \"author\": \"David Freedman, Robert Pisani & Roger Purves\", \"year\": \"\", \"note\": \"A skeptical, concept-first introduction to data, regression, experiments and inference.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Model validation matters as much as model construction in complex social systems.\"}, {\"title\": \"Understanding Analysis\", \"author\": \"Stephen Abbott\", \"year\": \"\", \"note\": \"A humane first rigorous real-analysis book on limits, continuity, sequences, compactness and convergence.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Teaches what must be true for informal mathematical arguments about limits and dynamics to be valid.\"}, {\"title\": \"Visual Complex Analysis\", \"author\": \"Tristan Needham\", \"year\": \"\", \"note\": \"Develops complex numbers and analytic functions geometrically before symbolically.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Excellent training in changing representations until structure becomes visible.\"}, {\"title\": \"Elementary Differential Equations and Boundary Value Problems\", \"author\": \"Boyce, DiPrima & Meade\", \"year\": \"\", \"note\": \"The standard bridge from calculus to equations that describe changing systems.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"ODEs are the basic mathematical language of population, epidemic, physical and economic dynamics.\"}, {\"title\": \"Nonlinear Dynamics and Chaos\", \"author\": \"Steven H. Strogatz\", \"year\": \"\", \"note\": \"Fixed points, bifurcations, oscillators, limit cycles and chaos presented with exceptional intuition.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"The mathematical heart of deterministic complexity.\"}, {\"title\": \"Discrete Mathematics with Applications\", \"author\": \"Susanna S. Epp\", \"year\": \"\", \"note\": \"Logic, combinatorics, relations, recursion and graphs\u2014the mathematics native to computer science.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Networks and algorithms are discrete structures before they become software.\"}, {\"title\": \"Graph Theory\", \"author\": \"Reinhard Diestel\", \"year\": \"\", \"note\": \"A rigorous route into paths, trees, connectivity, colouring and structural graph theory.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Gives formal depth beneath network-science measures and visualizations.\"}, {\"title\": \"Convex Optimization\", \"author\": \"Stephen Boyd & Lieven Vandenberghe\", \"year\": \"\", \"note\": \"A modern treatment of optimization problems with strong geometry and applications.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Optimization clarifies what an agent or system is actually maximizing under constraints.\"}, {\"title\": \"Partial Differential Equations: An Introduction\", \"author\": \"Walter A. Strauss\", \"year\": \"\", \"note\": \"Introduces diffusion, waves, Laplace equations and boundary-value problems.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"PDEs connect local rules to spatial patterns, diffusion, transport and continuum systems.\"}, {\"title\": \"Measure, Integration & Real Analysis\", \"author\": \"Sheldon Axler\", \"year\": \"\", \"note\": \"A modern route from measure to Lebesgue integration and rigorous probability foundations.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Provides the mathematical substrate for advanced probability and stochastic modelling.\"}, {\"title\": \"The Joy of x\", \"author\": \"Steven Strogatz\", \"year\": \"\", \"note\": \"A panoramic, friendly tour of mathematical ideas from arithmetic to infinity.\", \"tag\": \"Mathematics\", \"detail\": \"\", \"bridge\": \"Keeps the mathematical spine connected to intuition, culture and curiosity rather than only coursework.\"}, {\"title\": \"Complexity: A Guided Tour\", \"author\": \"Melanie Mitchell\", \"year\": \"\", \"note\": \"The best broad first map of emergence, computation, evolution, networks, cellular automata and adaptation.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"It defines the intellectual territory before you specialize.\"}, {\"title\": \"Thinking in Systems\", \"author\": \"Donella H. Meadows\", \"year\": \"\", \"note\": \"Stocks, flows, feedback, delays, resilience, policy resistance and leverage points in plain language.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Gives a practical vocabulary for diagnosing systems before formal modelling.\"}, {\"title\": \"Complexity: The Emerging Science at the Edge of Order and Chaos\", \"author\": \"M. Mitchell Waldrop\", \"year\": \"\", \"note\": \"The Santa Fe Institute origin story linking physics, economics, evolution and computation.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Shows why complexity became a cross-disciplinary field rather than a single technique.\"}, {\"title\": \"Chaos: Making a New Science\", \"author\": \"James Gleick\", \"year\": \"\", \"note\": \"The classic story of sensitivity, strange attractors and the birth of chaos theory.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Makes nonlinear dynamics culturally and historically legible.\"}, {\"title\": \"Introduction to the Modeling and Analysis of Complex Systems\", \"author\": \"Hiroki Sayama\", \"year\": \"\", \"note\": \"A rare technical bridge combining mathematical models, Python, dynamics, cellular automata, networks and agents.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Ideal central text for turning concepts into executable models.\"}, {\"title\": \"Think Complexity\", \"author\": \"Allen B. Downey\", \"year\": \"\", \"note\": \"Coding-first exploration of cellular automata, fractals, networks, self-organized criticality and agent models.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Turns complexity from vocabulary into experiments you can modify.\"}, {\"title\": \"Linked\", \"author\": \"Albert-L\u00e1szl\u00f3 Barab\u00e1si\", \"year\": \"\", \"note\": \"Story-driven introduction to hubs, preferential attachment and large-scale network structure.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Trains you to ask about connections and topology rather than isolated attributes.\"}, {\"title\": \"Network Science\", \"author\": \"Albert-L\u00e1szl\u00f3 Barab\u00e1si\", \"year\": \"\", \"note\": \"Structured technical treatment of random networks, scale-free networks, robustness, communities and spreading.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Your main bridge from intuitive networks to quantitative analysis.\"}, {\"title\": \"Six Degrees\", \"author\": \"Duncan J. Watts\", \"year\": \"\", \"note\": \"Small worlds, clustering, social connectivity and the mechanics of spreading.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Complements Barab\u00e1si by emphasizing different generative mechanisms.\"}, {\"title\": \"Networks, Crowds, and Markets\", \"author\": \"David Easley & Jon Kleinberg\", \"year\": \"\", \"note\": \"Networks joined to games, markets, cascades, auctions, information and social influence.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Excellent bridge from graph structure to human behaviour and institutions.\"}, {\"title\": \"Sync\", \"author\": \"Steven Strogatz\", \"year\": \"\", \"note\": \"Synchronization in fireflies, hearts, power grids, sleep cycles and coupled oscillators.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Shows how coordination can emerge without a central controller.\"}, {\"title\": \"Emergence\", \"author\": \"Steven Johnson\", \"year\": \"\", \"note\": \"Ants, cities, brains and software become examples of bottom-up organization.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"A strong intuition-builder for local rules generating macro order.\"}, {\"title\": \"Scale\", \"author\": \"Geoffrey West\", \"year\": \"\", \"note\": \"Scaling laws connect metabolism, cities, infrastructure, firms and growth.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Demonstrates that very different systems can share quantitative regularities.\"}, {\"title\": \"The Origin of Wealth\", \"author\": \"Eric D. Beinhocker\", \"year\": \"\", \"note\": \"Reframes the economy as an evolving complex adaptive system rather than an equilibrium machine.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"A major bridge from complexity into markets, innovation and institutions.\"}, {\"title\": \"The Sciences of the Artificial\", \"author\": \"Herbert A. Simon\", \"year\": \"\", \"note\": \"Hierarchy, bounded rationality, near-decomposability, design and artificial systems.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"One of the deepest conceptual roots of complexity, organization and design science.\"}, {\"title\": \"Antifragile\", \"author\": \"Nassim Nicholas Taleb\", \"year\": \"\", \"note\": \"Explores systems that gain from stress, volatility and disorder.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Useful for resilience, nonlinear harm, optionality and intervention under uncertainty.\"}, {\"title\": \"How Nature Works\", \"author\": \"Per Bak\", \"year\": \"\", \"note\": \"The classic case for self-organized criticality and power-law events.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Historically important for thinking about criticality, avalanches and scale.\"}, {\"title\": \"Order Out of Chaos\", \"author\": \"Ilya Prigogine & Isabelle Stengers\", \"year\": \"\", \"note\": \"Far-from-equilibrium thermodynamics, dissipative structures and irreversibility.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"The physical-science route into self-organization.\"}, {\"title\": \"At Home in the Universe\", \"author\": \"Stuart Kauffman\", \"year\": \"\", \"note\": \"Explores self-organization, fitness landscapes and the emergence of order in evolution.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Important for adaptive landscapes and coevolutionary thinking.\"}, {\"title\": \"Complex Adaptive Systems\", \"author\": \"John H. Miller & Scott E. Page\", \"year\": \"\", \"note\": \"A formal conceptual treatment of agents, adaptation, diversity and aggregation.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Excellent for connecting agent-based modelling with social-science questions.\"}, {\"title\": \"Micromotives and Macrobehavior\", \"author\": \"Thomas C. Schelling\", \"year\": \"\", \"note\": \"Tiny individual preferences can produce segregation and other large-scale outcomes nobody explicitly chose.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Perhaps the cleanest social-science example of micro rules producing macro patterns.\"}, {\"title\": \"The Systems View of Life\", \"author\": \"Fritjof Capra & Pier Luigi Luisi\", \"year\": \"\", \"note\": \"A broad synthesis of living systems, ecology, cognition and social organization.\", \"tag\": \"Complexity, Networks & Systems\", \"detail\": \"\", \"bridge\": \"Useful for thinking in nested, relational and ecological systems.\"}, {\"title\": \"Anthropology: What Does It Mean to Be Human?\", \"author\": \"Robert Lavenda & Emily Schultz\", \"year\": \"\", \"note\": \"A broad four-field introduction covering biological, cultural, linguistic and archaeological anthropology.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Establishes the full discipline before you specialize.\"}, {\"title\": \"Small Places, Large Issues\", \"author\": \"Thomas Hylland Eriksen\", \"year\": \"\", \"note\": \"One of the clearest introductions to sociocultural anthropology and anthropological theory.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Shows how local ethnography can reveal large-scale structures without flattening context.\"}, {\"title\": \"Essentials of Biological Anthropology\", \"author\": \"Clark Spencer Larsen\", \"year\": \"\", \"note\": \"Evolution, primates, human variation, adaptation and biological history.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Provides the evolutionary substrate for gene\u2013culture and multilevel models.\"}, {\"title\": \"Archaeology: Theories, Methods and Practice\", \"author\": \"Colin Renfrew & Paul Bahn\", \"year\": \"\", \"note\": \"How material traces become evidence about past societies.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Excellent training in inference from incomplete data across long timescales.\"}, {\"title\": \"Research Methods in Anthropology\", \"author\": \"H. Russell Bernard\", \"year\": \"\", \"note\": \"Participant observation, interviews, surveys, sampling, mixed methods and field design.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Keeps quantitative models grounded in how human data are actually produced.\"}, {\"title\": \"Participant Observation\", \"author\": \"James P. Spradley\", \"year\": \"\", \"note\": \"A practical guide to entering a social world, observing it and learning its categories.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"Observe worlds before converting them into variables or exposition.\", \"bridge\": \"Useful antidote to modelling people only through variables in a dataset.\"}, {\"title\": \"The Interpretation of Cultures\", \"author\": \"Clifford Geertz\", \"year\": \"\", \"note\": \"Thick description, symbols and culture as webs of meaning.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"Thick description: meaning before abstraction.\", \"bridge\": \"Adds interpretive depth where purely mechanistic models become too thin.\"}, {\"title\": \"Purity and Danger\", \"author\": \"Mary Douglas\", \"year\": \"\", \"note\": \"Pollution, taboo and classification as expressions of social order.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Useful for boundaries, categories, norm enforcement and symbolic systems.\"}, {\"title\": \"Debt: The First 5,000 Years\", \"author\": \"David Graeber\", \"year\": \"\", \"note\": \"A long anthropological history of debt, money, violence and obligation.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Reframes exchange as embedded in social and political networks.\"}, {\"title\": \"The Dawn of Everything\", \"author\": \"David Graeber & David Wengrow\", \"year\": \"\", \"note\": \"Challenges simple linear stories of social evolution, states and inequality.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Expands the space of possible institutional arrangements and historical equilibria.\"}, {\"title\": \"The Secret of Our Success\", \"author\": \"Joseph Henrich\", \"year\": \"\", \"note\": \"Argues that cumulative culture and social learning made humans successful.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Direct bridge to diffusion, imitation, collective intelligence and cultural evolution.\"}, {\"title\": \"The WEIRDest People in the World\", \"author\": \"Joseph Henrich\", \"year\": \"\", \"note\": \"Explores how kinship, religion and institutions shaped distinctive Western psychology.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"A large case study in culture\u2013institution\u2013psychology coevolution and path dependence.\"}, {\"title\": \"Culture and the Evolutionary Process\", \"author\": \"Robert Boyd & Peter J. Richerson\", \"year\": \"\", \"note\": \"Formal models of cultural transmission, selection and gene\u2013culture coevolution.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"One of the clearest technical bridges from anthropology to complexity.\"}, {\"title\": \"Stone Age Economics\", \"author\": \"Marshall Sahlins\", \"year\": \"\", \"note\": \"Essays on exchange, abundance and economic life in small-scale societies.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Challenges universal assumptions about scarcity, rationality and economic behaviour.\"}, {\"title\": \"An Immense World\", \"author\": \"Ed Yong\", \"year\": \"\", \"note\": \"Explores the radically different sensory worlds\u2014umwelten\u2014of animals.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"A profound exercise in escaping human-centered models of perception and environment.\"}, {\"title\": \"The Spirit Catches You and You Fall Down\", \"author\": \"Anne Fadiman\", \"year\": \"\", \"note\": \"A Hmong family and the American medical system collide despite good intentions on both sides.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"An unforgettable example of institutional interfaces, translation failure and local rationality.\"}, {\"title\": \"Tribal India\", \"author\": \"Nadeem Hasnain\", \"year\": \"\", \"note\": \"A broad introduction to tribal communities, classifications, institutions and change in India.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Useful as a map, best read alongside newer ethnography to avoid static categories.\"}, {\"title\": \"People and Nature\", \"author\": \"Emilio F. Moran\", \"year\": \"\", \"note\": \"Human\u2013environment relations, adaptation, land use and coupled systems.\", \"tag\": \"Anthropology & Human Variation\", \"detail\": \"\", \"bridge\": \"Connects environmental anthropology directly to complex social\u2013ecological systems.\"}, {\"title\": \"Inspired\", \"author\": \"Marty Cagan\", \"year\": \"\", \"note\": \"A broad map of modern product discovery, empowered teams and solving problems rather than shipping feature lists.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Establishes the basic operating model of product work.\"}, {\"title\": \"The Mom Test\", \"author\": \"Rob Fitzpatrick\", \"year\": \"\", \"note\": \"Teaches how to ask customer questions that reveal behaviour rather than polite opinions.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Improves the quality of evidence feeding product decisions.\"}, {\"title\": \"Continuous Discovery Habits\", \"author\": \"Teresa Torres\", \"year\": \"\", \"note\": \"Outcomes, continuous interviewing, opportunity mapping and assumption testing as a repeatable system.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Treats product discovery as a feedback loop rather than a one-time research phase.\"}, {\"title\": \"Escaping the Build Trap\", \"author\": \"Melissa Perri\", \"year\": \"\", \"note\": \"Explains why shipping more features is a poor proxy for customer or business outcomes.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"A systems view of metrics, incentives and organizational behaviour.\"}, {\"title\": \"The Lean Product Playbook\", \"author\": \"Dan Olsen\", \"year\": \"\", \"note\": \"A structured path from target customer and underserved needs to value proposition, MVP and testing.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Useful for moving from ambiguous problem space to falsifiable product hypotheses.\"}, {\"title\": \"Obviously Awesome\", \"author\": \"April Dunford\", \"year\": \"\", \"note\": \"A practical framework for competitive alternatives, differentiated value and market category.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Shows how perceived value depends on context and reference frames.\"}, {\"title\": \"Good Strategy/Bad Strategy\", \"author\": \"Richard Rumelt\", \"year\": \"\", \"note\": \"Diagnosis, guiding policy and coherent action as the core of real strategy.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Teaches intervention at leverage points rather than accumulation of goals.\"}, {\"title\": \"Playing to Win\", \"author\": \"A.G. Lafley & Roger L. Martin\", \"year\": \"\", \"note\": \"Strategy as a set of explicit choices about where to play and how to win.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Makes trade-offs and strategic coherence operational.\"}, {\"title\": \"Competing Against Luck\", \"author\": \"Clayton Christensen et al.\", \"year\": \"\", \"note\": \"Jobs-to-be-Done reframes demand around progress customers seek rather than demographic segments.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Useful for modelling demand through mechanisms rather than surface correlations.\"}, {\"title\": \"The Innovator's Dilemma\", \"author\": \"Clayton M. Christensen\", \"year\": \"\", \"note\": \"Why competent incumbents fail when disruptive technologies begin in unattractive markets.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"A classic study of lock-in, incentives and technological transition.\"}, {\"title\": \"Crossing the Chasm\", \"author\": \"Geoffrey A. Moore\", \"year\": \"\", \"note\": \"Explains adoption gaps between early enthusiasts and mainstream markets.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Direct connection to diffusion, network effects and market-category formation.\"}, {\"title\": \"Build\", \"author\": \"Tony Fadell\", \"year\": \"\", \"note\": \"A practical account of product creation, teams, hardware/software trade-offs and execution.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Useful for seeing product work as a coupled technical\u2013organizational system.\"}, {\"title\": \"The Design of Everyday Things\", \"author\": \"Don Norman\", \"year\": \"\", \"note\": \"Affordances, feedback, mappings, errors and human-centred design.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"A reminder that system behaviour is partly produced by interface design.\"}, {\"title\": \"High Output Management\", \"author\": \"Andrew S. Grove\", \"year\": \"\", \"note\": \"Managerial leverage, meetings, process, teams and performance in a compact operating philosophy.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"A systems-oriented view of organizations and information flow.\"}, {\"title\": \"The Goal\", \"author\": \"Eliyahu M. Goldratt & Jeff Cox\", \"year\": \"\", \"note\": \"A memorable introduction to bottlenecks, throughput and the Theory of Constraints.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Shows why local optimization can damage total system performance.\"}, {\"title\": \"The Practice of Management\", \"author\": \"Peter F. Drucker\", \"year\": \"\", \"note\": \"A durable foundation in objectives, decentralization, responsibility, customers and managerial work.\", \"tag\": \"Product, Strategy & Organizations\", \"detail\": \"\", \"bridge\": \"Provides the institutional frame around product teams and strategy.\"}, {\"title\": \"India: A History\", \"author\": \"John Keay\", \"year\": \"\", \"note\": \"A readable single-volume sweep from ancient civilizations to the modern republic.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Gives chronological scaffolding before more specialized arguments.\"}, {\"title\": \"India After Gandhi\", \"author\": \"Ramachandra Guha\", \"year\": \"\", \"note\": \"A wide narrative of the republic after independence: elections, federalism, language, conflict and social change.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Post-independence political background.\", \"bridge\": \"India becomes a living complex system of negotiated institutions rather than a static civilization.\"}, {\"title\": \"The Penguin History of Early India\", \"author\": \"Romila Thapar\", \"year\": \"\", \"note\": \"A serious account of early Indian society, states, religion and material change.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Useful for seeing institutions and identities as historically produced.\"}, {\"title\": \"India Since Independence\", \"author\": \"Bipan Chandra, Mridula Mukherjee & Aditya Mukherjee\", \"year\": \"\", \"note\": \"A structured political-economic history of post-1947 India.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Complements narrative history with a more systematic treatment of policy and political economy.\"}, {\"title\": \"The Idea of India\", \"author\": \"Sunil Khilnani\", \"year\": \"\", \"note\": \"Explores the republic as an institutional and political idea rather than a civilizational inevitability.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Useful for pluralism, state-building and contested national identity.\"}, {\"title\": \"The Argumentative Indian\", \"author\": \"Amartya Sen\", \"year\": \"\", \"note\": \"Essays on pluralism, reasoning, secularism, identity and India's intellectual traditions.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Counters single-story models of Indian civilization.\"}, {\"title\": \"Annihilation of Caste\", \"author\": \"B. R. Ambedkar\", \"year\": \"\", \"note\": \"A foundational critique of caste, hierarchy and Hindu social order.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Foundational caste architecture for the Ayodhya story.\", \"bridge\": \"Essential for understanding how social stratification reproduces itself institutionally.\"}, {\"title\": \"The Discovery of India\", \"author\": \"Jawaharlal Nehru\", \"year\": \"\", \"note\": \"A sweeping, personal interpretation of Indian history and civilization written during imprisonment.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Read critically as a major nation-building narrative that shaped elite self-understanding.\"}, {\"title\": \"Everybody Loves a Good Drought\", \"author\": \"P. Sainath\", \"year\": \"\", \"note\": \"Ground-level reporting on rural poverty, bureaucracy and development schemes.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"Working-class life and policy failure made concrete.\", \"bridge\": \"A masterclass in implementation failure, incentives and the distance between policy and lived reality.\"}, {\"title\": \"Ants Among Elephants\", \"author\": \"Sujatha Gidla\", \"year\": \"\", \"note\": \"A family history of caste, Christianity, communism and modern Andhra Pradesh.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Turns hierarchy, mobility and ideology into lived networks and institutions.\"}, {\"title\": \"The Lost River\", \"author\": \"Michel Danino\", \"year\": \"\", \"note\": \"An accessible synthesis of archaeology, geography and debates around the Sarasvati.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Useful as a case study in interdisciplinary inference and contested evidence.\"}, {\"title\": \"India Unbound\", \"author\": \"Gurcharan Das\", \"year\": \"\", \"note\": \"A narrative of India's transition from state-led controls toward market liberalization.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Useful for understanding institutional change, incentives and economic path dependence.\"}, {\"title\": \"In Spite of the Gods\", \"author\": \"Edward Luce\", \"year\": \"\", \"note\": \"A journalist's portrait of India's growth, democracy, inequality and institutions.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"A useful outsider synthesis to compare against Indian accounts.\"}, {\"title\": \"India Moving\", \"author\": \"Chinmay Tumbe\", \"year\": \"\", \"note\": \"A long history of migration inside and beyond India.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Mobility becomes a network process shaping cities, labour, kinship and regional development.\"}, {\"title\": \"The Billionaire Raj\", \"author\": \"James Crabtree\", \"year\": \"\", \"note\": \"Investigates wealth, capitalism, cronyism and inequality in contemporary India.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Useful for power networks, elite concentration and institutional feedback.\"}, {\"title\": \"Whole Numbers and Half Truths\", \"author\": \"Rukmini S.\", \"year\": \"\", \"note\": \"Uses data to interrogate popular beliefs about Indians' work, marriage, health, wealth and attitudes.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"A disciplined bridge between social questions, measurement and statistical reality.\"}, {\"title\": \"The Great Indian Middle Class\", \"author\": \"Pavan K. Varma\", \"year\": \"\", \"note\": \"A provocative portrait of aspiration, consumption, public morality and middle-class power.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Useful for preference formation, status, civic behaviour and cultural change.\"}, {\"title\": \"The Great Derangement\", \"author\": \"Amitav Ghosh\", \"year\": \"\", \"note\": \"Asks why modern literature, politics and imagination struggle to represent climate disruption.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Connects India, empire, fossil energy and planetary-scale systems.\"}, {\"title\": \"A Feast of Vultures\", \"author\": \"Josy Joseph\", \"year\": \"\", \"note\": \"Investigates networks linking business, bureaucracy, lobbying and political power.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"A concrete map of informal institutions and influence networks.\"}, {\"title\": \"The Ivory Throne\", \"author\": \"Manu S. Pillai\", \"year\": \"\", \"note\": \"A vivid history of Travancore through monarchy, caste, gender and colonialism.\", \"tag\": \"India \u2014 History, Society & State\", \"detail\": \"\", \"bridge\": \"Builds regional depth and resists reducing Indian history to Delhi-centric narratives.\"}, {\"title\": \"Philosophy: The Basics\", \"author\": \"Nigel Warburton\", \"year\": \"\", \"note\": \"Accessible entry into knowledge, mind, ethics, politics, religion and philosophical argument.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Provides the vocabulary and argumentative style needed for later philosophy.\"}, {\"title\": \"Think\", \"author\": \"Simon Blackburn\", \"year\": \"\", \"note\": \"A compact tour through knowledge, mind, free will, identity, God and ethics.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Strengthens conceptual distinctions before technical debates.\"}, {\"title\": \"Philosophy of Science: A Very Short Introduction\", \"author\": \"Samir Okasha\", \"year\": \"\", \"note\": \"A clear map of explanation, induction, realism, falsification and scientific change.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Complexity models are idealizations; philosophy helps separate prediction from explanation.\"}, {\"title\": \"Theory and Reality\", \"author\": \"Peter Godfrey-Smith\", \"year\": \"\", \"note\": \"A deeper history of twentieth-century philosophy of science from logical empiricism to realism and social studies.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Useful for understanding what models can legitimately claim about reality.\"}, {\"title\": \"The Structure of Scientific Revolutions\", \"author\": \"Thomas S. Kuhn\", \"year\": \"\", \"note\": \"Paradigms, normal science, anomalies and scientific revolutions.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"A study of collective belief, lock-in and regime change inside science itself.\"}, {\"title\": \"The Book of Why\", \"author\": \"Judea Pearl & Dana Mackenzie\", \"year\": \"\", \"note\": \"An accessible history and explanation of causal inference, intervention and counterfactuals.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Essential when feedback and confounding make correlation unreliable.\"}, {\"title\": \"The World in the Model\", \"author\": \"Mary S. Morgan\", \"year\": \"\", \"note\": \"Shows how models mediate between theory, evidence and the world.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Directly relevant to computational modelling and model-based reasoning.\"}, {\"title\": \"G\u00f6del, Escher, Bach\", \"author\": \"Douglas Hofstadter\", \"year\": \"\", \"note\": \"A playful, demanding exploration of formal systems, recursion, self-reference, minds and meaning.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"One of the richest bridges between mathematics, computation, cognition and emergence.\"}, {\"title\": \"The Mind's I\", \"author\": \"Douglas Hofstadter & Daniel Dennett (eds.)\", \"year\": \"\", \"note\": \"Stories and essays on selfhood, consciousness, minds and machines.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Excellent intermediate bridge from intuition to philosophy-of-mind problems.\"}, {\"title\": \"Consciousness Explained\", \"author\": \"Daniel Dennett\", \"year\": \"\", \"note\": \"A naturalistic, functional account that rejects a single Cartesian theatre of consciousness.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Encourages distributed-process thinking about mind.\"}, {\"title\": \"The Conscious Mind\", \"author\": \"David Chalmers\", \"year\": \"\", \"note\": \"The classic modern statement of the 'hard problem' and arguments for taking consciousness seriously.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Useful counterpoint to functionalist and computational accounts.\"}, {\"title\": \"Being You\", \"author\": \"Anil Seth\", \"year\": \"\", \"note\": \"A modern account of perception and selfhood as controlled hallucination and predictive inference.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Connects mind to modelling, prediction, embodiment and uncertainty.\"}, {\"title\": \"Free Will\", \"author\": \"Sam Harris\", \"year\": \"\", \"note\": \"A concise challenge to intuitive notions of authorship and choice.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"Useful for thinking about agency in deterministic, stochastic and social systems.\"}, {\"title\": \"Four Thousand Weeks\", \"author\": \"Oliver Burkeman\", \"year\": \"\", \"note\": \"A philosophical critique of productivity optimization grounded in human finitude.\", \"tag\": \"Philosophy & Philosophy of Mind\", \"detail\": \"\", \"bridge\": \"A personal lesson in constraints, trade-offs and the impossibility of maximizing everything.\"}, {\"title\": \"Code: The Hidden Language of Computer Hardware and Software\", \"author\": \"Charles Petzold\", \"year\": \"\", \"note\": \"Starts below programming and builds from switches and logic to binary, circuits, memory, processors and software.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Gives a physical-to-logical mental model of computation.\"}, {\"title\": \"Think Python\", \"author\": \"Allen B. Downey\", \"year\": \"\", \"note\": \"A gentle working introduction to functions, recursion, collections, objects and program design.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Python becomes the executable language of your mathematical and complexity work.\"}, {\"title\": \"Computer Science: An Interdisciplinary Approach\", \"author\": \"Robert Sedgewick & Kevin Wayne\", \"year\": \"\", \"note\": \"A broad first CS course linking programming, algorithms, data and scientific applications.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Connects coding skill to the abstractions of computer science.\"}, {\"title\": \"Grokking Algorithms\", \"author\": \"Aditya Bhargava\", \"year\": \"\", \"note\": \"A friendly first pass through searching, sorting, graphs, dynamic programming and Big-O.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Introduces the idea that two correct procedures can scale very differently.\"}, {\"title\": \"Introduction to Algorithms\", \"author\": \"Cormen, Leiserson, Rivest & Stein\", \"year\": \"\", \"note\": \"The canonical reference for algorithm design and analysis.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Useful when you need formal guarantees rather than only coding intuition.\"}, {\"title\": \"Introduction to the Theory of Computation\", \"author\": \"Michael Sipser\", \"year\": \"\", \"note\": \"Automata, computability and complexity in a clear theoretical progression.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Clarifies the differences among solvable, computable and feasible.\"}, {\"title\": \"Computer Systems: A Programmer's Perspective\", \"author\": \"Randal Bryant & David O'Hallaron\", \"year\": \"\", \"note\": \"Machine code, memory hierarchy, linking, processes and virtual memory from a programmer's viewpoint.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Shows what high-level languages abstract away and why performance behaves as it does.\"}, {\"title\": \"Operating Systems: Three Easy Pieces\", \"author\": \"Remzi & Andrea Arpaci-Dusseau\", \"year\": \"\", \"note\": \"Processes, concurrency, memory and storage explained through strong conceptual models.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"A system is partly the policy for sharing scarce resources safely.\"}, {\"title\": \"Designing Data-Intensive Applications\", \"author\": \"Martin Kleppmann\", \"year\": \"\", \"note\": \"Databases, logs, replication, partitioning, streams, transactions and distributed-system trade-offs.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Essential for understanding real information systems as interacting, failure-prone networks.\"}, {\"title\": \"A Philosophy of Software Design\", \"author\": \"John Ousterhout\", \"year\": \"\", \"note\": \"Deep modules, information hiding, interfaces and complexity management.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Software architecture becomes a study in controlling coupling and cognitive load.\"}, {\"title\": \"The Pragmatic Programmer\", \"author\": \"David Thomas & Andrew Hunt\", \"year\": \"\", \"note\": \"Practical habits for maintainable code, debugging, automation and engineering judgment.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Useful for making computational research reproducible rather than fragile.\"}, {\"title\": \"Structure and Interpretation of Computer Programs\", \"author\": \"Harold Abelson & Gerald Jay Sussman\", \"year\": \"\", \"note\": \"A deep course in abstraction, interpreters, state and computational processes.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Changes how you think about programs\u2014from instructions to models of processes.\"}, {\"title\": \"The Missing README\", \"author\": \"Chris Riccomini & Dmitriy Ryaboy\", \"year\": \"\", \"note\": \"A practical bridge from coding alone to working effectively in real engineering teams.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"Adds version control, testing, deployment and operational habits.\"}, {\"title\": \"The Cathedral and the Bazaar\", \"author\": \"Eric S. Raymond\", \"year\": \"\", \"note\": \"Classic essays on open-source development and decentralized collaboration.\", \"tag\": \"Computer Science & Software\", \"detail\": \"\", \"bridge\": \"A useful social example of distributed production and emergent coordination.\"}, {\"title\": \"Artificial Intelligence: A Modern Approach\", \"author\": \"Stuart Russell & Peter Norvig\", \"year\": \"\", \"note\": \"The broadest standard map of AI: search, reasoning, uncertainty, learning, perception and agents.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Defines AI beyond current language-model fashion.\"}, {\"title\": \"The Hundred-Page Machine Learning Book\", \"author\": \"Andriy Burkov\", \"year\": \"\", \"note\": \"A concise overview of supervised learning, evaluation, regularization and core ML concepts.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"A quick conceptual layer before deeper implementations.\"}, {\"title\": \"Hands-On Machine Learning with Scikit-Learn, Keras & TensorFlow\", \"author\": \"Aur\u00e9lien G\u00e9ron\", \"year\": \"\", \"note\": \"Builds working intuition through classical ML and neural-network implementations.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Useful for connecting mathematical ideas to experiments and evaluation.\"}, {\"title\": \"Deep Learning\", \"author\": \"Ian Goodfellow, Yoshua Bengio & Aaron Courville\", \"year\": \"\", \"note\": \"The foundational technical reference on neural networks, optimization and representation learning.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Provides theoretical depth below modern AI systems.\"}, {\"title\": \"Build a Large Language Model (From Scratch)\", \"author\": \"Sebastian Raschka\", \"year\": \"\", \"note\": \"Builds a small transformer stack step by step so tokens, attention and training stop feeling magical.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Makes the LLM an inspectable computational system.\"}, {\"title\": \"Speech and Language Processing\", \"author\": \"Daniel Jurafsky & James H. Martin\", \"year\": \"\", \"note\": \"The major reference for NLP: language models, embeddings, transformers, evaluation and language structure.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Connects AI to linguistics, probability and information.\"}, {\"title\": \"AI Engineering\", \"author\": \"Chip Huyen\", \"year\": \"\", \"note\": \"Focuses on building reliable applications around foundation models: evaluation, latency, cost, data and feedback.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Treats AI as a production system rather than a demo.\"}, {\"title\": \"Designing Machine Learning Systems\", \"author\": \"Chip Huyen\", \"year\": \"\", \"note\": \"Data pipelines, deployment, monitoring, distribution shift and feedback loops.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"A systems perspective on models embedded in changing environments.\"}, {\"title\": \"The Alignment Problem\", \"author\": \"Brian Christian\", \"year\": \"\", \"note\": \"How machine-learning objectives inherit ambiguity, bias and human value choices.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"A bridge between optimization, institutions, behaviour and governance.\"}, {\"title\": \"Human Compatible\", \"author\": \"Stuart Russell\", \"year\": \"\", \"note\": \"Argues for AI systems designed around uncertainty about human preferences rather than fixed objectives.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Frames alignment as a control and value-learning problem.\"}, {\"title\": \"Weapons of Math Destruction\", \"author\": \"Cathy O'Neil\", \"year\": \"\", \"note\": \"Shows how opaque models can amplify inequality in education, credit, work and policing.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"A vivid study of algorithmic feedback loops and institutional power.\"}, {\"title\": \"The Master Algorithm\", \"author\": \"Pedro Domingos\", \"year\": \"\", \"note\": \"Surveys major machine-learning traditions through different philosophies of learning.\", \"tag\": \"AI, Machine Learning & Intelligent Systems\", \"detail\": \"\", \"bridge\": \"Useful for seeing AI as a landscape of assumptions rather than one technique.\"}, {\"title\": \"University Physics with Modern Physics\", \"author\": \"Young & Freedman\", \"year\": \"\", \"note\": \"A calculus-based undergraduate foundation in mechanics, waves, thermodynamics, electromagnetism, optics and modern physics.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Provides mechanisms and quantitative discipline before conceptual reframing.\"}, {\"title\": \"Six Easy Pieces\", \"author\": \"Richard P. Feynman\", \"year\": \"\", \"note\": \"Selected Feynman lectures on atoms, energy, gravitation, quantum behaviour and physical law.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"A perspective-changing second voice alongside conventional problem solving.\"}, {\"title\": \"The Feynman Lectures on Physics, Vol. I\", \"author\": \"Feynman, Leighton & Sands\", \"year\": \"\", \"note\": \"Mechanics, radiation, heat and physical intuition at unusual depth.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Builds the habit of asking what equations mean physically.\"}, {\"title\": \"An Introduction to Thermal Physics\", \"author\": \"Daniel V. Schroeder\", \"year\": \"\", \"note\": \"A clear statistical route into temperature, entropy and thermodynamics.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Entropy and ensembles are central bridges into information and complex systems.\"}, {\"title\": \"Classical Mechanics\", \"author\": \"John R. Taylor\", \"year\": \"\", \"note\": \"An approachable intermediate mechanics text with Lagrangian ideas and nonlinear systems.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Strengthens dynamical modelling and phase-space thinking.\"}, {\"title\": \"Introduction to Electrodynamics\", \"author\": \"David J. Griffiths\", \"year\": \"\", \"note\": \"The standard intermediate route into fields, potentials and Maxwell's equations.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Trains spatial reasoning about distributed interactions.\"}, {\"title\": \"Introduction to Quantum Mechanics\", \"author\": \"Griffiths & Schroeter\", \"year\": \"\", \"note\": \"A clear mathematical first course in quantum states, operators and dynamics.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Builds comfort with nonclassical models and probabilistic structure.\"}, {\"title\": \"The Order of Time\", \"author\": \"Carlo Rovelli\", \"year\": \"\", \"note\": \"A compact physical and philosophical exploration of why time is not universal or simple.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Encourages relational and scale-sensitive thinking.\"}, {\"title\": \"Reality Is Not What It Seems\", \"author\": \"Carlo Rovelli\", \"year\": \"\", \"note\": \"From atoms and relativity to quantum gravity as a history of changing physical pictures.\", \"tag\": \"Physics & Physical Reality\", \"detail\": \"\", \"bridge\": \"Shows science as reconstruction through better abstractions.\"}, {\"title\": \"Something Deeply Hidden\", \"author\": \"Sean Carroll\", \"year\": \"\", \"note\": \"A conceptual case for the many-worlds interpretation of quantum mechanics.\", \"tag\": \"Physics & Physical Reality
