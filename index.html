es a portrait of Israeli society's repressed anxieties in the years leading to the Six-Day War.\", \"year_num\": 1968}]}, {\"code\": \"SYR\", \"country\": \"Syria\", \"expected_count\": 5, \"intro\": \"Syria's civil war, which began in 2011, has killed over 500,000 people and displaced half the population. Its literature -- mostly written in exile -- preserves what the bombs and the dictator tried to erase.\", \"source_page\": 46, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"What Strange Paradise\", \"source_page\": 46, \"author\": \"Omar El Akkad\", \"year\": \"2021\", \"description\": \"A Syrian boy washes ashore on a Greek island after a refugee boat capsizes. El Akkad's Booker Prize winner tells the Mediterranean migration crisis from both sides of the wire -- among the most urgent novels of our moment.\", \"year_num\": 2021}, {\"num\": 2, \"title\": \"The Beekeeper of Aleppo\", \"source_page\": 46, \"author\": \"Christy Lefteri\", \"year\": \"2019\", \"description\": \"A beekeeper and his artist wife flee the destruction of Aleppo to reach Britain. Written after Lefteri volunteered in Athens refugee camps, this novel brings the Syrian refugee experience into human scale.\", \"year_num\": 2019}, {\"num\": 3, \"title\": \"No Knives in the Kitchens of This City\", \"source_page\": 46, \"author\": \"Khaled Khalifa\", \"year\": \"2013\", \"description\": \"A Damascene family over four decades of Baathist rule -- surveillance, torture, and the slow death of hope. Syria's most important living novelist remains in Damascus; this is courage in fiction form.\", \"year_num\": 2013}, {\"num\": 4, \"title\": \"In Praise of Hatred\", \"source_page\": 46, \"author\": \"Khaled Khalifa\", \"year\": \"2008\", \"description\": \"Set in 1980s Aleppo during Assad Sr.'s crackdown on the Muslim Brotherhood, a young woman is drawn into extremism. It foresaw the Syria that would collapse in 2011.\", \"year_num\": 2008}, {\"num\": 5, \"title\": \"The Dark Side of Love\", \"source_page\": 46, \"author\": \"Rafik Schami\", \"year\": \"2004\", \"description\": \"A Syrian writer in exile traces two Damascene families across three generations -- Christian, Muslim, urban, rural. Schami's epic of forbidden love is the richest fictional portrait of Syrian society before its destruction.\", \"year_num\": 2004}]}, {\"code\": \"MMR\", \"country\": \"Myanmar (Burma)\", \"expected_count\": 5, \"intro\": \"Myanmar has lived under military rule for most of its post-independence history. Its 2021 coup re-ignited a brutal civil war. Its literature survives through authors who write in exile or in secret.\", \"source_page\": 47, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Glass Palace\", \"source_page\": 47, \"author\": \"Amitav Ghosh\", \"year\": \"2000\", \"description\": \"From the fall of the Burmese monarchy in 1885 to the present day, Ghosh's epic follows an Indian-born orphan's rise across Burma, Malaya, and India. The essential fictional account of Burma under British colonial rule.\", \"year_num\": 2000}, {\"num\": 2, \"title\": \"From the Land of Green Ghosts\", \"source_page\": 47, \"author\": \"Pascal Khoo Thwe\", \"year\": \"2002\", \"description\": \"A Padaung tribesman escapes Burma's 1988 uprising and walks through the jungle to Thailand. This autobiographical novel is both an adventure story and an elegy for Burma under the generals.\", \"year_num\": 2002}, {\"num\": 3, \"title\": \"Finding George Orwell in Burma\", \"source_page\": 47, \"author\": \"Emma Larkin\", \"year\": \"2004\", \"description\": \"A journalist retraces Orwell's time as a colonial police officer in Burma and discovers that Burmese read 1984 and Animal Farm as documentaries about their own lives. Literature as survival.\", \"year_num\": 2004}, {\"num\": 4, \"title\": \"Smile as They Bow\", \"source_page\": 47, \"author\": \"Nu Nu Yi\", \"year\": \"2007\", \"description\": \"Set during the Taungbyon spirit festival near Mandalay, this novel of a transgender ritual performer navigating gender, spirituality, and love is Burma's most celebrated literary debut in decades.\", \"year_num\": 2007}, {\"num\": 5, \"title\": \"The Lizard Cage\", \"source_page\": 47, \"author\": \"Karen Connelly\", \"year\": \"2005\", \"description\": \"A political prisoner in a Rangoon jail and a street orphan. Connelly's Giller Prize-winning novel is the most sustained fictional portrait of life inside Burma's gulag.\", \"year_num\": 2005}]}, {\"code\": \"SDN\", \"country\": \"Sudan\", \"expected_count\": 5, \"intro\": \"Sudan -- ancient Nubia, victim of the Darfur genocide and the ongoing 2023 civil war that has displaced millions -- produced one of Arabic literature's undisputed masterworks.\", \"source_page\": 48, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Season of Migration to the North\", \"source_page\": 48, \"author\": \"Tayeb Salih\", \"year\": \"1966\", \"description\": \"Called 'the most important Arabic novel of the 20th century' -- a Sudanese man returns from studying in London carrying something dark. Salih's inversion of Heart of Darkness is a perfect post-colonial masterpiece.\", \"year_num\": 1966}, {\"num\": 2, \"title\": \"Wedding of Zein\", \"source_page\": 48, \"author\": \"Tayeb Salih\", \"year\": \"1966\", \"description\": \"Salih's companion novella -- the village fool's miraculous marriage -- is a celebration of Sudanese communal life, Islamic spirituality, and the humanity of a Nile village before modernity devoured it.\", \"year_num\": 1966}, {\"num\": 3, \"title\": \"The Cairo Trilogy\", \"source_page\": 48, \"author\": \"Naguib Mahfouz\", \"year\": \"1956-1957\", \"description\": \"Though Egyptian, Mahfouz's Nobel Prize-winning trilogy shapes the entire tradition within which Sudanese literature operates -- included here as the defining Arab social novel.\", \"year_num\": 1956}, {\"num\": 4, \"title\": \"A Grain of Wheat\", \"source_page\": 48, \"author\": \"Ngugi wa Thiong'o\", \"year\": \"1967\", \"description\": \"The East African anti-colonial tradition that Sudanese literature shares -- resistance, betrayal, and the cost of independence -- captured in the most morally complex novel of Kenyan resistance.\", \"year_num\": 1967}, {\"num\": 5, \"title\": \"Johnny Mad Dog\", \"source_page\": 48, \"author\": \"Emmanuel Dongala\", \"year\": \"2002\", \"description\": \"A teenage soldier in a sub-Saharan African civil war -- the world as seen through a child soldier's eyes. Congolese author Dongala's novel captures the logic of Africa's child-soldier wars that extends across Sudan's own conflicts.\", \"year_num\": 2002}]}, {\"code\": \"IRQ\", \"country\": \"Iraq\", \"expected_count\": 5, \"intro\": \"Iraq -- Mesopotamia, cradle of civilisation, Babylon and Nineveh -- has been shattered by the Gulf War, UN sanctions, the 2003 US invasion, and ISIS, producing a literature of survival, displacement, and the archaeology of destroyed worlds.\", \"source_page\": 49, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Frankenstein in Baghdad\", \"source_page\": 49, \"author\": \"Ahmed Saadawi\", \"year\": \"2013\", \"description\": \"A junk dealer in post-invasion Baghdad sews together body parts of bomb victims to create a creature that goes on its own killing spree for justice. Saadawi's International Prize for Arabic Fiction winner is the most brilliant literary response to the Iraq War.\", \"year_num\": 2013}, {\"num\": 2, \"title\": \"The Corpse Washer\", \"source_page\": 49, \"author\": \"Sinan Antoon\", \"year\": \"2010\", \"description\": \"A Baghdad sculptor who reluctantly inherits his father's corpse-washing business across the Iran-Iraq War, Gulf War, and US invasion. Antoon's novel -- one per decade of catastrophe -- is the most intimate portrait of what war does to one Iraqi family.\", \"year_num\": 2010}, {\"num\": 3, \"title\": \"Absent\", \"source_page\": 49, \"author\": \"Jawad Al-Asadi\", \"year\": \"2010\", \"description\": \"Iraqi theatre and poetry's confrontation with displacement and the cultural destruction of Baghdad -- the libraries burned, the museums looted. Al-Asadi represents Iraq's cultural mourning for its own civilisational heritage.\", \"year_num\": 2010}, {\"num\": 4, \"title\": \"The Long Way Back\", \"source_page\": 49, \"author\": \"Jabra Ibrahim Jabra\", \"year\": \"1986\", \"description\": \"Palestinian-Iraqi author Jabra's novel of Baghdad intellectuals -- exiles within their exile -- is the essential portrait of Iraq's mid-century literary culture: cosmopolitan, modernist, doomed.\", \"year_num\": 1986}, {\"num\": 5, \"title\": \"In the City of Love and Ashes\", \"source_page\": 49, \"author\": \"Haifa Zangana\", \"year\": \"2009\", \"description\": \"A Baghdadi woman under Saddam's surveillance state in the 1980s. Zangana, a former political prisoner herself, writes with documentary precision about the daily terror of life in a totalitarian Arab state.\", \"year_num\": 2009}]}, {\"code\": \"YEM\", \"country\": \"Yemen\", \"expected_count\": 5, \"intro\": \"Yemen's civil war -- the world's worst humanitarian crisis, with hundreds of thousands dead and millions starving -- has largely silenced its literary culture. But its ancient storytelling tradition and diaspora voices bear witness to what is being destroyed.\", \"source_page\": 50, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Hostage (Boats of Al-Ghad)\", \"source_page\": 50, \"author\": \"Zayd Mutee' Dammaj\", \"year\": \"1985\", \"description\": \"A boy becomes a hostage in an Imam's court -- Yemen's most celebrated novel, describing the feudal Imamate system that the 1962 revolution overthrew. A world vanished into history, and now being fought over again.\", \"year_num\": 1985}, {\"num\": 2, \"title\": \"The Arch and the Butterfly\", \"source_page\": 50, \"author\": \"Mohammed Achaari\", \"year\": \"2010\", \"description\": \"A Moroccan father discovers his son has died in the Afghan jihad. Achaari's Prix Goncourt Arabic-language winner captures the radicalisation pipeline that has devastated Yemen -- and the grief of the families left behind.\", \"year_num\": 2010}, {\"num\": 3, \"title\": \"Arabian Nights and Days\", \"source_page\": 50, \"author\": \"Naguib Mahfouz\", \"year\": \"1979\", \"description\": \"Mahfouz's revisitation of the One Thousand and One Nights transposes the frame story to modern times. Included here for the Arabian Peninsula literary tradition within which Yemen's endangered oral culture sits.\", \"year_num\": 1979}, {\"num\": 4, \"title\": \"Cities of Salt\", \"source_page\": 50, \"author\": \"Abdul Rahman Munif\", \"year\": \"1984\", \"description\": \"Saudi-Jordanian author Munif's five-volume novel of an Arabian desert community transformed by oil -- banned in Saudi Arabia and every Gulf state. The most devastating account of what the discovery of oil did to the Gulf's people and societies.\", \"year_num\": 1984}, {\"num\": 5, \"title\": \"The Slaves\", \"source_page\": 50, \"author\": \"Ibrahim al-Koni\", \"year\": \"2010\", \"description\": \"Libyan-Tuareg author al-Koni's novel of the Saharan desert world -- nomads, slavery, and the elemental confrontation between human beings and the merciless landscape -- captures the pre-modern Arabian world Yemen's war is destroying.\", \"year_num\": 2010}]}, {\"code\": \"LBY\", \"country\": \"Libya\", \"expected_count\": 5, \"intro\": \"Libya -- a country that barely existed as a coherent nation before Gaddafi, and which has been engulfed in civil war since his fall in 2011 -- has produced one writer of international significance who made the desert itself his subject.\", \"source_page\": 51, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"In the Country of Men\", \"source_page\": 51, \"author\": \"Hisham Matar\", \"year\": \"2006\", \"description\": \"A nine-year-old in Tripoli in 1979 watches his father disappear into Gaddafi's secret police. Matar's Booker Prize-shortlisted debut is the most intimate portrait of life under Gaddafi's Libya and of a childhood destroyed by a dictatorship.\", \"year_num\": 2006}, {\"num\": 2, \"title\": \"The Return\", \"source_page\": 51, \"author\": \"Hisham Matar\", \"year\": \"2016\", \"description\": \"Matar returns to Libya after Gaddafi's fall to search for news of his father, imprisoned 20 years earlier. This Pulitzer Prize-winning memoir is inseparable from its fiction -- the most honest account of what Libya's revolution cost.\", \"year_num\": 2016}, {\"num\": 3, \"title\": \"The Bleeding of the Stone\", \"source_page\": 51, \"author\": \"Ibrahim al-Koni\", \"year\": \"1990\", \"description\": \"A Tuareg shepherd in the Libyan Sahara is the last man who knows the whereabouts of the aoudad mountain sheep -- and the last connection to a world the modern state is destroying. Al-Koni's lyrical novel is Libya's greatest work of fiction.\", \"year_num\": 1990}, {\"num\": 4, \"title\": \"Gold Dust\", \"source_page\": 51, \"author\": \"Ibrahim al-Koni\", \"year\": \"1990\", \"description\": \"A man and his camel cross the desert together in a novel that transforms a Tuareg journey into a meditation on loyalty, mortality, and the relationship between humans and the earth. Desert literature at its purest.\", \"year_num\": 1990}, {\"num\": 5, \"title\": \"Anubis\", \"source_page\": 51, \"author\": \"Ibrahim al-Koni\", \"year\": \"2002\", \"description\": \"Al-Koni's mythological novel weaving Tuareg and ancient Egyptian spiritual worlds. Libya's literary tradition is inseparable from the Sahara -- this is its deepest, most spiritual expression.\", \"year_num\": 2002}]}, {\"code\": \"SOM\", \"country\": \"Somalia\", \"expected_count\": 5, \"intro\": \"Somalia -- stateless since 1991, plagued by civil war, Al-Shabaab, piracy, and famine -- has one literary giant: Nuruddin Farah, who has written his country's tragedy into some of the finest political fiction in Africa.\", \"source_page\": 52, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Maps\", \"source_page\": 52, \"author\": \"Nuruddin Farah\", \"year\": \"1986\", \"description\": \"An orphan's uncertain identity -- his nationality, his gender, who his mother is -- mirrors Somalia's uncertain borders. Farah's Maps Trilogy opener is the most psychologically profound Somali novel and a masterpiece of postcolonial identity fiction.\", \"year_num\": 1986}, {\"num\": 2, \"title\": \"Links\", \"source_page\": 52, \"author\": \"Nuruddin Farah\", \"year\": \"2003\", \"description\": \"A Somali exile returns to Mogadishu in the early 1990s to find a city of warring clans and ruins. Farah's most directly political novel is the essential fictional account of Somalia's collapse into statelessness.\", \"year_num\": 2003}, {\"num\": 3, \"title\": \"Crossbones\", \"source_page\": 52, \"author\": \"Nuruddin Farah\", \"year\": \"2011\", \"description\": \"A Somali-Canadian journalist returns to Mogadishu as Al-Shabaab controls the city. The final volume of Farah's Variations on the Theme of an African Dictatorship is the most recent portrait of a country trying to exist.\", \"year_num\": 2011}, {\"num\": 4, \"title\": \"From a Crooked Rib\", \"source_page\": 52, \"author\": \"Nuruddin Farah\", \"year\": \"1970\", \"description\": \"A Somali girl runs away from an arranged marriage -- the first novel published by a Somali author and the first in the tradition to give voice to Somali women's experience of patriarchal nomadic society.\", \"year_num\": 1970}, {\"num\": 5, \"title\": \"Gifts\", \"source_page\": 52, \"author\": \"Nuruddin Farah\", \"year\": \"1993\", \"description\": \"A doctor in Mogadishu contemplates the ethics of international aid -- gift or dependency, relief or humiliation. Farah's meditation on what foreign charity does to Somali dignity is the most politically uncomfortable novel about Africa and the West.\", \"year_num\": 1993}]}, {\"code\": \"VEN\", \"country\": \"Venezuela\", \"expected_count\": 5, \"intro\": \"Venezuela -- once Latin America's wealthiest nation, now experiencing economic collapse, mass emigration, and Maduro's authoritarian government -- has a literary tradition that predates the crisis and predicted it.\", \"source_page\": 53, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Dona Barbara\", \"source_page\": 53, \"author\": \"Romulo Gallegos\", \"year\": \"1929\", \"description\": \"The cacica (chieftain) Dona Barbara dominates the Venezuelan llanos (plains) in a novel of civilization versus barbarism. Gallegos's novel is Venezuela's national epic -- its landscape, its caudillo culture, and its eternal political conflict in one story.\", \"year_num\": 1929}, {\"num\": 2, \"title\": \"Ifigenia\", \"source_page\": 53, \"author\": \"Teresa de la Parra\", \"year\": \"1924\", \"description\": \"A Venezuelan upper-class woman returns from Paris to find herself trapped in Caracas's patriarchal society. De la Parra's feminist novel is the earliest and most elegant critique of Venezuelan bourgeois culture.\", \"year_num\": 1924}, {\"num\": 3, \"title\": \"Lanzas Coloradas\", \"source_page\": 53, \"author\": \"Arturo Uslar Pietri\", \"year\": \"1931\", \"description\": \"The wars of Venezuelan independence (1810-23) through the llanos. Uslar Pietri's historical novel is the most vivid account of the violence that created Venezuela -- the same violence, transformed, that defines it today.\", \"year_num\": 1931}, {\"num\": 4, \"title\": \"The Lost Steps\", \"source_page\": 53, \"author\": \"Alejo Carpentier\", \"year\": \"1953\", \"description\": \"A Cuban composer travels into the Venezuelan jungle to find primitive musical instruments and finds himself going back in time through human history. Set on the Orinoco, Carpentier's masterpiece captures the elemental power of Venezuela's interior.\", \"year_num\": 1953}, {\"num\": 5, \"title\": \"The Night\", \"source_page\": 53, \"author\": \"Tomas Eloy Martinez\", \"year\": \"1996\", \"description\": \"A journalist covering Peron's return to Argentina in 1973 -- included here as the model for Venezuelan political fiction: the caudillo as phenomenon, the crowd as his instrument, and the journalist as helpless witness.\", \"year_num\": 1996}]}, {\"code\": \"DRC\", \"country\": \"DR Congo\", \"expected_count\": 5, \"intro\": \"The Democratic Republic of Congo -- site of the world's deadliest conflict since WWII, with an estimated six million dead since 1996 -- has been written about more brilliantly by outsiders than insiders, a symptom of its colonial wound.\", \"source_page\": 54, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Heart of Darkness\", \"source_page\": 54, \"author\": \"Joseph Conrad\", \"year\": \"1899\", \"description\": \"Marlow travels up the Congo River to find Kurtz -- the famous horror of European colonialism. Conrad's novella is ethically contested (Achebe called it racist) but remains the foundational text on what Europe did to the Congo and what the Congo did to Europe.\", \"year_num\": 1899}, {\"num\": 2, \"title\": \"The Poisonwood Bible\", \"source_page\": 54, \"author\": \"Barbara Kingsolver\", \"year\": \"1998\", \"description\": \"An American Baptist missionary imposes his rigid faith on a Congolese village during the 1960s. Kingsolver's novel is the most read fictional account of the Congo's decolonisation, Patrice Lumumba's murder, and Mobutu's rise.\", \"year_num\": 1998}, {\"num\": 3, \"title\": \"Johnny Mad Dog\", \"source_page\": 54, \"author\": \"Emmanuel Dongala\", \"year\": \"2002\", \"description\": \"A teenage soldier and a girl trying to survive the same civil war from opposite sides. Congolese author Dongala's novel is the most honest account of child soldiers -- their logic, their violence, their terrifying ordinariness.\", \"year_num\": 2002}, {\"num\": 4, \"title\": \"Congo Inc.\", \"source_page\": 54, \"author\": \"In Koli Jean Bofane\", \"year\": \"2014\", \"description\": \"A young Mongo tribesman in Kinshasa navigates coltan mining, international NGOs, and the absurdity of Congo's globalised extraction economy. Bofane's satirical novel is the most original Congolese fiction written from inside.\", \"year_num\": 2014}, {\"num\": 5, \"title\": \"A Sunday at the Pool in Kigali\", \"source_page\": 54, \"author\": \"Gil Courtemanche\", \"year\": \"2000\", \"description\": \"Though set in Rwanda, Courtemanche's novel of genocide-era Central Africa captures the specific atmosphere of the Great Lakes region -- aid workers, corrupt elites, and the catastrophe none of them could stop.\", \"year_num\": 2000}]}, {\"code\": \"HTI\", \"country\": \"Haiti\", \"expected_count\": 5, \"intro\": \"Haiti -- the first Black republic, forged by the world's only successful slave revolution, and now among the world's most desperate countries -- has a literary tradition of extraordinary richness that the world has barely begun to read.\", \"source_page\": 55, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Breath, Eyes, Memory\", \"source_page\": 55, \"author\": \"Edwidge Danticat\", \"year\": \"1994\", \"description\": \"Sophie Caco travels from Haiti to New York to live with her mother, carrying the trauma of her island. Danticat's debut introduced Haiti to the world literary stage and gave the Haitian diaspora its founding narrative.\", \"year_num\": 1994}, {\"num\": 2, \"title\": \"Krik? Krak!\", \"source_page\": 55, \"author\": \"Edwidge Danticat\", \"year\": \"1995\", \"description\": \"Nine stories of Haitian women across the Duvalier dictatorship, the boat people, and the diaspora. Danticat's story collection is the fullest portrait of Haitian feminine experience -- suffering, resistance, and radical survival.\", \"year_num\": 1995}, {\"num\": 3, \"title\": \"The Farming of Bones\", \"source_page\": 55, \"author\": \"Edwidge Danticat\", \"year\": \"1998\", \"description\": \"The 1937 massacre of Haitian sugar cane workers by Dominican dictator Trujillo -- an event deliberately forgotten by both countries. Danticat's novel is the essential act of historical recovery in Caribbean literature.\", \"year_num\": 1998}, {\"num\": 4, \"title\": \"The Kingdom of This World\", \"source_page\": 55, \"author\": \"Alejo Carpentier\", \"year\": \"1949\", \"description\": \"The Haitian Revolution and Henri Christophe's Black Kingdom -- Carpentier's first Magical Realist novel is the most beautiful account of Haiti's founding revolution and the African spiritual world that powered it.\", \"year_num\": 1949}, {\"num\": 5, \"title\": \"Masters of the Dew\", \"source_page\": 55, \"author\": \"Jacques Roumain\", \"year\": \"1944\", \"description\": \"A young Haitian returns from Cuba to find his village destroyed by drought and family feud. Roumain's masterpiece -- written in Haitian Creole and French -- is both a political manifesto and Haiti's most beloved novel.\", \"year_num\": 1944}]}, {\"code\": \"BIH\", \"country\": \"Bosnia\", \"expected_count\": 5, \"intro\": \"Bosnia and Herzegovina -- site of Europe's worst genocide since WWII, with 100,000 killed and the Srebrenica massacre of 1995 -- has a literary tradition stretching back to the Nobel Prize-winning Ivo Andric, who captured the country's layered civilisations.\", \"source_page\": 56, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Bridge on the Drina\", \"source_page\": 56, \"author\": \"Ivo Andric\", \"year\": \"1945\", \"description\": \"A 16th-century Ottoman bridge in Visegrad as the fixed point around which four centuries of Bosnian history revolves -- Turks, Austro-Hungarians, Serbs, Muslims, Jews. Andric's Nobel Prize winner is the essential account of the Balkans as Europe's civilisational crossroads.\", \"year_num\": 1945}, {\"num\": 2, \"title\": \"Death and the Dervish\", \"source_page\": 56, \"author\": \"Mesa Selimovic\", \"year\": \"1966\", \"description\": \"An 18th-century Bosnian Muslim monk searches for his arrested brother within an Ottoman legal system that treats individuals as expendable. Selimovic's masterpiece is the most philosophically profound Bosnian novel -- justice, power, and the individual soul.\", \"year_num\": 1966}, {\"num\": 3, \"title\": \"The Cellist of Sarajevo\", \"source_page\": 56, \"author\": \"Steven Galloway\", \"year\": \"2008\", \"description\": \"During the Sarajevo siege (1992-96), a cellist plays Albinoni's Adagio for 22 days in memory of 22 people killed by a shell. Three civilians try to reach him. Galloway's novel is the most widely read international account of the siege.\", \"year_num\": 2008}, {\"num\": 4, \"title\": \"The Lazarus Project\", \"source_page\": 56, \"author\": \"Aleksandar Hemon\", \"year\": \"2008\", \"description\": \"A Bosnian immigrant in Chicago traces the 1908 murder of a Jewish immigrant by a Chicago police chief. Hemon's bilingual, bicultural novel is the essential account of what it means to carry Eastern Europe inside you in America.\", \"year_num\": 2008}, {\"num\": 5, \"title\": \"Nowhere Man\", \"source_page\": 56, \"author\": \"Aleksandar Hemon\", \"year\": \"2002\", \"description\": \"Jozef Pronek -- Bosnian musician in Chicago -- loses his country while visiting America. Hemon's fragmented, funny, heartbreaking debut is the Bosnian war's best account of what it means to be displaced from a country that has ceased to exist.\", \"year_num\": 2002}]}, {\"code\": \"RWA\", \"country\": \"Rwanda\", \"expected_count\": 5, \"intro\": \"Rwanda's 1994 genocide -- 800,000 Tutsi and moderate Hutu killed in 100 days -- is one of the 20th century's defining atrocities and has produced a literature that grapples with the question all genocide literature must ask: how does one write about this?\", \"source_page\": 57, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"Our Lady of the Nile\", \"source_page\": 57, \"author\": \"Scholastique Mukasonga\", \"year\": \"2012\", \"description\": \"Girls at an elite Rwandan boarding school in the 1970s navigate the growing ethnic tensions between Hutu and Tutsi students. Mukasonga -- who lost 37 family members in the genocide -- shows the ideology being assembled, year by year.\", \"year_num\": 2012}, {\"num\": 2, \"title\": \"Cockroaches\", \"source_page\": 57, \"author\": \"Scholastique Mukasonga\", \"year\": \"2006\", \"description\": \"The term 'inyenzi' (cockroach) used for Tutsi in pre-genocide Rwanda. Mukasonga's novella is the most personal account of the ethnic hatred that built for decades before the killing began in 1994.\", \"year_num\": 2006}, {\"num\": 3, \"title\": \"A Sunday at the Pool in Kigali\", \"source_page\": 57, \"author\": \"Gil Courtemanche\", \"year\": \"2000\", \"description\": \"A Canadian journalist at a Kigali hotel pool watches the genocide approach. Courtemanche's documentary novel -- written before the International Criminal Tribunal's verdicts -- is the essential fictional account of the genocide's mechanics.\", \"year_num\": 2000}, {\"num\": 4, \"title\": \"The Barefoot Woman\", \"source_page\": 57, \"author\": \"Scholastique Mukasonga\", \"year\": \"2018\", \"description\": \"Mukasonga's tribute to her mother Stefania, who died in the 1994 genocide. This memoir-novel of Rwandan Tutsi women's daily lives is the most intimate account of the world that was destroyed.\", \"year_num\": 2018}, {\"num\": 5, \"title\": \"Shake Hands with the Devil\", \"source_page\": 57, \"author\": \"Romeo Dallaire\", \"year\": \"2003\", \"description\": \"The UN force commander's account of the genocide he was powerless to stop. Though memoir rather than fiction, Dallaire's book -- written in the desperation of a man who saw everything -- is indispensable to understanding Rwanda's catastrophe.\", \"year_num\": 2003}]}, {\"code\": \"PRK\", \"country\": \"North Korea\", \"expected_count\": 5, \"intro\": \"North Korea -- the world's most isolated state, where an estimated 200,000 people are held in political prison camps -- has no free literary culture. Its literature is entirely state-produced propaganda. The real literature of North Korea is written by defectors.\", \"source_page\": 58, \"group\": \"Active conflict & war zones\", \"extended\": false, \"books\": [{\"num\": 1, \"title\": \"The Accusation\", \"source_page\": 58, \"author\": \"Bandi\", \"year\": \"2014\", \"description\": \"Seven stories written inside North Korea by an author who cannot be identified, smuggled out by a defector. This is the only fiction written inside North Korea by a North Korean that the world has been able to read -- an act of extraordinary courage.\", \"year_num\": 2014}, {\"num\": 2, \"title\": \"In Order to Live\", \"source_page\": 58, \"author\": \"Yeonmi Park\", \"year\": \"2015\", \"description\": \"Park escaped North Korea at 13 and crossed the Gobi Desert to reach freedom. Her memoir-narrative of life in Hyesan, the defection, and the sex trafficking she survived is the most widely read North Korean defector account.\", \"year_num\": 2015}, {\"num\": 3, \"title\": \"Without You, There Is No Us\", \"source_page\": 58, \"author\": \"Suki Kim\", \"year\": \"2014\", \"description\": \"A Korean-American journalist spends six months teaching English to the sons of the North Korean elite. Kim's account is the most detailed portrait of daily life at the top of North Korean society -- the most isolated people on earth.\", \"year_num\": 2014}, {\"num\": 4, \"title\": \"Nothing to Envy\", \"source_page\": 58, \"author\": \"Barbara Demick\", \"year\": \"2009\", \"description\": \"Six North Korean defectors tell their stories. Demick's reconstruction -- part fiction, part reportage -- is the fullest portrait of ordinary North Korean life across the Kim dynasty, the famine, and the decision to flee.\", \"year_num\": 2009}, {\"num\": 5, \"title\": \"Dear Leader\", \"source_page\": 58, \"author\": \"Jang Jin-Sung\", \"year\": \"2014\", \"description\": \"A poet who was a member of Kim Jong-il's inner propaganda circle defects after obtaining a banned South Korean magazine. Jang's memoir of life inside the Korean Workers' Party is the most intimate portrait of how the regime maintains its ideological control. A Final Note on Selection Every list like this is an argument. These novels were chosen on two grounds: literary greatness and documentary power -- the ability to make a country's history, landscape, class structure, and moral life legible to an outsider. Four countries received extended treatment because their literary traditions are deep enough to demand it: Russia, India, the USA, and the UK have each produced literary traditions that rival any civilisation's. The conflict zone selections carry particular weight: in Ukraine, Afghanistan, Syria, Myanmar, Iraq, Somalia, Haiti, Bosnia, Rwanda, and North Korea, literature is an act of survival. The books listed for those countries are as close as reading can bring you to understanding what war destroys -- not just buildings and bodies, but the particular, irreplaceable way a people told stories about themselves. Read them before those stories become inaccessible. 50 Countries | 300 Novels | One World\", \"year_num\": 2014}]}];\nconst $=id=>document.getElementById(id); let savedOnly=false, unreadOnly=false;\nconst allBooks=DATA.flatMap(c=>c.books.map(b=>({...b,code:c.code,country:c.country,group:c.group,extended:c.extended,intro:c.intro})));\nconst bookKey=b=>'worldFiction:'+b.code+':'+b.num+':'+b.title;\nconst readKey=b=>bookKey(b)+':read', saveKey=b=>bookKey(b)+':save';\nconst isRead=b=>localStorage.getItem(readKey(b))==='1'; const isSaved=b=>localStorage.getItem(saveKey(b))==='1';\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'})[c]);\nfunction periodOk(y,p){if(!p)return true;if(!y)return false;if(p==='pre1900')return y\u003c1900;if(p==='1900-1945')return y>=1900&&y\u003c=1945;if(p==='1946-1989')return y>=1946&&y\u003c=1989;if(p==='1990-2009')return y>=1990&&y\u003c=2009;if(p==='2010plus')return y>=2010;return true}\nfunction setup(){DATA.forEach(c=>{let o=document.createElement('option');o.value=c.code;o.textContent=`${c.country} (${c.books.length})`;$('country').appendChild(o)});$('majorPills').innerHTML=DATA.filter(c=>c.group.startsWith('Major')).map(c=>`\u003cbutton class=\"cpill\" onclick=\"pickCountry('${c.code}')\">${esc(c.country)}\u003c/button>`).join('');$('conflictPills').innerHTML=DATA.filter(c=>c.group.startsWith('Active')).map(c=>`\u003cbutton class=\"cpill\" onclick=\"pickCountry('${c.code}')\">${esc(c.country)}\u003c/button>`).join('');['q','group','country','period','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();}\nfunction getMatches(){const q=$('q').value.trim().toLowerCase(),g=$('group').value,co=$('country').value,p=$('period').value;let rows=[];DATA.forEach(c=>{if(g&&c.group!==g)return;if(co&&c.code!==co)return;let books=c.books.filter(b=>{const hay=[b.title,b.author,b.year,b.description,c.country,c.intro,c.code].join(' ').toLowerCase();return (!q||hay.includes(q))&&periodOk(b.year_num,p)&&(!savedOnly||isSaved({...b,code:c.code}))&&(!unreadOnly||!isRead({...b,code:c.code}))});if(books.length)rows.push({...c,books})});const s=$('sort').value;if(s==='country')rows.sort((a,b)=>a.country.localeCompare(b.country));if(s==='old'||s==='new'||s==='title'){let flattened=rows.flatMap(c=>c.books.map(b=>({...b,code:c.code,country:c.country,group:c.group,intro:c.intro,extended:c.extended,expected_count:c.expected_count})));flattened.sort((a,b)=>s==='title'?a.title.localeCompare(b.title):s==='old'?(a.year_num||9999)-(b.year_num||9999):(b.year_num||0)-(a.year_num||0));rows=flattened.map(x=>({code:x.code,country:x.country,group:x.group,intro:x.intro,extended:x.extended,expected_count:1,books:[x],virtual:true}))}return rows}\nfunction render(){const rows=getMatches(),bookCount=rows.reduce((n,c)=>n+c.books.length,0);$('resultline').textContent=`${bookCount} books shown across ${new Set(rows.map(c=>c.code)).size} country sections \u00b7 ${allBooks.filter(isRead).length} read \u00b7 ${allBooks.filter(isSaved).length} saved`;$('savedBtn').classList.toggle('active',savedOnly);$('unreadBtn').classList.toggle('active',unreadOnly);$('countryList').innerHTML=rows.length?rows.map(countryHTML).join(''):'\u003cdiv class=\"empty\">No books match these filters.\u003c/div>';updateProgress();}\nfunction countryHTML(c){const conflict=c.group.startsWith('Active'),open=c.virtual||$('country').value===c.code||$('q').value||$('period').value||savedOnly||unreadOnly;return `\u003carticle class=\"country-card ${conflict?'conflict':''} ${c.extended?'extended':''} ${open?'open':''}\" id=\"card-${c.code}\">\u003cdiv class=\"country-head\">\u003cdiv>\u003cdiv class=\"country-code\">[${esc(c.code)}] \u00b7 ${esc(c.group)}\u003c/div>\u003ch3 class=\"country-name\">${esc(c.country)}\u003c/h3>\u003cp class=\"country-intro\">${esc(c.intro)}\u003c/p>\u003c/div>\u003cdiv class=\"country-meta\">\u003cb>${c.books.length}\u003c/b>\u003cspan>${c.books.length===1?'visible book':'visible books'}\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"country-actions\">\u003cbutton class=\"toggle\" onclick=\"toggleCountry('${c.code}')\">Open / close books\u003c/button>\u003cbutton class=\"toggle\" onclick=\"pickCountry('${c.code}')\">Focus country\u003c/button>\u003cspan class=\"toggle\">PDF page ${c.source_page}\u003c/span>\u003c/div>\u003cdiv class=\"books\">${c.books.map(b=>bookHTML(c,b)).join('')}\u003c/div>\u003c/article>`}\nfunction bookHTML(c,b){const bb={...b,code:c.code};return `\u003carticle class=\"book ${isRead(bb)?'read':''} ${isSaved(bb)?'saved':''}\">\u003cdiv class=\"book-top\">\u003cdiv class=\"num\">${b.num}\u003c/div>\u003cdiv>\u003ch4>${esc(b.title)}\u003c/h4>\u003cdiv class=\"byline\">${esc(b.author)} \u00b7 ${esc(b.year)}\u003c/div>\u003c/div>\u003cdiv class=\"year\">${b.year_num||''}\u003c/div>\u003c/div>\u003cp class=\"desc\">${esc(b.description)}\u003c/p>\u003cdiv class=\"book-foot\">\u003cbutton class=\"mini ${isRead(bb)?'on':''}\" onclick='toggleRead(${JSON.stringify(c.code)},${b.num})'>\u2713 ${isRead(bb)?'Read':'Mark read'}\u003c/button>\u003cbutton class=\"mini star ${isSaved(bb)?'on':''}\" onclick='toggleSave(${JSON.stringify(c.code)},${b.num})'>\u2605 ${isSaved(bb)?'Saved':'Save'}\u003c/button>\u003cspan class=\"page\">Source PDF p. ${b.source_page}\u003c/span>\u003c/div>\u003c/article>`}\nfunction getBook(code,num){const c=DATA.find(x=>x.code===code);const b=c.books.find(x=>x.num===num);return{...b,code}}\nfunction toggleRead(code,num){const b=getBook(code,num),k=readKey(b);localStorage.getItem(k)==='1'?localStorage.removeItem(k):localStorage.setItem(k,'1');render()}\nfunction toggleSave(code,num){const b=getBook(code,num),k=saveKey(b);localStorage.getItem(k)==='1'?localStorage.removeItem(k):localStorage.setItem(k,'1');render()}\nfunction toggleCountry(code){const e=$('card-'+code);if(e)e.classList.toggle('open')}\nfunction pickCountry(code){$('country').value=code;location.hash='countries';render();setTimeout(()=>{const e=$('card-'+code);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},80)}\nfunction openVisible(){document.querySelectorAll('.country-card').forEach(e=>e.classList.add('open'))}\nfunction toggleSavedFilter(){savedOnly=!savedOnly;render()} function toggleUnreadFilter(){unreadOnly=!unreadOnly;render()}\nfunction resetFilters(){$('q').value='';$('group').value='';$('country').value='';$('period').value='';$('sort').value='source';savedOnly=false;unreadOnly=false;render()}\nfunction randomUnread(){const pool=allBooks.filter(b=>!isRead(b));if(!pool.length)return alert('All 300 entries are marked read.');const b=pool[Math.floor(Math.random()*pool.length)];resetFilters();$('q').value=b.title;render();location.hash='countries'}\nfunction updateProgress(){const r=allBooks.filter(isRead).length,s=allBooks.filter(isSaved);const pct=Math.round(r/allBooks.length*100);$('progressBar').style.width=pct+'%';$('progressText').textContent=`${r} of ${allBooks.length} entries marked read (${pct}%).`;$('queue').innerHTML=s.length?s.slice(0,20).map(b=>`\u003cdiv>\u003cb>${esc(b.title)}\u003c/b> \u00b7 ${esc(b.author)} \u003csmall>(${esc(b.country)})\u003c/small>\u003c/div>`).join(''):'\u003cdiv>No saved books yet. Use \u2605 Save on any book.\u003c/div>'}\nfunction clearProgress(){if(!confirm('Clear all read and saved markers for this guide?'))return;Object.keys(localStorage).filter(k=>k.startsWith('worldFiction:')).forEach(k=>localStorage.removeItem(k));render()}\nsetup();\n\u003c/script>\u003c/body>\u003c/html>", "nonfiction": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003ctitle>The World in Nonfiction \u2014 Expanded Novelist&#x27;s Edition\u003c/title>\u003cstyle>\n:root{--navy:#123A63;--navy2:#0B5E75;--gold:#D97706;--red:#B42318;--cream:#F2F5F9;--paper:#fff;--ink:#101828;--muted:#475467;--line:#BFCBDA;--green:#087A67;--purple:#6941C6;--pink:#A23B72;--shadow:0 10px 28px rgba(15,23,42,.08)}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.55}\nbutton,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}\n.nav{max-width:1360px;margin:auto;padding:10px 20px;display:flex;gap:17px;align-items:center;overflow:auto;white-space:nowrap}.logo{font-weight:950;color:var(--navy);letter-spacing:.04em;margin-right:auto}.nav a{font-size:12px;text-decoration:none;color:#344054;font-weight:800}\n.hero{background:linear-gradient(125deg,#071B2E,#123A63 56%,#0B5E75);color:#fff}.hero-inner{max-width:1360px;margin:auto;padding:64px 20px 52px;display:grid;grid-template-columns:1.45fr .72fr;gap:36px;align-items:end}\n.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:950;color:#FFD166}h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,80px);line-height:.96;letter-spacing:-.045em;margin:12px 0 17px}.hero p{font-family:Georgia,serif;font-size:18px;max-width:850px;color:#F2F4F7}\n.hero-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.34);border-radius:18px;padding:20px}.hero-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.hero-stat{background:rgba(255,255,255,.1);border-radius:11px;padding:11px}.hero-stat b{display:block;font-size:25px}.hero-stat span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#E4E7EC}\nmain{max-width:1360px;margin:auto;padding:0 20px 70px}section{padding:44px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:20px}.section-head h2{font-family:Georgia,serif;color:var(--navy);font-size:34px;line-height:1.05;margin:0}.section-head p{max-width:760px;color:var(--muted);font-size:13px;margin:0}\n.novel-layer{background:linear-gradient(135deg,#FFF7E8,#F4F0FF);border:1px solid #E7C68C;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.novel-layer h3{font-family:Georgia,serif;font-size:25px;margin:0;color:var(--navy)}.novel-layer p{font-size:12.5px;color:#475467;max-width:900px}\n.project-row,.toolrow,.pills{display:flex;gap:7px;flex-wrap:wrap}.project{border:1px solid #AAB7C7;background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.project.active{background:var(--pink);border-color:var(--pink);color:white}\n.controls-wrap{position:sticky;top:41px;z-index:20;background:rgba(242,245,249,.97);backdrop-filter:blur(12px);padding:13px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}.controls{display:grid;grid-template-columns:2.1fr repeat(4,1fr);gap:8px}\ninput,select{width:100%;padding:10px 11px;border:1.5px solid #AAB7C7;border-radius:10px;background:white;color:var(--ink);font-size:12px}.btn{border:1px solid #AAB7C7;background:white;border-radius:999px;padding:8px 11px;font-size:10.5px;font-weight:900;color:#344054}.btn.primary{background:var(--navy);border-color:var(--navy);color:white}.btn.active{background:var(--green);border-color:var(--green);color:white}.resultline{font-size:11px;color:var(--muted);margin-top:8px}\n.list{display:grid;gap:13px}.section-card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 6px 20px rgba(15,23,42,.05)}.section-card.novelmatch{border-top:4px solid var(--pink)}\n.section-title{padding:18px 20px 14px;display:grid;grid-template-columns:1fr auto;gap:14px}.code{font-size:10px;letter-spacing:.12em;font-weight:950;color:#B45309}.section-title h3{font-family:Georgia,serif;color:var(--navy);font-size:26px;margin:3px 0 6px}.intro{font-family:Georgia,serif;color:#475467;font-size:14px;margin:0;max-width:1000px}.meta-count{text-align:right}.meta-count b{display:block;font-size:27px;color:var(--navy)}.meta-count span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}\n.section-actions{padding:0 20px 14px}.toggle{border:1px solid #C4D0DE;background:#E8EFF6;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:900;color:#344054}.books{display:none;background:#EAF0F6;border-top:1px solid var(--line);padding:10px 12px 14px}.section-card.open .books{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}\n.book{background:#fff;border:1px solid #BDC9D7;border-radius:12px;padding:13px;position:relative}.book.read{opacity:.78;background:#F4FBF8}.book.saved{box-shadow:inset 0 0 0 2px rgba(217,119,6,.5)}.book.project-hit{border-left:4px solid var(--pink)}\n.book-top{display:grid;grid-template-columns:auto 1fr auto;gap:9px}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#FFF0D7;border:1px solid #F1C37B;color:#994900;font-size:10px;font-weight:950}.book h4{font-family:Georgia,serif;color:#102A43;font-size:18px;line-height:1.12;margin:1px 0 3px}.byline{font-size:10.5px;color:#475467;font-weight:800}.year{font-size:10px;color:#B45309;font-weight:950}.desc{font-family:Georgia,serif;font-size:13px;color:#344054;margin:10px 0 7px}.bridge{font-size:11px;color:#344054;background:#F2F7FB;border-left:3px solid var(--navy2);padding:7px 8px;margin:8px 0}.novelnote{font-size:10.5px;background:#FFF2F7;border-left:3px solid var(--pink);padding:7px 8px;margin:8px 0;color:#5C2143}\n.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{background:#EEF3F8;border:1px solid #D2DDE8;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:850;color:#475467}.tag.projecttag{background:#FBEAF3;border-color:#E8A7C9;color:#7A284F}.tag.deep{background:#EAF7F4;border-color:#A8D9CF;color:#086454}\n.book-foot{border-top:1px solid #DCE3EA;margin-top:9px;padding-top:8px;display:flex;gap:6px}.mini{border:1px solid #C8D2DD;background:#E7EEF5;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:900;color:#344054}.mini.on{background:var(--green);color:#fff;border-color:var(--green)}.mini.star.on{background:var(--gold);color:#fff;border-color:var(--gold)}\n.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.statbox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.statbox b{display:block;font-size:25px;color:var(--navy)}.statbox span{font-size:10px;color:var(--muted);font-weight:850;text-transform:uppercase}\n.empty{padding:42px;text-align:center;background:#fff;border:1px dashed #AAB7C7;border-radius:14px;color:var(--muted)}.note{margin-top:13px;padding:14px 16px;background:#FFF4DE;border-left:4px solid var(--gold);border-radius:0 11px 11px 0;font-size:11px;color:#4D3B1F}.footer{padding-top:28px;color:var(--muted);font-size:10.5px}\n@media(max-width:980px){.hero-inner{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr 1fr}.section-card.open .books{grid-template-columns:1fr}}\n@media(max-width:620px){.nav{padding:9px 13px}.hero-inner,main{padding-left:13px;padding-right:13px}h1{font-size:48px}.section-head{display:block}.section-head p{margin-top:8px}.controls{grid-template-columns:1fr}.controls-wrap{position:relative;top:0}.stats-grid{grid-template-columns:1fr 1fr}.section-title{grid-template-columns:1fr}.meta-count{text-align:left;display:flex;gap:7px;align-items:baseline}}\n@media print{.top,.controls-wrap,.section-actions,.book-foot,.novel-layer .project-row{display:none!important}.books{display:grid!important;grid-template-columns:repeat(2,1fr)!important}body{background:white}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"top\">\u003cnav class=\"nav\">\u003cdiv class=\"logo\">THE WORLD IN NONFICTION\u003c/div>\u003ca href=\"#novelsN\">For My Novels\u003c/a>\u003ca href=\"#newN\">New Foundations\u003c/a>\u003ca href=\"#browseN\">Browse\u003c/a>\u003c/nav>\u003c/div>\n\u003cheader class=\"hero\">\u003cdiv class=\"hero-inner\">\u003cdiv>\u003cdiv class=\"eyebrow\">Expanded integrated atlas \u00b7 novelist's edition\u003c/div>\u003ch1>The World\u003cbr>in Nonfiction\u003c/h1>\u003cp>The original integrated knowledge atlas, expanded with foundational shelves on language, sound & music, global politics, architecture, writing craft \u2014 plus a deep comparative section on non-dual philosophy.\u003c/p>\u003c/div>\u003caside class=\"hero-card\">\u003cdiv class=\"hero-stats\">\u003cdiv class=\"hero-stat\">\u003cb>277\u003c/b>\u003cspan>books\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>22\u003c/b>\u003cspan>knowledge domains\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>6\u003c/b>\u003cspan>deep domains\u003c/span>\u003c/div>\u003cdiv class=\"hero-stat\">\u003cb>30\u003c/b>\u003cspan>novel-linked books\u003c/span>\u003c/div>\u003c/div>\u003c/aside>\u003c/div>\u003c/header>\n\u003cmain>\n\u003csection id=\"novelsN\">\u003cdiv class=\"novel-layer\">\u003cdiv class=\"eyebrow\" style=\"color:var(--pink)\">Interactive layer\u003c/div>\u003ch3>\u270d For My Novels\u003c/h3>\u003cp>This layer cross-links political history, caste, theology, journalism, craft and place-writing to the specific projects named in your research guides.\u003c/p>\u003cdiv class=\"project-row\" id=\"projectRowN\">\u003c/div>\u003cdiv class=\"note\">Added research books include \u003cb>Shadow Armies, Why I Am Not a Hindu, The Free Voice, Caste Matters, Kabir: The Weaver's Songs, The Bijak of Kabir, The Life of a Text, We Need New Stories, Sudan's Unfinished Democracy, The Great Theft, The Question of Palestine, The Hundred Years' War on Palestine\u003c/b> and \u003cb>Palestinian Walks\u003c/b>.\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"newN\">\u003cdiv class=\"section-head\">\u003ch2>New foundational shelves\u003c/h2>\u003cp>The missing areas are now first-class domains rather than scattered one-off recommendations.\u003c/p>\u003c/div>\u003cdiv class=\"stats-grid\">\n\u003cdiv class=\"statbox\">\u003cb>10\u003c/b>\u003cspan>Language\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>10\u003c/b>\u003cspan>Sound & music\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>16\u003c/b>\u003cspan>Global politics\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>10\u003c/b>\u003cspan>Architecture\u003c/span>\u003c/div>\u003cdiv class=\"statbox\">\u003cb>16\u003c/b>\u003cspan>Non-dual \u00b7 deep\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>Non-dual philosophy is intentionally deep:\u003c/b> it starts with the Upanishads and Bhagavad Gita, moves through Gaudapada and Shankara, then Ramana Maharshi and Nisargadatta, Kashmir Shaivism, Buddhist Madhyamaka/emptiness, and contemporary direct-path writing. The traditions are kept distinct rather than flattened into one doctrine.\u003c/div>\u003c/section>\n\u003csection id=\"browseN\">\u003cdiv class=\"section-head\">\u003ch2>Explore all 277 nonfiction books\u003c/h2>\u003cp>Search across title, author, rationale and cross-domain bridge; filter by depth, domain, level and novel project.\u003c/p>\u003c/div>\n\u003cdiv class=\"controls-wrap\">\u003cdiv class=\"controls\">\u003cinput id=\"qN\" placeholder=\"Search title, author, concept, subject\u2026\">\u003cselect id=\"depthN\">\u003coption value=\"\">All depth bands\u003c/option>\u003coption>Deep\u003c/option>\u003coption>Intermediate\u003c/option>\u003coption>Foundation\u003c/option>\u003c/select>\u003cselect id=\"domainN\">\u003coption value=\"\">All domains\u003c/option>\u003c/select>\u003cselect id=\"levelN\">\u003coption value=\"\">All levels\u003c/option>\u003coption>Foundation\u003c/option>\u003coption>Core\u003c/option>\u003coption>Explore\u003c/option>\u003coption>Advanced\u003c/option>\u003c/select>\u003cselect id=\"projectN\">\u003coption value=\"\">All novel projects\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"toolrow\">\u003cbutton class=\"btn primary\" onclick=\"openVisibleN()\">Open visible\u003c/button>\u003cbutton class=\"btn\" id=\"savedN\" onclick=\"toggleSavedN()\">\u2605 Saved only\u003c/button>\u003cbutton class=\"btn\" id=\"unreadN\" onclick=\"toggleUnreadN()\">Unread only\u003c/button>\u003cbutton class=\"btn\" onclick=\"resetN()\">Reset\u003c/button>\u003c/div>\u003cdiv class=\"resultline\" id=\"resultN\">\u003c/div>\u003c/div>\n\u003cdiv class=\"list\" id=\"listN\">\u003c/div>\u003c/section>\n\u003cdiv class=\"footer\">The World in Nonfiction \u2014 Expanded Novelist's Edition \u00b7 277 books across 22 domains \u00b7 self-contained HTML.\u003c/div>\u003c/main>\n\u003cscript>\nconst ATLASN={\"domains\":[{\"code\":\"MATH\",\"name\":\"Mathematics\",\"expected_count\":20,\"depth\":\"Deep\",\"intro\":\"Build mathematical maturity from basic manipulation and proof through calculus, linear algebra, probability, analysis, dynamics and modelling. This is the strongest formal spine because it supports the M.Sc., computation and complexity science.\"},{\"code\":\"CPLX\",\"name\":\"Complexity, Networks & Systems\",\"expected_count\":22,\"depth\":\"Deep\",\"intro\":\"The central synthesis layer: feedback, emergence, nonlinear dynamics, networks, adaptation, scaling, self-organization, agent-based models and complex adaptive systems.\"},{\"code\":\"ANTH\",\"name\":\"Anthropology & Human Variation\",\"expected_count\":18,\"depth\":\"Deep\",\"intro\":\"Learn to take human variation seriously: biological evolution, culture, kinship, fieldwork, archaeology, language, environment, institutions and cultural evolution.\"},{\"code\":\"PROD\",\"name\":\"Product, Strategy & Organizations\",\"expected_count\":16,\"depth\":\"Deep\",\"intro\":\"A builder's shelf for discovering real problems, designing products, positioning them, choosing strategy, managing organizations and understanding innovation as a system.\"},{\"code\":\"IND\",\"name\":\"India \u2014 History, Society & State\",\"expected_count\":27,\"depth\":\"Deep\",\"intro\":\"A deliberately plural route into India: history, Constitution, caste, economy, development, tribes, environment, bureaucracy, democracy, language, migration and regional complexity.\"},{\"code\":\"PHIL\",\"name\":\"Philosophy & Philosophy of Mind\",\"expected_count\":14,\"depth\":\"Intermediate\",\"intro\":\"An intermediate path from argument and epistemology into philosophy of science, causation, mind, consciousness, free will, emergence and models.\"},{\"code\":\"CS\",\"name\":\"Computer Science & Software\",\"expected_count\":14,\"depth\":\"Intermediate\",\"intro\":\"Understand how computation works from bits to algorithms, systems, software design and data-intensive architecture, with Python as the practical language.\"},{\"code\":\"AI\",\"name\":\"AI, Machine Learning & Intelligent Systems\",\"expected_count\":12,\"depth\":\"Intermediate\",\"intro\":\"Move from a broad definition of AI to statistical learning, neural networks, transformers, AI engineering, alignment and the social consequences of automated systems.\"},{\"code\":\"PHYS\",\"name\":\"Physics & Physical Reality\",\"expected_count\":12,\"depth\":\"Intermediate\",\"intro\":\"Build a calculus-based physical foundation, then use conceptual books to rethink time, entropy, quantum theory and the relation between information and reality.\"},{\"code\":\"BIO\",\"name\":\"Biology, Evolution & Life\",\"expected_count\":8,\"depth\":\"Foundation\",\"intro\":\"A compact biological base: cells, evolution, ecology, cooperation, cognition, microbiomes and the sensory worlds of other organisms.\"},{\"code\":\"ECON\",\"name\":\"Economics & Institutions\",\"expected_count\":8,\"depth\":\"Foundation\",\"intro\":\"A modern introduction to incentives, institutions, development, behavioural economics, inequality, evolutionary economics and real-world markets.\"},{\"code\":\"POL\",\"name\":\"Politics, Sociology & Collective Action\",\"expected_count\":8,\"depth\":\"Foundation\",\"intro\":\"A foundation in power, institutions, social structure, collective action, state capacity and the limits of centralized control.\"},{\"code\":\"HIST\",\"name\":\"History, Geography & Geopolitics\",\"expected_count\":8,\"depth\":\"Foundation\",\"intro\":\"Learn to reason historically and spatially, then use geography, energy, trade and chokepoints to understand why global patterns take the shapes they do.\"},{\"code\":\"MEDIA\",\"name\":\"Media, Art, Design & Perception\",\"expected_count\":8,\"depth\":\"Foundation\",\"intro\":\"How media, images, architecture and design reorganize attention and meaning\u2014from McLuhan and Berger to visual culture and human-centred design.\"},{\"code\":\"MIND\",\"name\":\"Psychology, Cognition & Behaviour\",\"expected_count\":6,\"depth\":\"Foundation\",\"intro\":\"A compact route into cognition, judgment, morality, behaviour and predictive minds\u2014useful for building realistic agents in social models.\"},{\"code\":\"EARTH\",\"name\":\"Environment, Climate & Earth Systems\",\"expected_count\":6,\"depth\":\"Foundation\",\"intro\":\"Earth as a coupled physical\u2013biological\u2013human system: climate, planetary boundaries, resilience, energy and the Anthropocene.\"},{\"code\":\"GLOB\",\"name\":\"Global Politics & International Relations\",\"expected_count\":16,\"depth\":\"Foundation\",\"intro\":\"An accessible foundation in international relations, power, war, diplomacy, global institutions and competing theories of world order. Read across perspectives rather than treating any one school as neutral.\"},{\"code\":\"WRITE\",\"name\":\"Writing Craft & Literary Practice\",\"expected_count\":8,\"depth\":\"Foundation\",\"intro\":\"A practical writer's shelf: close reading, voice, sentence craft, structure, revision, discipline and the ethics of turning research into fiction.\"},{\"code\":\"LANG\",\"name\":\"Language & Linguistics\",\"expected_count\":10,\"depth\":\"Foundation\",\"intro\":\"A readable path into what language is, how it changes, how it shapes categories and metaphors, how dialects and internet speech evolve, and how languages rise and disappear.\"},{\"code\":\"MUSIC\",\"name\":\"Sound, Music & Listening\",\"expected_count\":10,\"depth\":\"Foundation\",\"intro\":\"A fundamental but pleasurable route into hearing: music cognition, sound recording, listening cultures, composition, noise, rhythm and the social life of sound.\"},{\"code\":\"ARCH\",\"name\":\"Architecture, Cities & Built Environment\",\"expected_count\":10,\"depth\":\"Foundation\",\"intro\":\"An approachable visual and social foundation in buildings, streets, cities, human scale, pattern, memory and how designed space changes behaviour.\"},{\"code\":\"NOND\",\"name\":\"Non-Dual Philosophy & Contemplative Traditions\",\"expected_count\":16,\"depth\":\"Deep\",\"intro\":\"A deep comparative shelf centred on Advaita Vedanta, Ramana Maharshi, Nisargadatta and Kashmir Shaivism, with Buddhist emptiness and modern direct-path texts as counterpoints. Read experientially but also critically: traditions use 'non-dual' in importantly different ways.\"}],\"books\":[{\"domain\":\"MATH\",\"title\":\"Basic Mathematics\",\"author\":\"Serge Lang\",\"kind\":\"Textbook\",\"level\":\"Foundation\",\"why\":\"Rebuilds algebra, functions, equations, inequalities, geometry and trigonometry without assuming that school mathematics is already automatic.\",\"bridge\":\"Fluent algebra is the entry ticket to dynamical systems, probability, modelling and every later quantitative layer.\",\"year\":\"\",\"num\":1,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Book of Proof\",\"author\":\"Richard Hammack\",\"kind\":\"Open textbook\",\"level\":\"Foundation\",\"why\":\"A gentle first course in logic, sets, induction, contradiction, functions and proof-writing.\",\"bridge\":\"Complexity work becomes stronger when you can distinguish intuition, simulation and proof.\",\"year\":\"\",\"num\":2,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"How to Solve It\",\"author\":\"George P\u00f3lya\",\"kind\":\"Classic guide\",\"level\":\"Foundation\",\"why\":\"A short, durable method for attacking unfamiliar mathematical problems by reformulation, analogy and decomposition.\",\"bridge\":\"Problem decomposition is also the mental habit behind modelling and computational experimentation.\",\"year\":\"\",\"num\":3,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Calculus: Early Transcendentals\",\"author\":\"James Stewart\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"A broad computational calculus spine with enormous exercise depth.\",\"bridge\":\"Calculus supplies rates, accumulation and continuous change\u2014the language of dynamical systems.\",\"year\":\"\",\"num\":4,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Infinite Powers\",\"author\":\"Steven Strogatz\",\"kind\":\"Trade / conceptual\",\"level\":\"Core\",\"why\":\"Tells the story and intuition of calculus through motion, curves, waves and approximation.\",\"bridge\":\"Shows why local change can explain global behaviour, a recurring complexity theme.\",\"year\":\"\",\"num\":5,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Introduction to Linear Algebra\",\"author\":\"Gilbert Strang\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"Builds geometric and computational intuition for vectors, matrices, eigenvalues and linear transformations.\",\"bridge\":\"Networks, machine learning, Markov processes and numerical models all live heavily in linear algebra.\",\"year\":\"\",\"num\":6,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Linear Algebra Done Right\",\"author\":\"Sheldon Axler\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"Moves from matrix calculation to vector spaces, operators, eigenstructure and proof-oriented abstraction.\",\"bridge\":\"Useful for learning to see structural properties that survive changes of representation.\",\"year\":\"\",\"num\":7,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Introduction to Probability\",\"author\":\"Joseph K. Blitzstein & Jessica Hwang\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"An unusually intuitive route into conditional probability, random variables, expectation and common distributions.\",\"bridge\":\"Complex systems are noisy; probability separates stochastic structure from narrative guesswork.\",\"year\":\"\",\"num\":8,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"The Drunkard's Walk\",\"author\":\"Leonard Mlodinow\",\"kind\":\"Trade / conceptual\",\"level\":\"Foundation\",\"why\":\"Explains randomness, base rates and probability traps through everyday examples.\",\"bridge\":\"A strong antidote to finding false patterns in noisy systems.\",\"year\":\"\",\"num\":9,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Statistics\",\"author\":\"David Freedman, Robert Pisani & Roger Purves\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"A skeptical, concept-first introduction to data, regression, experiments and inference.\",\"bridge\":\"Model validation matters as much as model construction in complex social systems.\",\"year\":\"\",\"num\":10,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Understanding Analysis\",\"author\":\"Stephen Abbott\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"A humane first rigorous real-analysis book on limits, continuity, sequences, compactness and convergence.\",\"bridge\":\"Teaches what must be true for informal mathematical arguments about limits and dynamics to be valid.\",\"year\":\"\",\"num\":11,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Visual Complex Analysis\",\"author\":\"Tristan Needham\",\"kind\":\"Textbook / visual\",\"level\":\"Advanced\",\"why\":\"Develops complex numbers and analytic functions geometrically before symbolically.\",\"bridge\":\"Excellent training in changing representations until structure becomes visible.\",\"year\":\"\",\"num\":12,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Elementary Differential Equations and Boundary Value Problems\",\"author\":\"Boyce, DiPrima & Meade\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"The standard bridge from calculus to equations that describe changing systems.\",\"bridge\":\"ODEs are the basic mathematical language of population, epidemic, physical and economic dynamics.\",\"year\":\"\",\"num\":13,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Nonlinear Dynamics and Chaos\",\"author\":\"Steven H. Strogatz\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"Fixed points, bifurcations, oscillators, limit cycles and chaos presented with exceptional intuition.\",\"bridge\":\"The mathematical heart of deterministic complexity.\",\"year\":\"\",\"num\":14,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Discrete Mathematics with Applications\",\"author\":\"Susanna S. Epp\",\"kind\":\"Textbook\",\"level\":\"Core\",\"why\":\"Logic, combinatorics, relations, recursion and graphs\u2014the mathematics native to computer science.\",\"bridge\":\"Networks and algorithms are discrete structures before they become software.\",\"year\":\"\",\"num\":15,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Graph Theory\",\"author\":\"Reinhard Diestel\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"A rigorous route into paths, trees, connectivity, colouring and structural graph theory.\",\"bridge\":\"Gives formal depth beneath network-science measures and visualizations.\",\"year\":\"\",\"num\":16,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Convex Optimization\",\"author\":\"Stephen Boyd & Lieven Vandenberghe\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"A modern treatment of optimization problems with strong geometry and applications.\",\"bridge\":\"Optimization clarifies what an agent or system is actually maximizing under constraints.\",\"year\":\"\",\"num\":17,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Partial Differential Equations: An Introduction\",\"author\":\"Walter A. Strauss\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"Introduces diffusion, waves, Laplace equations and boundary-value problems.\",\"bridge\":\"PDEs connect local rules to spatial patterns, diffusion, transport and continuum systems.\",\"year\":\"\",\"num\":18,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"Measure, Integration & Real Analysis\",\"author\":\"Sheldon Axler\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"A modern route from measure to Lebesgue integration and rigorous probability foundations.\",\"bridge\":\"Provides the mathematical substrate for advanced probability and stochastic modelling.\",\"year\":\"\",\"num\":19,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"MATH\",\"title\":\"The Joy of x\",\"author\":\"Steven Strogatz\",\"kind\":\"Trade / conceptual\",\"level\":\"Foundation\",\"why\":\"A panoramic, friendly tour of mathematical ideas from arithmetic to infinity.\",\"bridge\":\"Keeps the mathematical spine connected to intuition, culture and curiosity rather than only coursework.\",\"year\":\"\",\"num\":20,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Complexity: A Guided Tour\",\"author\":\"Melanie Mitchell\",\"kind\":\"Trade / conceptual\",\"level\":\"Foundation\",\"why\":\"The best broad first map of emergence, computation, evolution, networks, cellular automata and adaptation.\",\"bridge\":\"It defines the intellectual territory before you specialize.\",\"year\":\"\",\"num\":1,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Thinking in Systems\",\"author\":\"Donella H. Meadows\",\"kind\":\"Systems guide\",\"level\":\"Foundation\",\"why\":\"Stocks, flows, feedback, delays, resilience, policy resistance and leverage points in plain language.\",\"bridge\":\"Gives a practical vocabulary for diagnosing systems before formal modelling.\",\"year\":\"\",\"num\":2,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Complexity: The Emerging Science at the Edge of Order and Chaos\",\"author\":\"M. Mitchell Waldrop\",\"kind\":\"History of ideas\",\"level\":\"Foundation\",\"why\":\"The Santa Fe Institute origin story linking physics, economics, evolution and computation.\",\"bridge\":\"Shows why complexity became a cross-disciplinary field rather than a single technique.\",\"year\":\"\",\"num\":3,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Chaos: Making a New Science\",\"author\":\"James Gleick\",\"kind\":\"History / narrative\",\"level\":\"Foundation\",\"why\":\"The classic story of sensitivity, strange attractors and the birth of chaos theory.\",\"bridge\":\"Makes nonlinear dynamics culturally and historically legible.\",\"year\":\"\",\"num\":4,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Introduction to the Modeling and Analysis of Complex Systems\",\"author\":\"Hiroki Sayama\",\"kind\":\"Open textbook\",\"level\":\"Core\",\"why\":\"A rare technical bridge combining mathematical models, Python, dynamics, cellular automata, networks and agents.\",\"bridge\":\"Ideal central text for turning concepts into executable models.\",\"year\":\"\",\"num\":5,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Think Complexity\",\"author\":\"Allen B. Downey\",\"kind\":\"Open textbook\",\"level\":\"Core\",\"why\":\"Coding-first exploration of cellular automata, fractals, networks, self-organized criticality and agent models.\",\"bridge\":\"Turns complexity from vocabulary into experiments you can modify.\",\"year\":\"\",\"num\":6,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Linked\",\"author\":\"Albert-L\u00e1szl\u00f3 Barab\u00e1si\",\"kind\":\"Trade / networks\",\"level\":\"Foundation\",\"why\":\"Story-driven introduction to hubs, preferential attachment and large-scale network structure.\",\"bridge\":\"Trains you to ask about connections and topology rather than isolated attributes.\",\"year\":\"\",\"num\":7,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Network Science\",\"author\":\"Albert-L\u00e1szl\u00f3 Barab\u00e1si\",\"kind\":\"Open textbook\",\"level\":\"Core\",\"why\":\"Structured technical treatment of random networks, scale-free networks, robustness, communities and spreading.\",\"bridge\":\"Your main bridge from intuitive networks to quantitative analysis.\",\"year\":\"\",\"num\":8,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Six Degrees\",\"author\":\"Duncan J. Watts\",\"kind\":\"Trade / networks\",\"level\":\"Core\",\"why\":\"Small worlds, clustering, social connectivity and the mechanics of spreading.\",\"bridge\":\"Complements Barab\u00e1si by emphasizing different generative mechanisms.\",\"year\":\"\",\"num\":9,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Networks, Crowds, and Markets\",\"author\":\"David Easley & Jon Kleinberg\",\"kind\":\"Textbook\",\"level\":\"Advanced\",\"why\":\"Networks joined to games, markets, cascades, auctions, information and social influence.\",\"bridge\":\"Excellent bridge from graph structure to human behaviour and institutions.\",\"year\":\"\",\"num\":10,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Sync\",\"author\":\"Steven Strogatz\",\"kind\":\"Trade / conceptual\",\"level\":\"Core\",\"why\":\"Synchronization in fireflies, hearts, power grids, sleep cycles and coupled oscillators.\",\"bridge\":\"Shows how coordination can emerge without a central controller.\",\"year\":\"\",\"num\":11,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Emergence\",\"author\":\"Steven Johnson\",\"kind\":\"Trade / conceptual\",\"level\":\"Foundation\",\"why\":\"Ants, cities, brains and software become examples of bottom-up organization.\",\"bridge\":\"A strong intuition-builder for local rules generating macro order.\",\"year\":\"\",\"num\":12,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Scale\",\"author\":\"Geoffrey West\",\"kind\":\"Trade / conceptual\",\"level\":\"Core\",\"why\":\"Scaling laws connect metabolism, cities, infrastructure, firms and growth.\",\"bridge\":\"Demonstrates that very different systems can share quantitative regularities.\",\"year\":\"\",\"num\":13,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"The Origin of Wealth\",\"author\":\"Eric D. Beinhocker\",\"kind\":\"Trade / economics\",\"level\":\"Core\",\"why\":\"Reframes the economy as an evolving complex adaptive system rather than an equilibrium machine.\",\"bridge\":\"A major bridge from complexity into markets, innovation and institutions.\",\"year\":\"\",\"num\":14,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"The Sciences of the Artificial\",\"author\":\"Herbert A. Simon\",\"kind\":\"Classic\",\"level\":\"Advanced\",\"why\":\"Hierarchy, bounded rationality, near-decomposability, design and artificial systems.\",\"bridge\":\"One of the deepest conceptual roots of complexity, organization and design science.\",\"year\":\"\",\"num\":15,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Antifragile\",\"author\":\"Nassim Nicholas Taleb\",\"kind\":\"Trade / uncertainty\",\"level\":\"Core\",\"why\":\"Explores systems that gain from stress, volatility and disorder.\",\"bridge\":\"Useful for resilience, nonlinear harm, optionality and intervention under uncertainty.\",\"year\":\"\",\"num\":16,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"How Nature Works\",\"author\":\"Per Bak\",\"kind\":\"Trade / conceptual\",\"level\":\"Advanced\",\"why\":\"The classic case for self-organized criticality and power-law events.\",\"bridge\":\"Historically important for thinking about criticality, avalanches and scale.\",\"year\":\"\",\"num\":17,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"CPLX\",\"title\":\"Order Out of Chaos\",\"author\":\"Ilya Prigogine & Isabelle Stengers\",\"kind\":\"Science / philosophy\",\"level\":\"Advanced\",\"why\":\"Far-from-equilibrium thermodynamics, dissipative structures and irreversibility.\",\"bridge\":\"The physical-science route into self-organization.\",\"year\":\"\",\"num\":18, ension across centuries.\",\"bridge\":\"A long-run view of material constraints on power.\",\"year\":\"\",\"num\":13,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"GLOB\",\"title\":\"The Revenge of Geography\",\"author\":\"Robert D. Kaplan\",\"kind\":\"Geopolitics\",\"level\":\"Explore\",\"why\":\"Argues that terrain and strategic location continue to constrain political choices.\",\"bridge\":\"Read alongside anti-determinist accounts; useful for spatial intuition.\",\"year\":\"\",\"num\":14,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"GLOB\",\"title\":\"Soft Power\",\"author\":\"Joseph S. Nye Jr.\",\"kind\":\"International relations\",\"level\":\"Foundation\",\"why\":\"Explains influence through attraction, legitimacy and culture rather than coercion alone.\",\"bridge\":\"Useful for media, reputation and symbolic power in world politics.\",\"year\":\"\",\"num\":15,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"GLOB\",\"title\":\"The Strategy of Conflict\",\"author\":\"Thomas C. Schelling\",\"kind\":\"Strategic theory\",\"level\":\"Advanced\",\"why\":\"Bargaining, threats, commitment and focal points in conflict.\",\"bridge\":\"A foundational bridge from game theory to diplomacy and coercion.\",\"year\":\"\",\"num\":16,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"ARCH\",\"title\":\"Architecture: Form, Space, and Order\",\"author\":\"Francis D. K. Ching\",\"kind\":\"Visual architecture primer\",\"level\":\"Foundation\",\"why\":\"A visual grammar of form, space, circulation, proportion and ordering principles.\",\"bridge\":\"Probably the best first book for learning to see architecture.\",\"year\":\"\",\"num\":1,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"ARCH\",\"title\":\"A Pattern Language\",\"author\":\"Christopher Alexander, Sara Ishikawa & Murray Silverstein\",\"kind\":\"Architecture / design patterns\",\"level\":\"Core\",\"why\":\"Hundreds of recurring patterns for rooms, streets, neighborhoods and human-scale environments.\",\"bridge ace.\",\"year\":\"\",\"num\":7,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"ARCH\",\"title\":\"Happy City\",\"author\":\"Charles Montgomery\",\"kind\":\"Cities / wellbeing\",\"level\":\"Foundation\",\"why\":\"Research and stories about how urban design changes health, trust, movement and happiness.\",\"bridge\":\"A readable bridge between city form and lived experience.\",\"year\":\"\",\"num\":8,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"ARCH\",\"title\":\"Walkable City\",\"author\":\"Jeff Speck\",\"kind\":\"Urban design\",\"level\":\"Foundation\",\"why\":\"A practical explanation of why walkability depends on safety, usefulness, comfort and interest.\",\"bridge\":\"Makes street-level design legible without specialist training.\",\"year\":\"\",\"num\":9,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"ARCH\",\"title\":\"Building and Dwelling\",\"author\":\"Richard Sennett\",\"kind\":\"Cities / social life\",\"level\":\"Core\",\"why\":\"Distinguishes the planned city from the lived city and asks how urban form can remain open to difference.\",\"bridge\":\"A humane bridge between architecture, sociology and politics.\",\"year\":\"\",\"num\":10,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"NOND\",\"title\":\"The Upanishads\",\"author\":\"Patrick Olivelle (trans.)\",\"kind\":\"Classical source\",\"level\":\"Foundation\",\"why\":\"Primary texts behind later Vedanta: self, ultimate reality, consciousness and liberation in multiple voices.\",\"bridge\":\"Start here to see the diversity that later Advaita systematizes.\",\"year\":\"\",\"num\":1,\"novelTags\":[],\"novelNote\":\"\"},{\"domain\":\"NOND\",\"title\":\"The Bhagavad Gita\",\"author\":\"Eknath Easwaran (trans.)\",\"kind\":\"Classical source\",\"level\":\"Foundation\",\"why\":\"A readable translation of the dialogue on action, self, devotion, knowledge and liberation.\",\"bridge\":\"Useful for seeing how non-dual insight coexists with action and ethical duty.\",\"year\":\"\",\"num\":2,\"novelTag N(b)?'on':''}\" onclick=\"toggleReadN('${b.domain}','${escN(b.title)}')\">\u2713 Read\u003c/button>\u003cbutton class=\"mini star ${isSavedN(b)?'on':''}\" onclick=\"toggleSaveN('${b.domain}','${escN(b.title)}')\">\u2605 Save\u003c/button>\u003c/div>\u003c/article>`}\nfunction findN(d,t){return BOOKN.find(b=>b.domain===d&&b.title===t)}function toggleReadN(d,t){const b=findN(d,t),k=keyN(b,'read');localStorage.getItem(k)==='1'?localStorage.removeItem(k):localStorage.setItem(k,'1');renderN()}function toggleSaveN(d,t){const b=findN(d,t),k=keyN(b,'save');localStorage.getItem(k)==='1'?localStorage.removeItem(k):localStorage.setItem(k,'1');renderN()}\nfunction pickProjectN(p,el){$N('projectN').value=p;document.querySelectorAll('#projectRowN .project').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderN();location.hash='browseN'}function openVisibleN(){document.querySelectorAll('#listN .section-card').forEach(x=>x.classList.add('open'))}function toggleSavedN(){savedOnlyN=!savedOnlyN;renderN()}function toggleUnreadN(){unreadOnlyN=!unreadOnlyN;renderN()}function resetN(){['qN','depthN','domainN','levelN','projectN'].forEach(id=>$N(id).value='');savedOnlyN=false;unreadOnlyN=false;document.querySelectorAll('#projectRowN .project').forEach((x,i)=>x.classList.toggle('active',i===0));renderN()}setupN();\n\u003c/script>\u003c/body>\u003c/html>", "india": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003ctitle>India in Fiction \u2014 Novelist&#x27;s Edition\u003c/title>\u003cstyle>\n:root{--navy:#123A63;--navy2:#0B5E75;--gold:#D97706;--red:#B42318;--cream:#F2F5F9;--paper:#fff;--ink:#101828;--muted:#475467;--line:#BFCBDA;--green:#087A67;--purple:#6941C6;--pink:#A23B72;--shadow:0 10px 28px rgba(15,23,42,.08)}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream)
